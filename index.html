    async function startARExperience() {
      unlockAndPlayAudio();
      const gyroPromise = enableGyroscopeIfAvailable();
      loadingModal.classList.add('hidden');
      experienceHud.classList.add('active');

      if (navigator.xr) {
        const arSupported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
        if (arSupported) {
          disableGyroscope();
          await startXRSession('immersive-ar');
          return;
        }
      }
      await gyroPromise;
      await startMobileCameraARMode();
    }

    async function startXRSession(requestedMode = 'immersive-vr') {
      unlockAndPlayAudio();
      loadingModal.classList.add('hidden');
      experienceHud.classList.add('active');

      if (isCameraARActive) {
        isCameraARActive = false;
        stopCameraStream();
        disableGyroscope();
      }

      if (!navigator.xr) {
        if (requestedMode === 'immersive-ar') {
          await startMobileCameraARMode();
          return;
        }
        setARPlacementMode(false);
        triggerMaterializationOnce();
        showToast('WebXR VR requiere navegador Quest 3 · Vista 3D activa');
        return;
      }

      try {
        const supported = await navigator.xr.isSessionSupported(requestedMode).catch(() => false);
        if (!supported && requestedMode === 'immersive-ar') {
          await enableGyroscopeIfAvailable();
          await startMobileCameraARMode();
          return;
        }
        if (!supported) {
          setARPlacementMode(false);
          triggerMaterializationOnce();
          showToast('Abre este enlace en Meta Quest 3 para modo VR');
          return;
        }

        const sessionInit = {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
        };
        if (requestedMode === 'immersive-ar') {
          sessionInit.optionalFeatures.push('hit-test', 'plane-detection', 'dom-overlay');
          sessionInit.domOverlay = { root: experienceHud };
        }

        const session = await navigator.xr.requestSession(requestedMode, sessionInit);
        renderer.xr.setReferenceSpaceType('local-floor');
        camera.position.set(0, 0, 0);
        camera.rotation.set(0, 0, 0);
        cameraRig.position.set(0, 0, spawnDistance);
        cameraRig.rotation.set(0, 0, 0);

        xrHitTestSource = null;
        xrRefSpace = null;
        xrNoHitElapsed = 0;

        await renderer.xr.setSession(session);

        const isPassthrough = requestedMode === 'immersive-ar' || session.environmentBlendMode === 'alpha-blend';
        isARModeActive = isPassthrough;
        applyTransparentARVisuals(isPassthrough);

        if (isPassthrough) {
          xrRefSpace = renderer.xr.getReferenceSpace();
          if (typeof session.requestHitTestSource === 'function') {
            session.requestReferenceSpace('viewer')
              .then((viewerSpace) => session.requestHitTestSource({ space: viewerSpace }))
              .then((source) => { xrHitTestSource = source; })
              .catch(() => {});
          }
          arAnchorScale = IS_QUEST ? 0.80 : 0.72;
          barcaAnchorGroup.scale.setScalar(arAnchorScale);
          scaleReadout.textContent = `${Math.round(arAnchorScale * 100)}%`;
          barcaAnchorGroup.visible = hasMaterializedOnce || hasPlacedInAR;
          experienceHud.classList.toggle('active', !!session.domOverlayState);
          setARPlacementMode(true);
        } else {
          experienceHud.classList.remove('active');
          setARPlacementMode(false);
          barcaAnchorGroup.visible = true;
          triggerMaterializationOnce();
        }

        session.addEventListener('end', () => {
          if (isRecordingVideo) stopVideoRecording();
          if (xrHitTestSource) { try { xrHitTestSource.cancel(); } catch (e) {} xrHitTestSource = null; }
          xrRefSpace = null;
          clearDetectedPlaneMeshes();
          isARModeActive = false;
          setARPlacementMode(false);
          applyTransparentARVisuals(false);
          experienceHud.classList.add('active');
          resetViewerPosition(false);
          if (!hasMaterializedOnce) triggerMaterializationOnce();
        });
      } catch (err) {
        if (requestedMode === 'immersive-ar') {
          await enableGyroscopeIfAvailable();
          await startMobileCameraARMode();
        } else {
          setARPlacementMode(false);
          triggerMaterializationOnce();
          showToast('No se pudo iniciar XR · Vista 3D activa');
        }
      }
    }

    function resetViewerPosition(notify = true) {
      if (!isARModeActive) {
        barcaAnchorGroup.position.set(0, 0, 0);
        barcaAnchorGroup.rotation.set(0, 0, 0);
      }
      cameraRig.position.set(0, 0, spawnDistance);
      cameraRig.rotation.set(0, 0, 0);
      barcaAnchorGroup.scale.setScalar(arAnchorScale);
      if (!renderer.xr.isPresenting) {
        yaw = 0; pitch = 0; gyroBaseYaw = null;
        camera.position.set(0, 1.65, 0);
        camera.rotation.set(0, 0, 0, 'YXZ');
      }
      if (notify) showToast('Vista centrada hacia la travesía');
    }

    function rotateRigAroundHead(angle) {
      renderer.xr.getCamera().getWorldPosition(_headBefore);
      cameraRig.rotation.y += angle;
      cameraRig.updateMatrixWorld(true);
      renderer.xr.getCamera().getWorldPosition(_headAfter);
      cameraRig.position.x += _headBefore.x - _headAfter.x;
      cameraRig.position.z += _headBefore.z - _headAfter.z;
    }

      // Arrastre 1 dedo + Pellizco 2 dedos para escala natural

      viewport.addEventListener('pointerdown', (e) => {

        if (!audioStarted && !isAudioMuted) unlockAndPlayAudio();
        if (toolsDrawerOpen) toggleToolsDrawer(false);
      });
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown || renderer.xr.isPresenting) return;
        const dx = e.clientX - prevPointerX, dy = e.clientY - prevPointerY;
        prevPointerX = e.clientX; prevPointerY = e.clientY;
        yaw -= dx * 0.0045;

      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPointerDown = false;
          pinchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          pinchStartScale = arAnchorScale;
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          const d = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          arAnchorScale = THREE.MathUtils.clamp(pinchStartScale * (d / pinchStartDist), 0.30, 1.80);
          barcaAnchorGroup.scale.setScalar(arAnchorScale);
          scaleReadout.textContent = `${Math.round(arAnchorScale * 100)}%`;
        }
      }, { passive: true });

      viewport.addEventListener('touchend', () => { pinchStartDist = 0; }, { passive: true });
    }

    function updateVRLocomotion(dt) {
      const session = renderer.xr.getSession();
      if (!session) return;
      const xrCam = renderer.xr.getCamera();
      xrCam.getWorldDirection(_xrForward);
      _xrForward.y = 0;
      if (_xrForward.lengthSq() > 0.0001) _xrForward.normalize();
      else _xrForward.set(0, 0, -1);
      _xrRight.crossVectors(_xrForward, _upAxis).normalize();

      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const axes = source.gamepad.axes;
        const buttons = source.gamepad.buttons;
        const stickX = axes.length >= 4 ? axes[2] : (axes[0] || 0);
        const stickY = axes.length >= 4 ? axes[3] : (axes[1] || 0);

        if (source.handedness === 'left') {
          if (Math.abs(stickY) > 0.15) cameraRig.position.addScaledVector(_xrForward, -stickY * 2.4 * dt);
          if (Math.abs(stickX) > 0.15) cameraRig.position.addScaledVector(_xrRight, stickX * 2.4 * dt);
          const xP = !!(buttons[4] && buttons[4].pressed);
          const yP = !!(buttons[5] && buttons[5].pressed);
          if (xP && !prevButtons.leftX && isARModeActive) setARPlacementMode(!isARPlacementMode);
          if (yP && !prevButtons.leftY) resetViewerPosition(false);
          prevButtons.leftX = xP; prevButtons.leftY = yP;
        }
        if (source.handedness === 'right') {
          if (Math.abs(stickX) > 0.65 && snapTurnReady) {
            rotateRigAroundHead(stickX > 0 ? -THREE.MathUtils.degToRad(30) : THREE.MathUtils.degToRad(30));
            snapTurnReady = false;
          } else if (Math.abs(stickX) < 0.25) snapTurnReady = true;
          if (Math.abs(stickY) > 0.2) cameraRig.position.addScaledVector(_xrForward, -stickY * 1.8 * dt);
          const aP = !!(buttons[4] && buttons[4].pressed);
          const bP = !!(buttons[5] && buttons[5].pressed);
          if (aP && !prevButtons.rightA && isARModeActive && isARPlacementMode) placeSceneAtDetectedSurface();
          if (bP && !prevButtons.rightB) resetViewerPosition(false);
          prevButtons.rightA = aP; prevButtons.rightB = bP;
        }
      }

      const dist = Math.hypot(cameraRig.position.x, cameraRig.position.z);
      if (dist > 20) {
        const ratio = 20 / dist;
        cameraRig.position.x *= ratio;
        cameraRig.position.z *= ratio;
      }
    }

    function updateDesktopMovement(dt) {
      if (renderer.xr.isPresenting) return;
      camera.getWorldDirection(_xrForward);
      _xrForward.y = 0;
      if (_xrForward.lengthSq() > 0.0001) _xrForward.normalize();
      _xrRight.crossVectors(_xrForward, _upAxis).normalize();
      const speed = 2.8;
      if (moveButtonDir !== 0) cameraRig.position.addScaledVector(_xrForward, moveButtonDir * speed * dt);
      if (keysPressed.w) cameraRig.position.addScaledVector(_xrForward, speed * dt);
      if (keysPressed.s) cameraRig.position.addScaledVector(_xrForward, -speed * dt);
      if (keysPressed.d) cameraRig.position.addScaledVector(_xrRight, speed * dt);
      if (keysPressed.a) cameraRig.position.addScaledVector(_xrRight, -speed * dt);
    }

    // =========================================================================
    // 🚣 ACTUALIZACIÓN DE TRAVESÍA DE LAS 9 BARCAS (CERO ALLOCS POR FRAME)
    // =========================================================================
    const headingOffsetRad = THREE.MathUtils.degToRad(SCULPTURE_CONFIG.headingOffsetDeg);

    function updateConvoyNavigation(dt, timeSec) {
      if (convoyBoats.length === 0) return;
      convoyElapsedTime += dt;

      const primCount = fleetInstancedPrimitives.length;

      for (let i = 0; i < convoyBoats.length; i++) {
        const b = convoyBoats[i];
        const cfg = b.cfg;

        // Progreso cíclico suave de un extremo al otro del escenario
        const u = (cfg.uStart + convoyElapsedTime * cfg.speed) % 1.0;
        const uNext = Math.min(0.9995, u + 0.003);

        evaluateConvoyPosition(u, cfg, _pathSampleA);
        evaluateConvoyPosition(uNext, cfg, _pathSampleB);

        const dx = _pathSampleB.x - _pathSampleA.x;
        const dz = _pathSampleB.z - _pathSampleA.z;
        const heading = Math.atan2(dx, dz) + headingOffsetRad;

        // Aparición y desaparición suave en los bordes lejanos del río
        const edgeFade = smoothstepJS(0.0, 0.08, u) * smoothstepJS(1.0, 0.92, u);
        const finalScale = Math.max(0.0001, cfg.scaleMul * edgeFade);

        // Oscilación hidrodinámica sincronizada con el agua
        sampleRiverHeightAndSlopeJS(_pathSampleA.x, _pathSampleA.z, timeSec, _waveSample);
        const by = _waveSample.h * 0.72 + Math.sin(timeSec * 0.85 + b.phase) * 0.022;
        const roll = THREE.MathUtils.clamp(-_waveSample.sx * 0.26, -0.07, 0.07);
        const pitchBoat = THREE.MathUtils.clamp(_waveSample.sz * 0.26, -0.07, 0.07);

        b.curX = _pathSampleA.x;
        b.curY = by;
        b.curZ = _pathSampleA.z;
        b.curYaw = heading;
        b.curPitch = pitchBoat;
        b.curRoll = roll;
        b.curScale = finalScale;

        // Pasar posición y visibilidad al shader del agua para estelas dinámicas
        _boatWakeArray[i].set(b.curX, b.curZ, edgeFade * (hasMaterializedOnce ? 1.0 : b.progress));

        if (usingInstancedFleet && primCount > 0) {
          _dummyObj.position.set(b.curX, b.curY, b.curZ);
          _dummyObj.rotation.set(b.curPitch, 0, b.curRoll);
          _dummyObj.scale.set(1, 1, 1);
          _dummyObj.updateMatrix();
          _boatMat.copy(_dummyObj.matrix);

          _dummyObj.position.set(0, 0, 0);
          _dummyObj.rotation.set(0, b.curYaw, 0);
          _dummyObj.scale.setScalar(b.curScale);
          _dummyObj.updateMatrix();
          _pivotMat.multiplyMatrices(_boatMat, _dummyObj.matrix);

          for (let p = 0; p < primCount; p++) {
            const prim = fleetInstancedPrimitives[p];
            _instanceMat.multiplyMatrices(_pivotMat, prim.localMatrix);
            prim.instancedMesh.setMatrixAt(i, _instanceMat);
          }
        } else {
          b.group.position.set(b.curX, b.curY, b.curZ);
          b.group.rotation.set(b.curPitch, 0, b.curRoll);
          b.pivot.rotation.y = b.curYaw;
          b.pivot.scale.setScalar(b.curScale);
        }
      }

      if (usingInstancedFleet && primCount > 0) {
        for (let p = 0; p < primCount; p++) {
          fleetInstancedPrimitives[p].instancedMesh.instanceMatrix.needsUpdate = true;
        }
      }
    }

    function renderLoop(timestamp, frame) {
      const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000 || 0.016);
      lastFrameTime = timestamp;
      const timeSec = timestamp * 0.001;

      if (renderer.xr.isPresenting) {
        updateVRLocomotion(dt);
        if (isARModeActive && frame) updateWebXRHitTest(frame, dt);
      } else {
        if (gyroEnabled) updateCameraFromGyro();
        updateDesktopMovement(dt);
        if (isCameraARActive && isARPlacementMode) updateFallbackSurfaceEstimate(false);
      }

      if (waterUniforms) waterUniforms.uTime.value = timeSec;
      if (firefliesMaterial) firefliesMaterial.uniforms.uTime.value = timeSec;

      updateConvoyNavigation(dt, timeSec);

      // Materialización única mientras las 9 barcas ya navegan
      if (isMaterializing) {
        materializationElapsed += dt;
        let allDone = true;
        let progSum = 0;
        const anchorScaleY = barcaAnchorGroup.scale.y;

        for (let i = 0; i < convoyBoats.length; i++) {
          const b = convoyBoats[i];
          if (b.done) { progSum += 1.0; continue; }

          const localT = (materializationElapsed - b.delay) / b.duration;
          b.group.getWorldPosition(_tmpWorldPos);
          const effScale = b.curScale * anchorScaleY;

          if (localT <= 0) {
            allDone = false;
            b.progress = 0.0;
            b.clippingPlane.constant = _tmpWorldPos.y + localBoundsMinY * effScale - 0.1;
            b.particleMat.uniforms.uTime.value = timeSec;
            b.particleMat.uniforms.uProgress.value = 0.0;
            continue;
          }

          if (localT >= 1.0) {
            b.done = true;
            b.progress = 1.0;
            b.clippingPlane.constant = 1000;
            b.particleMat.uniforms.uProgress.value = 1.0;
            b.particles.visible = false;
            progSum += 1.0;
            continue;
          }

          allDone = false;
          const eased = localT * localT * (3.0 - 2.0 * localT);
          b.progress = eased;
          progSum += eased;

          const worldMinY = _tmpWorldPos.y + localBoundsMinY * effScale;
          const worldMaxY = _tmpWorldPos.y + (localBoundsMaxY + 0.18) * effScale;
          b.clippingPlane.constant = THREE.MathUtils.lerp(worldMinY, worldMaxY, eased);
          b.particleMat.uniforms.uTime.value = timeSec;
          b.particleMat.uniforms.uProgress.value = eased;
        }

        currentRevealAudioFactor = progSum / Math.max(1, convoyBoats.length);

        if (allDone) {
          isMaterializing = false;
          hasMaterializedOnce = true;
          currentRevealAudioFactor = 1.0;
          finalizeAndOptimizeConvoy();
        }
      } else if (hasMaterializedOnce) {
        currentRevealAudioFactor = 1.0;
      }

      // Envolvente de audio sincronizada con las barcas
      if (ambientAudioEl) {
        const targetGain = isAudioMuted
          ? 0.0
          : THREE.MathUtils.lerp(AUDIO_CONFIG.baseVolume, AUDIO_CONFIG.maxVolume, currentRevealAudioFactor);
        const lerpAlpha = 1.0 - Math.exp(-dt * 3.8);
        currentAppliedGain = THREE.MathUtils.lerp(currentAppliedGain, targetGain, lerpAlpha);

        if (audioGainNode && audioCtx) {
          audioGainNode.gain.setTargetAtTime(currentAppliedGain, audioCtx.currentTime, 0.05);
        } else {
          ambientAudioEl.volume = THREE.MathUtils.clamp(currentAppliedGain, 0, 1);
        }
      }

      renderer.render(scene, camera);

      // Si está grabando video, componer cada cuadro (cámara real + WebGL) justo después del render
      if (isRecordingVideo) {
        compositeCurrentFrameToCaptureCanvas();
      }
    }
  </script>
