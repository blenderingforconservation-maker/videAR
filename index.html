<!DOCTYPE html>
<html lang="es">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; background: #09292e; font-family: 'Inter', sans-serif; touch-action: none; }
    .font-museum { font-family: 'Cormorant Garamond', Georgia, serif; }
    #ar-camera-feed { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; background: #000; }
    #ar-camera-feed.active { display: block; }
    #ar-camera-feed.mirrored { transform: scaleX(-1); }
    #webgl-viewport { position: fixed; inset: 0; z-index: 2; cursor: grab; }
    #webgl-viewport:active { cursor: grabbing; }
    #xr-dom-overlay-root { position: fixed; inset: 0; z-index: 20; pointer-events: none; }

    #experience-hud { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    #experience-hud.active { display: flex; }
    .interactive { pointer-events: auto; }
    .organic-glass { background: rgba(7, 29, 33, 0.58); backdrop-filter: blur(14px) saturate(135%); -webkit-backdrop-filter: blur(14px) saturate(135%); border: 1px solid rgba(153, 246, 228, 0.26); box-shadow: 0 8px 26px rgba(2, 16, 19, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.12); }
    .organic-btn { transition: transform 0.14s ease, border-color 0.2s ease; }
    .organic-btn:active { transform: scale(0.92); border-color: rgba(253, 224, 71, 0.78); }
    .cta-luminous { background: linear-gradient(135deg, #14b8a6 0%, #2dd4bf 55%, #f5e67a 100%); box-shadow: 0 8px 24px rgba(45, 212, 191, 0.34); transition: transform 0.14s ease; }
    .cta-luminous:active { transform: scale(0.95); }
    #shutter-btn { width: 70px; height: 70px; border-radius: 999px; padding: 5px; background: rgba(7, 29, 33, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 2.5px solid rgba(236, 254, 255, 0.94); box-shadow: 0 6px 24px rgba(0,0,0,0.36), 0 0 20px rgba(45,212,191,0.28); display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease, border-color 0.2s ease; }
    #shutter-btn:active { transform: scale(0.92); }
    #shutter-core { width: 100%; height: 100%; border-radius: 999px; background: linear-gradient(145deg, #fff 0%, #ccfbf1 100%); transition: all 0.2s ease; }
    #shutter-btn.video-mode #shutter-core { background: linear-gradient(145deg, #fb7185 0%, #e11d48 100%); transform: scale(0.86); }
    #shutter-btn.recording { border-color: rgba(251, 113, 133, 0.95); box-shadow: 0 0 0 6px rgba(225, 29, 72, 0.22); }
    #shutter-btn.recording #shutter-core { width: 24px; height: 24px; border-radius: 7px; background: #f43f5e; transform: scale(1); }
    .mode-pill-active { background: rgba(45, 212, 191, 0.26); color: #f0fdfa; border-color: rgba(94, 234, 212, 0.55); }
    #walk-joystick { width: 84px; height: 84px; border-radius: 999px; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; }
    #walk-knob { width: 36px; height: 36px; border-radius: 999px; background: radial-gradient(circle at 35% 35%, #ccfbf1, #2dd4bf); box-shadow: 0 4px 14px rgba(0,0,0,0.38); pointer-events: none; transition: transform 0.08s ease-out; }

    #capture-modal { background: rgba(4, 18, 21, 0.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }

</head>
<body>

  <video id="ar-camera-feed" autoplay playsinline muted></video>
  <div id="webgl-viewport"></div>

  <!-- PANTALLA INICIAL -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#061c20] px-6 text-center">
    <div class="w-14 h-14 mb-4 rounded-full bg-teal-400/10 border border-teal-300/35 flex items-center justify-center shadow-[0_0_32px_rgba(45,212,191,0.28)]">
      <div class="w-3 h-3 rounded-full bg-lime-200 animate-ping"></div>
    </div>
    <span class="text-[10px] uppercase tracking-[0.32em] text-teal-200/80 font-medium mb-1">Museo Leonora Carrington SLP</span>
    <h1 class="font-museum text-4xl sm:text-5xl text-stone-50 tracking-wide mb-2">La Barca de las Grullas</h1>
    <p id="loading-message" class="text-xs text-teal-100/75 max-w-xs mb-5 leading-relaxed">Preparando las 10 barcas, el río y los controles de exploración...</p>
    <div id="progress-container" class="w-60 flex flex-col items-center mb-4">
      <div class="w-full h-1 bg-teal-950 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-teal-400 via-emerald-300 to-yellow-200 w-0 transition-all duration-200"></div>
      </div>
      <span id="progress-text" class="text-[10px] font-mono text-teal-300/75 mt-2">0%</span>
    </div>
    <div id="launch-controls" class="hidden flex-col gap-2.5 w-full max-w-xs">
      <button id="btn-launch-ar-cam" class="cta-luminous w-full py-3.5 px-6 rounded-full text-slate-950 font-bold text-xs uppercase tracking-[0.12em]">
        📷 AR Cámara · Foto y Video
      </button>
      <button id="btn-launch-ar-xr" class="organic-glass organic-btn w-full py-3 px-6 rounded-full text-teal-50 font-semibold text-xs uppercase tracking-[0.12em]">
        AR Espacial 6DOF (Quest 3 / ARCore)
      </button>
      <button id="btn-launch-vr-direct" class="organic-glass organic-btn w-full py-3 px-6 rounded-full text-teal-100 font-semibold text-xs uppercase tracking-[0.12em]">
        Entrar en VR · Quest 3
      </button>
      <button id="btn-start-preview" class="w-full py-2 text-teal-200/80 hover:text-teal-50 font-medium text-[11px] uppercase tracking-[0.16em]">

    <p class="mt-5 max-w-xs text-[11px] text-teal-200/55 leading-relaxed">
      Camina hacia las 10 barcas, rodéalas y guarda fotos o videos directo en tu teléfono.

  <!-- RAÍZ DOM-OVERLAY WEBXR (HUD + FLASH + TOAST + MODAL DE CAPTURA) -->
  <div id="xr-dom-overlay-root">
    <div id="shutter-flash"></div>
    <div id="toast-banner">Cargando...</div>

    <div id="experience-hud">
      <header class="w-full flex items-center justify-between gap-2">
        <div class="organic-glass flex items-center gap-2 rounded-full px-3.5 py-2">

          <span id="status-label" class="text-[11px] font-medium text-teal-50 tracking-wide">Travesía · 10 Barcas</span>
        </div>
        <div class="interactive flex items-center gap-2">
          <button id="btn-switch-cam" class="hidden organic-glass organic-btn w-10 h-10 rounded-full flex items-center justify-center text-teal-50" title="Cambiar cámara">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          </button>
          <button id="btn-audio" class="organic-glass organic-btn w-10 h-10 rounded-full flex items-center justify-center text-teal-50" title="Sonido">
            <svg id="icon-audio-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg id="icon-audio-off" class="w-4 h-4 hidden text-rose-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
          <button id="btn-fullscreen" class="organic-glass organic-btn w-10 h-10 rounded-full flex items-center justify-center text-teal-50" title="Pantalla completa">
            <svg id="icon-fs-enter" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            <svg id="icon-fs-exit" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
          <button id="btn-exit-ar" class="hidden px-3.5 h-10 rounded-full bg-rose-950/75 border border-rose-400/45 text-rose-100 text-[11px] font-semibold uppercase tracking-wider organic-btn backdrop-blur-md">Salir AR</button>
        </div>
      </header>

      <footer class="w-full flex flex-col items-center gap-2.5">
        <!-- Joystick de caminata 360° para acercarse y rodear esculturas -->
        <div id="walk-pad-wrap" class="w-full flex justify-start px-1">
          <div class="interactive flex flex-col items-center gap-1">
            <div id="walk-joystick" class="organic-glass"><div id="walk-knob"></div></div>
            <span class="text-[9px] uppercase tracking-[0.2em] text-teal-100/75 font-medium">Caminar</span>
          </div>
        </div>

        <!-- Despliegue sobre planos horizontales o verticales -->
        <div id="ar-placement-bar" class="hidden interactive flex items-center justify-center gap-2.5 w-full max-w-xs">
          <button id="btn-ar-place" class="cta-luminous flex-1 py-3 px-5 rounded-full text-slate-950 font-bold text-xs uppercase tracking-wider">Desplegar en Plano</button>
          <button id="btn-ar-cancel-place" class="hidden organic-glass organic-btn px-4 py-3 rounded-full text-teal-100 text-[11px] font-medium">Listo</button>
        </div>

        <!-- Ajustes desplegables -->
        <div id="quick-tools-drawer" class="drawer-closed interactive organic-glass rounded-3xl px-3.5 py-2.5 flex flex-wrap items-center justify-center gap-2 max-w-sm">

          <span id="scale-readout" class="text-[11px] font-mono text-teal-200/90 min-w-[38px] text-center">100%</span>
          <button id="btn-scale-up" class="organic-btn w-8 h-8 rounded-full bg-teal-950/60 border border-teal-400/30 text-teal-100 text-sm font-semibold">+</button>
          <div class="w-px h-4 bg-teal-300/20"></div>
          <button id="btn-recenter" class="organic-btn px-3 py-1.5 rounded-full bg-yellow-300/15 border border-yellow-300/40 text-yellow-200 text-[11px] font-medium">Centrar</button>
          <button id="btn-switch-ar-xr" class="organic-btn px-3 py-1.5 rounded-full bg-emerald-400/20 border border-emerald-300/40 text-emerald-100 text-[11px] font-semibold">AR 6DOF</button>
          <button id="btn-switch-vr" class="organic-btn px-3 py-1.5 rounded-full bg-teal-400/20 border border-teal-300/40 text-teal-50 text-[11px] font-semibold">VR</button>
        </div>

        <!-- Dock principal Foto / Video -->
        <div id="capture-dock" class="interactive flex flex-col items-center gap-2 w-full max-w-sm">
          <div class="organic-glass rounded-full p-1 flex items-center gap-1">
            <button id="mode-photo" class="mode-pill-active px-4 py-1 rounded-full text-[11px] font-semibold tracking-wider uppercase border border-transparent">Foto</button>
            <button id="mode-video" class="px-4 py-1 rounded-full text-[11px] font-semibold tracking-wider uppercase text-teal-200/70 border border-transparent">Video</button>
          </div>
          <div class="w-full grid grid-cols-3 items-center px-2">
            <div class="flex justify-start">
              <button id="btn-left-context" class="organic-glass organic-btn h-11 px-4 rounded-full text-teal-50 text-[11px] font-semibold flex items-center gap-1.5">
                <span id="btn-left-label">AR</span>
              </button>
            </div>
            <div class="flex justify-center">
              <button id="shutter-btn" aria-label="Capturar foto o video"><span id="shutter-core"></span></button>
            </div>
            <div class="flex justify-end items-center gap-2">

              </button>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- MODAL DE PREVISUALIZACIÓN Y GUARDADO EN GALERÍA -->
    <div id="capture-modal" class="hidden interactive fixed inset-0 z-50 flex flex-col items-center justify-center p-5">
      <div class="organic-glass w-full max-w-md rounded-3xl p-4 flex flex-col gap-3.5 shadow-2xl">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-teal-300"></span>
            <span id="capture-modal-title" class="text-xs font-semibold uppercase tracking-widest text-teal-100">Captura Lista</span>
          </div>
          <button id="btn-close-capture" class="organic-btn w-8 h-8 rounded-full bg-teal-950/80 border border-teal-400/30 text-teal-100 flex items-center justify-center text-sm">✕</button>
        </div>
        <div class="relative w-full max-h-[58dvh] rounded-2xl overflow-hidden bg-slate-950/90 border border-teal-300/20 flex items-center justify-center">
          <img id="preview-photo" class="hidden max-w-full max-h-[58dvh] object-contain" alt="Foto" />
          <video id="preview-video" class="hidden max-w-full max-h-[58dvh] object-contain" controls playsinline loop></video>
        </div>
        <div class="flex items-center gap-2.5">
          <button id="btn-save-device" class="cta-luminous flex-1 py-3.5 px-5 rounded-full text-slate-950 font-bold text-xs uppercase tracking-wider">Guardar en Teléfono</button>
          <button id="btn-share-device" class="hidden organic-glass organic-btn py-3.5 px-4 rounded-full text-teal-50 font-semibold text-xs uppercase tracking-wider">Fotos</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    const UA = navigator.userAgent || '';
    const IS_QUEST = /OculusBrowser|Quest/i.test(UA);
    const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const IS_MOBILE = (/Android|iPhone|iPad|iPod/i.test(UA) || IS_IOS) && !IS_QUEST;

    const PERF = {
      maxDpr: IS_MOBILE ? 1.25 : 1.5,
      waterSubdivisions: IS_MOBILE ? 84 : (IS_QUEST ? 112 : 128),
      fireflyCount: IS_MOBILE ? 105 : 160,
      particlesPerBoat: IS_MOBILE ? 200 : 340,
      maxAniso: IS_MOBILE ? 2 : 4
    };

    const SCULPTURE_CONFIG = { baseScale: 3.4, submersionRatio: 0.14, modelProwOffsetDeg: 0 };
    const CONVOY_CONFIG = { spanHalfX: 25.0, approachDepthZ: 3.8, direction: 1 };
    const WATER_CONFIG = { levelY: 0.28, subdivisions: PERF.waterSubdivisions, waveAmplitude: 1.52, flowSpeed: 0.38, turbulence: 1.55 };
    const MATERIALIZATION_CONFIG = { boatDuration: 2.0, maxStaggerDelay: 1.4 };
    const AUDIO_CONFIG = { baseVolume: 0.06, maxVolume: 0.86 };
    const FIREFLY_CONFIG = { count: PERF.fireflyCount, minHeight: 0.38, maxHeight: 5.0, spreadRadius: 23.0 };

    // 10 barcas dispersas (sin líneas rectas ni colisiones)
    const BOAT_COUNT = 10;
    const CONVOY_BOATS_LAYOUT = [
      { uStart: 0.44, speed: 0.036, laneZ:  2.20, scaleMul: 1.02, swayAmp: 0.34, swayFreq: 2.1, swayPhase: 0.4 },
      { uStart: 0.77, speed: 0.032, laneZ:  0.80, scaleMul: 0.94, swayAmp: 0.42, swayFreq: 2.7, swayPhase: 2.5 },
      { uStart: 0.17, speed: 0.038, laneZ: -0.60, scaleMul: 0.98, swayAmp: 0.36, swayFreq: 1.9, swayPhase: 4.1 },
      { uStart: 0.61, speed: 0.030, laneZ: -2.05, scaleMul: 0.89, swayAmp: 0.45, swayFreq: 2.4, swayPhase: 1.3 },
      { uStart: 0.06, speed: 0.035, laneZ: -3.50, scaleMul: 0.92, swayAmp: 0.38, swayFreq: 2.9, swayPhase: 3.7 },
      { uStart: 0.86, speed: 0.028, laneZ: -4.95, scaleMul: 0.85, swayAmp: 0.44, swayFreq: 2.2, swayPhase: 5.2 },
      { uStart: 0.31, speed: 0.033, laneZ: -6.40, scaleMul: 0.82, swayAmp: 0.40, swayFreq: 2.6, swayPhase: 0.9 },
      { uStart: 0.53, speed: 0.026, laneZ: -7.90, scaleMul: 0.78, swayAmp: 0.46, swayFreq: 1.8, swayPhase: 3.1 },
      { uStart: 0.94, speed: 0.031, laneZ: -9.35, scaleMul: 0.80, swayAmp: 0.39, swayFreq: 2.5, swayPhase: 4.8 },
      { uStart: 0.24, speed: 0.025, laneZ:-10.80, scaleMul: 0.74, swayAmp: 0.42, swayFreq: 2.0, swayPhase: 1.9 }
    ];
    const sessionJitter = Math.random();
    CONVOY_BOATS_LAYOUT.forEach((b, i) => {
      b.uStart = (b.uStart + sessionJitter * 0.35 + ((i * 0.137) % 0.18)) % 1.0;
      b.swayPhase += Math.random() * 1.4;
    });

    const REPO_RAW_BASE = 'https://blenderingforconservation-maker.github.io/videAR/';
    const ASSETS = {
      sculpture: `${REPO_RAW_BASE}models/barcagrullas.glb`,
      waterTexture: `${REPO_RAW_BASE}image_c713d6.png`,
      ambientAudio: `${REPO_RAW_BASE}bosque_noche.mp3`
    };
    const SCENE_BG_HEX = 0x0d363c, SCENE_FOG_HEX = 0x12474c, SCENE_FOG_DENSITY = 0.015;

    let scene, camera, captureCamera, cameraRig, renderer;
    let barcaAnchorGroup, convoyGroup, fleetInstancedGroup;
    const convoyBoats = [], fleetInstancedPrimitives = [], baseMeshTemplates = [];
    let usingInstancedFleet = false, canUseInstancing = false;
    let waterMesh, waterUniforms, skyDome, firefliesMesh, firefliesMaterial;
    let isMaterializing = false, hasMaterializedOnce = false, materializationElapsed = 0;
    let currentRevealAudioFactor = 0, boatParticleGeoRef = null, convoyElapsedTime = 0;
    let spawnDistance = 7.4, lastFrameTime = performance.now(), localBoundsMinY = -0.3, localBoundsMaxY = 4.2;

    // Audio
    let ambientAudioEl = null, audioCtx = null, audioGainNode = null, audioRecordDest = null;
    let isAudioMuted = false, audioStarted = false, currentAppliedGain = 0;

    // Foto / Video
    let captureMode = 'photo', isRecordingVideo = false, mediaRecorder = null, activeRecordStream = null;
    let recordedChunks = [], recordStartTime = 0, recordTimerInterval = null, lastXRVideoCaptureMs = 0, lastCapture = null;
    const captureCanvas = document.createElement('canvas');
    const captureCtx = captureCanvas.getContext('2d', { alpha: false });

    // AR y Planos

    function setupWalkJoystick() {
      const maxR = 26;

        const d = Math.hypot(dx, dy); if (d > maxR) { dx = dx/d*maxR; dy = dy/d*maxR; }

        walkKnob.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
      };
      const resetK = () => { walkInput.active = false; walkInput.pointerId = null; walkInput.x = walkInput.y = 0; walkJoystick.classList.remove('dragging'); walkKnob.style.transform = 'translate3d(0,0,0)'; };

      walkJoystick.addEventListener('pointermove', (e) => { if (walkInput.active && e.pointerId === walkInput.pointerId) { e.preventDefault(); e.stopPropagation(); moveK(e.clientX, e.clientY); } });
      walkJoystick.addEventListener('pointerup', (e) => { if (e.pointerId === walkInput.pointerId) resetK(); });

    async function exitActiveARMode() {
      if (isRecordingVideo) stopVideoRecording();
      const xs = renderer.xr.getSession(); if (xs) { await xs.end().catch(() => {}); return; }
      if (isCameraARActive) {
        isCameraARActive = false; isARModeActive = false; setARPlacementMode(false); stopCameraStream(); disableGyroscope();
        applyTransparentARVisuals(false); resetViewerPosition(false); if (!hasMaterializedOnce) triggerMaterializationOnce(); showToast('Vista 3D activa');
      }
    }
    async function startXRSession(mode = 'immersive-vr') {
      unlockAndPlayAudio(); loadingModal.classList.add('hidden'); experienceHud.classList.add('active');
      if (isCameraARActive) { isCameraARActive = false; stopCameraStream(); disableGyroscope(); }
      if (!navigator.xr) { if (mode === 'immersive-ar') { await startMobileCameraARMode(); return; } setARPlacementMode(false); triggerMaterializationOnce(); showToast('WebXR requiere Quest 3 · Vista 3D activa'); return; }
      try {
        const sup = await navigator.xr.isSessionSupported(mode).catch(() => false);
        if (!sup) { if (mode === 'immersive-ar') { await startMobileCameraARMode(); return; } setARPlacementMode(false); triggerMaterializationOnce(); showToast('Abre en Meta Quest 3 para VR'); return; }
        const initOpts = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
        if (mode === 'immersive-ar') { initOpts.optionalFeatures.push('hit-test', 'plane-detection', 'dom-overlay'); initOpts.domOverlay = { root: xrDomOverlayRoot }; }
        const session = await navigator.xr.requestSession(mode, initOpts);
        renderer.xr.setReferenceSpaceType('local-floor');
        camera.position.set(0,0,0); camera.rotation.set(0,0,0); cameraRig.position.set(0,0,spawnDistance); cameraRig.rotation.set(0,0,0);
        xrHitTestSource = null; xrRefSpace = null; xrNoHitElapsed = 0;
        await renderer.xr.setSession(session);
        const isPass = mode === 'immersive-ar' || session.environmentBlendMode === 'alpha-blend';
        isARModeActive = isPass; applyTransparentARVisuals(isPass);
        if (isPass) {
          xrRefSpace = renderer.xr.getReferenceSpace();
          if (session.requestHitTestSource) session.requestReferenceSpace('viewer').then((vs) => session.requestHitTestSource({ space: vs })).then((s) => { xrHitTestSource = s; }).catch(() => {});
          session.addEventListener('select', () => { if (isARModeActive && isARPlacementMode) placeSceneAtDetectedSurface(); });
          arAnchorScale = IS_QUEST ? 0.80 : 0.72; barcaAnchorGroup.scale.setScalar(arAnchorScale); scaleReadout.textContent = `${Math.round(arAnchorScale*100)}%`;
          barcaAnchorGroup.visible = hasMaterializedOnce || hasPlacedInAR;
          experienceHud.classList.toggle('active', !!session.domOverlayState); setARPlacementMode(true);
        } else { experienceHud.classList.remove('active'); setARPlacementMode(false); barcaAnchorGroup.visible = true; triggerMaterializationOnce(); }
        session.addEventListener('end', () => {
          if (isRecordingVideo) stopVideoRecording();
          if (xrHitTestSource) { try { xrHitTestSource.cancel(); } catch (e) {} xrHitTestSource = null; }
          xrRefSpace = null; clearDetectedPlaneMeshes(); isARModeActive = false; setARPlacementMode(false); applyTransparentARVisuals(false);
          experienceHud.classList.add('active'); resetViewerPosition(false); if (!hasMaterializedOnce) triggerMaterializationOnce();
        });
      } catch (e) { if (mode === 'immersive-ar') await startMobileCameraARMode(); else { setARPlacementMode(false); triggerMaterializationOnce(); showToast('No se pudo iniciar XR · Vista 3D'); } }
    }

    function resetViewerPosition(notify = true) {
      if (!isARModeActive) { barcaAnchorGroup.position.set(0,0,0); barcaAnchorGroup.rotation.set(0,0,0); }
      cameraRig.position.set(0, 0, spawnDistance); cameraRig.rotation.set(0, 0, 0); barcaAnchorGroup.scale.setScalar(arAnchorScale);
      if (!renderer.xr.isPresenting) { yaw = 0; pitch = 0; gyroBaseYaw = null; camera.position.set(0, 1.65, 0); camera.rotation.set(0, 0, 0, 'YXZ'); }
      if (notify) showToast('Vista centrada');
    }
    function adjustScale(delta) { arAnchorScale = THREE.MathUtils.clamp(arAnchorScale + delta, 0.30, 1.80); barcaAnchorGroup.scale.setScalar(arAnchorScale); scaleReadout.textContent = `${Math.round(arAnchorScale*100)}%`; }
    function toggleToolsDrawer(st) { toolsDrawerOpen = typeof st === 'boolean' ? st : !toolsDrawerOpen; quickToolsDrawer.classList.toggle('drawer-closed', !toolsDrawerOpen); }
    function rotateRigAroundHead(ang) {
      renderer.xr.getCamera().getWorldPosition(_headBefore); cameraRig.rotation.y += ang; cameraRig.updateMatrixWorld(true);
      renderer.xr.getCamera().getWorldPosition(_headAfter); cameraRig.position.x += _headBefore.x - _headAfter.x; cameraRig.position.z += _headBefore.z - _headAfter.z;
    }

    function setupUIAndControls() {
      $('btn-launch-ar-cam').addEventListener('click', startMobileCameraARMode);
      $('btn-launch-ar-xr').addEventListener('click', () => startXRSession('immersive-ar'));
      $('btn-launch-vr-direct').addEventListener('click', () => startXRSession('immersive-vr'));
      $('btn-start-preview').addEventListener('click', () => { unlockAndPlayAudio(); loadingModal.classList.add('hidden'); experienceHud.classList.add('active'); setARPlacementMode(false); barcaAnchorGroup.visible = true; triggerMaterializationOnce(); });
      btnAudio.addEventListener('click', toggleAudioMute); btnFullscreen.addEventListener('click', toggleFullscreen); btnExitAr.addEventListener('click', exitActiveARMode);
      btnSwitchCam.addEventListener('click', async () => { if (!isCameraARActive) return; currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment'; try { await startCameraStream(currentFacingMode); } catch (e) { showToast('No se pudo cambiar cámara'); } });
      btnArPlace.addEventListener('click', () => { unlockAndPlayAudio(); placeSceneAtDetectedSurface(); });
      btnArCancelPlace.addEventListener('click', () => setARPlacementMode(false));
      btnLeftContext.addEventListener('click', () => isARModeActive ? setARPlacementMode(!isARPlacementMode) : startMobileCameraARMode());
      modePhotoBtn.addEventListener('click', () => { if (!isRecordingVideo) { captureMode = 'photo'; modePhotoBtn.classList.add('mode-pill-active'); modeVideoBtn.classList.remove('mode-pill-active'); shutterBtn.classList.remove('video-mode'); } });
      modeVideoBtn.addEventListener('click', () => { if (!isRecordingVideo) { captureMode = 'video'; modeVideoBtn.classList.add('mode-pill-active'); modePhotoBtn.classList.remove('mode-pill-active'); shutterBtn.classList.add('video-mode'); } });
      shutterBtn.addEventListener('click', (e) => { e.stopPropagation(); if (captureMode === 'photo') capturePhoto(); else if (isRecordingVideo) stopVideoRecording(); else startVideoRecording(); });
      btnToggleTools.addEventListener('click', () => toggleToolsDrawer());
      btnScaleDown.addEventListener('click', () => adjustScale(-0.10)); btnScaleUp.addEventListener('click', () => adjustScale(0.10));
      btnRecenter.addEventListener('click', () => resetViewerPosition(true));
      btnSwitchArXr.addEventListener('click', () => { toggleToolsDrawer(false); startXRSession('immersive-ar'); });
      btnSwitchVr.addEventListener('click', () => { toggleToolsDrawer(false); startXRSession('immersive-vr'); });
      btnLastCapture.addEventListener('click', () => { if (lastCapture) captureModal.classList.remove('hidden'); });
      btnCloseCapture.addEventListener('click', () => { captureModal.classList.add('hidden'); previewVideo.pause(); });
      btnSaveDevice.addEventListener('click', saveCaptureToPhone); btnShareDevice.addEventListener('click', shareCaptureToGallery);
      window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k in keysPressed) keysPressed[k] = true; });
      window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keysPressed) keysPressed[k] = false; });

      const vp = $('webgl-viewport');
      vp.addEventListener('pointerdown', (e) => { isPointerDown = true; pointerMovedDist = 0; prevPointerX = e.clientX; prevPointerY = e.clientY; if (!audioStarted && !isAudioMuted) unlockAndPlayAudio(); if (toolsDrawerOpen) toggleToolsDrawer(false); });
      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown || renderer.xr.isPresenting) return;
        const dx = e.clientX - prevPointerX, dy = e.clientY - prevPointerY; pointerMovedDist += Math.hypot(dx, dy);
        prevPointerX = e.clientX; prevPointerY = e.clientY;
        yaw -= dx * 0.0045; pitch = THREE.MathUtils.clamp(pitch - dy * 0.0045, -0.95, 0.95);
        if (!gyroEnabled) camera.rotation.set(pitch, yaw, 0, 'YXZ');
      });
      window.addEventListener('pointerup', () => { if (isPointerDown && pointerMovedDist < 8 && isCameraARActive && isARPlacementMode) placeSceneAtDetectedSurface(); isPointerDown = false; });
      vp.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { isPointerDown = false; pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); pinchStartScale = arAnchorScale; } }, { passive: true });
      vp.addEventListener('touchmove', (e) => { if (e.touches.length === 2 && pinchStartDist > 0) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); arAnchorScale = THREE.MathUtils.clamp(pinchStartScale * (d / pinchStartDist), 0.30, 1.80); barcaAnchorGroup.scale.setScalar(arAnchorScale); scaleReadout.textContent = `${Math.round(arAnchorScale*100)}%`; } }, { passive: true });
      vp.addEventListener('touchend', () => { pinchStartDist = 0; }, { passive: true });
    }

    function updateVRLocomotion(dt) {
      const session = renderer.xr.getSession(); if (!session) return;
      renderer.xr.getCamera().getWorldDirection(_xrForward); _xrForward.y = 0;
      if (_xrForward.lengthSq() > 1e-4) _xrForward.normalize(); else _xrForward.set(0,0,-1);
      _xrRight.crossVectors(_xrForward, _upAxis).normalize();
      for (const s of session.inputSources) {
        if (!s.gamepad) continue;
        const ax = s.gamepad.axes, bt = s.gamepad.buttons;
        const sx = ax.length >= 4 ? ax[2] : (ax[0] || 0), sy = ax.length >= 4 ? ax[3] : (ax[1] || 0);
        if (s.handedness === 'left') {
          if (Math.abs(sy) > 0.14) cameraRig.position.addScaledVector(_xrForward, -sy * 2.8 * dt);
          if (Math.abs(sx) > 0.14) cameraRig.position.addScaledVector(_xrRight, sx * 2.8 * dt);
          const xP = !!(bt[4] && bt[4].pressed), yP = !!(bt[5] && bt[5].pressed);
          if (xP && !prevButtons.leftX && isARModeActive) setARPlacementMode(!isARPlacementMode);
          if (yP && !prevButtons.leftY) resetViewerPosition(false);
          prevButtons.leftX = xP; prevButtons.leftY = yP;
        }
        if (s.handedness === 'right') {
          if (Math.abs(sx) > 0.65 && snapTurnReady) { rotateRigAroundHead(sx > 0 ? -Math.PI/6 : Math.PI/6); snapTurnReady = false; }
          else if (Math.abs(sx) < 0.25) snapTurnReady = true;
          if (Math.abs(sy) > 0.2) cameraRig.position.addScaledVector(_xrForward, -sy * 2.2 * dt);
          const aP = !!(bt[4] && bt[4].pressed), bP = !!(bt[5] && bt[5].pressed);
          if (aP && !prevButtons.rightA && isARModeActive && isARPlacementMode) placeSceneAtDetectedSurface();
          if (bP && !prevButtons.rightB) resetViewerPosition(false);
          prevButtons.rightA = aP; prevButtons.rightB = bP;
        }
      }
      const d = Math.hypot(cameraRig.position.x, cameraRig.position.z);
      if (d > 30) { cameraRig.position.x *= 30/d; cameraRig.position.z *= 30/d; }
    }

    function updateExplorationMovement(dt) {
      if (renderer.xr.isPresenting) return;
      camera.getWorldDirection(_xrForward); _xrForward.y = 0;
      if (_xrForward.lengthSq() > 1e-4) _xrForward.normalize(); else _xrForward.set(0,0,-1);
      _xrRight.crossVectors(_xrForward, _upAxis).normalize();
      const sp = 3.2;
      if (Math.abs(walkInput.y) > 0.05) cameraRig.position.addScaledVector(_xrForward, -walkInput.y * sp * dt);
      if (Math.abs(walkInput.x) > 0.05) cameraRig.position.addScaledVector(_xrRight, walkInput.x * sp * dt);
      if (keysPressed.w || keysPressed.arrowup)    cameraRig.position.addScaledVector(_xrForward,  sp * dt);
      if (keysPressed.s || keysPressed.arrowdown)  cameraRig.position.addScaledVector(_xrForward, -sp * dt);
      if (keysPressed.d || keysPressed.arrowright) cameraRig.position.addScaledVector(_xrRight,    sp * dt);
      if (keysPressed.a || keysPressed.arrowleft)  cameraRig.position.addScaledVector(_xrRight,   -sp * dt);
      const d = Math.hypot(cameraRig.position.x, cameraRig.position.z);
      if (d > 32) { cameraRig.position.x *= 32/d; cameraRig.position.z *= 32/d; }
    }

    const prowOffsetRad = THREE.MathUtils.degToRad(SCULPTURE_CONFIG.modelProwOffsetDeg);
    function updateConvoyNavigation(dt, timeSec) {
      if (!convoyBoats.length) return;
      convoyElapsedTime += dt;
      const primCount = fleetInstancedPrimitives.length;
      for (let i = 0; i < convoyBoats.length; i++) {
        const b = convoyBoats[i], cfg = b.cfg;
        const u = (cfg.uStart + convoyElapsedTime * cfg.speed) % 1.0;
        evaluateConvoyPosition(u, cfg, _pathSampleA);
        evaluateConvoyPosition(Math.min(0.9995, u + 0.003), cfg, _pathSampleB);
        const dx = _pathSampleB.x - _pathSampleA.x, dz = _pathSampleB.z - _pathSampleA.z, len = Math.hypot(dx, dz) || 1;
        const dirX = dx / len, dirZ = dz / len;
        const heading = Math.atan2(-dirZ, dirX) + prowOffsetRad;
        const edgeFade = smoothstepJS(0.0, 0.08, u) * smoothstepJS(1.0, 0.92, u);
        const finalScale = Math.max(0.0001, cfg.scaleMul * edgeFade);
        sampleRiverHeightAndSlopeJS(_pathSampleA.x, _pathSampleA.z, timeSec, _waveSample);
        b.curX = _pathSampleA.x; b.curY = _waveSample.h * 0.72 + Math.sin(timeSec * 0.92 + b.phase) * 0.022; b.curZ = _pathSampleA.z;
        b.curYaw = heading; b.curPitch = THREE.MathUtils.clamp(-_waveSample.sz * 0.28, -0.085, 0.085); b.curRoll = THREE.MathUtils.clamp(_waveSample.sx * 0.28, -0.085, 0.085); b.curScale = finalScale;
        const wakeVis = edgeFade * (hasMaterializedOnce ? 1.0 : b.progress);
        _boatWakeArray[i].set(b.curX, b.curZ, dirX * wakeVis, dirZ * wakeVis);

        if (usingInstancedFleet && primCount > 0) {
          _dummyObj.position.set(b.curX, b.curY, b.curZ); _dummyObj.rotation.set(b.curPitch, 0, b.curRoll); _dummyObj.scale.set(1,1,1); _dummyObj.updateMatrix(); _boatMat.copy(_dummyObj.matrix);
          _dummyObj.position.set(0,0,0); _dummyObj.rotation.set(0, b.curYaw, 0); _dummyObj.scale.setScalar(b.curScale); _dummyObj.updateMatrix(); _pivotMat.multiplyMatrices(_boatMat, _dummyObj.matrix);
          for (let p = 0; p < primCount; p++) { _instanceMat.multiplyMatrices(_pivotMat, fleetInstancedPrimitives[p].localMatrix); fleetInstancedPrimitives[p].instancedMesh.setMatrixAt(i, _instanceMat); }
        } else {
          b.group.position.set(b.curX, b.curY, b.curZ); b.group.rotation.set(b.curPitch, 0, b.curRoll); b.pivot.rotation.y = b.curYaw; b.pivot.scale.setScalar(b.curScale);
        }
      }
      if (usingInstancedFleet && primCount > 0) for (let p = 0; p < primCount; p++) fleetInstancedPrimitives[p].instancedMesh.instanceMatrix.needsUpdate = true;
    }

    function renderLoop(timestamp, frame) {
      const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000 || 0.016);
      lastFrameTime = timestamp; const timeSec = timestamp * 0.001;
      if (renderer.xr.isPresenting) { updateVRLocomotion(dt); if (isARModeActive && frame) updateWebXRHitTest(frame, dt); }
      else { if (gyroEnabled) updateCameraFromGyro(); updateExplorationMovement(dt); if (isCameraARActive && isARPlacementMode) updateFallbackSurfaceEstimate(false); }

      if (waterUniforms) waterUniforms.uTime.value = timeSec;
      if (firefliesMaterial) firefliesMaterial.uniforms.uTime.value = timeSec;
      updateConvoyNavigation(dt, timeSec);

      if (isMaterializing) {
        materializationElapsed += dt; let allDone = true, progSum = 0; const aScaleY = barcaAnchorGroup.scale.y;
        for (let i = 0; i < convoyBoats.length; i++) {
          const b = convoyBoats[i]; if (b.done) { progSum += 1; continue; }
          const lt = (materializationElapsed - b.delay) / b.duration;
          b.group.getWorldPosition(_tmpWorldPos); const eS = b.curScale * aScaleY;
          if (lt <= 0) { allDone = false; b.progress = 0; b.clippingPlane.constant = _tmpWorldPos.y + localBoundsMinY * eS - 0.1; b.particleMat.uniforms.uTime.value = timeSec; b.particleMat.uniforms.uProgress.value = 0; continue; }
          if (lt >= 1) { b.done = true; b.progress = 1; b.clippingPlane.constant = 1000; b.particleMat.uniforms.uProgress.value = 1; b.particles.visible = false; progSum += 1; continue; }
          allDone = false; const e = lt*lt*(3-2*lt); b.progress = e; progSum += e;
          b.clippingPlane.constant = THREE.MathUtils.lerp(_tmpWorldPos.y + localBoundsMinY * eS, _tmpWorldPos.y + (localBoundsMaxY + 0.18) * eS, e);
          b.particleMat.uniforms.uTime.value = timeSec; b.particleMat.uniforms.uProgress.value = e;
        }
        currentRevealAudioFactor = progSum / Math.max(1, convoyBoats.length);
        if (allDone) { isMaterializing = false; hasMaterializedOnce = true; currentRevealAudioFactor = 1; finalizeAndOptimizeConvoy(); }
      } else if (hasMaterializedOnce) currentRevealAudioFactor = 1;

      if (ambientAudioEl) {
        const tgt = isAudioMuted ? 0 : THREE.MathUtils.lerp(AUDIO_CONFIG.baseVolume, AUDIO_CONFIG.maxVolume, currentRevealAudioFactor);
        currentAppliedGain = THREE.MathUtils.lerp(currentAppliedGain, tgt, 1 - Math.exp(-dt * 3.8));
        if (audioGainNode && audioCtx) audioGainNode.gain.setTargetAtTime(currentAppliedGain, audioCtx.currentTime, 0.05);
        else ambientAudioEl.volume = THREE.MathUtils.clamp(currentAppliedGain, 0, 1);
      }

      renderer.render(scene, camera);

      if (isRecordingVideo) {
        if (renderer.xr.isPresenting) {
          if (timestamp - lastXRVideoCaptureMs >= 38) { lastXRVideoCaptureMs = timestamp; renderCleanFrameToWebGLCanvas(); compositeCurrentFrameToCaptureCanvas(); }
        } else compositeCurrentFrameToCaptureCanvas();
      }
    }
  </script>
