    waterMesh.rotation.x = -Math.PI / 2;
    waterRoot.add(waterMesh);

    function setupGLBWaterPlane(rawScene) {
      if (glbWaterGroup) {
        waterRoot.remove(glbWaterGroup);
        disposeHierarchy(glbWaterGroup);
        glbWaterGroup = null;
      }
      glbWaterAnimatedTextures.length = 0;

      const wrapper = new THREE.Group();
      wrapper.add(rawScene);

      rawScene.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(rawScene);
      let size = box.getSize(new THREE.Vector3());

      const horizSpan = Math.max(size.x, size.z, 0.001);
      const scaleXZ = WATER_SIZE / horizSpan;
      rawScene.scale.set(scaleXZ, Math.max(1.0, scaleXZ * 0.05), scaleXZ);
      rawScene.updateMatrixWorld(true);

      box = new THREE.Box3().setFromObject(rawScene);
      const center = box.getCenter(new THREE.Vector3());
      rawScene.position.x -= center.x;
      rawScene.position.z -= center.z;
      rawScene.position.y -= center.y;

      const seenTextures = new Set();

      rawScene.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        obj.frustumCulled = false;

        const isArray = Array.isArray(obj.material);
        const mats = (isArray ? obj.material : [obj.material]).map((orig) => {
          const m = orig.clone();
          m.transparent = true;
          m.depthWrite = true;

          if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
            m.envMapIntensity = Math.max(m.envMapIntensity ?? 1.0, 1.35);
          }

          const texSlots = [
            { tex: m.normalMap,    speedX:  0.018, speedY:  0.024 },
            { tex: m.bumpMap,      speedX: -0.015, speedY:  0.020 },
            { tex: m.roughnessMap, speedX:  0.012, speedY: -0.016 },
            { tex: m.map,          speedX:  0.010, speedY:  0.014 }
          ];
          for (const slot of texSlots) {
            if (slot.tex && !seenTextures.has(slot.tex)) {
              seenTextures.add(slot.tex);
              slot.tex.wrapS = THREE.RepeatWrapping;
              slot.tex.wrapT = THREE.RepeatWrapping;
              slot.tex.needsUpdate = true;
              glbWaterAnimatedTextures.push({
                tex: slot.tex,
                baseOffsetX: slot.tex.offset.x,
                baseOffsetY: slot.tex.offset.y,
                speedX: slot.speedX,
                speedY: slot.speedY
              });
            }
          }

          m.onBeforeCompile = (shader) => {
            shader.uniforms.uTime         = waterUniforms.uTime;
            shader.uniforms.uWaterReveal  = waterUniforms.uWaterReveal;
            shader.uniforms.uBoatPos      = waterUniforms.uBoatPos;
            shader.uniforms.uBoatDir      = waterUniforms.uBoatDir;
            shader.uniforms.uMotionFactor = waterUniforms.uMotionFactor;
            shader.uniforms.uFlowOffset   = waterUniforms.uFlowOffset;
            shader.uniforms.uIsAR         = waterUniforms.uIsAR;

            shader.vertexShader = shader.vertexShader
              .replace(
                '#include <common>',
                /* glsl */ `
                #include <common>
                uniform float uTime;
                uniform vec3 uBoatPos;
                uniform vec2 uBoatDir;
                uniform float uMotionFactor;
                uniform vec2 uFlowOffset;
                varying vec3 vWaterWorldPos;
                `
              )
              .replace(
                '#include <begin_vertex>',
                /* glsl */ `
                #include <begin_vertex>
                vec4 wpTmp = modelMatrix * vec4(transformed, 1.0);
                vec2 pW = wpTmp.xz - uFlowOffset * 0.45;
                float waveH = (sin(pW.x * 0.30 + uTime * 0.85) * 0.045
                             + cos(pW.y * 0.38 - uTime * 0.78) * 0.040
                             + sin((pW.x * 0.22 + pW.y * 0.30) + uTime * 1.15) * 0.028)
                             * (1.0 + uMotionFactor * 0.65);

                if (uMotionFactor > 0.01) {
                  vec2 toV = wpTmp.xz - uBoatPos.xz;
                  vec2 fwdW = normalize(uBoatDir + vec2(0.0001));
                  vec2 rightW = vec2(-fwdW.y, fwdW.x);
                  float alongW = dot(toV, fwdW);
                  float acrossW = abs(dot(toV, rightW));
                  if (alongW < 1.4 && alongW > -22.0) {
                    float spreadW = max(0.0, -alongW) * 0.54 + 0.62;
                    float armW = exp(-abs(acrossW - spreadW) * 1.4) * sin(alongW * 1.7 - uTime * 7.0);
                    float fadeW = smoothstep(-22.0, -2.5, alongW) * smoothstep(1.4, -0.3, alongW);
                    waveH += armW * fadeW * 0.10 * uMotionFactor;
                  }
                }
                transformed.y += waveH;
                vWaterWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
                `
              );

            shader.fragmentShader = shader.fragmentShader
              .replace(
                '#include <common>',
                /* glsl */ `
                #include <common>
                uniform float uTime;
                uniform float uWaterReveal;
                uniform vec3 uBoatPos;
                uniform vec2 uBoatDir;
                uniform float uMotionFactor;
                uniform float uIsAR;
                varying vec3 vWaterWorldPos;
                `
              )
              .replace(
                '#include <dithering_fragment>',
                /* glsl */ `
                if (uWaterReveal <= 0.001) discard;
                float distOrigW = length(vWaterWorldPos.xz);
                float revMaskW = 1.0;
                if (uWaterReveal < 0.999) {
                  float edgeW = uWaterReveal * 185.0 - distOrigW;
                  revMaskW = smoothstep(-5.5, 6.0, edgeW);
                  if (revMaskW <= 0.005) discard;
                  float pulseW = 0.62 + 0.38 * sin(uTime * 7.5 - distOrigW * 0.45);
                  float glowW = exp(-abs(edgeW) * 0.30) * pulseW * (1.0 - smoothstep(0.88, 1.0, uWaterReveal));
                  gl_FragColor.rgb += vec3(0.24, 0.76, 1.0) * glowW * 1.25;
                }

                if (uMotionFactor > 0.01) {
                  vec2 toF = vWaterWorldPos.xz - uBoatPos.xz;
                  vec2 fwdF = normalize(uBoatDir + vec2(0.0001));
                  vec2 rightF = vec2(-fwdF.y, fwdF.x);
                  float alongF = dot(toF, fwdF);
                  float acrossF = abs(dot(toF, rightF));

                  float bowF = exp(-pow((alongF - 1.75) * 1.4, 2.0)) * exp(-pow(acrossF * 1.25, 2.0));
                  float wakeF = 0.0;
                  if (alongF < 1.5 && alongF > -24.0) {
                    float spF = max(0.0, -alongF) * 0.56 + 0.62;
                    float chevF = 0.55 + 0.45 * sin(alongF * 3.4 - acrossF * 2.2 - uTime * 8.5);
                    float fdF = smoothstep(-24.0, -2.5, alongF) * smoothstep(1.5, -0.3, alongF);
                    wakeF = exp(-abs(acrossF - spF) * 2.1) * chevF * fdF;
                  }
                  float foamF = clamp((bowF * 0.8 + wakeF * 0.85) * uMotionFactor, 0.0, 1.0);
                  gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.82, 0.92, 0.97), foamF * 0.68);
                }

                if (uIsAR > 0.5) {
                  float camDW = length(vWaterWorldPos.xz - cameraPosition.xz);
                  gl_FragColor.a *= smoothstep(95.0, 28.0, camDW) * 0.94;
                }
                gl_FragColor.a *= revMaskW;
                #include <dithering_fragment>
                `
              );
          };

          return m;
        });

        obj.material = isArray ? mats : mats[0];
      });

      glbWaterGroup = wrapper;
      usingGLBWater = true;
      waterMesh.visible = false;
      waterRoot.add(glbWaterGroup);
    }

    function updateGLBWaterAnimation(t) {
      if (!usingGLBWater) return;
      const flowX = waterUniforms.uFlowOffset.value.x * 0.015;
      const flowY = waterUniforms.uFlowOffset.value.y * 0.015;
      for (const item of glbWaterAnimatedTextures) {
        item.tex.offset.x = item.baseOffsetX + t * item.speedX + flowX;
        item.tex.offset.y = item.baseOffsetY + t * item.speedY + flowY;
      }
    }

    const SPRAY_COUNT = 54;
    const sprayPositions = new Float32Array(SPRAY_COUNT * 3);
    const sprayVelocities = [];
    const sprayLife = new Float32Array(SPRAY_COUNT);
    for (let i = 0; i < SPRAY_COUNT; i++) {
      sprayPositions[i * 3 + 1] = -20;
      sprayVelocities.push(new THREE.Vector3());
      sprayLife[i] = Math.random();
    }
    const sprayGeo = new THREE.BufferGeometry();
    sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPositions, 3));
    const sprayMat = new THREE.PointsMaterial({
      color: 0xd9f0fa,
      size: 0.16,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const sprayPoints = new THREE.Points(sprayGeo, sprayMat);
    sprayPoints.frustumCulled = false;
    sprayPoints.visible = false;
    scene.add(sprayPoints);

    function updateWaterSpray(dt, boatPos, dir2D, motionFactor) {
      sprayMat.opacity = THREE.MathUtils.lerp(sprayMat.opacity, motionFactor * 0.72, dt * 5);
      if (sprayMat.opacity <= 0.005 && motionFactor < 0.05) {
        sprayPoints.visible = false;
        return;
      }
      sprayPoints.visible = true;
      if (motionFactor < 0.05) return;

      const posAttr = sprayGeo.attributes.position;
      const rightX = -dir2D.y;
      const rightZ = dir2D.x;

      for (let i = 0; i < SPRAY_COUNT; i++) {
        sprayLife[i] += dt * (1.2 + Math.random() * 0.7);
        if (sprayLife[i] >= 1.0) {
          sprayLife[i] = 0;
          const side = Math.random() < 0.5 ? 1 : -1;
          const alongBoat = 1.65 - Math.random() * 2.4;
          const lateral = side * (0.65 + Math.random() * 0.25);

          sprayPositions[i * 3]     = boatPos.x + dir2D.x * alongBoat + rightX * lateral;
          sprayPositions[i * 3 + 1] = 0.06 + Math.random() * 0.10;
          sprayPositions[i * 3 + 2] = boatPos.z + dir2D.y * alongBoat + rightZ * lateral;

          sprayVelocities[i].set(
            rightX * side * (0.65 + Math.random() * 0.85) - dir2D.x * 0.8,
            0.50 + Math.random() * 0.70,
            rightZ * side * (0.65 + Math.random() * 0.85) - dir2D.y * 0.8
          );
        } else {
          sprayVelocities[i].y -= 2.4 * dt;
          sprayPositions[i * 3]     += sprayVelocities[i].x * dt;
          sprayPositions[i * 3 + 1] += sprayVelocities[i].y * dt;
          sprayPositions[i * 3 + 2] += sprayVelocities[i].z * dt;
        }
      }
      posAttr.needsUpdate = true;
    }

    // =========================================================================
    // BLOQUE 3B: PORTAL MONUMENTAL 3D + ESPIRAL ESTRICTAMENTE RECTANGULAR INTERIOR
    // =========================================================================
    const portalGroup = new THREE.Group();
    portalGroup.position.copy(CONFIG.portalBasePosition);
    portalGroup.visible = false;
    scene.add(portalGroup);

    const portalUniforms = {
      uTime:      { value: 0 },
      uProximity: { value: 0 },
      uReveal:    { value: 0 },
      uAspect:    { value: 0.72 },
      uRatio:     { value: Math.min(window.devicePixelRatio, 2) }
    };

    let portalModelPivot = null;
    let portalMatRecords = [];
    let portalMaterialized = false;
    let portalVortexMesh = null;
    let portalCloudPoints = null;
    let portalSampledVerts = [];

    // Espiral interdimensional estrictamente recortado al marco rectangular interior del GLB
    const portalVortexMaterial = new THREE.ShaderMaterial({
      uniforms: portalUniforms,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: false,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv * 2.0 - 1.0;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        precision highp float;

        uniform float uTime;
        uniform float uProximity;
        uniform float uReveal;
        uniform float uAspect;

        varying vec2 vUv;

        void main() {
          if (uReveal <= 0.005) discard;

          // Recorte estricto al rectángulo interior [-1, 1] x [-1, 1] (jamás se sale del marco)
          float edgeX = 1.0 - abs(vUv.x);
          float edgeY = 1.0 - abs(vUv.y);
          float minEdge = min(edgeX, edgeY);
          if (minEdge <= 0.0) discard;

          // Coordenadas proporcionales para que el espiral no se deforme en el rectángulo
          vec2 p = vec2(vUv.x * uAspect, vUv.y);
          float r = length(p);
          float angle = atan(p.y, p.x);

          float speed = 1.15 + uProximity * 2.6 + (1.0 - uReveal) * 2.0;
          // Espiral logarítmico girando hacia el centro
          float logR = log(r + 0.055);
          float spiral1 = 0.5 + 0.5 * sin(angle * 3.0 - logR * 9.5 + uTime * speed * 1.4);
          float spiral2 = 0.5 + 0.5 * sin(angle * 6.0 - logR * 15.0 + uTime * speed * 0.95 + 1.2);
          float spiralArms = pow(spiral1, 1.8) * 0.72 + pow(spiral2, 2.6) * 0.38;

          // Profundidad de vórtice hacia el centro
          float depthPull = exp(-r * 2.2);
          float coreBright = exp(-r * 6.5);

          vec3 colVoid   = vec3(0.03, 0.07, 0.18);
          vec3 colCyan   = vec3(0.18, 0.62, 0.96);
          vec3 colGold   = vec3(0.98, 0.80, 0.44);
          vec3 colCore   = vec3(1.00, 0.97, 0.88);
          vec3 colBirth  = vec3(0.24, 0.78, 1.00);

          vec3 col = mix(colVoid, colCyan, spiralArms * 0.78);
          col = mix(col, colGold, spiralArms * (0.45 + 0.55 * depthPull));
          col += colCore * coreBright * 0.95;

          // Borde luminoso interno pegado exactamente al marco rectangular
          float innerFrameRim = exp(-minEdge * 22.0) * 0.75;
          col += mix(colGold, colCore, 0.45) * innerFrameRim;

          // Intensificación al acercarse la barca para cruzar
          col = mix(col, colCore, uProximity * 0.76 * (0.35 + 0.65 * depthPull));
          col = mix(colBirth, col, smoothstep(0.22, 0.92, uReveal));

          float rectMask = smoothstep(0.0, 0.035, minEdge);
          float alpha = rectMask * (0.88 + 0.12 * spiralArms) * uReveal;
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    function buildPortalParticleCloud(sampledVerts, aperture) {
      if (portalCloudPoints) {
        portalGroup.remove(portalCloudPoints);
        portalCloudPoints.geometry.dispose();
        portalCloudPoints.material.dispose();
        portalCloudPoints = null;
      }

      const TOTAL = 260;
      const positions = new Float32Array(TOTAL * 3);
      const sizes     = new Float32Array(TOTAL);
      const phases    = new Float32Array(TOTAL);
      const speeds    = new Float32Array(TOTAL);
      const colorMix  = new Float32Array(TOTAL);
      const drifts    = new Float32Array(TOTAL * 3);

      const halfW = aperture.width * 0.48;
      const halfH = aperture.height * 0.48;

      for (let i = 0; i < TOTAL; i++) {
        // Partículas contenidas dentro del rectángulo interior del portal
        const px = aperture.centerX + (Math.random() * 2 - 1) * halfW;
        const py = Math.max(0.55, aperture.centerY + (Math.random() * 2 - 1) * halfH);
        const pz = aperture.zOffset + (Math.random() - 0.5) * 2.2;

        positions[i * 3]     = px;
        positions[i * 3 + 1] = py;
        positions[i * 3 + 2] = pz;

        sizes[i]    = 130.0 + Math.random() * 140.0;
        phases[i]   = Math.random() * Math.PI * 2;
        speeds[i]   = 1.35 + Math.random() * 2.0;
        colorMix[i] = Math.random();

        drifts[i * 3]     = (Math.random() - 0.5) * 0.45;
        drifts[i * 3 + 1] = 0.25 + Math.random() * 0.55;
        drifts[i * 3 + 2] = (Math.random() - 0.5) * 0.45;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position',  new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSize',     new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aPhase',    new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aSpeed',    new THREE.BufferAttribute(speeds, 1));
      geo.setAttribute('aColorMix', new THREE.BufferAttribute(colorMix, 1));
      geo.setAttribute('aDrift',    new THREE.BufferAttribute(drifts, 3));

      const mat = new THREE.ShaderMaterial({
        uniforms: portalUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
        vertexShader: /* glsl */ `
          attribute float aSize;
          attribute float aPhase;
          attribute float aSpeed;
          attribute float aColorMix;
          attribute vec3 aDrift;

          uniform float uTime;
          uniform float uProximity;
          uniform float uReveal;
          uniform float uRatio;

          varying float vPulse;
          varying float vColorMix;
          varying float vReveal;

          void main() {
            vec3 p = position;
            float t = uTime;

            p.x += sin(t * 0.45 + aPhase) * aDrift.x;
            p.y += cos(t * 0.40 + aPhase * 1.25) * aDrift.y;
            p.z += sin(t * 0.36 + aPhase * 0.85) * aDrift.z;

            float pulseWave = 0.5 + 0.5 * sin(t * aSpeed * (1.0 + uProximity * 0.5) + aPhase * 2.4);
            vPulse = 0.24 + 0.76 * pow(pulseWave, 1.5);
            vColorMix = aColorMix;
            vReveal = uReveal;

            vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
            float dist = max(-mvPosition.z, 2.5);
            float ptSize = (aSize * uRatio / dist) * (0.72 + 0.40 * vPulse);
            gl_PointSize = clamp(ptSize, 1.5 * uRatio, 12.0 * uRatio);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;

          uniform float uProximity;
          varying float vPulse;
          varying float vColorMix;
          varying float vReveal;

          void main() {
            if (vReveal <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;

            float halo = exp(-d * 6.8);
            float core = exp(-d * 16.5);

            vec3 softCyan = vec3(0.32, 0.74, 0.96);
            vec3 warmGold = vec3(0.96, 0.79, 0.46);
            vec3 pearlCol = vec3(0.92, 0.94, 0.96);

            vec3 orbCol = vColorMix < 0.38
              ? mix(softCyan, pearlCol, vColorMix / 0.38)
              : mix(pearlCol, warmGold, (vColorMix - 0.38) / 0.62);

            orbCol = mix(softCyan, orbCol, smoothstep(0.22, 0.95, vReveal));
            vec3 col = mix(orbCol, vec3(0.98, 0.96, 0.92), core * 0.55);

            float alpha = (halo * 0.38 + core * 0.42) * (0.26 + 0.44 * vPulse) * 0.55 * vReveal;
            gl_FragColor = vec4(col * (0.74 + 0.24 * vPulse + 0.12 * uProximity), alpha);
          }
        `
      });

      portalCloudPoints = new THREE.Points(geo, mat);
      portalCloudPoints.frustumCulled = false;
      portalGroup.add(portalCloudPoints);
    }

    // Mide el hueco rectangular interior real del GLB con margen de seguridad para que nunca se salga
    function computePortalInnerAperture(wrapper, finalBox, finalSize) {
      wrapper.updateMatrixWorld(true);
      const yLow  = finalBox.min.y + finalSize.y * 0.22;
      const yHigh = finalBox.min.y + finalSize.y * 0.60;
      const yTopSearch = finalBox.min.y + finalSize.y * 0.52;

      let leftInner = -Infinity;
      let rightInner = Infinity;
      const v = new THREE.Vector3();

      wrapper.traverse((obj) => {
        if (!obj.isMesh || !obj.geometry || !obj.geometry.attributes.position) return;
        const pos = obj.geometry.attributes.position;
        const stride = Math.max(1, Math.floor(pos.count / 1200));
        for (let i = 0; i < pos.count; i += stride) {
          v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
          if (v.y >= yLow && v.y <= yHigh) {
            if (v.x < -finalSize.x * 0.08 && v.x > leftInner) leftInner = v.x;
            if (v.x >  finalSize.x * 0.08 && v.x < rightInner) rightInner = v.x;
          }
        }
      });

      if (!isFinite(leftInner) || !isFinite(rightInner) || (rightInner - leftInner) < finalSize.x * 0.25) {
        leftInner  = -finalSize.x * 0.32;
        rightInner =  finalSize.x * 0.32;
      }

      const rawHalfW = (rightInner - leftInner) * 0.5;
      const centerX = (leftInner + rightInner) * 0.5;

      let topInner = Infinity;
      wrapper.traverse((obj) => {
        if (!obj.isMesh || !obj.geometry || !obj.geometry.attributes.position) return;
        const pos = obj.geometry.attributes.position;
        const stride = Math.max(1, Math.floor(pos.count / 1200));
        for (let i = 0; i < pos.count; i += stride) {
          v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
          if (Math.abs(v.x - centerX) < rawHalfW * 0.45 && v.y > yTopSearch && v.y < topInner) {
            topInner = v.y;
          }
        }
      });

      if (!isFinite(topInner) || topInner < finalSize.y * 0.45) {
        topInner = finalBox.min.y + finalSize.y * 0.78;
      }

      const bottomY = Math.max(finalBox.min.y, -0.25);
      // Margen interno estricto (93% ancho, 95% alto) para quedar encapsulado dentro del marco rectangular
      const width   = THREE.MathUtils.clamp((rightInner - leftInner) * 0.93, finalSize.x * 0.32, finalSize.x * 0.78);
      const height  = THREE.MathUtils.clamp((topInner - bottomY) * 0.95, finalSize.y * 0.45, finalSize.y * 0.80);
      const centerY = bottomY + height * 0.5;

      return { centerX, centerY, width, height, zOffset: -0.15 };
    }

    function normalizePortalTemplate(rawScene) {
      const wrapper = new THREE.Group();
      wrapper.add(rawScene);

      rawScene.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(rawScene);
      let size = box.getSize(new THREE.Vector3());

      if (size.z > size.x * 1.15) {
        rawScene.rotation.y = Math.PI / 2;
      }

      rawScene.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(rawScene);
      size = box.getSize(new THREE.Vector3());

      let scale = CONFIG.portalTargetHeight / Math.max(size.y, 0.001);
      if (size.x * scale > CONFIG.portalMaxWidth) {
        scale = CONFIG.portalMaxWidth / Math.max(size.x, 0.001);
      }
      rawScene.scale.setScalar(scale);
      rawScene.updateMatrixWorld(true);

      box = new THREE.Box3().setFromObject(rawScene);
      const center = box.getCenter(new THREE.Vector3());
      rawScene.position.x -= center.x;
      rawScene.position.z -= center.z;
      rawScene.position.y -= (box.min.y + CONFIG.portalWaterSink);

      rawScene.updateMatrixWorld(true);
      const finalBox = new THREE.Box3().setFromObject(wrapper);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const aperture = computePortalInnerAperture(wrapper, finalBox, finalSize);

      const matRecords = [];
      rawScene.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          obj.frustumCulled = false;
          const isArray = Array.isArray(obj.material);
          const mats = (isArray ? obj.material : [obj.material]).map((orig) => {
            const m = orig.clone();
            if (m.isMeshStandardMaterial) {
              m.roughness = Math.min(m.roughness ?? 0.55, 0.78);
              m.envMapIntensity = 1.35;
            }
            matRecords.push({
              mat: m,
              origTransparent: !!m.transparent,
              origDepthWrite: m.depthWrite !== undefined ? m.depthWrite : true,
              origOpacity: m.opacity !== undefined ? m.opacity : 1.0,
              hasEmissive: !!m.emissive,
              origEmissive: m.emissive ? m.emissive.clone() : new THREE.Color(0x000000),
              origEmissiveIntensity: m.emissiveIntensity !== undefined ? m.emissiveIntensity : 0.0
            });
            return m;
          });
          obj.material = isArray ? mats : mats[0];
        }
      });

      const sampledVerts = sampleVerticesFromTemplate(wrapper, 280);
      return { wrapper, finalSize, aperture, matRecords, sampledVerts };
    }

    function createFallbackMonumentalPortal() {
      const wrapper = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: 0x6e5a44,
        metalness: 0.76,
        roughness: 0.34,
        envMapIntensity: 1.35
      });
      const h = CONFIG.portalTargetHeight;
      const w = h * 0.86;
      const thick = 4.6;
      const depth = 6.2;

      const leftPillar = new THREE.Mesh(new THREE.BoxGeometry(thick, h, depth), mat);
      leftPillar.position.set(-w * 0.5 + thick * 0.5, h * 0.5, 0);
      const rightPillar = leftPillar.clone();
      rightPillar.position.x = w * 0.5 - thick * 0.5;
      const topBeam = new THREE.Mesh(new THREE.BoxGeometry(w, thick * 1.1, depth * 1.05), mat);
      topBeam.position.set(0, h - thick * 0.55, 0);

      wrapper.add(leftPillar, rightPillar, topBeam);
      return normalizePortalTemplate(wrapper);
    }

    function setupMonumentalPortal(normalizedPortal) {
      if (portalModelPivot) {
        portalGroup.remove(portalModelPivot);
        disposeHierarchy(portalModelPivot);
      }
      if (portalVortexMesh) {
        portalGroup.remove(portalVortexMesh);
        portalVortexMesh.geometry.dispose();
      }

      const { wrapper, finalSize, aperture, matRecords, sampledVerts } = normalizedPortal;
      portalModelPivot   = wrapper;
      portalMatRecords   = matRecords;
      portalSampledVerts = sampledVerts;
      portalMaterialized = false;

      portalGroup.add(portalModelPivot);

      portalUniforms.uAspect.value = aperture.width / Math.max(aperture.height, 0.01);
      portalVortexMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(aperture.width, aperture.height),
        portalVortexMaterial
      );
      portalVortexMesh.position.set(aperture.centerX, aperture.centerY, aperture.zOffset);
      portalVortexMesh.frustumCulled = false;
      portalGroup.add(portalVortexMesh);

      buildPortalParticleCloud(sampledVerts, aperture);

      const frontOffset = Math.max(finalSize.z * 0.6, 8.0) + 6.0;
      portalGlowLight.position.set(0, aperture.centerY * 0.60, CONFIG.portalBasePosition.z + frontOffset);
      portalCrownLight.position.set(0, aperture.centerY * 1.35, CONFIG.portalBasePosition.z + frontOffset + 4.0);
      waterUniforms.uPortalPos.value.set(0, aperture.centerY, CONFIG.portalBasePosition.z);
    }

    const BLUE_MAT_COLOR       = new THREE.Color(0x28a4ff);
    const GOLD_PORTAL_EMISSIVE = new THREE.Color(0xd8a856);
    const BLUE_PORTAL_EMISSIVE = new THREE.Color(0x38b6ff);

    function setPortalMaterialization(progress, timeSec) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);
      portalUniforms.uReveal.value = p;

      if (!portalModelPivot) return;

      if (p <= 0.001) {
        portalModelPivot.visible = false;
        portalMaterialized = false;
        return;
      }

      portalModelPivot.visible = true;
      const easeOut = 1.0 - Math.pow(1.0 - p, 3.0);
      portalGroup.scale.setScalar(THREE.MathUtils.lerp(0.86, 1.0, easeOut));

      if (p >= 0.999) {
        if (!portalMaterialized) {
          portalMaterialized = true;
          portalGroup.scale.setScalar(1.0);
          for (const rec of portalMatRecords) {
            rec.mat.transparent = rec.origTransparent;
            rec.mat.depthWrite  = rec.origDepthWrite;
            rec.mat.opacity     = rec.origOpacity;
            if (rec.hasEmissive) {
              rec.mat.emissive.copy(rec.origEmissive);
              rec.mat.emissiveIntensity = rec.origEmissiveIntensity;
            }
            rec.mat.needsUpdate = true;
          }
        }
        return;
      }

      portalMaterialized = false;
      const glowBell = Math.sin(p * Math.PI);
      const bluePulse = 0.60 + 0.40 * Math.sin(timeSec * 8.2);

      for (const rec of portalMatRecords) {
        if (!rec.mat.transparent) {
          rec.mat.transparent = true;
          rec.mat.needsUpdate = true;
        }
        rec.mat.depthWrite = p > 0.58 ? rec.origDepthWrite : false;
        rec.mat.opacity = rec.origOpacity * smoothstepJS(0.04, 0.84, p);

        if (rec.hasEmissive) {
          rec.mat.emissive.lerpColors(BLUE_PORTAL_EMISSIVE, GOLD_PORTAL_EMISSIVE, smoothstepJS(0.45, 1.0, p));
          rec.mat.emissiveIntensity = THREE.MathUtils.lerp(
            rec.origEmissiveIntensity,
            1.35 * bluePulse,
            glowBell
          );
        }
      }
    }

    let materializePoints = null;
    const matParticleUniforms = {
      uTime:    { value: 0 },
      uMatTime: { value: -1.0 },
      uRatio:   { value: Math.min(window.devicePixelRatio, 2) }
    };

    function buildMaterializeParticles(sampledBoatVerts) {
      if (materializePoints) {
        scene.remove(materializePoints);
        materializePoints.geometry.dispose();
        materializePoints.material.dispose();
        materializePoints = null;
      }

      const perBoatCount = sampledBoatVerts.length;
      const sceneExtraCount = 340;
      const total = boats.length * perBoatCount + sceneExtraCount;

      const positions = new Float32Array(total * 3);
      const delays    = new Float32Array(total);
      const seeds     = new Float32Array(total);
      const kinds     = new Float32Array(total);

      const tmpVec = new THREE.Vector3();
      let ptr = 0;

      boats.forEach((b) => {
        b.group.updateMatrixWorld(true);
        const boatDelay = b.matDelay;
        for (let i = 0; i < perBoatCount; i++) {
          tmpVec.copy(sampledBoatVerts[i]).applyMatrix4(b.group.matrixWorld);
          positions[ptr * 3]     = tmpVec.x;
          positions[ptr * 3 + 1] = tmpVec.y;
          positions[ptr * 3 + 2] = tmpVec.z;
          delays[ptr] = boatDelay + Math.random() * 0.28;
          seeds[ptr]  = Math.random();
          kinds[ptr]  = 0.0;
          ptr++;
        }
      });

      for (let i = 0; i < sceneExtraCount; i++) {
        const isPortalCloud = i > sceneExtraCount * 0.60;
        if (isPortalCloud && portalSampledVerts.length > 0) {
          const pv = portalSampledVerts[i % portalSampledVerts.length];
          positions[ptr * 3]     = CONFIG.portalBasePosition.x + pv.x + (Math.random() - 0.5) * 3.0;
          positions[ptr * 3 + 1] = Math.max(0.6, pv.y + (Math.random() - 0.5) * 3.0);
          positions[ptr * 3 + 2] = CONFIG.portalBasePosition.z + pv.z + (Math.random() - 0.5) * 3.5;
          delays[ptr] = 0.70 + Math.random() * 0.75;
          kinds[ptr]  = 2.0;
        } else {
          positions[ptr * 3]     = (Math.random() - 0.5) * 34;
          positions[ptr * 3 + 1] = 0.08 + Math.random() * 0.6;
          positions[ptr * 3 + 2] = 2.0 - Math.random() * 72;
          delays[ptr] = Math.random() * 1.1;
          kinds[ptr]  = 1.0;
        }
        seeds[ptr] = Math.random();
        ptr++;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aDelay',   new THREE.BufferAttribute(delays, 1));
      geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds, 1));
      geo.setAttribute('aKind',    new THREE.BufferAttribute(kinds, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: matParticleUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
        vertexShader: /* glsl */ `
          attribute float aDelay;
          attribute float aSeed;
          attribute float aKind;

          uniform float uTime;
          uniform float uMatTime;
          uniform float uRatio;

          varying float vAlpha;
          varying float vPulse;
          varying float vKind;

          void main() {
            vKind = aKind;
            if (uMatTime < 0.0) {
              vAlpha = 0.0;
              gl_PointSize = 0.0;
              gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
              return;
            }

            float localT = uMatTime - aDelay;
            if (localT < 0.0) {
              vAlpha = 0.0;
              gl_PointSize = 0.0;
              gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
              return;
            }

            float dur = aKind < 0.5 ? 3.2 : 3.6;
            float p = clamp(localT / dur, 0.0, 1.0);
            vec3 pos = position;

            float freq = 5.2 + fract(aSeed * 7.13) * 4.8;
            float pulse = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * freq + aSeed * 31.4));
            vPulse = pulse;

            if (aKind < 0.5) {
              float gather = smoothstep(0.0, 0.44, p);
              float driftUp = smoothstep(0.66, 1.0, p);
              float angle = (1.0 - gather) * 4.2 + aSeed * 6.28318;
              float swirlR = (1.0 - gather) * (0.38 + fract(aSeed * 13.7) * 0.95);

              pos.x += cos(angle) * swirlR;
              pos.z += sin(angle) * swirlR;
              pos.y += -(1.0 - gather) * (0.30 + fract(aSeed * 5.9) * 0.45)
                     + driftUp * (1.15 + fract(aSeed * 19.3) * 1.65);

              vAlpha = smoothstep(0.0, 0.14, p) * (1.0 - smoothstep(0.68, 1.0, p));
            } else {
              pos.y += p * (2.4 + fract(aSeed * 11.1) * 3.0);
              pos.x += sin(uTime * 1.4 + aSeed * 12.0) * (aKind > 1.5 ? 1.0 : 0.55);
              pos.z += cos(uTime * 1.1 + aSeed * 9.0) * (aKind > 1.5 ? 1.0 : 0.55);
              vAlpha = smoothstep(0.0, 0.18, p) * (1.0 - smoothstep(0.68, 1.0, p));
            }

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float baseSize = (aKind > 1.5 ? 210.0 : (aKind < 0.5 ? 36.0 : 52.0)) * uRatio;
            float maxPt = (aKind > 1.5 ? 18.0 : 44.0) * uRatio;
            gl_PointSize = clamp((baseSize / max(-mvPosition.z, 1.0)) * (0.65 + 0.60 * pulse), 2.0, maxPt);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;

          varying float vAlpha;
          varying float vPulse;
          varying float vKind;

          void main() {
            if (vAlpha <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;

            float halo = exp(-d * 5.8);
            float core = exp(-d * 14.8);

            vec3 deepBlue  = vec3(0.08, 0.46, 1.00);
            vec3 cyanBlue  = vec3(0.36, 0.84, 1.00);
            vec3 coreWhite = vec3(0.88, 0.97, 1.00);

            vec3 col = mix(deepBlue, cyanBlue, vPulse);
            col = mix(col, coreWhite, core * 0.78);

            float dimPortal = vKind > 1.5 ? 0.60 : 1.0;
            float finalAlpha = (halo * 0.72 + core * 0.60) * vAlpha * (0.50 + 0.45 * vPulse) * dimPortal;
            gl_FragColor = vec4(col * (0.95 + 0.30 * vPulse), finalAlpha);
          }
        `
      });

      materializePoints = new THREE.Points(geo, mat);
      materializePoints.frustumCulled = false;
      materializePoints.visible = false;
      scene.add(materializePoints);
    }

    // --- Luciérnagas orgánicas (protagonistas en Escenario A oscuro, sutiles en Escenario B) ---
    const ambientParticleUniforms = {
      uTime:        { value: 0 },
      uReveal:      { value: 0 },
      uGalaxyWorld: { value: 0 },
      uRatio:       { value: Math.min(window.devicePixelRatio, 2) }
    };
    const ambientPoints = (() => {
      const count = 240;
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const isBlue = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const nearBoats = i < 140;
        positions[i * 3]     = nearBoats ? (Math.random() - 0.5) * 24 : (Math.random() - 0.5) * 44;
        positions[i * 3 + 1] = nearBoats ? (0.35 + Math.random() * 3.8) : (0.6 + Math.random() * 8.5);
        positions[i * 3 + 2] = nearBoats ? (2.5 - Math.random() * 18) : (4.0 - Math.random() * 86);
        phases[i] = Math.random() * Math.PI * 2;
        isBlue[i] = i < 185 ? 0.0 : 1.0; // Mayoría luciérnagas cálidas doradas
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aIsBlue',  new THREE.BufferAttribute(isBlue, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: ambientParticleUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          attribute float aPhase;
          attribute float aIsBlue;
          uniform float uTime;
          uniform float uReveal;
          uniform float uGalaxyWorld;
          uniform float uRatio;
          varying float vPulse;
          varying float vIsBlue;
          varying float vReveal;

          void main() {
            vec3 pos = position;
            pos.y += sin(uTime * 0.72 + aPhase) * 0.42;
            pos.x += cos(uTime * 0.46 + aPhase * 1.3) * 0.52;
            pos.z += sin(uTime * 0.38 + aPhase * 0.9) * 0.35;
            vPulse = 0.22 + 0.78 * pow(0.5 + 0.5 * sin(uTime * (aIsBlue > 0.5 ? 2.4 : 1.65) + aPhase * 2.1), 1.6);
            vIsBlue = aIsBlue;
            vReveal = uReveal;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float sizeBoost = mix(30.0, 22.0, uGalaxyWorld);
            gl_PointSize = clamp((sizeBoost * uRatio / max(-mvPosition.z, 1.0)) * (0.65 + 0.60 * vPulse), 1.8, 28.0);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;

          uniform float uGalaxyWorld;
          varying float vPulse;
          varying float vIsBlue;
          varying float vReveal;

          void main() {
            if (vReveal <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float glow = exp(-d * 6.0) * vPulse * vReveal * mix(1.05, 0.65, uGalaxyWorld);
            vec3 fireflyGold = vec3(1.00, 0.88, 0.44);
            vec3 cosmicBlue  = vec3(0.36, 0.82, 1.00);
            vec3 col = mix(fireflyGold, cosmicBlue, vIsBlue * (0.25 + 0.75 * uGalaxyWorld));
            gl_FragColor = vec4(col, glow);
          }
        `
      });
      const pts = new THREE.Points(geo, mat);
      pts.visible = false;
      scene.add(pts);
      return pts;
    })();

    // =========================================================================
    // BLOQUE 4: CARGA PARALELA (barcagrullas.glb + portal + agua.glb)
    // =========================================================================
    const boats = [];
    const boatHitboxes = [];
    let boatSampledVerts = [];
    let boatReady = false;
    let portalReady = false;
    let waterReady = false;
    let boatProgress = 0;
    let portalProgress = 0;
    let waterProgress = 0;
    let vrSupported = false;
    let arSupported = false;
    let activeDracoLoader = null;

    const introScreen = document.getElementById('intro-screen');
    const loadTrack   = document.getElementById('load-track');
    const loadFill    = document.getElementById('load-fill');
    const orbAR       = document.getElementById('orb-ar');
    const orbVR       = document.getElementById('orb-vr');
    const orbWeb      = document.getElementById('orb-web');

    function sampleVerticesFromTemplate(wrapper, maxSamples = 145) {
      wrapper.updateMatrixWorld(true);
      const rawVerts = [];
      const v = new THREE.Vector3();

      wrapper.traverse((obj) => {
        if (obj.isMesh && obj.geometry && obj.geometry.attributes.position) {
          const pos = obj.geometry.attributes.position;
          const stride = Math.max(1, Math.floor(pos.count / 110));
          for (let i = 0; i < pos.count; i += stride) {
            v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
            rawVerts.push(v.clone());
          }
        }
      });

      if (rawVerts.length === 0) {
        for (let i = 0; i < maxSamples; i++) {
          rawVerts.push(new THREE.Vector3(
            (Math.random() - 0.5) * 1.4,
            Math.random() * 1.4,
            (Math.random() - 0.5) * 3.6
          ));
        }
      }

      const sampled = [];
      for (let i = 0; i < maxSamples; i++) {
        const idx = Math.floor((i / maxSamples) * rawVerts.length);
        sampled.push(rawVerts[idx]);
      }
      return sampled;
    }

    function normalizeBoatTemplate(rawScene) {
      const wrapper = new THREE.Group();
      wrapper.add(rawScene);

      rawScene.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(rawScene);
      let size = box.getSize(new THREE.Vector3());

      if (size.x > size.z * 1.15) {
        rawScene.rotation.y = Math.PI / 2;
      }

      rawScene.rotation.y += Math.PI;

      rawScene.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(rawScene);
      size = box.getSize(new THREE.Vector3());

      const longestHoriz = Math.max(size.x, size.z, 0.001);
      const scale = CONFIG.targetBoatLength / longestHoriz;
      rawScene.scale.setScalar(scale);
      rawScene.updateMatrixWorld(true);

      box = new THREE.Box3().setFromObject(rawScene);
      const center = box.getCenter(new THREE.Vector3());
      rawScene.position.x -= center.x;
      rawScene.position.z -= center.z;
      rawScene.position.y -= (box.min.y + CONFIG.waterlineSink);

      rawScene.updateMatrixWorld(true);
      const finalBox = new THREE.Box3().setFromObject(wrapper);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      CONFIG.seatOffset.set(0, THREE.MathUtils.clamp(finalSize.y * 0.19, 0.24, 0.50), 0);

      rawScene.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          obj.frustumCulled = true;
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            if (m.isMeshStandardMaterial) {
              m.roughness = Math.min(m.roughness ?? 0.55, 0.72);
              m.envMapIntensity = 1.25;
            }
          });
        }
      });

      const sampledVerts = sampleVerticesFromTemplate(wrapper, 145);
      return { wrapper, finalSize, sampledVerts };
    }

    function createSculpturalFallbackBoat() {
      const wrapper = new THREE.Group();
      const bronzeDark = new THREE.MeshStandardMaterial({
        color: 0x4b3f32,
        metalness: 0.74,
        roughness: 0.34,
        envMapIntensity: 1.35
      });
      const bronzeGold = new THREE.MeshStandardMaterial({
        color: 0x997c52,
        metalness: 0.80,
        roughness: 0.28,
        envMapIntensity: 1.4
      });

      const hullGeo = new THREE.CapsuleGeometry(0.56, 2.3, 8, 18);
      hullGeo.rotateX(Math.PI / 2);
      hullGeo.scale(1.12, 0.52, 1.15);
      const hull = new THREE.Mesh(hullGeo, bronzeDark);
      hull.position.y = 0.04;
      wrapper.add(hull);

      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.06, 10, 28), bronzeGold);
      rim.rotation.x = Math.PI / 2;
      rim.scale.set(0.64, 1.72, 1.0);
      rim.position.y = 0.22;
      wrapper.add(rim);

      const neckCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.20, 1.20),
        new THREE.Vector3(0, 0.80, 1.56),
        new THREE.Vector3(0, 1.40, 1.44),
        new THREE.Vector3(0, 1.50, 1.66)
      ]);
      wrapper.add(new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 22, 0.07, 10, false), bronzeGold));

      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.42, 8), bronzeGold);
      beak.rotation.x = Math.PI / 2 + 0.12;
      beak.position.set(0, 1.48, 1.92);
      wrapper.add(beak);

      [-1, 1].forEach((side) => {
        const wingCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(side * 0.48, 0.20, 0.55),
          new THREE.Vector3(side * 0.68, 0.56, -0.10),
          new THREE.Vector3(side * 0.50, 0.76, -0.95),
          new THREE.Vector3(side * 0.24, 0.46, -1.52)

        wrapper.add(new THREE.Mesh(new THREE.TubeGeometry(wingCurve, 18, 0.055, 8, false), bronzeDark));
      });

      return {
        wrapper,
        finalSize: new THREE.Vector3(1.4, 1.85, 3.8),
        sampledVerts: sampleVerticesFromTemplate(wrapper, 145)
      };
    }

    function populateBoats(normalizedData) {
      boats.forEach((b) => {
        scene.remove(b.group);
        disposeHierarchy(b.group, false, true);
      });
      boats.length = 0;
      boatHitboxes.length = 0;

      const { wrapper, finalSize, sampledVerts } = normalizedData;
      boatSampledVerts = sampledVerts;
      const ringRadius = Math.max(finalSize.x, finalSize.z) * 0.48;
      const centerIndex = Math.floor(CONFIG.boatsLayout.length / 2);

      const sharedRingGeo = new THREE.RingGeometry(ringRadius * 0.92, ringRadius * 1.03, 40);
      const sharedHitboxGeo = new THREE.BoxGeometry(
        Math.max(finalSize.x * 1.15, 1.8),
        Math.max(finalSize.y * 1.15, 2.0),
        Math.max(finalSize.z * 1.08, 3.6)
      );
      const sharedHitboxMat = new THREE.MeshBasicMaterial({ visible: false });

      buildIntroWireframe(wrapper);

      CONFIG.boatsLayout.forEach((cfg, index) => {
        const boatGroup = new THREE.Group();
        boatGroup.position.copy(cfg.pos);
        const initialYaw = Math.PI + cfg.yaw;
        boatGroup.rotation.y = initialYaw;
        boatGroup.visible = false;

        const visual = wrapper.clone(true);

        const matRecords = [];
        visual.traverse((obj) => {
          if (obj.isMesh && obj.material) {
            const isArray = Array.isArray(obj.material);
            const clonedList = (isArray ? obj.material : [obj.material]).map((orig) => {
              const m = orig.clone();
              matRecords.push({
                mat: m,
                origTransparent: !!m.transparent,
                origDepthWrite: m.depthWrite !== undefined ? m.depthWrite : true,
                origOpacity: m.opacity !== undefined ? m.opacity : 1.0,
                hasEmissive: !!m.emissive,
                origEmissive: m.emissive ? m.emissive.clone() : new THREE.Color(0x000000),
                origEmissiveIntensity: m.emissiveIntensity !== undefined ? m.emissiveIntensity : 0.0
              });
              return m;
            });
            obj.material = isArray ? clonedList : clonedList[0];
          }
        });

        boatGroup.add(visual);

        const beaconRing = new THREE.Mesh(
          sharedRingGeo,
          new THREE.MeshBasicMaterial({
            color: 0xf4d694,
            transparent: true,
            opacity: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        beaconRing.rotation.x = -Math.PI / 2;
        beaconRing.position.y = 0.05;
        boatGroup.add(beaconRing);

        const hitbox = new THREE.Mesh(sharedHitboxGeo, sharedHitboxMat);
        hitbox.position.y = Math.max(finalSize.y * 0.42, 0.75);
        hitbox.userData.boatIndex = index;
        boatGroup.add(hitbox);
        boatHitboxes.push(hitbox);

        scene.add(boatGroup);

        const radialStep = Math.abs(index - centerIndex);
        boats.push({
          index,
          group: boatGroup,
          visual,
          beaconRing,
          matRecords,
          matDelay: 0.25 + radialStep * 0.24,
          materialized: false,
          homePos: cfg.pos.clone(),
          homeYaw: initialYaw,
          phaseOffset: index * 1.41 + Math.random() * 0.5
        });
      });
    }

    function setBoatMaterialization(boat, progress, timeSec) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);
      if (p <= 0.001) {
        boat.group.visible = false;
        boat.materialized = false;
        return;
      }

      boat.group.visible = true;
      const easeOut = 1.0 - Math.pow(1.0 - p, 3.0);

      boat.group.position.set(
        boat.homePos.x,
        boat.homePos.y - (1.0 - easeOut) * 0.28,
        boat.homePos.z
      );
      boat.visual.scale.setScalar(THREE.MathUtils.lerp(0.93, 1.0, easeOut));

      if (p >= 0.999) {
        if (!boat.materialized) {
          boat.materialized = true;
          boat.visual.scale.setScalar(1.0);
          for (const rec of boat.matRecords) {
            rec.mat.transparent = rec.origTransparent;
            rec.mat.depthWrite  = rec.origDepthWrite;
            rec.mat.opacity     = rec.origOpacity;
            if (rec.hasEmissive) {
              rec.mat.emissive.copy(rec.origEmissive);
              rec.mat.emissiveIntensity = rec.origEmissiveIntensity;
            }
            rec.mat.needsUpdate = true;
          }
        }
        return;
      }

      boat.materialized = false;
      const glowBell = Math.sin(p * Math.PI);
      const bluePulse = 0.58 + 0.42 * Math.sin(timeSec * 8.5 + boat.phaseOffset);

      for (const rec of boat.matRecords) {
        if (!rec.mat.transparent) {
          rec.mat.transparent = true;
          rec.mat.needsUpdate = true;
        }
        rec.mat.depthWrite = p > 0.58 ? rec.origDepthWrite : false;
        rec.mat.opacity = rec.origOpacity * smoothstepJS(0.05, 0.86, p);

        if (rec.hasEmissive) {
          rec.mat.emissive.lerpColors(BLUE_MAT_COLOR, rec.origEmissive, smoothstepJS(0.45, 1.0, p));
          rec.mat.emissiveIntensity = THREE.MathUtils.lerp(
            rec.origEmissiveIntensity,
            1.75 * bluePulse,
            glowBell
          );
        }
      }
    }

    const forestAudio = new Audio();

    forestAudio.src = ASSETS.audioPrimary;
    forestAudio.loop = true;

    const audioEngine = {
      ctx: null,
      enabled: false,
      masterGain: null,
      wakeGain: null,
      wakeFilter: null,
      portalGain: null,
      currentForestVol: 0,

      initSynth() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0;
        this.masterGain.connect(this.ctx.destination);

        const bufSize = this.ctx.sampleRate * 3;
        const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          lastOut = (lastOut + 0.025 * white) / 1.025;
          data[i] = lastOut * 2.6;
        }

        const wakeSrc = this.ctx.createBufferSource();
        wakeSrc.buffer = noiseBuf;
        wakeSrc.loop = true;
        this.wakeFilter = this.ctx.createBiquadFilter();
        this.wakeFilter.type = 'bandpass';
        this.wakeFilter.frequency.value = 420;
        this.wakeFilter.Q.value = 0.75;
        this.wakeGain = this.ctx.createGain();
        this.wakeGain.gain.value = 0.0;
        wakeSrc.connect(this.wakeFilter).connect(this.wakeGain).connect(this.masterGain);
        wakeSrc.start();

        this.portalGain = this.ctx.createGain();
        this.portalGain.gain.value = 0.0;

        const oscA = this.ctx.createOscillator();
        oscA.type = 'sine';
        oscA.frequency.value = 146.83;

        const oscB = this.ctx.createOscillator();
        oscB.type = 'triangle';
        oscB.frequency.value = 220.0;

        const portalFilter = this.ctx.createBiquadFilter();
        portalFilter.type = 'lowpass';
        portalFilter.frequency.value = 640;

        oscA.connect(portalFilter);
        oscB.connect(portalFilter);
        portalFilter.connect(this.portalGain).connect(this.masterGain);
        oscA.start();
        oscB.start();
      },

      toggle(forceOn = false) {
        this.initSynth();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        this.enabled = forceOn ? true : !this.enabled;
        const now = this.ctx.currentTime;
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.65 : 0.0, now, 0.25);

        if (this.enabled) {
          forestAudio.play().catch(() => {});
        } else {
          forestAudio.pause();
        }

        btnAudio.textContent = this.enabled ? 'Audio: ON' : 'Audio: OFF';
        btnAudio.classList.toggle('active', this.enabled);
      },

      handleVisibility(isHidden) {
        if (!this.ctx) return;
        if (isHidden) {
          forestAudio.pause();
          if (this.ctx.state === 'running') this.ctx.suspend().catch(() => {});
        } else if (this.enabled) {
          if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
          forestAudio.play().catch(() => {});
        }
      },

      playMaterializeSwell() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [196.0, 293.66, 369.99, 587.33];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq * 0.985, now);
          osc.frequency.exponentialRampToValueAtTime(freq, now + 2.2);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(320, now);
          filter.frequency.exponentialRampToValueAtTime(1600, now + 1.8);
          filter.frequency.exponentialRampToValueAtTime(480, now + 3.8);

          const start = now + idx * 0.14;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(0.065, start + 1.2);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 3.6);

          osc.connect(filter).connect(gain).connect(this.masterGain);
          osc.start(start);
          osc.stop(start + 3.7);
        });
      },

      playBoardChime() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(293.66, now);
        osc.frequency.exponentialRampToValueAtTime(440.0, now + 0.65);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.13, now + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
        osc.connect(gain).connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 1.45);
      },

      update(dt, motionFactor, portalProximity) {
        const targetForest = this.enabled ? THREE.MathUtils.lerp(0.62, 0.22, portalProximity) : 0.0;
        this.currentForestVol = THREE.MathUtils.lerp(this.currentForestVol, targetForest, dt * 2.5);
        forestAudio.volume = THREE.MathUtils.clamp(this.currentForestVol, 0, 1);

        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.wakeGain.gain.setTargetAtTime(motionFactor * 0.44, now, 0.18);
        this.wakeFilter.frequency.setTargetAtTime(360 + motionFactor * 560, now, 0.18);
        this.portalGain.gain.setTargetAtTime(Math.pow(portalProximity, 1.55) * 0.30, now, 0.12);
      }
    };

      introStage.visible = false;
      introScreen.classList.add('hidden');
      hudEl.classList.add('visible');
      btnFullscreen.style.display = (modeName === 'web') ? '' : 'none';

      waterRoot.visible = true;
      portalGroup.visible = true;
      ambientPoints.visible = true;
      galaxySkyDome.visible = !isARMode;
      if (materializePoints) materializePoints.visible = true;

      currentState = STATE.MATERIALIZING;
      stateTimer = 0;
      matElapsed = 0;
      matParticleUniforms.uMatTime.value = 0;

      audioEngine.playMaterializeSwell();
      setHUD('Materializando...', 'Las barcas y luciérnagas emergen en la noche', true);
    }

    function showIntroState() {
      currentState = STATE.INTRO;
      resetSceneToHidden();

      scene.background = INTRO_BG;
      scene.fog = null;
      renderer.setClearAlpha(1);
      camera.position.set(0, CONFIG.defaultEyeHeight, 0);
      camYaw = 0;
      camPitch = 0;
      updateDesktopCameraLook();

      introStage.visible = true;
      positionIntroStage();
      hudEl.classList.remove('visible');
      introScreen.classList.remove('hidden');
    }

    async function returnToIntroMenu() {
      const session = renderer.xr.getSession();
      if (session) {
        await session.end().catch(() => {});
      }
      showIntroState();
    }

    function buildVoyageCurve(startPos) {
      const endPos = new THREE.Vector3(
        CONFIG.portalBasePosition.x,
        0.25,
        CONFIG.portalBasePosition.z + 1.5
      );
      const sideSign = startPos.x === 0 ? (Math.random() < 0.5 ? 1 : -1) : Math.sign(startPos.x);
      const p1 = new THREE.Vector3(
        startPos.x * 0.82 + sideSign * 2.2,
        0.0,
        THREE.MathUtils.lerp(startPos.z, endPos.z, 0.30)
      );
      const p2 = new THREE.Vector3(
        startPos.x * 0.25 - sideSign * 2.0,
        0.06,
        THREE.MathUtils.lerp(startPos.z, endPos.z, 0.68)
      );
      return new THREE.CatmullRomCurve3([startPos.clone(), p1, p2, endPos]);
    }

    function voyageEaseC1(u) {
      const a = 0.20;
      const k = 1.0 / (2.0 * a - a * a);
      if (u < a) return k * u * u;
      return k * a * a + 2.0 * k * a * (u - a);
    }

    function startBoarding(boat) {
      if (currentState !== STATE.IDLE || !boat) return;
      if (!audioEngine.enabled) audioEngine.toggle(true);
      audioEngine.playBoardChime();

      activeBoat = boat;
      currentState = STATE.BOARDING;
      stateTimer = 0;
      boardStartRigPos.copy(playerRig.position);
      navCurve = buildVoyageCurve(boat.group.position);
      navProgress = 0;
      prevBoatPos.copy(boat.group.position);

      setHUD('Abordando barca...', 'La corriente hacia el portal está por iniciar', false);
    }

    function onPortalCrossed(context) {
      playerRig.position.copy(CONFIG.originPosition);

      if (context.boat) {
        context.boat.group.position.copy(context.boat.homePos);
        context.boat.group.rotation.set(0, context.boat.homeYaw, 0);
        context.boat.visual.rotation.x = 0;
        context.boat.visual.rotation.z = 0;
      }

      activeBoat = null;
      navCurve = null;
      navProgress = 0;
      currentBoatSpeed = 0;
      smoothMotionFactor = 0;
      portalUniforms.uProximity.value = 0;
      waterUniforms.uBoatSpeed.value = 0;
      waterUniforms.uMotionFactor.value = 0;
      sprayMat.opacity = 0;
      sprayPoints.visible = false;

      // Transición Escenario A (oscuro + luciérnagas) <-> Escenario B (agua + galaxias)
      const nextWorld = (currentWorld === 'A') ? 'B' : 'A';
      applyWorldAtmosphere(nextWorld);

      if (nextWorld === 'B') {
        setHUD(
          'Escenario B · Mar de Galaxias',
          'Explora el cielo 360° · Toca una barca para cruzar de regreso',
          false
        );
      } else {
        setHUD(
          'Escenario A · Embarcadero nocturno',
          'Toca una barca para cruzar hacia el Mar de Galaxias',
          false
        );
      }
    }

    // =========================================================================
    // BLOQUE 7: INTERACCIÓN 360° + WEBXR (AR / VR / 3D WEB)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    let isDragging = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let camYaw = 0;
    let camPitch = 0;

    function updateDesktopCameraLook() {
      if (renderer.xr.isPresenting) return;
      camera.rotation.order = 'YXZ';
      camera.rotation.y = camYaw;
      camera.rotation.x = camPitch;
    }
    updateDesktopCameraLook();

    window.addEventListener('pointermove', (e) => {
      if (currentState !== STATE.INTRO || !e.isPrimary) return;
      introParallaxX = (e.clientX / window.innerWidth - 0.5) * 2;
      introParallaxY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function pickBoatFromPointer(clientX, clientY) {
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(boatHitboxes, false);
      return hits.length > 0 ? boats[hits[0].object.userData.boatIndex] : null;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (currentState === STATE.INTRO || !e.isPrimary) return;
      isDragging = true;
      pointerDownX = lastPointerX = e.clientX;
      pointerDownY = lastPointerY = e.clientY;
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (currentState === STATE.INTRO || !e.isPrimary) return;
      if (isDragging && !renderer.xr.isPresenting) {
        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        camYaw += dx * 0.0042;
        camPitch = THREE.MathUtils.clamp(camPitch + dy * 0.0038, -0.95, 1.48);
        updateDesktopCameraLook();
      } else if (currentState === STATE.IDLE && !renderer.xr.isPresenting) {
        const b = pickBoatFromPointer(e.clientX, e.clientY);
        hoveredBoatIndex = b ? b.index : -1;
        renderer.domElement.style.cursor = b ? 'pointer' : 'grab';
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging || !e.isPrimary) return;
      const moved = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      isDragging = false;
      if (e.target === renderer.domElement && moved < 10 && currentState === STATE.IDLE && !renderer.xr.isPresenting) {
        const b = pickBoatFromPointer(e.clientX, e.clientY);
        if (b) startBoarding(b);
      }
    });

    window.addEventListener('pointercancel', () => { isDragging = false; });

    const tempMatrix = new THREE.Matrix4();
    const controllers = [];
    const vrLasers = [];

    function raycastFromController(controller) {
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
      const hits = raycaster.intersectObjects(boatHitboxes, false);
      return hits.length > 0 ? boats[hits[0].object.userData.boatIndex] : null;
    }

    function setupXRController(idx) {
      const controller = renderer.xr.getController(idx);
      const laser = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -16)
        ]),
        new THREE.LineBasicMaterial({
          color: 0xf4d694,
          transparent: true,
          opacity: 0.45
        })
      );
      controller.add(laser);
      vrLasers.push(laser);

      controller.addEventListener('selectstart', () => {
        if (currentState !== STATE.IDLE) return;
        const boat = raycastFromController(controller);
        if (boat) startBoarding(boat);
      });

      playerRig.add(controller);
      controllers.push(controller);
    }
    setupXRController(0);
    setupXRController(1);

    btnAudio.addEventListener('click', () => audioEngine.toggle());
    btnModes.addEventListener('click', () => returnToIntroMenu());

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    });
    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.textContent = document.fullscreenElement ? 'Salir pantalla' : 'Pantalla completa';
    });

    async function detectXRCapabilities() {
      if ('xr' in navigator) {
        vrSupported = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
        arSupported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      }
      refreshIntroOrbs();
    }
    detectXRCapabilities();

    orbWeb.addEventListener('click', () => {
      if (!boatReady || !portalReady || !waterReady) return;
      isARMode = false;
      waterUniforms.uIsAR.value = 0.0;
      renderer.setClearAlpha(1);
      vrLasers.forEach(l => l.visible = false);
      camera.position.set(0, CONFIG.defaultEyeHeight, 0);
      camYaw = 0;
      camPitch = 0.14;
      updateDesktopCameraLook();

      audioEngine.toggle(true);
      startMaterialization('web');
    });

    orbAR.addEventListener('click', () => startXRMode('immersive-ar'));
    orbVR.addEventListener('click', () => startXRMode('immersive-vr'));

    async function startXRMode(xrMode) {
      if (!boatReady || !portalReady || !waterReady || !('xr' in navigator)) return;
      try {
        audioEngine.toggle(true);

        const isAR = (xrMode === 'immersive-ar');
        const sessionInit = isAR
          ? {
              optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay'],
              domOverlay: { root: document.getElementById('hud') }
            }
          : {
              optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
            };

        const session = await navigator.xr.requestSession(xrMode, sessionInit);
        isARMode = isAR;

        if (isARMode) {
          scene.background = null;
          scene.fog = null;
          waterUniforms.uIsAR.value = 1.0;
          renderer.setClearAlpha(0);
          vrLasers.forEach(l => l.visible = false);
        } else {
          waterUniforms.uIsAR.value = 0.0;
          renderer.setClearAlpha(1);
          vrLasers.forEach(l => l.visible = true);
        }

        if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
        await renderer.xr.setSession(session);
        camera.position.set(0, 0, 0);

        startMaterialization(isARMode ? 'ar' : 'vr');

        session.addEventListener('end', () => {
          isARMode = false;
          waterUniforms.uIsAR.value = 0.0;
          vrLasers.forEach(l => l.visible = false);
          showIntroState();
        });
      } catch (err) {
        console.warn('No se pudo iniciar la sesión WebXR:', err);
      }
    }

    // =========================================================================
    // BUCLE PRINCIPAL DE ANIMACIÓN (60–72+ FPS)
    // =========================================================================
    const clock = new THREE.Clock();
    const worldCamPos = new THREE.Vector3();
    const tmpTargetRigPos = new THREE.Vector3();
    const tmpPosOnCurve = new THREE.Vector3();
    const tmpTangent = new THREE.Vector3();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();

      galaxySkyUniforms.uTime.value = t;
      waterUniforms.uTime.value = t;
      portalUniforms.uTime.value = t;
      matParticleUniforms.uTime.value = t;
      ambientParticleUniforms.uTime.value = t;

      if (currentState === STATE.INTRO) {
        introAuraUniforms.uTime.value = t;
        introDustUniforms.uTime.value = t;

        if (introWireframePivot) {
          introFadeIn = Math.min(introFadeIn + dt * 0.9, 1.0);
          const pulse = 0.78 + 0.22 * Math.sin(t * 2.1);

          introAuraUniforms.uFade.value = introFadeIn;
          if (introEdgeMat)     introEdgeMat.opacity     = 0.36 * introFadeIn * pulse;
          if (introMeshWireMat) introMeshWireMat.opacity = 0.055 * introFadeIn * pulse;

          introWireframePivot.position.y = Math.sin(t * 0.95) * 0.07;
          const targetRotY = (Math.PI / 2 - 0.10) + introParallaxX * 0.10;
          const targetRotX = 0.04 + introParallaxY * 0.05;
          introWireframePivot.rotation.y = THREE.MathUtils.lerp(introWireframePivot.rotation.y, targetRotY, dt * 3.0);
          introWireframePivot.rotation.x = THREE.MathUtils.lerp(introWireframePivot.rotation.x, targetRotX, dt * 3.0);
        }

        renderer.render(scene, camera);
        return;
      }

      skyAngle += dt * 0.010 * SKY_SETTINGS.rotationSpeed;
      galaxySkyUniforms.uSkyRotation.value = skyAngle;
      galaxySkyDome.position.copy(playerRig.position);

      waterRoot.position.x = Math.round(playerRig.position.x / WATER_STEP) * WATER_STEP;
      waterRoot.position.z = Math.round(playerRig.position.z / WATER_STEP) * WATER_STEP;
      updateGLBWaterAnimation(t);

      if (matElapsed >= 0) {
        if (matElapsed < 6.5) {
          matElapsed += dt;
          matParticleUniforms.uMatTime.value = matElapsed;
        } else if (materializePoints && materializePoints.visible) {
          materializePoints.visible = false;
        }
      }

      if (currentState === STATE.MATERIALIZING) {
        stateTimer += dt;
        const u = Math.min(stateTimer / CONFIG.materializeDuration, 1.0);

        galaxySkyUniforms.uReveal.value = smoothstepJS(0.02, 0.86, u);
        waterUniforms.uWaterReveal.value = smoothstepJS(0.0, 0.72, u);
        ambientParticleUniforms.uReveal.value = smoothstepJS(0.30, 1.0, u);

        const blueBell = Math.sin(u * Math.PI);
        const blueBeat = 0.65 + 0.35 * Math.sin(t * 7.8);
        materializeBlueLight.intensity = blueBell * blueBeat * 11.5;

        for (const b of boats) {
          const boatLocal = (stateTimer - b.matDelay) / 2.05;
          setBoatMaterialization(b, boatLocal, t);
        }

        const portalP = smoothstepJS(0.22, 0.96, u);
        setPortalMaterialization(portalP, t);
        portalGlowLight.intensity  = portalP * 18.0;
        portalCrownLight.intensity = portalP * 9.0;

        if (u >= 1.0) {
          galaxySkyUniforms.uReveal.value = 1.0;
          waterUniforms.uWaterReveal.value = 1.0;
          ambientParticleUniforms.uReveal.value = 1.0;
          setPortalMaterialization(1.0, t);
          portalGlowLight.intensity  = 18.0;
          portalCrownLight.intensity = 9.0;
          materializeBlueLight.intensity = 0.0;
          for (const b of boats) setBoatMaterialization(b, 1.0, t);

          currentState = STATE.IDLE;
          if (activeMode === 'ar') {
            setHUD('AR · Escenario A (Nocturno)', 'Camina hacia una barca o tócala para abordar', false);
          } else if (activeMode === 'vr') {
            setHUD('VR · Escenario A (Nocturno)', 'Apunta o camina hacia una barca para abordar', false);
          } else {
            setHUD('Escenario A · Embarcadero nocturno', 'Arrastra 360° · Toca una barca para cruzar el portal', false);
          }
        }

        audioEngine.update(dt, 0, 0);
        renderer.render(scene, camera);
        return;
      }

      const portalBreath = 0.92 + 0.08 * Math.sin(t * 1.7);

      if (currentState === STATE.IDLE && renderer.xr.isPresenting) {
        hoveredBoatIndex = -1;
        if (!isARMode) {
          for (const ctrl of controllers) {
            const hit = raycastFromController(ctrl);
            if (hit) { hoveredBoatIndex = hit.index; break; }
          }
        }

        camera.getWorldPosition(worldCamPos);
        for (const b of boats) {
          const distXZ = Math.hypot(
            worldCamPos.x - b.group.position.x,
            worldCamPos.z - b.group.position.z
          );
          if (distXZ < CONFIG.proximityBoardDist) {
            startBoarding(b);
            break;
          }
        }
      }

      for (const b of boats) {
        const isHovered = (b.index === hoveredBoatIndex && currentState === STATE.IDLE);
        const targetRingOpacity = (currentState === STATE.IDLE) ? (isHovered ? 0.85 : 0.18) : 0.0;
        b.beaconRing.material.opacity = THREE.MathUtils.lerp(
          b.beaconRing.material.opacity,
          targetRingOpacity,
          dt * 6
        );
        const targetScale = isHovered ? 1.12 : 1.0;
        b.beaconRing.scale.setScalar(
          THREE.MathUtils.lerp(b.beaconRing.scale.x, targetScale, dt * 6)
        );

        if (b !== activeBoat) {
          const ph = b.phaseOffset;
          b.group.position.y = Math.sin(t * 0.62 + ph) * 0.022;
          b.visual.rotation.x = Math.sin(t * 0.52 + ph) * 0.014;
          b.visual.rotation.z = Math.cos(t * 0.58 + ph) * 0.018;
        }
      }

      let targetMotionFactor = 0.0;

      if (currentState === STATE.BOARDING && activeBoat) {
        stateTimer += dt;
        const u = Math.min(stateTimer / CONFIG.boardingDuration, 1.0);
        const smooth = u * u * (3 - 2 * u);

        tmpTargetRigPos.copy(activeBoat.group.position).add(CONFIG.seatOffset);
        playerRig.position.lerpVectors(boardStartRigPos, tmpTargetRigPos, smooth);
        activeBoat.group.position.y = -Math.sin(u * Math.PI) * 0.095;

        if (u >= 1.0) {
          currentState = STATE.NAVIGATING;
          stateTimer = 0;
          setHUD('Navegando hacia el portal', 'Observa el portal y el entorno libremente', false);
        }
      }

      else if (currentState === STATE.NAVIGATING && activeBoat && navCurve) {
        stateTimer += dt;
        const rawT = Math.min(stateTimer / CONFIG.voyageDuration, 1.0);
        navProgress = voyageEaseC1(rawT);

        navCurve.getPoint(navProgress, tmpPosOnCurve);
        navCurve.getTangent(navProgress, tmpTangent);

        const stepDist = tmpPosOnCurve.distanceTo(prevBoatPos);
        currentBoatSpeed = dt > 0 ? stepDist / dt : 0;
        prevBoatPos.copy(tmpPosOnCurve);

        targetMotionFactor = THREE.MathUtils.clamp(currentBoatSpeed / 3.8, 0.0, 1.0);

        activeBoat.group.position.copy(tmpPosOnCurve);
        activeBoat.group.position.y += Math.sin(t * 1.15) * (0.018 + 0.022 * smoothMotionFactor);

        const targetYaw = Math.atan2(tmpTangent.x, tmpTangent.z);
        activeBoat.group.rotation.y = lerpAngle(activeBoat.group.rotation.y, targetYaw, dt * 2.6);

        activeBoat.visual.rotation.x = -0.012 * smoothMotionFactor + Math.sin(t * 1.05) * (0.012 + 0.014 * smoothMotionFactor);
        activeBoat.visual.rotation.z = Math.cos(t * 0.90) * (0.015 + 0.016 * smoothMotionFactor);

        playerRig.position.set(
          tmpPosOnCurve.x + CONFIG.seatOffset.x,
          tmpPosOnCurve.y + CONFIG.seatOffset.y,
          tmpPosOnCurve.z + CONFIG.seatOffset.z
        );

        waterUniforms.uBoatPos.value.copy(tmpPosOnCurve);
        currentBoatDir.set(tmpTangent.x, tmpTangent.z).normalize();
        waterUniforms.uBoatDir.value.copy(currentBoatDir);
        waterUniforms.uBoatSpeed.value = currentBoatSpeed;

        waterUniforms.uFlowOffset.value.x -= currentBoatDir.x * currentBoatSpeed * dt * 0.55;
        waterUniforms.uFlowOffset.value.y -= currentBoatDir.y * currentBoatSpeed * dt * 0.55;

        updateWaterSpray(dt, tmpPosOnCurve, currentBoatDir, smoothMotionFactor);

        const proximity = smoothstepJS(0.45, 1.0, navProgress);
        portalUniforms.uProximity.value = proximity;
        portalGlowLight.intensity  = (18.0 + proximity * 26.0) * portalBreath;
        portalCrownLight.intensity = (9.0  + proximity * 12.0) * portalBreath;

        if (navProgress > 0.92) {
          const preFlash = (navProgress - 0.92) / 0.08;
          portalFlashMesh.visible = true;
          portalFlashMat.opacity = Math.min(preFlash * 0.68, 0.68);
        }

        if (rawT >= 1.0) {
          currentState = STATE.PORTAL_CROSSING;
          stateTimer = 0;
          flashSwapped = false;
          portalFlashMesh.visible = true;
          setHUD('Cruzando el umbral...', '', false);
        }
      }

      else if (currentState === STATE.PORTAL_CROSSING) {
        stateTimer += dt;
        const riseTime = 0.45;
        const holdTime = CONFIG.flashPeakDuration;
        const fadeTime = 1.25;

        if (stateTimer < riseTime) {
          const k = stateTimer / riseTime;
          portalFlashMat.opacity = THREE.MathUtils.lerp(0.68, 1.0, k);
        } else if (stateTimer < riseTime + holdTime) {
          portalFlashMat.opacity = 1.0;
          if (!flashSwapped) {
            flashSwapped = true;
            voyagesCompleted += 1;
            onPortalCrossed({
              voyagesCompleted,
              boat: activeBoat,
              isARMode
            });
          }
        } else if (stateTimer < riseTime + holdTime + fadeTime) {
          const k = (stateTimer - riseTime - holdTime) / fadeTime;
          portalFlashMat.opacity = 1.0 - (k * k * (3 - 2 * k));
        } else {
          portalFlashMat.opacity = 0.0;
          portalFlashMesh.visible = false;
          portalGlowLight.intensity  = 18.0;
          portalCrownLight.intensity = 9.0;
          currentState = STATE.IDLE;
        }
      } else {
        portalGlowLight.intensity  = 18.0 * portalBreath;
        portalCrownLight.intensity = 9.0  * portalBreath;
      }

      smoothMotionFactor = THREE.MathUtils.lerp(smoothMotionFactor, targetMotionFactor, dt * 2.8);
      waterUniforms.uMotionFactor.value = smoothMotionFactor;
      if (currentState !== STATE.NAVIGATING) {
        updateWaterSpray(dt, waterUniforms.uBoatPos.value, currentBoatDir, 0);
      }

      audioEngine.update(dt, smoothMotionFactor, portalUniforms.uProximity.value);
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      const pr = Math.min(window.devicePixelRatio, 2);
      matParticleUniforms.uRatio.value = pr;
      ambientParticleUniforms.uRatio.value = pr;
      introDustUniforms.uRatio.value = pr;
      portalUniforms.uRatio.value = pr;
      positionIntroStage();
    });
  </script>
</body>
</html>
