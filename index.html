<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07191d">
  <title>Atmósferas escultóricas | AR</title>
  <style>
    :root { color-scheme: dark; --mint:#8ce7d5; --glass:rgba(5,22,27,.78); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; min-height:100%; background:#07191d; color:#effbf9;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    body { min-height:100svh; overflow:hidden; }
    #app { position:fixed; inset:0; overflow:hidden; }
    #hud { position:absolute; z-index:5; inset:0; display:flex; flex-direction:column;
      justify-content:space-between; padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      pointer-events:none; }
    .top,.bottom { width:min(100%,560px); margin-inline:auto; }
    .eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mint); font-weight:750; }
    h1 { font-size:clamp(28px,7.5vw,42px); line-height:1.02; margin:10px 0 0; letter-spacing:-.04em; }
    .panel { background:var(--glass); border:1px solid rgba(164,231,221,.2); border-radius:18px;
      padding:14px 15px; backdrop-filter:blur(16px); box-shadow:0 12px 40px #0003; }
    #status { font-size:13px; line-height:1.45; color:#e1f2ef; margin:0 0 12px; }
    .actions { display:flex; gap:9px; flex-wrap:wrap; pointer-events:auto; }
    button { appearance:none; border:0; border-radius:999px; padding:13px 17px; min-height:46px;
      font-weight:750; font-size:13px; cursor:pointer; }
    #start { color:#06201e; background:var(--mint); flex:1; }
    #reset { color:#e9f6f3; background:#ffffff17; border:1px solid #ffffff25; }
    #close { color:#ffdede; background:#ff4d4d22; border:1px solid #ff4d4d55; display:none; flex:1; }
    #fallback { position:absolute; z-index:4; inset:0; display:none; align-items:center; justify-content:center;
      padding:24px; background:linear-gradient(160deg,#0b282d,#07191d); }
    #fallback .panel { max-width:460px; }
    #fallback h2 { margin:0 0 10px; font-size:24px; }
    #fallback p { color:#c3d9d7; font-size:14px; line-height:1.55; }
    .pill { display:inline-block; padding:5px 9px; border-radius:99px; background:#8ce7d51c; color:var(--mint);
      font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; margin-bottom:10px; }
    canvas { display:block; touch-action:none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="top">
      <div class="eyebrow">Experiencia de patrimonio · WebAR</div>
      <h1>Atmósferas<br>escultóricas.</h1>
    </div>
    <div class="bottom panel">
      <p id="status">Preparando la experiencia…</p>
      <div class="actions">
        <button id="start">Iniciar realidad aumentada</button>
        <button id="reset" type="button">Reiniciar</button>
        <button id="close" type="button">Cerrar AR</button>
      </div>
    </div>
  </div>
  <div id="fallback">
    <div class="panel">
      <span class="pill">Compatibilidad del dispositivo</span>
      <h2>AR espacial no disponible aquí</h2>
      <p id="fallbackText">Este navegador no expone WebXR immersive-ar.</p>
    </div>
  </div>
</div>
<script type="module">
  import * as THREE from 'three';

  const app          = document.querySelector('#app');
  const statusEl     = document.querySelector('#status');
  const startButton  = document.querySelector('#start');
  const resetButton  = document.querySelector('#reset');
  const closeButton  = document.querySelector('#close');
  const fallback     = document.querySelector('#fallback');
  const fallbackText = document.querySelector('#fallbackText');

  /* ---------------- Renderer / escena ---------------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  app.prepend(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 30);
  scene.add(new THREE.HemisphereLight(0xd8fff7, 0x193c42, 1.6));

  /* ---------------- Textura de partícula ---------------- */
  function makeParticleTexture() {
    const size = 128; const c = document.createElement('canvas');
    c.width = c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0.0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(230,255,255,0.85)');
    g.addColorStop(0.55, 'rgba(160,235,240,0.35)');
    g.addColorStop(1.0, 'rgba(100,200,220,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
  }
  const particleTexture = makeParticleTexture();

  /* ---------------- Reticle ---------------- */
  const reticleGeo = new THREE.RingGeometry(0.12, 0.17, 48); reticleGeo.rotateX(-Math.PI / 2);
  const reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({ color: 0x9cf7e7, side: THREE.DoubleSide, transparent: true, opacity: 0.95 }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  /* ---------------- Efecto agua + neblina + brillos ---------------- */
  function createAtmosphere() {
    const group = new THREE.Group();

    // --- AGUA: Shader con Domain Warping (movimiento de pantano) ---
    const waterGeo = new THREE.PlaneGeometry(14.4, 14.4, 1, 1);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uColorDeep: { value: new THREE.Color(0x0a2a30) },    // Fondo oscuro del pantano
        uColorShallow: { value: new THREE.Color(0x2bb8a8) }  // Reflejo turquesa
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColorDeep;
        uniform vec3 uColorShallow;
        varying vec2 vUv;

        void main() {
          // Coordenadas centradas
          vec2 p = (vUv - 0.5) * 2.0;
          float t = uTime * 0.3; // Velocidad muy lenta (pantano)

          // DOMAIN WARPING: Distorsionamos las coordenadas con ondas lentas
          // Esto crea formas irregulares y orgánicas, sin círculos.
          vec2 warp = vec2(
            sin(p.y * 2.5 + t) * 0.15 + cos(p.x * 1.5 - t) * 0.1,
            cos(p.x * 2.5 + t) * 0.15 + sin(p.y * 1.5 - t) * 0.1
          );
          vec2 p2 = p + warp;

          // Ondas direccionales sobre las coordenadas distorsionadas
          float w1 = sin(p2.x * 4.0 + p2.y * 2.0 + t * 1.2);
          float w2 = cos(p2.x * -2.0 + p2.y * 5.0 + t * 1.5);
          float w3 = sin(p2.x * 7.0 - p2.y * 3.0 - t * 0.8);

          // Altura combinada (normalizada de 0.0 a 1.0)
          float wave = (w1 * 0.5 + w2 * 0.3 + w3 * 0.2) * 0.5 + 0.5;

          // Brillo en las crestas
          float spec = pow(wave, 6.0);

          // Mezcla de color
          vec3 color = mix(uColorDeep, uColorShallow, wave);
          color += vec3(0.6, 1.0, 1.0) * spec * 0.5; // Destello blanco/cian

          // Borde desvanecido
          float edge = 1.0 - smoothstep(0.7, 1.0, length(p));

          // OPACIDAD ALTA: Base 0.65 para que no sea fantasmal
          float alpha = (0.65 + wave * 0.20 + spec * 0.15) * edge;

          gl_FragColor = vec4(color, alpha);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });
    
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 0.05; 
    water.frustumCulled = false;
    group.add(water);

    // --- NEBLINA ---
    const mistCount = 1200;
    const mistPositions = new Float32Array(mistCount * 3);
    for (let i = 0; i < mistCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.sqrt(Math.random()) * 12.3;
      mistPositions[i * 3]     = Math.cos(angle) * radius;
      mistPositions[i * 3 + 1] = 0.15 + Math.random() * 2.4;
      mistPositions[i * 3 + 2] = Math.sin(angle) * radius;
    }
    const mistGeo = new THREE.BufferGeometry();
    mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPositions, 3));
    const mistMat = new THREE.PointsMaterial({
      size: 0.55, map: particleTexture, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, color: 0xb5eef5, opacity: 0.32, sizeAttenuation: true
    });
    const mist = new THREE.Points(mistGeo, mistMat);
    mist.frustumCulled = false;
    group.add(mist);

    // --- PARTÍCULAS DE BRILLO ---
    const sparkCount = 400;
    const sparkPositions = new Float32Array(sparkCount * 3);
    for (let i = 0; i < sparkCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.sqrt(Math.random()) * 12.3;
      sparkPositions[i * 3]     = Math.cos(angle) * radius;
      sparkPositions[i * 3 + 1] = 0.20 + Math.random() * 3.2;
      sparkPositions[i * 3 + 2] = Math.sin(angle) * radius;
    }
    const sparkGeo = new THREE.BufferGeometry();
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
    const sparkMat = new THREE.PointsMaterial({
      size: 0.45, map: particleTexture, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, color: 0xffffff, opacity: 0.95, sizeAttenuation: true
    });
    const sparks = new THREE.Points(sparkGeo, sparkMat);
    sparks.frustumCulled = false;
    group.add(sparks);

    group.userData.waterMaterial = waterMat;
    group.userData.mistMaterial = mistMat;
    group.userData.sparkMaterial = sparkMat;
    group.userData.mist = mist;
    group.userData.sparks = sparks;
    group.visible = false;
    scene.add(group);
    return group;
  }

  const placedEffect = createAtmosphere();

  /* ---------------- Estado ---------------- */
  let hitTestSource = null;
  let activeSession = null;
  let elapsed = 0;
  let xrSessionStarting = false;
  let arSupported = null;

  /* ---------------- Acciones ---------------- */
  function showFallback(text) {
    fallbackText.textContent = text;
    fallback.style.display = 'flex';
  }

  function placeEffect() {
    if (!reticle.visible) {
      statusEl.textContent = 'Aún no detecto una superficie. Mueve lentamente el teléfono y apunta hacia el suelo.';
      return;
    }
    placedEffect.position.setFromMatrixPosition(reticle.matrix);
    placedEffect.position.y -= 0.01;
    placedEffect.visible = true;
    statusEl.textContent = 'Atmósfera colocada. Muévete alrededor para explorarla.';
  }

  function clearEffect() {
    placedEffect.visible = false;
    reticle.visible = false;
    statusEl.textContent = 'Efecto reiniciado. Apunta al suelo y toca para colocar.';
  }

  async function endAR() {
    if (activeSession) {
      try { await activeSession.end(); } catch (_) {}
    }
  }

  /* ---------------- Controladores / sesión ---------------- */
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', placeEffect);
  scene.add(controller);

  renderer.xr.addEventListener('sessionstart', async () => {
    activeSession = renderer.xr.getSession();
    fallback.style.display = 'none';

    startButton.style.display = 'none';
    closeButton.style.display = 'block';
    statusEl.textContent = 'AR activa. Apunta al suelo para detectar una superficie.';

    const session = activeSession;
    if (!session) return;

    session.addEventListener('select', placeEffect);

    try {
      const viewerSpace = await session.requestReferenceSpace('viewer');
      if (session !== activeSession) return;
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    } catch (err) {
      statusEl.textContent = 'AR activa, sin seguimiento de superficies: ' + (err?.message || err);
    }

    session.addEventListener('end', () => {
      hitTestSource = null;
      activeSession = null;
      xrSessionStarting = false;
      startButton.disabled = false;
      startButton.textContent = 'Iniciar realidad aumentada';
      statusEl.textContent = 'Sesión finalizada.';
    }, { once: true });
  });

  renderer.xr.addEventListener('sessionend', () => {
    hitTestSource = null;
    activeSession = null;
    xrSessionStarting = false;
    startButton.disabled = false;
    startButton.style.display = '';
    startButton.textContent = 'Iniciar realidad aumentada';
    closeButton.style.display = 'none';
  });

  /* ---------------- Bucle de render ---------------- */
  renderer.setAnimationLoop((time, frame) => {
    elapsed = time * 0.001;

    placedEffect.userData.waterMaterial.uniforms.uTime.value = elapsed;

    placedEffect.userData.mist.rotation.y = elapsed * 0.05;
    placedEffect.userData.sparks.rotation.y = -elapsed * 0.08;

    placedEffect.userData.mistMaterial.opacity = 0.26 + 0.10 * Math.sin(elapsed * 0.6);
    placedEffect.userData.sparkMaterial.opacity = 0.75 + 0.20 * Math.sin(elapsed * 1.6);

    if (frame) {
      const refSpace = renderer.xr.getReferenceSpace();
      if (hitTestSource && refSpace) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(refSpace);
          if (pose) {
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            reticle.matrixWorldNeedsUpdate = true;
          } else { reticle.visible = false; }
        } else { reticle.visible = false; }
      }
    }
    renderer.render(scene, camera);
  });

  /* ---------------- Inicio de AR ---------------- */
  async function beginAR() {
    if (xrSessionStarting || renderer.xr.isPresenting || activeSession) {
      statusEl.textContent = 'La RA ya está iniciada o se está abriendo.';
      return;
    }
    if (!navigator.xr) {
      showFallback('Este navegador no ofrece navigator.xr. Prueba Chrome actualizado en Android compatible.');
      return;
    }
    if (arSupported === false) {
      showFallback('El dispositivo no admite sesiones immersive-ar.');
      return;
    }

    xrSessionStarting = true;
    startButton.disabled = true;
    startButton.textContent = 'Iniciando…';
    statusEl.textContent = 'Iniciando la cámara AR…';

    let session = null;
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });
      await renderer.xr.setSession(session);
    } catch (err) {
      if (session && !renderer.xr.isPresenting) {
        try { await session.end(); } catch (_) {}
      }
      const message = err?.message || String(err);
      showFallback(message.includes('already an active')
        ? 'Ya hay una sesión AR activa. Recarga la página y pulsa Iniciar una sola vez.'
        : 'No se pudo iniciar la sesión AR: ' + message + '. Comprueba HTTPS y compatibilidad del dispositivo.');
      statusEl.textContent = 'No se pudo iniciar AR.';
      startButton.disabled = false;
      startButton.textContent = 'Intentar de nuevo';
    } finally {
      if (!renderer.xr.isPresenting && !activeSession) {
        xrSessionStarting = false;
        startButton.disabled = false;
        if (startButton.textContent === 'Iniciando…') {
          startButton.textContent = 'Iniciar realidad aumentada';
        }
      }
    }
  }

  startButton.addEventListener('click', beginAR);
  resetButton.addEventListener('click', clearEffect);
  closeButton.addEventListener('click', endAR);

  document.body.addEventListener('beforexrselect', (e) => {
    const t = e.target;
    if (t && t.closest && t.closest('button, .actions')) e.preventDefault();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((ok) => {
      arSupported = ok;
      statusEl.textContent = ok ? 'Listo. Pulsa “Iniciar realidad aumentada”.' : 'Este dispositivo no admite WebXR immersive-ar.';
      if (!ok) startButton.textContent = 'Ver compatibilidad';
    }).catch(() => {
      statusEl.textContent = 'No se pudo comprobar la compatibilidad. Pulsa “Iniciar”.';
    });
  } else {
    statusEl.textContent = 'Este navegador no ofrece WebXR. Prueba Chrome en Android.';
    startButton.textContent = 'Ver compatibilidad';
  }
</script>
</body>
</html>
