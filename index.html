<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07191d">
  <title>Museo Leonora Carrington SLP · La Barca de las Grullas AR</title>

  <!-- Tipografías Museográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --mint: #8ce7d5;
      --gold: #d4af37;
      --glass: rgba(5, 22, 27, 0.78);
      --glass-border: rgba(212, 175, 55, 0.3);
      --danger: #ff5a5f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background: #07191d;
      color: #effbf9;
      font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Video de cámara trasera en 100svh sin forzar pantalla completa del sistema */
    #ar-camera-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.35s ease;
    }

    body.ar-active #ar-camera-video {
      opacity: 1;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    #camera-flash {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }
    #camera-flash.active {
      opacity: 0.85;
      transition: none;
    }

    /* ================================================= */
    /* UI PRINCIPAL Y HUD CENTRADO                       */
    /* ================================================= */
    #hud {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .top, .bottom {
      width: min(100%, 540px);
      margin-inline: auto;
    }

    .museum-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .museum-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(5, 22, 27, 0.72);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }

    .museum-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 8px var(--mint);
    }

    h1.editorial-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(36px, 9vw, 54px);
      font-weight: 600;
      line-height: 0.98;
      margin: 4px 0 0;
      letter-spacing: -0.02em;
      text-align: center;
      color: #f4f9f8;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    h1.editorial-title em {
      font-style: italic;
      font-weight: 500;
      color: var(--mint);
    }

    body.ar-active h1.editorial-title {
      display: none;
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 16px 18px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 14px;
      text-align: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
      animation: pulseDot 1.6s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    #status {
      font-size: 13px;
      line-height: 1.45;
      color: #e1f2ef;
      margin: 0;
      font-weight: 500;
    }

    #start {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 999px;
      padding: 15px 20px;
      min-height: 50px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #041816;
      background: linear-gradient(135deg, #e7c96b 0%, #d4af37 48%, #8ce7d5 100%);
      box-shadow: 0 10px 26px rgba(212, 175, 55, 0.25);
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    #start:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* ================================================= */
    /* CONTROLES EN SESIÓN AR (CAMINATA + FOTO + VIDEO)  */
    /* ================================================= */
    #ar-dock {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    body.ar-active #pre-ar-panel {
      display: none;
    }

    body.ar-active #ar-dock {
      display: flex;
    }

    #ar-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 15px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid rgba(140, 231, 213, 0.3);
      font-size: 11px;
      color: #effbf9;
      transition: opacity 0.4s ease;
    }

    /* Consola de exploración de sala para caminar alrededor de la escultura fija */
    .walk-pad {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(5, 22, 27, 0.82);
      border: 1px solid rgba(140, 231, 213, 0.28);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
    }

    .walk-btn {
      appearance: none;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: radial-gradient(circle at 50% 0%, rgba(140, 231, 213, 0.22), rgba(5, 22, 27, 0.9) 80%);
      color: #effbf9;
      height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.2s ease;
    }

    .walk-btn:active, .walk-btn.pressing {
      transform: scale(0.92);
      border-color: var(--mint);
      background: rgba(140, 231, 213, 0.28);
    }

    .media-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    .icon-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #effbf9;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .shutter-photo {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 4px;
      background: transparent;
      border: 2.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .shutter-photo .inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #dff5f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #06201e;
    }

    .shutter-video {
      height: 44px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 90, 95, 0.45);
      background: rgba(255, 90, 95, 0.16);
      color: #ffdede;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .shutter-video .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .shutter-video.recording {
      background: rgba(255, 90, 95, 0.38);
      border-color: var(--danger);
      color: #ffffff;
    }

    /* Modal de Confirmación de Salida */
    #exit-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 22, 27, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #exit-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
    }

    .modal-panel h3 {
      font-family: 'Cormorant Garamond', serif;
      margin: 0 0 10px;
      font-size: 24px;
      color: #f4f9f8;
    }

    .modal-panel p {
      margin: 0 0 24px;
      font-size: 14px;
      color: #c3d9d7;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #effbf9;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
    }

    .btn-confirm {
      background: linear-gradient(135deg, #e7c96b 0%, #d4af37 48%, #8ce7d5 100%);
      color: #041816;
    }

    #toast {
      position: fixed;
      top: calc(68px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -10px);
      z-index: 30;
      background: rgba(5, 22, 27, 0.92);
      border: 1px solid var(--mint);
      color: #effbf9;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    #toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <video id="ar-camera-video" autoplay muted playsinline></video>
  <div id="camera-flash"></div>
  <div id="toast">Guardado en el teléfono</div>

  <!-- Modal Confirmación de Salida -->
  <div id="exit-modal">
    <div class="modal-panel">
      <h3>¿Salir de la sala AR?</h3>
      <p>Se detendrá la cámara y la atmósfera inmersiva.</p>
      <div class="modal-actions">
        <button id="btn-cancel-exit" class="btn-cancel">Cancelar</button>
        <button id="btn-confirm-exit" class="btn-confirm">OK</button>
      </div>
    </div>
  </div>

  <div id="hud">
    <div class="top">
      <div class="museum-header">
        <div class="museum-badge">
          <span class="dot"></span>
          <span>Museo Leonora Carrington · SLP</span>
        </div>
        <h1 class="editorial-title">La Barca de<br><em>las Grullas.</em></h1>
      </div>
    </div>

    <div class="bottom">
      <div id="pre-ar-panel" class="panel">
        <div class="status-row">
          <span class="status-dot"></span>
          <p id="status">Cargando escultura barcagrullas.glb…</p>
        </div>
        <button id="start" type="button" disabled>Cargando modelo 3D…</button>
      </div>

      <div id="ar-dock">
        <div id="ar-status-pill">
          <span class="status-dot" id="ar-pill-dot"></span>
          <span id="ar-status-text">Escultura fija en el suelo · Camina para explorar la sala</span>
        </div>

        <!-- Controles para caminar y rodear la escultura fija como una sala interactiva -->
        <div class="walk-pad">
          <button id="btn-walk-left" type="button" class="walk-btn" title="Caminar a la izquierda">
            <span>◀ Izq</span>
          </button>
          <button id="btn-walk-back" type="button" class="walk-btn" title="Retroceder">
            <span>▼ Atrás</span>
          </button>
          <button id="btn-walk-forward" type="button" class="walk-btn" title="Avanzar hacia la barca">
            <span>▲ Avanzar</span>
          </button>
          <button id="btn-walk-right" type="button" class="walk-btn" title="Caminar a la derecha">
            <span>Der ▶</span>
          </button>
        </div>

        <div class="media-bar">
          <button id="reset" type="button" class="icon-btn" title="Centrar escultura frente a mí">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>

          <button id="btn-photo" type="button" class="shutter-photo" title="Tomar Foto">
            <span class="inner">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                <circle cx="12" cy="13" r="3"/>
              </svg>
            </span>
          </button>

          <button id="btn-video" type="button" class="shutter-video" title="Grabar Video">
            <span class="rec-dot"></span>
            <span id="video-label">VIDEO</span>
          </button>

          <button id="close" type="button" class="icon-btn" title="Salir" style="border-color: rgba(255,90,95,0.4); color: #ffb4b4;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Audio en la raíz del repositorio videAR -->
<audio id="audioBosque" src="bosque_noche.mp3" preload="auto" crossorigin="anonymous" loop></audio>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

  // Rutas exactas del repositorio blenderingforconservation-maker/videAR
  const REPO_RAW = 'https://raw.githubusercontent.com/blenderingforconservation-maker/videAR/main/';
  const ASSET_PATHS = {
    boatModelLocal: 'models/barcagrullas.glb',
    boatModelRemote: `${REPO_RAW}models/barcagrullas.glb`,
    waterNormalLocal: 'image_c713d6.png',
    waterNormalRemote: `${REPO_RAW}image_c713d6.png`,
    audioRemote: `${REPO_RAW}bosque_noche.mp3`
  };

  // Escala 4x de la escultura (7.40 m de eslora) fija en el suelo
  const BOAT_TARGET_LENGTH = 7.40;
  const AR_ANCHOR_DISTANCE = 6.20;
  const AR_FLOOR_Y         = -1.48;
  const WATER_SURFACE_Y    = 0.04; // Nivel del agua que cubre los pies/base de la escultura

  const app            = document.querySelector('#app');
  const statusEl       = document.querySelector('#status');
  const arStatusPill   = document.querySelector('#ar-status-pill');
  const arStatusText   = document.querySelector('#ar-status-text');
  const arPillDot      = document.querySelector('#ar-pill-dot');
  const startButton    = document.querySelector('#start');
  const resetButton    = document.querySelector('#reset');
  const closeButton    = document.querySelector('#close');
  const photoButton    = document.querySelector('#btn-photo');
  const videoButton    = document.querySelector('#btn-video');
  const videoLabel     = document.querySelector('#video-label');
  const cameraFlash    = document.querySelector('#camera-flash');
  const toastEl        = document.querySelector('#toast');
  const audioBosque    = document.querySelector('#audioBosque');
  const arCameraVideo  = document.querySelector('#ar-camera-video');

  const btnWalkForward = document.querySelector('#btn-walk-forward');
  const btnWalkBack    = document.querySelector('#btn-walk-back');
  const btnWalkLeft    = document.querySelector('#btn-walk-left');
  const btnWalkRight   = document.querySelector('#btn-walk-right');

  const exitModal      = document.querySelector('#exit-modal');
  const btnCancelExit  = document.querySelector('#btn-cancel-exit');
  const btnConfirmExit = document.querySelector('#btn-confirm-exit');

  audioBosque.addEventListener('error', () => {
    if (audioBosque.src !== ASSET_PATHS.audioRemote) {
      audioBosque.src = ASSET_PATHS.audioRemote;
    }
  }, { once: true });

  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2800);
  }

  /* ---------------- Cámara Trasera Directa (Sin Fullscreen Forzoso) ---------------- */
  let cameraStream = null;
  let arActive = false;

  async function startCameraFeed() {
    if (cameraStream || !navigator.mediaDevices?.getUserMedia) return;
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      arCameraVideo.srcObject = cameraStream;
      await arCameraVideo.play();
    } catch (e) {
      console.warn('Cámara no disponible:', e);
    }
  }

  function stopCameraFeed() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    arCameraVideo.srcObject = null;
  }

  /* ---------------- Audio Nocturno + Web Audio API ---------------- */
  let fadeAudioInterval = null;
  let audioCtx, mediaStreamDestination, sourceNode;
  let audioInitialized = false;

  function initAudioCapture() {
    if (audioInitialized) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      mediaStreamDestination = audioCtx.createMediaStreamDestination();
      sourceNode = audioCtx.createMediaElementSource(audioBosque);
      sourceNode.connect(audioCtx.destination);
      sourceNode.connect(mediaStreamDestination);
      audioInitialized = true;
    } catch (e) {
      console.warn('Web Audio ya inicializado:', e);
    }
  }

  function iniciarAudioAmbiente() {
    if (!audioBosque) return;
    initAudioCapture();
    clearInterval(fadeAudioInterval);
    audioBosque.volume = 0.0;
    const playPromise = audioBosque.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        fadeAudioInterval = setInterval(() => {
          if (audioBosque.volume < 0.85) audioBosque.volume = Math.min(0.85, audioBosque.volume + 0.05);
          else clearInterval(fadeAudioInterval);
        }, 150);
      }).catch(() => {});
    }
  }

  function detenerAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    fadeAudioInterval = setInterval(() => {
      if (audioBosque.volume > 0.05) audioBosque.volume = Math.max(0, audioBosque.volume - 0.08);
      else {
        audioBosque.volume = 0;
        audioBosque.pause();
        audioBosque.currentTime = 0;
        clearInterval(fadeAudioInterval);
      }
    }, 100);
  }

  /* ---------------- Escena, Renderer y Plano de Ocultación Bajo el Agua ---------------- */
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    preserveDrawingBuffer: false,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.22;
  renderer.localClippingEnabled = true; // Recorta todo lo que esté debajo de la superficie del agua (pies/base)
  renderer.setClearColor(0x000000, 0);
  app.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x071e2b, 0.014);

  const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.05, 180);
  camera.position.set(0, 0, 0);
  scene.add(camera);

  // Plano de corte horizontal exacto en la superficie del agua:
  // Oculta los pies/soporte inferiores sumergidos para que solo se vea la barca sobre el agua
  const waterlineClipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(AR_FLOOR_Y + WATER_SURFACE_Y - 0.02));

  scene.add(new THREE.HemisphereLight(0xd8fff7, 0x193c42, 1.9));

  const keyLight = new THREE.DirectionalLight(0xfff4d6, 2.5);
  keyLight.position.set(-4.0, 8.0, 5.0);
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0x64f4d6, 1.45);
  rimLight.position.set(5.0, 4.0, -4.0);
  scene.add(rimLight);

  /* ---------------- Jerarquía de Sala Interactiva (Ancla Fija + Caminata Libre) ---------------- */
  // worldAnchorGroup: Fijo en el suelo físico en el centro inicial de la pantalla
  // walkStageGroup: Permite caminar por la sala alrededor de la escultura fija
  const worldAnchorGroup = new THREE.Group();
  worldAnchorGroup.position.set(0, AR_FLOOR_Y, -AR_ANCHOR_DISTANCE);
  scene.add(worldAnchorGroup);

  const walkStageGroup = new THREE.Group();
  worldAnchorGroup.add(walkStageGroup);

  const targetWalkOffset = new THREE.Vector3(0, 0, 0);
  const currentWalkOffset = new THREE.Vector3(0, 0, 0);
  const activeWalkInput = { forward: 0, strafe: 0 };

  /* ---------------- Sensores de Sala Interactiva: Giroscopio 3DoF + Podómetro de Caminata ---------------- */
  let hasGyro = false;
  const deviceEuler = new THREE.Euler();
  const deviceQuat = new THREE.Quaternion();
  const screenTransform = new THREE.Quaternion();
  const worldTransform = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  const _zAxis = new THREE.Vector3(0, 0, 1);
  const _viewDir = new THREE.Vector3();
  const _horizForward = new THREE.Vector3();
  const _horizRight = new THREE.Vector3();
  const _invAnchorQuat = new THREE.Quaternion();

  window.addEventListener('deviceorientation', (e) => {
    if (!arActive || e.alpha === null || e.beta === null || e.gamma === null) return;
    hasGyro = true;
    const alpha = THREE.MathUtils.degToRad(e.alpha);
    const beta = THREE.MathUtils.degToRad(e.beta);
    const gamma = THREE.MathUtils.degToRad(e.gamma);
    const orient = THREE.MathUtils.degToRad(window.screen?.orientation?.angle || window.orientation || 0);

    deviceEuler.set(beta, alpha, -gamma, 'YXZ');
    deviceQuat.setFromEuler(deviceEuler);
    deviceQuat.multiply(worldTransform);
    deviceQuat.multiply(screenTransform.setFromAxisAngle(_zAxis, -orient));
    camera.quaternion.copy(deviceQuat);
  });

  // Podómetro físico por acelerómetro: al caminar con el teléfono te desplazas dentro de la sala hacia donde miras
  let gravityMag = 9.81;
  let lastStepTime = 0;
  window.addEventListener('devicemotion', (e) => {
    if (!arActive) return;
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;
    const rawMag = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
    gravityMag = gravityMag * 0.88 + rawMag * 0.12;
    const deltaAcc = Math.abs(rawMag - gravityMag);

    const now = performance.now();
    if (deltaAcc > 1.18 && now - lastStepTime > 300) {
      lastStepTime = now;
      stepInRoom(1.25, 0);
    }
  });

  // Desplazamiento en el plano del suelo relativo a hacia dónde mira el visitante
  function stepInRoom(forwardMeters, strafeMeters) {
    camera.getWorldDirection(_viewDir);
    _horizForward.set(_viewDir.x, 0, _viewDir.z);
    if (_horizForward.lengthSq() < 0.001) {
      _horizForward.set(0, 0, -1);
    } else {
      _horizForward.normalize();
    }

    _invAnchorQuat.copy(worldAnchorGroup.quaternion).invert();
    _horizForward.applyQuaternion(_invAnchorQuat);
    _horizForward.y = 0;
    _horizForward.normalize();

    _horizRight.set(-_horizForward.z, 0, _horizForward.x);

    // Mover walkStageGroup en sentido opuesto equivale a que el visitante camine en el espacio
    targetWalkOffset.x -= (_horizForward.x * forwardMeters + _horizRight.x * strafeMeters);
    targetWalkOffset.z -= (_horizForward.z * forwardMeters + _horizRight.z * strafeMeters);

    targetWalkOffset.x = THREE.MathUtils.clamp(targetWalkOffset.x, -35.0, 35.0);
    targetWalkOffset.z = THREE.MathUtils.clamp(targetWalkOffset.z, -35.0, 35.0);
  }

  // Giro táctil en pantalla para explorar 360° también sin mover el teléfono
  let lastTouchX = null;
  let lastTouchY = null;
  window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    }
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1 || lastTouchX === null) return;
    if (e.target && e.target.closest && e.target.closest('button, .walk-pad, .media-bar')) return;
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;

    if (!hasGyro) {
      camera.rotation.y -= dx * 0.005;
      camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - dy * 0.005, -1.1, 0.75);
    } else {
      // Si tiene giroscopio, deslizar horizontalmente permite rodear suavemente la escultura
      stepInRoom(0, -dx * 0.025);
    }
  }, { passive: true });

  /* ---------------- Texturas Procedurales y Mapa Normal ---------------- */
  function makeParticleTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0.0, 'rgba(255, 255, 255, 1)');
    g.addColorStop(0.15, 'rgba(160, 255, 220, 0.95)');
    g.addColorStop(0.6, 'rgba(50, 230, 160, 0.3)');
    g.addColorStop(1.0, 'rgba(0, 120, 80, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const particleTexture = makeParticleTexture();

  function createFallbackWaterNormal() {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(size, size);
    const d = img.data;
    const tau = Math.PI * 2;
    const hFn = (u, v) =>
      Math.sin(u * tau * 3.0 + Math.cos(v * tau * 2.0) * 0.6) * 0.45 +
      Math.cos(v * tau * 4.0 - u * tau * 2.0) * 0.35 +
      Math.sin((u + v) * tau * 5.0) * 0.20;
    const eps = 1 / size;
    for (let y = 0; y < size; y++) {
      const v = y / size;
      for (let x = 0; x < size; x++) {
        const u = x / size;
        const dx = (hFn(u + eps, v) - hFn(u - eps, v)) * 2.5;
        const dy = (hFn(u, v + eps) - hFn(u, v - eps)) * 2.5;
        const inv = 1 / Math.sqrt(dx * dx + dy * dy + 1);
        const i = (y * size + x) * 4;
        d[i]     = Math.round(((-dx * inv) * 0.5 + 0.5) * 255);
        d[i + 1] = Math.round(((-dy * inv) * 0.5 + 0.5) * 255);
        d[i + 2] = Math.round(((1.0 * inv) * 0.5 + 0.5) * 255);
        d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  /* ---------------- Escena Fluvial + Barca Fija Anclada al Suelo ---------------- */
  function createAtmosphere() {
    const group = new THREE.Group();

    // Nodo estático de la escultura fijo en (0, 0, 0)
    const boatStaticAnchor = new THREE.Group();
    boatStaticAnchor.position.set(0, 0, 0);
    group.add(boatStaticAnchor);

    const boatSpotLight = new THREE.PointLight(0xffe6a3, 3.5, 20.0);
    boatSpotLight.position.set(-2.2, 5.8, 2.2);
    boatStaticAnchor.add(boatSpotLight);

    const waterBounceLight = new THREE.PointLight(0x28d7c6, 2.1, 14.0);
    waterBounceLight.position.set(0, 0.5, 0);
    boatStaticAnchor.add(waterBounceLight);

    const waterNormal = createFallbackWaterNormal();
    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');
    textureLoader.load(
      ASSET_PATHS.waterNormalLocal,
      (tex) => {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        waterMat.uniforms.uNormalMap.value = tex;
      },
      undefined,
      () => {
        textureLoader.load(ASSET_PATHS.waterNormalRemote, (tex2) => {
          tex2.wrapS = THREE.RepeatWrapping;
          tex2.wrapT = THREE.RepeatWrapping;
          waterMat.uniforms.uNormalMap.value = tex2;
        });
      }
    );

    const waterGeo = new THREE.PlaneGeometry(150.0, 150.0, 72, 72);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: true, // Oculta en el buffer de profundidad cualquier geometría debajo del agua
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uReveal: { value: 1.0 },
        uFlowSpeed: { value: 1.75 }, // Velocidad del río avanzando hacia la derecha (+X)
        uBoatPos: { value: new THREE.Vector2(0.0, 0.0) },
        uBoatHalfSize: { value: new THREE.Vector2(3.60, 1.35) },
        uColorDeep: { value: new THREE.Color(0x041b22) },
        uColorShallow: { value: new THREE.Color(0x189ca6) },
        uFoamColor: { value: new THREE.Color(0xe6fffc) },
        uLightColor: { value: new THREE.Color(0xbdf7ff) },
        uFogColor: { value: new THREE.Color(0x071e2b) },
        uFogDensity: { value: 0.014 },
        uNormalMap: { value: waterNormal }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uFlowSpeed;
        uniform vec2 uBoatPos;
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        varying vec3 vLocalPos;
        varying float vWaveHeight;

        void main() {
          vUv = uv;
          vec3 pos = position;

          // La corriente avanza continuamente de izquierda (-X) hacia la derecha (+X)
          float rightFlow = uTime * uFlowSpeed;
          float xPhase = pos.x - rightFlow * 2.5;

          float wave1 = sin(xPhase * 0.55 + pos.z * 0.22) * 0.045;
          float wave2 = cos(xPhase * 1.15 - pos.z * 0.55 + uTime * 1.2) * 0.022;

          // Cresta de choque estacionaria alrededor del casco fijo en (0, 0)
          vec2 relBoat = pos.xz - uBoatPos;
          float distBoat = length(relBoat);
          float bowWave = exp(-distBoat * 0.30) * sin(distBoat * 2.8 - uTime * 4.5) * 0.038;

          float h = wave1 + wave2 + bowWave;
          pos.y += h;

          vWaveHeight = h;
          vLocalPos = pos;

          vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uReveal;
        uniform float uFlowSpeed;
        uniform vec2 uBoatPos;
        uniform vec2 uBoatHalfSize;
        uniform vec3 uColorDeep;
        uniform vec3 uColorShallow;
        uniform vec3 uFoamColor;
        uniform vec3 uLightColor;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        uniform sampler2D uNormalMap;

        varying vec2 vUv;
        varying vec3 vWorldPosition;
        varying vec3 vLocalPos;
        varying float vWaveHeight;

        void main() {
          vec2 p = vLocalPos.xz - uBoatPos;
          float flow = uTime * uFlowSpeed;

          // 1. FLUJO SUPERFICIAL MOVIÉNDOSE HACIA LA DERECHA (+X)
          float meanderZ = sin(p.x * 0.14 - flow * 0.55) * 0.32;
          vec2 streamCoord = vec2(p.x, p.y + meanderZ);

          vec2 uvLayer1 = vec2(streamCoord.x * 0.18 - flow * 0.40, streamCoord.y * 0.22 + sin(uTime * 0.3) * 0.04);
          vec2 uvLayer2 = vec2(streamCoord.x * 0.38 - flow * 0.68, streamCoord.y * 0.44 - cos(uTime * 0.4) * 0.05);
          vec2 uvLayer3 = vec2(streamCoord.x * 0.26 - flow * 1.02, streamCoord.y * 0.72);

          vec3 n1 = texture2D(uNormalMap, uvLayer1).xyz * 2.0 - 1.0;
          vec3 n2 = texture2D(uNormalMap, uvLayer2).xyz * 2.0 - 1.0;
          vec3 n3 = texture2D(uNormalMap, uvLayer3).xyz * 2.0 - 1.0;

          vec2 normalXY = (n1.xy * 0.48 + n2.xy * 0.34 + n3.xy * 0.24) * 1.65;

          // 2. COLLAR DE ESPUMA QUE CUBRE LA BASE Y ESTELA EN "V" HACIA LA DERECHA (+X)
          vec2 hullNorm = p / max(uBoatHalfSize, vec2(0.5));
          float hullDist = length(hullNorm);

          // Anillo denso de agua y espuma en el perímetro del casco donde la barca toca el río
          float hullRing = smoothstep(1.95, 0.75, hullDist) * smoothstep(0.30, 0.92, hullDist);
          float hullRipples = 0.55 + 0.45 * sin(hullDist * 9.5 - uTime * 6.0 + n1.x * 2.0);
          float bowFactor = 0.60 + 0.40 * smoothstep(0.6, -1.0, hullNorm.x);
          float bowSplash = hullRing * hullRipples * bowFactor;

          // Estela hidrodinámica Kelvin abriéndose desde la proa (-X) hacia la derecha (+X)
          float trailX = p.x + uBoatHalfSize.x * 0.82;
          float rightSideMask = smoothstep(-0.6, 0.8, trailX);
          float wakeDecay = exp(-max(0.0, trailX) * 0.062);

          float wakeArmZ = max(uBoatHalfSize.y * 0.48, trailX * 0.34);
          float distToArm = abs(abs(p.y) - wakeArmZ);
          float kelvinWave = cos((abs(p.y) - wakeArmZ) * 6.5 - uTime * 6.8 + n2.y * 1.5);
          float kelvinMask = exp(-distToArm * 0.95) * rightSideMask * wakeDecay;
          float kelvinWake = max(0.0, kelvinWave) * kelvinMask;

          // Estela turbulenta central hacia +X
          float centerSlipstream = exp(-abs(p.y) / max(0.5, uBoatHalfSize.y * 0.85)) * smoothstep(-0.2, 2.0, trailX) * wakeDecay;
          float slipstreamFoam = centerSlipstream * smoothstep(0.05, 0.65, n2.x + n3.y) * 0.72;

          normalXY.y += sign(p.y) * kelvinWave * kelvinMask * 0.9;
          normalXY.x += kelvinWave * kelvinMask * 0.45;

          vec3 normal = normalize(vec3(normalXY.x, 1.0, normalXY.y));

          // 3. COLOR DEL AGUA, VETAS HORIZONTALES Y REFLEJOS
          vec3 viewDir = normalize(cameraPosition - vWorldPosition);
          vec3 lightDir = normalize(vec3(-0.4, 1.0, 0.45));
          vec3 halfVec = normalize(lightDir + viewDir);

          float spec = pow(max(dot(normal, halfVec), 0.0), 32.0);
          float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

          float flowStreaks = smoothstep(-0.25, 0.55, n1.x * 0.6 + n3.x * 0.6 + vWaveHeight * 6.0);
          vec3 baseWater = mix(uColorDeep, uColorShallow, flowStreaks);

          float surfaceCrestFoam = smoothstep(0.54, 0.85, n1.x * 0.5 + n2.y * 0.5 + flowStreaks * 0.32) * 0.28;
          float totalFoam = clamp(bowSplash + kelvinWake * 0.85 + slipstreamFoam + surfaceCrestFoam, 0.0, 1.0);

          vec3 color = mix(baseWater, uFoamColor, totalFoam * 0.84);
          color += uLightColor * spec * (1.4 + totalFoam * 0.75);
          color = mix(color, uLightColor, fresnel * 0.38);

          // 4. NIEBLA Y OPACIDAD DENSA EN EL CENTRO PARA TAPAR LOS PIES
          float dist = length(cameraPosition - vWorldPosition);
          float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
          float mist = smoothstep(-0.15, 0.65, n1.y + n2.x) * 0.24;
          color = mix(color, uFogColor, clamp(fogFactor * 0.65 + mist, 0.0, 0.80));

          float alpha = mix(0.92, 0.99, flowStreaks);
          alpha = max(alpha, max(fresnel * 0.88, totalFoam * 0.98));

          float edgeFade = 1.0 - smoothstep(0.65, 1.0, length(vUv - 0.5) * 2.0);
          alpha = clamp(alpha, 0.0, 0.98) * edgeFade * uReveal;

          gl_FragColor = vec4(color, alpha);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = WATER_SURFACE_Y;
    water.frustumCulled = false;
    group.add(water);

    /* ---------------- Partículas Fluyendo hacia la Derecha (+X) ---------------- */
    const particleCount = 1600;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      particlePositions[i * 3]     = (Math.random() - 0.5) * 90.0;
      particlePositions[i * 3 + 1] = WATER_SURFACE_Y + 0.08 + Math.random() * 4.2;
      particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 70.0;
      particleSeeds[i] = Math.random() * Math.PI * 2;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

    const particleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uReveal: { value: 1.0 },
        uFlowSpeed: { value: 1.75 },
        uTexture: { value: particleTexture },
        uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 1.5) },
        uFogDensity: { value: 0.014 }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uReveal;
        uniform float uFlowSpeed;
        uniform float uPixelRatio;
        uniform float uFogDensity;
        attribute float aSeed;
        varying float vAlpha;

        void main() {
          vec3 pos = position;

          float rightDrift = uTime * uFlowSpeed * (1.45 + 0.4 * sin(aSeed));
          pos.x = mod(pos.x + rightDrift + 45.0, 90.0) - 45.0;
          pos.y += cos(uTime * 0.6 + aSeed * 2.0) * 0.22;
          pos.z += sin(uTime * 0.5 + aSeed + pos.x * 0.12) * 0.35;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          float dist = length(mvPosition.xyz);
          float fogAtten = exp(-pow(dist * uFogDensity, 2.0));

          gl_PointSize = 110.0 * uPixelRatio * (1.0 / max(0.4, -mvPosition.z));
          gl_PointSize = clamp(gl_PointSize, 3.0, 56.0);

          vAlpha = (0.45 + 0.55 * sin(uTime * 1.8 + aSeed * 5.0)) * fogAtten * uReveal;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying float vAlpha;
        void main() {
          vec4 texColor = texture2D(uTexture, gl_PointCoord);
          gl_FragColor = vec4(texColor.rgb, texColor.a * vAlpha);
        }
      `
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    particles.frustumCulled = false;
    group.add(particles);

    group.userData.waterMaterial = waterMat;
    group.userData.particleMaterial = particleMat;
    group.userData.boatStaticAnchor = boatStaticAnchor;
    group.userData.waterMesh = water;

    walkStageGroup.add(group);
    return group;
  }

  const placedEffect = createAtmosphere();

  /* ---------------- Carga de models/barcagrullas.glb (Fija al Suelo y Pies Cubiertos por el Agua) ---------------- */
  async function loadBarcaGrullasModel() {
    await MeshoptDecoder.ready;

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setCrossOrigin('anonymous');
    gltfLoader.setDRACOLoader(dracoLoader);
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    const loadGLB = (url) =>
      new Promise((resolve, reject) => {
        gltfLoader.load(
          url,
          resolve,
          (xhr) => {
            if (xhr.total > 0) {
              const pct = Math.min(99, Math.round((xhr.loaded / xhr.total) * 100));
              statusEl.textContent = `Cargando La Barca de las Grullas (${pct}%)…`;
            }
          },
          reject
        );
      });

    let gltf = null;
    try {
      gltf = await loadGLB(ASSET_PATHS.boatModelLocal);
    } catch (_) {
      gltf = await loadGLB(ASSET_PATHS.boatModelRemote);
    }

    const boatModel = gltf.scene;
    boatModel.updateMatrixWorld(true);

    // 1. Orientar la proa de frente a la corriente (-X)
    const rawBox = new THREE.Box3().setFromObject(boatModel);
    const rawSize = rawBox.getSize(new THREE.Vector3());
    if (rawSize.z > rawSize.x) {
      boatModel.rotation.y = Math.PI / 2;
    } else {
      boatModel.rotation.y = Math.PI;
    }
    boatModel.updateMatrixWorld(true);

    // 2. Escalar a tamaño 4x (7.40 m de eslora)
    const rotBox = new THREE.Box3().setFromObject(boatModel);
    const rotSize = rotBox.getSize(new THREE.Vector3());
    const maxDim = Math.max(rotSize.x, rotSize.y, rotSize.z) || 1.0;
    const scaleFactor = BOAT_TARGET_LENGTH / maxDim;
    boatModel.scale.setScalar(scaleFactor);
    boatModel.updateMatrixWorld(true);

    // 3. Centrar en (0, 0) y sumergir el 20% inferior bajo el nivel del agua (WATER_SURFACE_Y)
    // para que no se vean los pies/base y solo sobresalga el casco de la barca sobre el agua
    const finalBox = new THREE.Box3().setFromObject(boatModel);
    const finalCenter = finalBox.getCenter(new THREE.Vector3());
    const finalSize = finalBox.getSize(new THREE.Vector3());
    const submergeFeetDepth = finalSize.y * 0.20;

    boatModel.position.set(
      -finalCenter.x,
      WATER_SURFACE_Y - finalBox.min.y - submergeFeetDepth,
      -finalCenter.z
    );
    boatModel.updateMatrixWorld(true);

    // Congelar matriz de la escultura (100% fija al suelo, sin flotar) y recortar pies bajo el agua
    boatModel.matrixAutoUpdate = false;
    boatModel.traverse((node) => {
      node.frustumCulled = false;
      node.matrixAutoUpdate = false;
      node.updateMatrix();
      if (node.isMesh && node.material) {
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        mats.forEach((m) => {
          m.clippingPlanes = [waterlineClipPlane];
          m.clipShadows = true;
          m.envMapIntensity = 1.4;
          m.needsUpdate = true;
        });
      }
    });

    placedEffect.userData.boatStaticAnchor.add(boatModel);

    placedEffect.userData.waterMaterial.uniforms.uBoatHalfSize.value.set(
      Math.max(1.80, finalSize.x * 0.48),
      Math.max(0.85, finalSize.z * 0.46)
    );

    dracoLoader.dispose();
  }

  /* ---------------- Anclaje en el Centro de la Pantalla y Controles de Sala ---------------- */
  let elapsed = 0;
  let lastFrameTime = performance.now();
  let revealProgress = 1.0;
  let pendingPhotoCapture = false;
  const _camForward = new THREE.Vector3();
  const _waterWorldPos = new THREE.Vector3();

  function anchorSculptureInCenterOfView() {
    camera.getWorldDirection(_camForward);
    const horiz = new THREE.Vector3(_camForward.x, 0, _camForward.z);
    if (horiz.lengthSq() < 0.001) horiz.set(0, 0, -1);
    else horiz.normalize();

    worldAnchorGroup.position.set(
      horiz.x * AR_ANCHOR_DISTANCE,
      AR_FLOOR_Y,
      horiz.z * AR_ANCHOR_DISTANCE
    );

    const yaw = Math.atan2(-horiz.x, -horiz.z);
    worldAnchorGroup.rotation.set(0, yaw, 0);

    targetWalkOffset.set(0, 0, 0);
    currentWalkOffset.set(0, 0, 0);
    walkStageGroup.position.set(0, 0, 0);

    revealProgress = 0.05;
    placedEffect.userData.waterMaterial.uniforms.uReveal.value = revealProgress;
    placedEffect.userData.particleMaterial.uniforms.uReveal.value = revealProgress;

    arStatusPill.style.opacity = '1';
    arStatusText.textContent = 'Escultura fija en el suelo · Camina para explorar la sala';
    arPillDot.style.background = '#8ce7d5';
    setTimeout(() => { arStatusPill.style.opacity = '0'; }, 3000);
  }

  // Botones de caminata continua y por pasos para rodear la escultura
  function bindWalkControl(btn, forwardVal, strafeVal) {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.classList.add('pressing');
      activeWalkInput.forward = forwardVal;
      activeWalkInput.strafe = strafeVal;
      stepInRoom(forwardVal * 0.9, strafeVal * 0.9);
    });
    const stop = () => {
      btn.classList.remove('pressing');
      if (activeWalkInput.forward === forwardVal) activeWalkInput.forward = 0;
      if (activeWalkInput.strafe === strafeVal) activeWalkInput.strafe = 0;
    };
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('pointercancel', stop);
  }

  bindWalkControl(btnWalkForward, 1, 0);
  bindWalkControl(btnWalkBack, -1, 0);
  bindWalkControl(btnWalkLeft, 0, -1);
  bindWalkControl(btnWalkRight, 0, 1);

  async function beginAR() {
    if (arActive) return;
    startButton.disabled = true;
    startButton.textContent = 'Activando cámara AR…';

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { await DeviceOrientationEvent.requestPermission(); } catch (_) {}
    }

    await startCameraFeed();
    initAudioCapture();

    arActive = true;
    document.documentElement.classList.add('ar-active');
    document.body.classList.add('ar-active');

    camera.position.set(0, 0, 0);
    if (!hasGyro) {
      camera.rotation.set(-0.16, 0, 0, 'YXZ');
    }

    anchorSculptureInCenterOfView();
    iniciarAudioAmbiente();
  }

  function endAR() {
    if (isRecording) stopVideoRecording();
    detenerAudioAmbiente();
    stopCameraFeed();
    arActive = false;

    document.documentElement.classList.remove('ar-active');
    document.body.classList.remove('ar-active');

    camera.position.set(0, 0, 0);
    camera.rotation.set(-0.16, 0, 0, 'YXZ');
    worldAnchorGroup.position.set(0, AR_FLOOR_Y, -AR_ANCHOR_DISTANCE);
    worldAnchorGroup.rotation.set(0, 0, 0);
    targetWalkOffset.set(0, 0, 0);
    currentWalkOffset.set(0, 0, 0);
    walkStageGroup.position.set(0, 0, 0);

    revealProgress = 1.0;
    placedEffect.userData.waterMaterial.uniforms.uReveal.value = 1.0;
    placedEffect.userData.particleMaterial.uniforms.uReveal.value = 1.0;

    startButton.disabled = false;
    startButton.textContent = 'Iniciar realidad aumentada';
  }

  closeButton.addEventListener('click', () => exitModal.classList.add('active'));
  btnCancelExit.addEventListener('click', () => exitModal.classList.remove('active'));
  btnConfirmExit.addEventListener('click', () => {
    exitModal.classList.remove('active');
    endAR();
  });

  /* ---------------- Captura de Foto y Video con Cámara Real ---------------- */
  const captureCanvas = document.createElement('canvas');
  const captureCtx = captureCanvas.getContext('2d');

  function drawVideoCover(ctx, video, targetW, targetH) {
    const vw = video.videoWidth || targetW;
    const vh = video.videoHeight || targetH;
    const scale = Math.max(targetW / vw, targetH / vh);
    const sw = targetW / scale;
    const sh = targetH / scale;
    const sx = (vw - sw) * 0.5;
    const sy = (vh - sh) * 0.5;
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);
  }

  function renderSceneToCaptureCanvas() {
    const w = renderer.domElement.width;
    const h = renderer.domElement.height;
    if (captureCanvas.width !== w || captureCanvas.height !== h) {
      captureCanvas.width = w;
      captureCanvas.height = h;
    }

    captureCtx.clearRect(0, 0, w, h);

    if (arCameraVideo.readyState >= 2) {
      drawVideoCover(captureCtx, arCameraVideo, w, h);
    } else {
      captureCtx.fillStyle = '#07191d';
      captureCtx.fillRect(0, 0, w, h);
    }

    captureCtx.drawImage(renderer.domElement, 0, 0, w, h);

    const fontSize = Math.max(18, Math.round(w * 0.024));
    captureCtx.font = `600 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
    captureCtx.fillStyle = 'rgba(244, 249, 248, 0.88)';
    captureCtx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    captureCtx.shadowBlur = 8;
    captureCtx.fillText('Museo Leonora Carrington · SLP', fontSize * 1.3, h - fontSize * 1.3);
    captureCtx.shadowBlur = 0;
  }

  async function saveFileToPhone(blob, filename, mimeType) {
    const file = new File([blob], filename, { type: mimeType });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Museo Leonora Carrington SLP' });
        showToast('Guardado en el teléfono');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('Descargado en el teléfono');
  }

  function triggerPhoto() {
    cameraFlash.classList.add('active');
    setTimeout(() => cameraFlash.classList.remove('active'), 90);
    pendingPhotoCapture = true;
  }

  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let recTimer = null;
  let recStart = 0;

  function toggleVideo() {
    if (isRecording) stopVideoRecording();
    else startVideoRecording();
  }

  function startVideoRecording() {
    try {
      renderSceneToCaptureCanvas();
      const canvasStream = captureCanvas.captureStream(30);
      const tracks = [...canvasStream.getVideoTracks()];

      if (mediaStreamDestination && mediaStreamDestination.stream) {
        tracks.push(...mediaStreamDestination.stream.getAudioTracks());
      }

      const combinedStream = new MediaStream(tracks);
      const mimeTypes = [
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      const mimeType = mimeTypes.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      const options = { videoBitsPerSecond: 4500000 };
      if (mimeType) options.mimeType = mimeType;

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(combinedStream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const finalMime = mediaRecorder.mimeType || 'video/webm';
        const ext = finalMime.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: finalMime });
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        saveFileToPhone(blob, `LaBarcaDeLasGrullas_SLP_${stamp}.${ext}`, finalMime);
      };

      mediaRecorder.start(250);
      isRecording = true;
      videoButton.classList.add('recording');
      recStart = performance.now();
      videoLabel.textContent = '00:00';

      recTimer = setInterval(() => {
        const s = Math.floor((performance.now() - recStart) / 1000);
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        videoLabel.textContent = `${mm}:${ss}`;
      }, 500);

      showToast('Grabando video…');
    } catch (e) {
      showToast('Video no disponible en este navegador');
    }
  }

  function stopVideoRecording() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.stop();
    isRecording = false;
    clearInterval(recTimer);
    videoButton.classList.remove('recording');
    videoLabel.textContent = 'VIDEO';
  }

  /* ---------------- Bucle Principal: Barca 100% Fija + Agua en Movimiento + Exploración ---------------- */
  renderer.setAnimationLoop((time) => {
    const dt = Math.min(0.05, (time - lastFrameTime) / 1000 || 0.016);
    lastFrameTime = time;
    elapsed = time * 0.001;

    if (revealProgress < 1.0) {
      revealProgress = Math.min(1.0, revealProgress + 0.025);
      placedEffect.userData.waterMaterial.uniforms.uReveal.value = revealProgress;
      placedEffect.userData.particleMaterial.uniforms.uReveal.value = revealProgress;
    }

    // Avance continuo si el visitante mantiene presionado un botón de caminata
    if (activeWalkInput.forward !== 0 || activeWalkInput.strafe !== 0) {
      stepInRoom(activeWalkInput.forward * 3.6 * dt, activeWalkInput.strafe * 3.2 * dt);
    }

    // Interpolación suave de caminata por la sala alrededor de la escultura fija
    currentWalkOffset.lerp(targetWalkOffset, Math.min(1, dt * 8.5));
    walkStageGroup.position.set(currentWalkOffset.x, 0, currentWalkOffset.z);

    // Mantener el plano de corte sincronizado con la superficie del agua para que jamás se vean los pies
    placedEffect.userData.waterMesh.getWorldPosition(_waterWorldPos);
    waterlineClipPlane.constant = -(_waterWorldPos.y - 0.015);

    // Solo el río y las partículas se mueven hacia la derecha (+X); la escultura permanece inmóvil en el suelo
    placedEffect.userData.waterMaterial.uniforms.uTime.value = elapsed;
    placedEffect.userData.particleMaterial.uniforms.uTime.value = elapsed;

    renderer.render(scene, camera);

    if (pendingPhotoCapture) {
      pendingPhotoCapture = false;
      renderSceneToCaptureCanvas();
      captureCanvas.toBlob((blob) => {
        if (!blob) return;
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        saveFileToPhone(blob, `LaBarcaDeLasGrullas_SLP_${stamp}.jpg`, 'image/jpeg');
      }, 'image/jpeg', 0.95);
    } else if (isRecording) {
      renderSceneToCaptureCanvas();
    }
  });

  startButton.addEventListener('click', beginAR);
  resetButton.addEventListener('click', () => {
    anchorSculptureInCenterOfView();
    showToast('Escultura centrada y fija en el suelo');
  });
  photoButton.addEventListener('click', triggerPhoto);
  videoButton.addEventListener('click', toggleVideo);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  camera.rotation.set(-0.16, 0, 0, 'YXZ');

  loadBarcaGrullasModel()
    .then(() => {
      statusEl.textContent = 'Listo. Pulsa “Iniciar realidad aumentada”.';
      startButton.disabled = false;
      startButton.textContent = 'Iniciar realidad aumentada';
    })
    .catch((err) => {
      console.error('Error cargando barcagrullas.glb:', err);
      statusEl.textContent = 'Atmósfera lista. Pulsa “Iniciar realidad aumentada”.';
      startButton.disabled = false;
      startButton.textContent = 'Iniciar realidad aumentada';
    });
</script>
</body>
