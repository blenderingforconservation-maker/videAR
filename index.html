<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07191d">
  <title>Museo Leonora Carrington SLP · Atmósferas Escultóricas AR</title>

  <!-- Tipografías Museográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --mint: #8ce7d5;
      --gold: #d4af37;
      --glass: rgba(5, 22, 27, 0.78);
      --glass-border: rgba(212, 175, 55, 0.3);
      --danger: #ff5a5f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07191d;
      color: #effbf9;
      font-family: 'Plus Jakarta Sans', Inter, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
    }

    /* CRÍTICO: Garantiza que el DOM Overlay sea 100% transparente al abrir la cámara AR */
    html.ar-active,
    body.ar-active,
    body.ar-active #app {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    /* Video oculto de respaldo para captura cuando camera-access no está disponible */
    #cam-fallback-video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    /* Efecto Flash al tomar fotografía */
    #camera-flash {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }
    #camera-flash.active {
      opacity: 0.85;
      transition: none;
    }

    /* ================================================= */
    /* UI PRINCIPAL Y HUD CENTRADO                       */
    /* ================================================= */
    #hud {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(22px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .top, .bottom {
      width: min(100%, 540px);
      margin-inline: auto;
    }

    .museum-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .museum-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(5, 22, 27, 0.72);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }

    .museum-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 8px var(--mint);
    }

    h1.editorial-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(38px, 9.5vw, 56px);
      font-weight: 600;
      line-height: 0.98;
      margin: 4px 0 0;
      letter-spacing: -0.02em;
      text-align: center;
      color: #f4f9f8;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    h1.editorial-title em {
      font-style: italic;
      font-weight: 500;
      color: var(--mint);
    }

    body.ar-active h1.editorial-title {
      display: none;
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 16px 18px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 14px;
      text-align: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
      animation: pulseDot 1.6s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    #status {
      font-size: 13px;
      line-height: 1.45;
      color: #e1f2ef;
      margin: 0;
      font-weight: 500;
    }

    #start {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 999px;
      padding: 15px 20px;
      min-height: 50px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #041816;
      background: linear-gradient(135deg, #e7c96b 0%, #d4af37 48%, #8ce7d5 100%);
      box-shadow: 0 10px 26px rgba(212, 175, 55, 0.25);
      cursor: pointer;
    }

    /* ================================================= */
    /* CONTROLES EN SESIÓN AR (FOTO, VIDEO, SALIR)       */
    /* ================================================= */
    #ar-dock {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    body.ar-active #pre-ar-panel {
      display: none;
    }

    body.ar-active #ar-dock {
      display: flex;
    }

    #ar-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid rgba(140, 231, 213, 0.3);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 12px;
      color: #effbf9;
      transition: opacity 0.4s ease;
    }

    .media-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    .icon-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #effbf9;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .shutter-photo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      padding: 4px;
      background: transparent;
      border: 2.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .shutter-photo .inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #dff5f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #06201e;
    }

    .shutter-video {
      height: 44px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 90, 95, 0.45);
      background: rgba(255, 90, 95, 0.16);
      color: #ffdede;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .shutter-video .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .shutter-video.recording {
      background: rgba(255, 90, 95, 0.38);
      border-color: var(--danger);
      color: #ffffff;
    }

    /* Toast de confirmación */
    #toast {
      position: fixed;
      top: calc(68px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -10px);
      z-index: 30;
      background: rgba(5, 22, 27, 0.92);
      border: 1px solid var(--mint);
      color: #effbf9;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    #toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Fallback de compatibilidad */
    #fallback {
      position: absolute;
      z-index: 15;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #0b282d, #07191d);
    }
    #fallback .panel {
      max-width: 440px;
      text-align: center;
    }
    #fallback h2 {
      font-family: 'Cormorant Garamond', serif;
      margin: 8px 0 10px;
      font-size: 26px;
    }
    #fallback p {
      color: #c3d9d7;
      font-size: 14px;
      line-height: 1.55;
      margin: 0 0 16px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <video id="cam-fallback-video" autoplay muted playsinline></video>
  <div id="camera-flash"></div>
  <div id="toast">Guardado en el teléfono</div>

  <div id="hud">
    <div class="top">
      <div class="museum-header">
        <div class="museum-badge">
          <span class="dot"></span>
          <span>Museo Leonora Carrington · SLP</span>
        </div>
        <h1 class="editorial-title">Atmósferas<br><em>escultóricas.</em></h1>
      </div>
    </div>

    <div class="bottom">
      <div id="pre-ar-panel" class="panel">
        <div class="status-row">
          <span class="status-dot"></span>
          <p id="status">Preparando la experiencia…</p>
        </div>
        <button id="start" type="button">Iniciar realidad aumentada</button>
      </div>

      <div id="ar-dock">
        <div id="ar-status-pill">
          <span class="status-dot" id="ar-pill-dot"></span>
          <span id="ar-status-text">Escaneando el suelo…</span>
        </div>

        <div class="media-bar">
          <button id="reset" type="button" class="icon-btn" title="Reposicionar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>

          <button id="btn-photo" type="button" class="shutter-photo" title="Tomar Foto">
            <span class="inner">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                <circle cx="12" cy="13" r="3"/>
              </svg>
            </span>
          </button>

          <button id="btn-video" type="button" class="shutter-video" title="Grabar Video">
            <span class="rec-dot"></span>
            <span id="video-label">VIDEO</span>
          </button>

          <button id="close" type="button" class="icon-btn" title="Salir" style="border-color: rgba(255,90,95,0.4); color: #ffb4b4;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="fallback">
    <div class="panel">
      <div class="museum-badge">Compatibilidad del dispositivo</div>
      <h2>AR espacial no disponible aquí</h2>
      <p id="fallbackText">Este navegador no expone WebXR immersive-ar.</p>
    </div>
  </div>
</div>

<audio id="audioBosque" src="bosque_noche.mp3" preload="auto" loop></audio>

<script type="module">
  import * as THREE from 'three';

  const app           = document.querySelector('#app');
  const statusEl      = document.querySelector('#status');
  const arStatusPill  = document.querySelector('#ar-status-pill');
  const arStatusText  = document.querySelector('#ar-status-text');
  const arPillDot     = document.querySelector('#ar-pill-dot');
  const startButton   = document.querySelector('#start');
  const resetButton   = document.querySelector('#reset');
  const closeButton   = document.querySelector('#close');
  const photoButton   = document.querySelector('#btn-photo');
  const videoButton   = document.querySelector('#btn-video');
  const videoLabel    = document.querySelector('#video-label');
  const cameraFlash   = document.querySelector('#camera-flash');
  const toastEl       = document.querySelector('#toast');
  const fallback      = document.querySelector('#fallback');
  const fallbackText  = document.querySelector('#fallbackText');
  const audioBosque   = document.querySelector('#audioBosque');
  const fallbackVideo = document.querySelector('#cam-fallback-video');

  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 3000);
  }

  /* ---------------- Permisos de Cámara y Respaldo getUserMedia ---------------- */
  let fallbackStream = null;

  async function requestCameraPermissionPreFlight() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      // Liberamos inmediatamente la pista antes de iniciar ARCore para evitar bloqueo de hardware
      stream.getTracks().forEach(track => track.stop());
      return true;
    } catch (err) {
      console.warn('Permiso de cámara denegado o no disponible:', err);
      return false;
    }
  }

  async function startFallbackVideoStream() {
    if (fallbackStream || !navigator.mediaDevices?.getUserMedia) return;
    try {
      fallbackStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      fallbackVideo.srcObject = fallbackStream;
      await fallbackVideo.play();
    } catch (e) {
      console.warn('El SO reservó la cámara exclusivamente para WebXR:', e);
    }
  }

  function stopFallbackVideoStream() {
    if (fallbackStream) {
      fallbackStream.getTracks().forEach(t => t.stop());
      fallbackStream = null;
    }
    fallbackVideo.srcObject = null;
  }

  /* ---------------- Sistema de Audio Suave ---------------- */
  let fadeAudioInterval = null;
  function iniciarAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    audioBosque.volume = 0.0;
    const playPromise = audioBosque.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        fadeAudioInterval = setInterval(() => {
          if (audioBosque.volume < 0.85) audioBosque.volume = Math.min(0.85, audioBosque.volume + 0.05);
          else clearInterval(fadeAudioInterval);
        }, 150);
      }).catch(e => console.warn('Interacción requerida', e));
    }
  }

  function detenerAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    fadeAudioInterval = setInterval(() => {
      if (audioBosque.volume > 0.05) audioBosque.volume = Math.max(0, audioBosque.volume - 0.08);
      else {
        audioBosque.volume = 0;
        audioBosque.pause();
        audioBosque.currentTime = 0;
        clearInterval(fadeAudioInterval);
      }
    }, 100);
  }

  /* ---------------- Renderer / Escena (Optimizado para AR y Captura) ---------------- */
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    preserveDrawingBuffer: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  app.prepend(renderer.domElement);

  const scene  = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x071e2b, 0.022);
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 150);
  // Cámara dedicada para sincronizar la matriz exacta del XRView al capturar
  const captureCamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 150);
  captureCamera.matrixAutoUpdate = false;

  scene.add(new THREE.HemisphereLight(0xd8fff7, 0x193c42, 1.6));

  /* ---------------- Pipeline WebGL2 para dibujar la Cámara XR de Fondo ---------------- */
  const gl = renderer.getContext();
  let xrGlBinding = null;
  let camShaderProgram = null;
  let camVao = null;
  let camScaleUniform = null;
  let camTexUniform = null;

  function initCameraBackgroundGL() {
    const vsSource = `#version 300 es
      out vec2 vUv;
      uniform vec2 uScale;
      void main() {
        vec2 pos[6] = vec2[6](
          vec2(-1.0, -1.0), vec2( 1.0, -1.0), vec2(-1.0,  1.0),
          vec2(-1.0,  1.0), vec2( 1.0, -1.0), vec2( 1.0,  1.0)
        );
        vec2 p = pos[gl_VertexID];
        // Ajuste aspect-ratio cover centrado en [0, 1]
        vUv = (p * uScale) * 0.5 + 0.5;
        gl_Position = vec4(p, 0.9999, 1.0);
      }
    `;
    const fsSource = `#version 300 es
      precision highp float;
      in vec2 vUv;
      uniform sampler2D uCamTex;
      out vec4 fragColor;
      void main() {
        fragColor = texture(uCamTex, vUv);
      }
    `;

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    };

    camShaderProgram = gl.createProgram();
    gl.attachShader(camShaderProgram, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(camShaderProgram, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(camShaderProgram);

    camScaleUniform = gl.getUniformLocation(camShaderProgram, 'uScale');
    camTexUniform = gl.getUniformLocation(camShaderProgram, 'uCamTex');
    camVao = gl.createVertexArray();
  }
  initCameraBackgroundGL();

  function drawXrCameraTextureToFramebuffer(cameraWebGLTexture, camW, camH, targetW, targetH) {
    if (!camShaderProgram || !cameraWebGLTexture) return;

    const canvasAspect = targetW / Math.max(1, targetH);
    const camAspect = camW / Math.max(1, camH);
    let scaleX = 1.0;
    let scaleY = 1.0;
    if (canvasAspect > camAspect) {
      scaleY = camAspect / canvasAspect;
    } else {
      scaleX = canvasAspect / camAspect;
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, targetW, targetH);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);

    gl.useProgram(camShaderProgram);
    gl.bindVertexArray(camVao);
    gl.uniform2f(camScaleUniform, scaleX, scaleY);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, cameraWebGLTexture);
    gl.uniform1i(camTexUniform, 0);

    gl.drawArrays(gl.TRIANGLES, 0, 6);

    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.bindVertexArray(null);
    // Sincroniza el estado interno de Three.js tras usar WebGL nativo
    renderer.resetState();
  }

  /* ---------------- Textura de partícula (Halo fluorescente) ---------------- */
  function makeParticleTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0.0, 'rgba(255, 255, 255, 1)');
    g.addColorStop(0.15, 'rgba(160, 255, 220, 0.95)');
    g.addColorStop(0.6, 'rgba(50, 230, 160, 0.3)');
    g.addColorStop(1.0, 'rgba(0, 120, 80, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const particleTexture = makeParticleTexture();

  /* ---------------- Reticle ---------------- */
  const reticleGeo = new THREE.RingGeometry(0.15, 0.2, 48);
  reticleGeo.rotateX(-Math.PI / 2);
  const reticle = new THREE.Mesh(
    reticleGeo,
    new THREE.MeshBasicMaterial({ color: 0x9cf7e7, side: THREE.DoubleSide, transparent: true, opacity: 0.95 })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  /* ---------------- Efecto agua + neblina + partículas ---------------- */
  function createAtmosphere() {
    const group = new THREE.Group();

    const textureLoader = new THREE.TextureLoader();
    const waterNormal = textureLoader.load('image_c713d6.png');
    waterNormal.wrapS = THREE.RepeatWrapping;
    waterNormal.wrapT = THREE.RepeatWrapping;

    const waterGeo = new THREE.PlaneGeometry(100.0, 100.0, 1, 1);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uReveal: { value: 0 },
        uColorDeep: { value: new THREE.Color(0x052026) },
        uColorShallow: { value: new THREE.Color(0x19a0a8) },
        uLightColor: { value: new THREE.Color(0xbdf7ff) },
        uFogColor: { value: new THREE.Color(0x082130) },
        uFogDensity: { value: 0.024 },
        uNormalMap: { value: waterNormal }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        void main() {
          vUv = uv;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uReveal;
        uniform vec3 uColorDeep;
        uniform vec3 uColorShallow;
        uniform vec3 uLightColor;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        uniform sampler2D uNormalMap;
        varying vec2 vUv;
        varying vec3 vWorldPosition;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p); vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) {
          float value = 0.0; float amp = 0.5; float freq = 1.0;
          for (int i = 0; i < 4; i++) {
            value += amp * noise(p * freq);
            freq *= 2.0; amp *= 0.5;
          }
          return value;
        }

        void main() {
          vec2 p = (vUv - 0.5) * 2.0 * 28.0;
          float t = uTime * 0.075;

          vec2 q = vec2(fbm(p + vec2(0.0, 0.0) + t), fbm(p + vec2(5.2, 1.3) - t));
          vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.5), fbm(p + 4.0 * q + vec2(8.3, 2.8) - t * 0.3));
          float height = fbm(p + 4.0 * r);

          vec2 uvNormal = vUv * 42.0 + vec2(t * 0.15, -t * 0.1);
          vec3 texNormal = texture2D(uNormalMap, uvNormal).xyz * 2.0 - 1.0;
          vec3 normal = normalize(vec3(texNormal.x * 1.5, texNormal.y * 1.5, 1.0));

          vec3 viewDir = normalize(cameraPosition - vWorldPosition);
          vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));

          float spec = pow(max(dot(normal, lightDir), 0.0), 24.0);
          float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

          vec3 color = mix(uColorDeep, uColorShallow, smoothstep(0.2, 0.8, height));
          color += uLightColor * spec * 1.5;
          color = mix(color, uLightColor, fresnel * 0.4);

          float dist = length(cameraPosition - vWorldPosition);
          float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
          float mistNoise = fbm(p * 0.45 - vec2(t * 0.35, t * 0.2));
          float mistLayer = smoothstep(0.35, 0.85, mistNoise) * 0.32;
          color = mix(color, uFogColor, clamp(fogFactor * 0.65 + mistLayer, 0.0, 0.78));

          float alpha = mix(0.85, 0.99, smoothstep(0.2, 0.8, height));
          alpha = max(alpha, fresnel * 0.8);

          float edgeFade = 1.0 - smoothstep(0.65, 1.0, length(vUv - 0.5) * 2.0);
          alpha = clamp(alpha, 0.0, 0.95) * edgeFade * uReveal;

          gl_FragColor = vec4(color, alpha);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 0.02;
    water.frustumCulled = false;
    group.add(water);

    const particleCount = 2200;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.pow(Math.random(), 0.75) * 45.0;
      particlePositions[i * 3]     = Math.cos(angle) * radius;
      particlePositions[i * 3 + 1] = 0.15 + Math.random() * 2.6;
      particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
      particleSeeds[i] = Math.random() * Math.PI * 2;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

    const particleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uReveal: { value: 0 },
        uTexture: { value: particleTexture },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        uFogDensity: { value: 0.025 }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uReveal;
        uniform float uPixelRatio;
        uniform float uFogDensity;
        attribute float aSeed;
        varying float vAlpha;
        void main() {
          vec3 pos = position;
          pos.x += sin(uTime * 0.5 + aSeed) * 0.4;
          pos.y += cos(uTime * 0.4 + aSeed * 2.0) * 0.25;
          pos.z += sin(uTime * 0.3 + aSeed * 3.0) * 0.4;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          float dist = length(mvPosition.xyz);
          float fogAtten = exp(-pow(dist * uFogDensity, 2.0));

          gl_PointSize = 100.0 * uPixelRatio * (1.0 / -mvPosition.z);
          gl_PointSize = clamp(gl_PointSize, 3.0, 55.0);

          vAlpha = (0.5 + 0.5 * sin(uTime * 1.5 + aSeed * 5.0)) * fogAtten * uReveal;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying float vAlpha;
        void main() {
          vec4 texColor = texture2D(uTexture, gl_PointCoord);
          gl_FragColor = vec4(texColor.rgb, texColor.a * vAlpha);
        }
      `
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    particles.frustumCulled = false;
    group.add(particles);

    group.userData.waterMaterial = waterMat;
    group.userData.particleMaterial = particleMat;
    group.visible = false;
    scene.add(group);
    return group;
  }

  const placedEffect = createAtmosphere();

  /* ---------------- Estado y Auto-Colocación ---------------- */
  let hitTestSource = null;
  let activeSession = null;
  let elapsed = 0;
  let xrSessionStarting = false;
  let arSupported = null;
  let isPlaced = false;
  let revealProgress = 0;
  let pendingPhotoCapture = false;

  function showFallback(text) {
    fallbackText.textContent = text;
    fallback.style.display = 'flex';
  }

  function autoPlaceEffect(poseMatrixArray) {
    isPlaced = true;
    reticle.visible = false;

    reticle.matrix.fromArray(poseMatrixArray);
    placedEffect.position.setFromMatrixPosition(reticle.matrix);
    placedEffect.position.y -= 0.01;
    placedEffect.visible = true;
    revealProgress = 0.02;

    arStatusText.textContent = 'Atmósfera activa';
    arPillDot.style.background = '#8ce7d5';
    setTimeout(() => { arStatusPill.style.opacity = '0'; }, 2200);

    iniciarAudioAmbiente();
  }

  function clearEffect() {
    isPlaced = false;
    revealProgress = 0;
    placedEffect.visible = false;
    placedEffect.userData.waterMaterial.uniforms.uReveal.value = 0;
    placedEffect.userData.particleMaterial.uniforms.uReveal.value = 0;
    reticle.visible = false;

    arStatusPill.style.opacity = '1';
    arStatusText.textContent = 'Escaneando nuevo suelo…';
    arPillDot.style.background = '#d4af37';
    detenerAudioAmbiente();
  }

  async function endAR() {
    if (isRecording) stopVideoRecording();
    detenerAudioAmbiente();
    stopFallbackVideoStream();
    if (activeSession) {
      try { await activeSession.end(); } catch (_) {}
    }
  }

  /* ---------------- Captura de Foto y Video con Cámara Real ---------------- */
  const captureCanvas = document.createElement('canvas');
  const captureCtx = captureCanvas.getContext('2d');

  function drawVideoCover(ctx, video, targetW, targetH) {
    const vw = video.videoWidth || targetW;
    const vh = video.videoHeight || targetH;
    const scale = Math.max(targetW / vw, targetH / vh);
    const sw = targetW / scale;
    const sh = targetH / scale;
    const sx = (vw - sw) * 0.5;
    const sy = (vh - sh) * 0.5;
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);
  }

  function renderSceneToCaptureCanvas(frame, refSpace) {
    const w = renderer.domElement.width;
    const h = renderer.domElement.height;
    if (captureCanvas.width !== w || captureCanvas.height !== h) {
      captureCanvas.width = w;
      captureCanvas.height = h;
    }

    let xrCameraTexture = null;
    let camW = w;
    let camH = h;
    let activeView = null;

    if (frame && refSpace) {
      const viewerPose = frame.getViewerPose(refSpace);
      if (viewerPose && viewerPose.views && viewerPose.views.length > 0) {
        activeView = viewerPose.views[0];
        if (activeView.camera && xrGlBinding) {
          try {
            xrCameraTexture = xrGlBinding.getCameraImage(activeView.camera);
            camW = activeView.camera.width;
            camH = activeView.camera.height;
          } catch (_) {}
        }
      }
    }

    const prevXrEnabled = renderer.xr.enabled;
    const prevAutoClear = renderer.autoClear;
    renderer.xr.enabled = false;
    renderer.setRenderTarget(null);

    if (xrCameraTexture) {
      // 1. Dibuja el feed real de la cámara WebXR en el fondo del framebuffer WebGL
      drawXrCameraTextureToFramebuffer(xrCameraTexture, camW, camH, w, h);
      renderer.autoClear = false;
      renderer.clearDepth();
    } else {
      // Si el navegador no expone camera-access, limpiamos en transparente y solicitamos stream de respaldo
      renderer.autoClear = true;
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, true, true);
      if (!fallbackStream) startFallbackVideoStream();
    }

    // 2. Sincroniza la cámara de captura con la pose exacta del XRView activo
    if (activeView) {
      captureCamera.projectionMatrix.fromArray(activeView.projectionMatrix);
      captureCamera.projectionMatrixInverse.copy(captureCamera.projectionMatrix).invert();
      captureCamera.matrixWorld.fromArray(activeView.transform.matrix);
      captureCamera.matrixWorldInverse.fromArray(activeView.transform.inverse.matrix);
      renderer.render(scene, captureCamera);
    } else {
      renderer.render(scene, camera);
    }

    renderer.autoClear = prevAutoClear;
    renderer.xr.enabled = prevXrEnabled;

    // 3. Volcado final al Canvas 2D de exportación
    captureCtx.clearRect(0, 0, w, h);

    // Si no hubo textura WebXR pero el video de respaldo está activo, se dibuja detrás
    if (!xrCameraTexture && fallbackVideo.readyState >= 2) {
      drawVideoCover(captureCtx, fallbackVideo, w, h);
    }

    // Superpone el render WebGL (que ya incluye cámara XR + 3D o el 3D transparente)
    captureCtx.drawImage(renderer.domElement, 0, 0, w, h);

    // 4. Marca de agua editorial del museo
    const fontSize = Math.max(18, Math.round(w * 0.024));
    captureCtx.font = `600 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
    captureCtx.fillStyle = 'rgba(244, 249, 248, 0.88)';
    captureCtx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    captureCtx.shadowBlur = 8;
    captureCtx.fillText('Museo Leonora Carrington · SLP', fontSize * 1.3, h - fontSize * 1.3);
    captureCtx.shadowBlur = 0;
  }

  async function saveFileToPhone(blob, filename, mimeType) {
    const file = new File([blob], filename, { type: mimeType });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Museo Leonora Carrington SLP' });
        showToast('Guardado en el teléfono');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('Descargado en el teléfono');
  }

  function triggerPhoto() {
    cameraFlash.classList.add('active');
    setTimeout(() => cameraFlash.classList.remove('active'), 90);
    pendingPhotoCapture = true;
  }

  // Grabación de Video
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let recTimer = null;
  let recStart = 0;

  function toggleVideo() {
    if (isRecording) stopVideoRecording();
    else startVideoRecording();
  }

  function startVideoRecording() {
    try {
      const w = renderer.domElement.width;
      const h = renderer.domElement.height;
      if (captureCanvas.width !== w || captureCanvas.height !== h) {
        captureCanvas.width = w;
        captureCanvas.height = h;
      }

      const stream = captureCanvas.captureStream(30);
      const mimeTypes = [
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      const mimeType = mimeTypes.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      const options = { videoBitsPerSecond: 8000000 };
      if (mimeType) options.mimeType = mimeType;

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, options);
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const finalMime = mediaRecorder.mimeType || 'video/webm';
        const ext = finalMime.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: finalMime });
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        saveFileToPhone(blob, `LeonoraCarrington_SLP_${stamp}.${ext}`, finalMime);
      };

      mediaRecorder.start(200);
      isRecording = true;
      videoButton.classList.add('recording');
      recStart = performance.now();
      videoLabel.textContent = '00:00';

      recTimer = setInterval(() => {
        const s = Math.floor((performance.now() - recStart) / 1000);
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        videoLabel.textContent = `${mm}:${ss}`;
      }, 500);

      showToast('Grabando video…');
    } catch (e) {
      showToast('Video no disponible en este navegador');
    }
  }

  function stopVideoRecording() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.stop();
    isRecording = false;
    clearInterval(recTimer);
    videoButton.classList.remove('recording');
    videoLabel.textContent = 'VIDEO';
  }

  /* ---------------- Eventos de Sesión WebXR ---------------- */
  renderer.xr.addEventListener('sessionstart', async () => {
    activeSession = renderer.xr.getSession();
    document.documentElement.classList.add('ar-active');
    document.body.classList.add('ar-active');
    fallback.style.display = 'none';

    isPlaced = false;
    revealProgress = 0;
    arStatusPill.style.opacity = '1';
    arStatusText.textContent = 'Escaneando entorno. Apunta hacia el suelo…';

    if (!activeSession) return;

    // Inicializa XRWebGLBinding para capturar la textura nativa de la cámara AR
    if (typeof XRWebGLBinding !== 'undefined') {
      try {
        xrGlBinding = new XRWebGLBinding(activeSession, gl);
      } catch (e) {
        console.warn('XRWebGLBinding no soportado en este contexto:', e);
        xrGlBinding = null;
      }
    }

    try {
      const viewerSpace = await activeSession.requestReferenceSpace('viewer');
      if (activeSession) {
        hitTestSource = await activeSession.requestHitTestSource({ space: viewerSpace });
      }
    } catch (err) {
      arStatusText.textContent = 'AR activa, buscando superficies…';
    }

    activeSession.addEventListener('end', () => {
      if (isRecording) stopVideoRecording();
      detenerAudioAmbiente();
      stopFallbackVideoStream();
      hitTestSource = null;
      xrGlBinding = null;
      activeSession = null;
      xrSessionStarting = false;
      isPlaced = false;
      placedEffect.visible = false;
      reticle.visible = false;

      document.documentElement.classList.remove('ar-active');
      document.body.classList.remove('ar-active');
      startButton.disabled = false;
      startButton.textContent = 'Iniciar realidad aumentada';
      statusEl.textContent = 'Listo. Pulsa “Iniciar realidad aumentada”.';
    }, { once: true });
  });

  /* ---------------- Bucle de Render ---------------- */
  renderer.setAnimationLoop((time, frame) => {
    elapsed = time * 0.001;

    if (isPlaced && revealProgress < 1.0) {
      revealProgress = Math.min(1.0, revealProgress + 0.025);
      placedEffect.userData.waterMaterial.uniforms.uReveal.value = revealProgress;
      placedEffect.userData.particleMaterial.uniforms.uReveal.value = revealProgress;
    }

    placedEffect.userData.waterMaterial.uniforms.uTime.value = elapsed;
    placedEffect.userData.particleMaterial.uniforms.uTime.value = elapsed;

    const refSpace = renderer.xr.getReferenceSpace();

    if (frame && !isPlaced && hitTestSource && refSpace) {
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0) {
        const pose = results[0].getPose(refSpace);
        if (pose) {
          autoPlaceEffect(pose.transform.matrix);
        }
      }
    }

    renderer.render(scene, camera);

    if (pendingPhotoCapture) {
      pendingPhotoCapture = false;
      renderSceneToCaptureCanvas(frame, refSpace);
      captureCanvas.toBlob((blob) => {
        if (!blob) return;
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        saveFileToPhone(blob, `LeonoraCarrington_SLP_${stamp}.jpg`, 'image/jpeg');
      }, 'image/jpeg', 0.95);
    } else if (isRecording) {
      renderSceneToCaptureCanvas(frame, refSpace);
    }
  });

  /* ---------------- Inicialización AR con Permiso de Cámara ---------------- */
  async function beginAR() {
    if (xrSessionStarting || renderer.xr.isPresenting || activeSession) return;
    if (!navigator.xr || arSupported === false) {
      showFallback('No compatible con WebXR immersive-ar.');
      return;
    }

    xrSessionStarting = true;
    startButton.disabled = true;
    startButton.textContent = 'Solicitando permiso de cámara…';

    // Solicita explícitamente el permiso de cámara antes de abrir la sesión AR
    await requestCameraPermissionPreFlight();

    startButton.textContent = 'Iniciando AR…';
    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'camera-access'],
        domOverlay: { root: document.body }
      });
      await renderer.xr.setSession(session);
    } catch (err) {
      showFallback('No se pudo iniciar. Revisa los permisos de la cámara.');
      startButton.disabled = false;
      startButton.textContent = 'Intentar de nuevo';
    } finally {
      xrSessionStarting = false;
    }
  }

  startButton.addEventListener('click', beginAR);
  resetButton.addEventListener('click', clearEffect);
  closeButton.addEventListener('click', endAR);
  photoButton.addEventListener('click', triggerPhoto);
  videoButton.addEventListener('click', toggleVideo);

  document.body.addEventListener('beforexrselect', (e) => {
    const t = e.target;
    if (t && t.closest && t.closest('button, .media-bar, .panel')) e.preventDefault();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((ok) => {
      arSupported = ok;
      statusEl.textContent = ok ? 'Listo. Pulsa “Iniciar realidad aumentada”.' : 'Dispositivo no compatible.';
      if (!ok) startButton.textContent = 'Ver compatibilidad';
    });
  }
</script>
</body>
</html>
