<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07191d">
  <title>Atmósferas escultóricas | AR</title>
  <style>
    :root { color-scheme: dark; --mint:#8ce7d5; --glass:rgba(5,22,27,.78); }
    * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html,body { margin:0; width:100%; min-height:100%; background:#07191d; color:#effbf9;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    body { min-height:100svh; overflow:hidden; }
    #app { position:fixed; inset:0; overflow:hidden; }
    
    /* ================================================= */
    /* UI PRINCIPAL Y HUD                                */
    /* ================================================= */
    #hud { position:absolute; z-index:5; inset:0; display:flex; flex-direction:column;
      justify-content:space-between; padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      pointer-events:none; transition: opacity 0.3s; }
    .top,.bottom { width:min(100%,560px); margin-inline:auto; }
    .eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mint); font-weight:750; }
    h1 { font-size:clamp(28px,7.5vw,42px); line-height:1.02; margin:10px 0 0; letter-spacing:-.04em; }
    
    .panel { background:var(--glass); border:1px solid rgba(164,231,221,.2); border-radius:18px;
      padding:14px 15px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 12px 40px #0003; }
    #status { font-size:13px; line-height:1.45; color:#e1f2ef; margin:0 0 12px; }
    
    .actions { display:flex; gap:9px; flex-wrap:wrap; pointer-events:auto; }
    button { appearance:none; border:0; border-radius:999px; padding:13px 17px; min-height:46px;
      font-weight:750; font-size:13px; cursor:pointer; }
    #start { color:#06201e; background:var(--mint); flex:1; }
    #reset { color:#e9f6f3; background:#ffffff17; border:1px solid #ffffff25; display:none; }
    #close { color:#ffdede; background:#ff4d4d22; border:1px solid #ff4d4d55; display:none; }

    #fallback { position:absolute; z-index:10; inset:0; display:none; align-items:center; justify-content:center;
      padding:24px; background:linear-gradient(160deg,#0b282d,#07191d); }
    #fallback .panel { max-width:460px; pointer-events:auto; }
    #fallback h2 { margin:0 0 10px; font-size:24px; }
    #fallback p { color:#c3d9d7; font-size:14px; line-height:1.55; }
    .pill { display:inline-block; padding:5px 9px; border-radius:99px; background:#8ce7d51c; color:var(--mint);
      font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; margin-bottom:10px; }
    
    canvas { display:block; touch-action:none; }

    /* ================================================= */
    /* UI DE CAPTURA (FOTO Y VIDEO)                      */
    /* ================================================= */
    #contenedorControles {
      position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: none; flex-direction: column; align-items: center; gap: 12px; pointer-events: none;
    }
    #badgeTiempo {
      display: none; align-items: center; gap: 6px; background: rgba(255, 59, 48, 0.92); color: #fff;
      font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 5px 12px; border-radius: 20px;
    }
    #badgeTiempo.activo { display: flex; }
    .punto-parpadeo { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: parpadeo 1s infinite; }
    @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .dock-captura {
      display: flex; align-items: center; gap: 22px; background: rgba(18, 18, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.16); padding: 12px 22px; border-radius: 50px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: auto;
    }
    .btn-icono { border: none; background: none; padding: 0; cursor: pointer; transition: transform 0.15s; }
    .btn-icono:active { transform: scale(0.9); }
    
    #btnFoto { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; }
    .nucleo-foto { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; color: #111; }
    
    #btnVideo { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; background: rgba(255, 59, 48, 0.15); display: flex; align-items: center; justify-content: center; }
    .nucleo-video { width: 40px; height: 40px; border-radius: 50%; background: #ff3b30; transition: all 0.25s; }
    #btnVideo.grabando { border-color: #ff3b30; }
    #btnVideo.grabando .nucleo-video { width: 22px; height: 22px; border-radius: 6px; }

    #flashPantalla { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.2s; }

    /* ================================================= */
    /* MODAL DE VISTA PREVIA Y DESCARGA                  */
    /* ================================================= */
    #modalPreview {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 18px; pointer-events: auto;
    }
    #modalPreview.activo { display: flex; }
    .tarjeta-preview { background: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; padding: 16px; width: 100%; max-width: 380px; color: #fff; }
    .cabecera-preview { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: #e5e5ea; }
    #pesoArchivo { background: rgba(48, 209, 88, 0.15); color: #30d158; border: 1px solid rgba(48, 209, 88, 0.3); padding: 4px 10px; border-radius: 12px; font-size: 11px; }
    .contenedor-media { width: 100%; max-height: 55vh; border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 14px; display: flex; justify-content: center; align-items: center; }
    .contenedor-media img, .contenedor-media video { max-width: 100%; max-height: 55vh; object-fit: contain; }
    .acciones-preview { display: flex; gap: 8px; }
    .btn-modal { flex: 1; padding: 12px 10px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    #btnCerrarPreview { background: #2c2c2e; color: #fff; flex: 0.5; }
    #btnCompartir { display: none; background: #30d158; color: #000; }
    #btnDescargar { background: #0a84ff; color: #fff; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="top">
      <div class="eyebrow">Experiencia de patrimonio · WebAR</div>
      <h1>Atmósferas<br>escultóricas.</h1>
    </div>
    <div class="bottom panel">
      <p id="status">Preparando la experiencia…</p>
      <div class="actions">
        <button id="start">Iniciar realidad aumentada</button>
        <button id="reset" type="button">Reposicionar</button>
        <button id="close" type="button">Salir</button>
      </div>
    </div>
  </div>

  <!-- Controles Inferiores (Ocultos hasta iniciar AR) -->
  <div id="contenedorControles">
    <div id="badgeTiempo">
      <span class="punto-parpadeo"></span>
      <span id="textoTiempo">00:00</span>
    </div>
    <div class="dock-captura">
      <button class="btn-icono" id="btnFoto" aria-label="Tomar foto">
        <div class="nucleo-foto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </div>
      </button>
      <button class="btn-icono" id="btnVideo" aria-label="Grabar video">
        <div class="nucleo-video"></div>
      </button>
    </div>
  </div>

  <div id="fallback">
    <div class="panel">
      <span class="pill">Compatibilidad del dispositivo</span>
      <h2>AR espacial no disponible aquí</h2>
      <p id="fallbackText">Este navegador no expone WebXR immersive-ar.</p>
    </div>
  </div>
</div>

<div id="flashPantalla"></div>

<!-- Modal de Descarga -->
<div id="modalPreview">
  <div class="tarjeta-preview">
    <div class="cabecera-preview">
      <span id="tituloPreview">Captura lista</span>
      <span id="pesoArchivo">0 KB</span>
    </div>
    <div class="contenedor-media" id="contenedorMedia"></div>
    <div class="acciones-preview">
      <button class="btn-modal" id="btnCerrarPreview">✕</button>
      <button class="btn-modal" id="btnCompartir">Guardar</button>
      <button class="btn-modal" id="btnDescargar">⬇ Descargar</button>
    </div>
  </div>
</div>

<!-- ===================================================== -->
<!-- ELEMENTO DE AUDIO: ATMÓSFERA INMERSIVA DE BOSQUE      -->
<!-- ===================================================== -->
<audio id="audioBosque" src="bosque_noche.mp3" preload="auto" loop></audio>

<script type="module">
  import * as THREE from 'three';

  const app          = document.querySelector('#app');
  const hud          = document.querySelector('#hud');
  const statusEl     = document.querySelector('#status');
  const startButton  = document.querySelector('#start');
  const resetButton  = document.querySelector('#reset');
  const closeButton  = document.querySelector('#close');
  const fallback     = document.querySelector('#fallback');
  const fallbackText = document.querySelector('#fallbackText');
  const audioBosque  = document.querySelector('#audioBosque');
  const contenedorControles = document.querySelector('#contenedorControles');

  /* ---------------- Sistema de Audio Suave ---------------- */
  let fadeAudioInterval = null;
  function iniciarAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    audioBosque.volume = 0.0;
    const playPromise = audioBosque.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        fadeAudioInterval = setInterval(() => {
          if (audioBosque.volume < 0.85) audioBosque.volume = Math.min(0.85, audioBosque.volume + 0.05);
          else clearInterval(fadeAudioInterval);
        }, 150);
      }).catch(err => console.warn("Audio esperando interacción del usuario:", err));
    }
  }
  function detenerAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    fadeAudioInterval = setInterval(() => {
      if (audioBosque.volume > 0.05) audioBosque.volume = Math.max(0, audioBosque.volume - 0.08);
      else {
        audioBosque.volume = 0;
        audioBosque.pause();
        audioBosque.currentTime = 0;
        clearInterval(fadeAudioInterval);
      }
    }, 100);
  }

  /* ---------------- Renderer / escena ---------------- */
  // preserveDrawingBuffer es OBLIGATORIO para poder exportar la imagen/video del canvas WebGL
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  app.prepend(renderer.domElement);

  const scene  = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x06181f, 0.12);
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 30);
  scene.add(new THREE.HemisphereLight(0xd8fff7, 0x193c42, 1.6));

  /* ---------------- Textura de partícula (Halo Amplio y Fluorescente) ---------------- */
  function makeParticleTexture() {
    const size = 128; const c = document.createElement('canvas');
    c.width = c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    // Centro blanco incandescente
    g.addColorStop(0.0, 'rgba(255, 255, 255, 1)');
    // Núcleo fluorescente verde/cian
    g.addColorStop(0.15, 'rgba(160, 255, 220, 0.95)');
    // Halo extenso difuminado
    g.addColorStop(0.6, 'rgba(50, 230, 160, 0.3)');
    g.addColorStop(1.0, 'rgba(0, 120, 80, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
  }
  const particleTexture = makeParticleTexture();

  /* ---------------- Reticle ---------------- */
  const reticleGeo = new THREE.RingGeometry(0.12, 0.17, 48); reticleGeo.rotateX(-Math.PI / 2);
  const reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({ color: 0x9cf7e7, side: THREE.DoubleSide, transparent: true, opacity: 0.95 }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  /* ---------------- Efecto agua (Más verde) + neblina + partículas ---------------- */
  function createAtmosphere() {
    const group = new THREE.Group();

    const textureLoader = new THREE.TextureLoader();
    const waterNormal = textureLoader.load('image_c713d6.png');
    waterNormal.wrapS = THREE.RepeatWrapping;
    waterNormal.wrapT = THREE.RepeatWrapping;

    const waterGeo = new THREE.PlaneGeometry(14.4, 14.4);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        // Tonos ajustados hacia el esmeralda/verde profundo
        uColorDeep: { value: new THREE.Color(0x041f1c) },
        uColorShallow: { value: new THREE.Color(0x19a886) },
        uLightColor: { value: new THREE.Color(0xbdffea) },
        uFogColor: { value: new THREE.Color(0x08202d) },
        uFogDensity: { value: 0.14 },
        uNormalMap: { value: waterNormal }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        void main() {
          vUv = uv;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColorDeep;
        uniform vec3 uColorShallow;
        uniform vec3 uLightColor;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        uniform sampler2D uNormalMap;
        varying vec2 vUv;
        varying vec3 vWorldPosition;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p); vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) {
          float value = 0.0; float amplitude = 0.5; float frequency = 1.0;
          for (int i = 0; i < 4; i++) {
            value += amplitude * noise(p * frequency);
            frequency *= 2.0; amplitude *= 0.5;
          }
          return value;
        }

        void main() {
          vec2 p = (vUv - 0.5) * 2.0 * 4.0; 
          float t = uTime * 0.075; 

          vec2 q = vec2(fbm(p + vec2(0.0, 0.0) + t), fbm(p + vec2(5.2, 1.3) - t));
          vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.5), fbm(p + 4.0 * q + vec2(8.3, 2.8) - t * 0.3));
          float height = fbm(p + 4.0 * r);

          vec2 uvNormal = vUv * 6.0 + vec2(t * 0.15, -t * 0.1);
          vec3 texNormal = texture2D(uNormalMap, uvNormal).xyz * 2.0 - 1.0;
          vec3 normal = normalize(vec3(texNormal.x * 1.5, texNormal.y * 1.5, 1.0));
          
          vec3 viewDir = normalize(cameraPosition - vWorldPosition);
          vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));

          float spec = pow(max(dot(normal, lightDir), 0.0), 24.0);
          float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

          vec3 color = mix(uColorDeep, uColorShallow, smoothstep(0.2, 0.8, height));
          color += uLightColor * spec * 1.5;
          color = mix(color, uLightColor, fresnel * 0.4);

          float dist = length(cameraPosition - vWorldPosition);
          float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
          float mistNoise = fbm(p * 1.2 - vec2(t * 0.35, t * 0.2));
          float mistLayer = smoothstep(0.35, 0.85, mistNoise) * 0.32;
          color = mix(color, uFogColor, clamp(fogFactor * 0.65 + mistLayer, 0.0, 0.75));

          float alpha = mix(0.85, 0.99, smoothstep(0.2, 0.8, height));
          alpha = max(alpha, fresnel * 0.8);
          
          float edgeFade = 1.0 - smoothstep(0.7, 1.0, length(vUv - 0.5) * 2.0);
          alpha = clamp(alpha, 0.0, 0.95) * edgeFade;

          gl_FragColor = vec4(color, alpha);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 0.02;
    water.frustumCulled = false;
    group.add(water);

    // --- PARTÍCULAS ---
    const particleCount = 1200;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.sqrt(Math.random()) * 12.3;
      particlePositions[i * 3]     = Math.cos(angle) * radius;
      particlePositions[i * 3 + 1] = 0.15 + Math.random() * 2.4;
      particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
      particleSeeds[i] = Math.random() * Math.PI * 2;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

    const particleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uTexture: { value: particleTexture },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        uFogDensity: { value: 0.12 }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        uniform float uFogDensity;
        attribute float aSeed;
        varying float vAlpha;

        void main() {
          vec3 pos = position;
          pos.x += sin(uTime * 0.5 + aSeed) * 0.4;
          pos.y += cos(uTime * 0.4 + aSeed * 2.0) * 0.25;
          pos.z += sin(uTime * 0.3 + aSeed * 3.0) * 0.4;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          float dist = length(mvPosition.xyz);
          float fogAtten = exp(-pow(dist * uFogDensity, 2.0));
          
          // Incremento del tamaño de las partículas para que luzcan más el halo
          gl_PointSize = 100.0 * uPixelRatio * (1.0 / -mvPosition.z);
          gl_PointSize = clamp(gl_PointSize, 3.0, 55.0);

          vAlpha = (0.5 + 0.5 * sin(uTime * 1.5 + aSeed * 5.0)) * fogAtten;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying float vAlpha;
        void main() {
          vec4 texColor = texture2D(uTexture, gl_PointCoord);
          gl_FragColor = vec4(texColor.rgb, texColor.a * vAlpha);
        }
      `
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    particles.frustumCulled = false;
    group.add(particles);

    group.userData.waterMaterial = waterMat;
    group.userData.particleMaterial = particleMat;
    group.visible = false;
    scene.add(group);
    return group;
  }

  const placedEffect = createAtmosphere();

  /* ---------------- Sistema Híbrido de Captura (WebXR Privacy Bypass) ---------------- */
  // WebXR no permite acceder a la cámara trasera por privacidad. 
  // Creamos un lienzo compositor que renderiza la atmósfera 3D sobre un elegante fondo oscuro
  window.capturador = {
    fotoPendiente: false, grabando: false,
    canvas: document.createElement('canvas')
  };
  window.capturador.ctx = window.capturador.canvas.getContext('2d', { alpha: false });

  let mediaRecorder = null;
  let fragmentosVideo = [];
  let tiempoGrabacion = null;
  let segundos = 0;
  let urlActual = null;
  let objActual = null;
  let nombreActual = "";

  const btnFoto = document.getElementById("btnFoto");
  const btnVideo = document.getElementById("btnVideo");
  const flash = document.getElementById("flashPantalla");
  const badgeTiempo = document.getElementById("badgeTiempo");
  const textoTiempo = document.getElementById("textoTiempo");
  
  btnFoto.addEventListener("click", () => {
    flash.style.opacity = "0.85";
    setTimeout(() => { flash.style.opacity = "0"; }, 180);
    window.capturador.fotoPendiente = true;
  });

  btnVideo.addEventListener("click", () => {
    if (!window.capturador.grabando) iniciarGrabacion();
    else detenerGrabacion();
  });

  function obtenerMimeType() {
    const tipos = ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
    for (const t of tipos) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    return "";
  }

  function iniciarGrabacion() {
    window.capturador.grabando = true;
    fragmentosVideo = [];
    const stream = window.capturador.canvas.captureStream(30);
    const mime = obtenerMimeType();
    try { mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 }); } 
    catch(e) { mediaRecorder = new MediaRecorder(stream); }

    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) fragmentosVideo.push(e.data); };
    mediaRecorder.onstop = () => {
      const finalMime = mediaRecorder.mimeType || "video/mp4";
      mostrarPreview(new Blob(fragmentosVideo, { type: finalMime }), "video");
    };

    mediaRecorder.start(250);
    btnVideo.classList.add("grabando");
    badgeTiempo.classList.add("activo");
    segundos = 0; textoTiempo.textContent = "00:00";
    tiempoGrabacion = setInterval(() => {
      segundos++;
      textoTiempo.textContent = String(Math.floor(segundos/60)).padStart(2,"0") + ":" + String(segundos%60).padStart(2,"0");
    }, 1000);
  }

  function detenerGrabacion() {
    window.capturador.grabando = false;
    clearInterval(tiempoGrabacion);
    btnVideo.classList.remove("grabando");
    badgeTiempo.classList.remove("activo");
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      try { mediaRecorder.requestData(); } catch(e){}
      setTimeout(() => { if (mediaRecorder.state !== "inactive") mediaRecorder.stop(); }, 100);
    }
  }

  /* ---------------- Estado y Controles AR ---------------- */
  let hitTestSource = null;
  let activeSession = null;
  let elapsed = 0;
  let xrSessionStarting = false;
  let arSupported = null;

  function showFallback(text) { fallbackText.textContent = text; fallback.style.display = 'flex'; }

  function placeEffect() {
    if (!reticle.visible) {
      statusEl.textContent = 'Mueve el teléfono apuntando al suelo...';
      return;
    }
    placedEffect.position.setFromMatrixPosition(reticle.matrix);
    placedEffect.position.y -= 0.01;
    placedEffect.visible = true;
    
    statusEl.textContent = 'Atmósfera colocada.';
    setTimeout(() => { hud.style.opacity = "0"; }, 2000); // Ocultar textos para vista limpia
    iniciarAudioAmbiente();
  }

  function clearEffect() {
    placedEffect.visible = false;
    reticle.visible = false;
    hud.style.opacity = "1";
    statusEl.textContent = 'Apunta al suelo y toca para colocar.';
    detenerAudioAmbiente();
  }

  async function endAR() {
    detenerAudioAmbiente();
    if (activeSession) { try { await activeSession.end(); } catch (_) {} }
  }

  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', placeEffect);
  scene.add(controller);

  renderer.xr.addEventListener('sessionstart', async () => {
    activeSession = renderer.xr.getSession();
    fallback.style.display = 'none';
    startButton.style.display = 'none';
    closeButton.style.display = 'block';
    resetButton.style.display = 'block';
    contenedorControles.style.display = 'flex'; // Mostrar controles fotográficos
    statusEl.textContent = 'AR activa. Apunta al suelo.';

    const session = activeSession;
    if (!session) return;
    try {
      const viewerSpace = await session.requestReferenceSpace('viewer');
      if (session === activeSession) hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    } catch (err) {}

    session.addEventListener('end', () => {
      detenerAudioAmbiente();
      hitTestSource = null; activeSession = null; xrSessionStarting = false;
      startButton.disabled = false; startButton.style.display = 'block';
      closeButton.style.display = 'none'; resetButton.style.display = 'none';
      contenedorControles.style.display = 'none'; hud.style.opacity = "1";
    }, { once: true });
  });

  /* ---------------- Bucle de Render y Compositor ---------------- */
  renderer.setAnimationLoop((time, frame) => {
    elapsed = time * 0.001;

    placedEffect.userData.waterMaterial.uniforms.uTime.value = elapsed;
    placedEffect.userData.particleMaterial.uniforms.uTime.value = elapsed;

    if (frame) {
      const refSpace = renderer.xr.getReferenceSpace();
      if (hitTestSource && refSpace) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(refSpace);
          if (pose) {
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            reticle.matrixWorldNeedsUpdate = true;
          } else { reticle.visible = false; }
        } else { reticle.visible = false; }
      }
    }
    renderer.render(scene, camera);

    // Compositor de Captura Activa
    if (window.capturador.fotoPendiente || window.capturador.grabando) {
      const glC = renderer.domElement;
      const compC = window.capturador.canvas;
      const ctx = window.capturador.ctx;
      
      if (compC.width !== glC.width) { compC.width = glC.width; compC.height = glC.height; }
      
      // Fondo estilizado (reemplaza la cámara negra que bloquea WebXR por privacidad)
      const grad = ctx.createLinearGradient(0, 0, 0, compC.height);
      grad.addColorStop(0, '#040d12');
      grad.addColorStop(1, '#091c21');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, compC.width, compC.height);
      
      ctx.drawImage(glC, 0, 0);

      if (window.capturador.fotoPendiente) {
        window.capturador.fotoPendiente = false;
        compC.toBlob(b => mostrarPreview(b, 'foto'), 'image/jpeg', 0.85);
      }
    }
  });

  /* ---------------- Lógica del Modal de Guardado ---------------- */
  const modal = document.getElementById("modalPreview");
  const contenedorMedia = document.getElementById("contenedorMedia");
  
  function mostrarPreview(blob, tipo) {
    if (urlActual) try { URL.revokeObjectURL(urlActual); } catch(e){}
    urlActual = URL.createObjectURL(blob);
    contenedorMedia.innerHTML = "";
    
    const kb = blob.size / 1024;
    document.getElementById("pesoArchivo").textContent = kb < 1024 ? `${Math.round(kb)} KB` : `${(kb/1024).toFixed(2)} MB`;
    const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");

    if (tipo === "foto") {
      document.getElementById("tituloPreview").textContent = "Fotografía Digital";
      nombreActual = `atmosfera-ar-${ts}.jpg`;
      objActual = new File([blob], nombreActual, { type: "image/jpeg" });
      const img = document.createElement("img"); img.src = urlActual;
      contenedorMedia.appendChild(img);
    } else {
      document.getElementById("tituloPreview").textContent = "Registro en Video";
      const esMp4 = blob.type && blob.type.includes("mp4");
      nombreActual = `atmosfera-ar-${ts}.${esMp4 ? 'mp4' : 'webm'}`;
      objActual = new File([blob], nombreActual, { type: esMp4 ? "video/mp4" : "video/webm" });
      const vid = document.createElement("video");
      vid.src = urlActual; vid.controls = true; vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
      contenedorMedia.appendChild(vid);
    }

    const btnComp = document.getElementById("btnCompartir");
    if (navigator.canShare && objActual && navigator.canShare({ files: [objActual] })) btnComp.style.display = "flex";
    else btnComp.style.display = "none";
    
    modal.classList.add("activo");
  }

  document.getElementById("btnCerrarPreview").addEventListener("click", () => { modal.classList.remove("activo"); contenedorMedia.innerHTML = ""; });
  document.getElementById("btnCompartir").addEventListener("click", async () => {
    if (!objActual) return;
    try { await navigator.share({ files: [objActual], title: 'Atmósfera AR' }); } catch(e){}
  });
  document.getElementById("btnDescargar").addEventListener("click", () => {
    if (!urlActual) return;
    const a = document.createElement("a"); a.style.display = "none"; a.href = urlActual; a.download = nombreActual;
    document.body.appendChild(a); a.click(); setTimeout(() => document.body.removeChild(a), 200);
  });

  /* ---------------- Inicialización AR ---------------- */
  async function beginAR() {
    if (xrSessionStarting || renderer.xr.isPresenting || activeSession) return;
    if (!navigator.xr || arSupported === false) { showFallback('No compatible con WebXR immersive-ar.'); return; }

    xrSessionStarting = true; startButton.disabled = true; startButton.textContent = 'Iniciando…';
    statusEl.textContent = 'Cargando cámara...';
    try {
      const session = await navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: document.body } });
      await renderer.xr.setSession(session);
    } catch (err) {
      showFallback('No se pudo iniciar la sesión AR. Asegúrate de tener permisos de cámara.');
      startButton.disabled = false; startButton.textContent = 'Intentar de nuevo';
    } finally { xrSessionStarting = false; }
  }

  startButton.addEventListener('click', beginAR);
  resetButton.addEventListener('click', clearEffect);
  closeButton.addEventListener('click', endAR);

  document.body.addEventListener('beforexrselect', (e) => {
    const t = e.target;
    if (t && t.closest && t.closest('button, .actions, .dock-captura')) e.preventDefault();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((ok) => {
      arSupported = ok; statusEl.textContent = ok ? 'Listo. Pulsa “Iniciar realidad aumentada”.' : 'Dispositivo no compatible.';
      if (!ok) startButton.textContent = 'Ver compatibilidad';
    }).catch(() => { statusEl.textContent = 'Pulsa “Iniciar”.'; });
  }
</script>
</body>
</html>
