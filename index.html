  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/blenderingforconservation-maker/recorridovirtual_Leonora/main/';
    const MODELS = {
      corridor: `${REPO_RAW_BASE}models/pasillo_optimizado.glb`,
      rock: `${REPO_RAW_BASE}models/rock.glb`,
      sculpture: `${REPO_RAW_BASE}models/3DModel.glb`
    };

    let scene, camera, renderer, gltfLoader;
    let hallAnchorGroup, walkStageGroup, interiorGroup;
    let clippingPlane, leafParticles, leafMaterial, magicWaveRing, magicWaveLight;

    const controllers = [];

    let isMaterializing = false;
    let materializationT = 0;
    let maxRevealHeight = 10.8;
    let totalCorridorLength = 14.0;
    let lastFrameTime = performance.now();

    const targetWalkOffset = new THREE.Vector3(0, 0, 0);
    const currentWalkOffset = new THREE.Vector3(0, 0, 0);
    let moveButtonDir = 0;
    let buttonCooldown = 0;
    const keysPressed = { forward: false, back: false, left: false, right: false };

    let isPointerDown = false;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let yaw = 0;
    let pitch = 0;

    const _rayDir = new THREE.Vector3();
    const _horizDir = new THREE.Vector3();
    const _localForward = new THREE.Vector3();
    const _localRight = new THREE.Vector3();
    const _invAnchorQuat = new THREE.Quaternion();

    const hudOverlay = document.getElementById('hud-overlay');
    const loadingModal = document.getElementById('loading-modal');
    const launchControls = document.getElementById('launch-controls');
    const btnStartPreview = document.getElementById('btn-start-preview');
    const btnEnterVR = document.getElementById('btn-enter-vr');
    const btnEnterAR = document.getElementById('btn-enter-ar');
    const btnReplayMagic = document.getElementById('btn-replay-magic');
    const btnStepForward = document.getElementById('btn-step-forward');
    const btnStepBack = document.getElementById('btn-step-back');
    const btnResetWalk = document.getElementById('btn-reset-walk');
    const distanceReadout = document.getElementById('distance-readout');
    const toastBanner = document.getElementById('toast-banner');

    function showToast(msg) {
      toastBanner.textContent = msg;
      toastBanner.style.opacity = '1';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toastBanner.style.opacity = '0'; }, 3000);
    }

    init();

    async function init() {
      const container = document.getElementById('webgl-viewport');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040907);
      scene.fog = new THREE.FogExp2(0x040907, 0.016);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 120);
      camera.position.set(0, 1.65, 1.2);
      camera.rotation.order = 'YXZ';
      scene.add(camera);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;

      // Optimización nativa agresiva para Quest 3 Pancake Lenses
      if (typeof renderer.xr.setFoveation === 'function') {
        renderer.xr.setFoveation(1.0);
      }

      renderer.localClippingEnabled = false;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      container.appendChild(renderer.domElement);

      setupLighting();
      setupQuestControllers();

      hallAnchorGroup = new THREE.Group();
      hallAnchorGroup.position.set(0, 0, 0);
      hallAnchorGroup.visible = true;
      scene.add(hallAnchorGroup);

      walkStageGroup = new THREE.Group();
      hallAnchorGroup.add(walkStageGroup);

      interiorGroup = new THREE.Group();
      walkStageGroup.add(interiorGroup);

      setupMagicalLeafMaterialization();
      await loadModelsParallel();

      setupUIAndDesktopControls();

      window.addEventListener('resize', () => {
        if (!renderer.xr.isPresenting) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
      });

      lastFrameTime = performance.now();
      renderer.setAnimationLoop(renderLoop);
    }

    function setupLighting() {
      const ambientLight = new THREE.AmbientLight(0xd9f99d, 0.9);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0xfef9c3, 0x14532d, 1.7);
      hemiLight.position.set(0, 12, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 2.1);
      dirLight.position.set(4, 14, 6);
      scene.add(dirLight);
    }

    function setupQuestControllers() {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -2.5)
      ]);
      const lineMat = new THREE.LineBasicMaterial({
        color: 0xa3e635,
        transparent: true,
        opacity: 0.5
      });

      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        controller.add(new THREE.Line(lineGeo, lineMat));

        // Gatillo o pellizco de manos en Quest 3 activa el efecto
        controller.addEventListener('select', () => {
          triggerMaterializationWave();
        });

        scene.add(controller);
        controllers.push(controller);
      }
    }

    function createRadiantLeafTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(64, 64);

      const aura = ctx.createRadialGradient(0, 0, 4, 0, 0, 60);
      aura.addColorStop(0, 'rgba(255, 255, 220, 0.55)');
      aura.addColorStop(0.5, 'rgba(190, 242, 100, 0.22)');
      aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, 60, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, -48);
      ctx.bezierCurveTo(35, -30, 42, 14, 0, 46);
      ctx.bezierCurveTo(-42, 14, -35, -30, 0, -48);
      ctx.closePath();

      const leafGrad = ctx.createLinearGradient(0, -48, 0, 46);
      leafGrad.addColorStop(0, '#ffffff');
      leafGrad.addColorStop(0.5, '#f7fee7');
      leafGrad.addColorStop(1, '#d9f99d');
      ctx.fillStyle = leafGrad;
      ctx.fill();

      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -42);
      ctx.lineTo(0, 50);
      ctx.stroke();

      ctx.restore();
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    function setupMagicalLeafMaterialization() {
      clippingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1000);

      const leafTexture = createRadiantLeafTexture();
      const palette = [
        new THREE.Color('#16a34a'),
        new THREE.Color('#22c55e'),
        new THREE.Color('#4ade80'),
        new THREE.Color('#84cc16'),
        new THREE.Color('#a3e635'),
        new THREE.Color('#bef264'),
        new THREE.Color('#eab308'),
        new THREE.Color('#facc15'),
        new THREE.Color('#fde047'),
        new THREE.Color('#fef08a')
      ];

      const leafCount = 950;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(leafCount * 3);
      const colors = new Float32Array(leafCount * 3);
      const seeds = new Float32Array(leafCount * 4);

      for (let i = 0; i < leafCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.4 + Math.random() * 2.1;
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = Math.random() * 10.5;
        positions[i * 3 + 2] = -Math.random() * 14.2;

        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        seeds[i * 4] = Math.random() * Math.PI * 2;
        seeds[i * 4 + 1] = 0.55 + Math.random() * 1.05;
        seeds[i * 4 + 2] = (Math.random() - 0.5) * 4.8;
        seeds[i * 4 + 3] = Math.random() < 0.28 ? 1.0 : 0.0;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));

      leafMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uMap: { value: leafTexture },
          uTime: { value: 0 },
          uProgress: { value: 1.0 },
          uMaxHeight: { value: 10.8 },
          uOpacity: { value: 0.65 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute vec3 aColor;
          attribute vec4 aSeed;
          varying vec3 vColor;
          varying float vAngle;
          varying float vAlpha;
          varying float vSparkle;
          varying float vWaveGlow;

          uniform float uTime;
          uniform float uProgress;
          uniform float uMaxHeight;
          uniform float uPixelRatio;

          void main() {
            vColor = aColor;
            float phase = aSeed.x;
            float leafScale = aSeed.y;
            float rotSpeed = aSeed.z;
            vSparkle = aSeed.w;

            vec3 pos = position;
            float bandY = uProgress * uMaxHeight;

            float vortexAngle = uTime * 2.2 + phase + pos.y * 0.65;
            float swirlRadius = 0.28 + 0.18 * sin(uTime * 1.7 + phase);
            pos.x += cos(vortexAngle) * swirlRadius;
            pos.z += sin(vortexAngle) * swirlRadius;

            float activeCeiling = max(0.8, bandY + 1.1);
            pos.y = mod(pos.y + uTime * (1.15 + leafScale * 0.5), activeCeiling);

            float distToWave = abs(pos.y - bandY);
            float waveBoost = smoothstep(2.2, 0.0, distToWave);
            vWaveGlow = waveBoost;

            float twinkle = 0.65 + 0.35 * sin(uTime * 6.5 + phase * 3.0);
            vAngle = phase + uTime * rotSpeed;
            vAlpha = clamp((0.40 + waveBoost * 0.60) * twinkle, 0.0, 1.0);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            float baseSize = (vSparkle > 0.5 ? 48.0 : 68.0) * leafScale * (1.0 + waveBoost * 0.55);
            gl_PointSize = clamp((baseSize * uPixelRatio) / max(-mvPosition.z, 0.45), 6.0, 64.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uOpacity;
          varying vec3 vColor;
          varying float vAngle;
          varying float vAlpha;
          varying float vSparkle;
          varying float vWaveGlow;

          void main() {
            vec2 centered = gl_PointCoord - vec2(0.5);
            float dist = length(centered);

            if (vSparkle > 0.5) {
              float crossStar = max(0.0, 1.0 - abs(centered.x * centered.y) * 90.0);
              float radial = smoothstep(0.5, 0.0, dist);
              float intensity = radial * (0.6 + 0.8 * crossStar);
              if (intensity < 0.05) discard;
              vec3 sparkCol = mix(vColor, vec3(1.0, 0.99, 0.85), 0.55);
              gl_FragColor = vec4(sparkCol * 1.45, intensity * vAlpha * uOpacity);
              return;
            }

            float c = cos(vAngle);
            float s = sin(vAngle);
            vec2 rotatedUV = vec2(
              centered.x * c - centered.y * s,
              centered.x * s + centered.y * c
            ) + vec2(0.5);

            if (rotatedUV.x < 0.0 || rotatedUV.x > 1.0 || rotatedUV.y < 0.0 || rotatedUV.y > 1.0) discard;

            vec4 texColor = texture2D(uMap, rotatedUV);
            if (texColor.a < 0.08) discard;

            vec3 radiantColor = mix(vColor * texColor.rgb, vec3(1.0, 0.98, 0.78), vWaveGlow * 0.48);
            gl_FragColor = vec4(radiantColor * 1.35, texColor.a * vAlpha * uOpacity);
          }
        `
      });

      leafParticles = new THREE.Points(geo, leafMaterial);
      leafParticles.frustumCulled = false;
      leafParticles.visible = true;
      walkStageGroup.add(leafParticles);

      const ringGeo = new THREE.RingGeometry(1.6, 2.35, 48).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xfde047,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      magicWaveRing = new THREE.Mesh(ringGeo, ringMat);
      magicWaveRing.visible = false;
      magicWaveRing.frustumCulled = false;
      walkStageGroup.add(magicWaveRing);

      magicWaveLight = new THREE.PointLight(0xfde047, 0, 14);
      walkStageGroup.add(magicWaveLight);
    }

    function fixCorridorMaterial(mat, maxAnisotropy) {
      if (!mat) return;
      const name = (mat.name || '').toLowerCase();
      const cutoutNames = ['alexandrapalm', 'wild bush', 'plantas', 'plant.leaf', 'rejapared', 'leaves', 'orchid', 'sepal'];
      const isCutout = cutoutNames.some(k => name.includes(k));

      if (isCutout) {
        mat.transparent = false;
        mat.alphaTest = 0.42;
        mat.depthWrite = true;
        mat.side = THREE.DoubleSide;
      } else {
        mat.transparent = false;
        mat.alphaTest = 0;
        mat.depthWrite = true;
        mat.side = THREE.FrontSide;
      }

      ['map', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((mapKey) => {
        if (mat[mapKey]) mat[mapKey].anisotropy = maxAnisotropy;
      });
    }

    async function loadModelsParallel() {
      await MeshoptDecoder.ready;

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      const progressMap = { corridor: 0, rock: 0, sculpture: 0 };
      const updateUIProgress = () => {
        const total = Math.min(99, Math.round((progressMap.corridor * 0.65) + (progressMap.rock * 0.15) + (progressMap.sculpture * 0.20)));
        document.getElementById('progress-bar').style.width = total + '%';
        document.getElementById('progress-text').textContent = total + '%';
      };

      const loadWithProgress = (url, key) =>
        new Promise((resolve, reject) => {
          gltfLoader.load(
            url,
            (gltf) => { progressMap[key] = 100; updateUIProgress(); resolve(gltf); },
            (xhr) => {
              if (xhr.total > 0) {
                progressMap[key] = (xhr.loaded / xhr.total) * 100;
                updateUIProgress();
              }
            },
            reject
          );
        });

      try {
        const [gltfCorridor, gltfRock, gltfSculpture] = await Promise.all([
          loadWithProgress(MODELS.corridor, 'corridor'),
          loadWithProgress(MODELS.rock, 'rock'),
          loadWithProgress(MODELS.sculpture, 'sculpture')
        ]);

        const corridor = gltfCorridor.scene;
        corridor.scale.setScalar(5.2);
        corridor.updateMatrixWorld(true);

        const pisoSlabBox = new THREE.Box3();
        const wallBox = new THREE.Box3();
        let hasPisoSlab = false;
        let hasWallMesh = false;

        corridor.traverse((node) => {
          if (node.isMesh) {
            const mName = (node.name || '').toLowerCase();
            const matName = (node.material?.name || '').toLowerCase();
            if (mName.includes('pisoceart') || matName.includes('pisoceart')) {
              pisoSlabBox.expandByObject(node);
              hasPisoSlab = true;
            }
            if (mName.includes('muro') || matName.includes('murocear')) {
              wallBox.expandByObject(node);
              hasWallMesh = true;
            }
          }
        });

        const fullCorrBox = new THREE.Box3().setFromObject(corridor);
        const refCenter = hasWallMesh ? wallBox.getCenter(new THREE.Vector3()) : fullCorrBox.getCenter(new THREE.Vector3());
        const exactFloorY = hasPisoSlab ? pisoSlabBox.min.y : fullCorrBox.min.y;
        const entranceZ = hasWallMesh ? wallBox.max.z : fullCorrBox.max.z;
        const backZ = hasWallMesh ? wallBox.min.z : fullCorrBox.min.z;

        corridor.position.set(-refCenter.x, -exactFloorY, -entranceZ);
        corridor.updateMatrixWorld(true);

        totalCorridorLength = Math.abs(entranceZ - backZ);
        const sculptureZ = -(totalCorridorLength * 0.46);

        const rock = gltfRock.scene;
        rock.scale.setScalar(3.60);
        rock.updateMatrixWorld(true);
        const rockBox = new THREE.Box3().setFromObject(rock);
        const rockCenter = rockBox.getCenter(new THREE.Vector3());
        rock.position.set(-rockCenter.x, -rockBox.min.y, sculptureZ - rockCenter.z);
        rock.updateMatrixWorld(true);
        const rockHeight = rockBox.max.y - rockBox.min.y;

        const sculpture = gltfSculpture.scene;
        sculpture.scale.setScalar(5.50);
        sculpture.updateMatrixWorld(true);
        const sculpBox = new THREE.Box3().setFromObject(sculpture);
        const sculpCenter = sculpBox.getCenter(new THREE.Vector3());
        sculpture.position.set(
          -sculpCenter.x,
          rockHeight - sculpBox.min.y - 0.10,
          sculptureZ - sculpCenter.z
        );
        sculpture.updateMatrixWorld(true);

        const sculptureLight = new THREE.PointLight(0xfef08a, 2.4, 14);
        sculptureLight.position.set(0, rockHeight + 2.5, sculptureZ + 1.5);
        interiorGroup.add(corridor, rock, sculpture, sculptureLight);

        const combinedBox = new THREE.Box3().setFromObject(interiorGroup);
        maxRevealHeight = Math.max(10.5, combinedBox.max.y + 0.6);
        leafMaterial.uniforms.uMaxHeight.value = maxRevealHeight;
        magicWaveRing.position.set(0, 0.1, sculptureZ * 0.65);

        const maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());
        const processedMaterials = new Set();

        interiorGroup.traverse((node) => {
          node.frustumCulled = false;
          if (node.isMesh && node.material) {
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((mat) => {
              if (!processedMaterials.has(mat)) {
                fixCorridorMaterial(mat, maxAniso);
                mat.clippingPlanes = [clippingPlane];
                mat.needsUpdate = true;
                processedMaterials.add(mat);
              }
            });
          }
        });

        dracoLoader.dispose();

        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('progress-text').textContent = '100%';
        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('loading-message').textContent = '¡Barca y Escultura listas!';
        launchControls.classList.remove('hidden');
        launchControls.classList.add('flex');

        triggerMaterializationWave();
      } catch (e) {
        console.error('Error cargando modelos:', e);
        document.getElementById('loading-message').textContent = 'Error al cargar modelos GLB. Verifica tu conexión.';
      }
    }

    function triggerMaterializationWave() {
      renderer.localClippingEnabled = true;
      isMaterializing = true;
      materializationT = 0;
      clippingPlane.constant = hallAnchorGroup.position.y + 0.05;

      leafParticles.visible = true;
      leafMaterial.uniforms.uProgress.value = 0;
      leafMaterial.uniforms.uOpacity.value = 1.0;

      magicWaveRing.visible = true;
      magicWaveRing.material.opacity = 0.85;
      magicWaveLight.intensity = 4.5;

      showToast('✨ Materializando La Barca de las Grullas...');
    }

    function setupUIAndDesktopControls() {
      btnStartPreview.addEventListener('click', () => {
        loadingModal.classList.add('hidden');
        hudOverlay.classList.add('active');
        triggerMaterializationWave();
      });

      btnReplayMagic.addEventListener('click', triggerMaterializationWave);
      btnEnterVR.addEventListener('click', () => startXRSession('immersive-vr'));
      btnEnterAR.addEventListener('click', () => startXRSession('immersive-ar'));

      const bindWalkButton = (btn, dir) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          btn.classList.add('pressing');
          moveButtonDir = dir;
          advanceAlongViewDirection(dir * 1.6, 0);
        });
        const stopPress = () => {
          btn.classList.remove('pressing');
          if (moveButtonDir === dir) moveButtonDir = 0;
        };
        btn.addEventListener('pointerup', stopPress);
        btn.addEventListener('pointerleave', stopPress);
        btn.addEventListener('pointercancel', stopPress);
      };

      bindWalkButton(btnStepForward, 1);
      bindWalkButton(btnStepBack, -1);

      btnResetWalk.addEventListener('click', () => {
        targetWalkOffset.set(0, 0, 0);
        showToast('Regresando a la entrada');
      });

      const viewport = document.getElementById('webgl-viewport');
      viewport.addEventListener('pointerdown', (e) => {
        isPointerDown = true;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown || renderer.xr.isPresenting) return;
        const dx = e.clientX - prevPointerX;
        const dy = e.clientY - prevPointerY;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;

        yaw -= dx * 0.0045;
        pitch = THREE.MathUtils.clamp(pitch - dy * 0.0045, -1.1, 1.1);
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
      });

      window.addEventListener('pointerup', () => { isPointerDown = false; });

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keysPressed.forward = true;
        if (k === 's' || e.key === 'ArrowDown') keysPressed.back = true;
        if (k === 'a' || e.key === 'ArrowLeft') keysPressed.left = true;
        if (k === 'd' || e.key === 'ArrowRight') keysPressed.right = true;
      });

      window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') keysPressed.forward = false;
        if (k === 's' || e.key === 'ArrowDown') keysPressed.back = false;
        if (k === 'a' || e.key === 'ArrowLeft') keysPressed.left = false;
        if (k === 'd' || e.key === 'ArrowRight') keysPressed.right = false;
      });
    }

    function advanceAlongViewDirection(forwardMeters, strafeMeters = 0) {
      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      activeCam.getWorldDirection(_rayDir);
      _horizDir.set(_rayDir.x, 0, _rayDir.z);
      if (_horizDir.lengthSq() < 0.001) {
        _horizDir.set(0, 0, -1);
      } else {
        _horizDir.normalize();
      }

      _invAnchorQuat.copy(hallAnchorGroup.quaternion).invert();
      _localForward.copy(_horizDir).applyQuaternion(_invAnchorQuat);
      _localForward.y = 0;
      _localForward.normalize();

      _localRight.set(-_localForward.z, 0, _localForward.x);

      targetWalkOffset.x -= (_localForward.x * forwardMeters + _localRight.x * strafeMeters);
      targetWalkOffset.z -= (_localForward.z * forwardMeters + _localRight.z * strafeMeters);

      targetWalkOffset.x = THREE.MathUtils.clamp(targetWalkOffset.x, -1.45, 1.45);
      targetWalkOffset.z = THREE.MathUtils.clamp(targetWalkOffset.z, -10.0, totalCorridorLength + 25.0);
    }

    function processQuestThumbsticks(dt) {
      if (!renderer.xr.isPresenting) return;
      const session = renderer.xr.getSession();
      if (!session || !session.inputSources) return;

      if (buttonCooldown > 0) buttonCooldown -= dt;

      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const gp = source.gamepad;
        const axes = gp.axes;

        const stickX = axes.length >= 4 ? axes[2] : (axes[0] || 0);
        const stickY = axes.length >= 4 ? axes[3] : (axes[1] || 0);

        if (Math.abs(stickY) > 0.15 || Math.abs(stickX) > 0.15) {
          if (source.handedness === 'left' || session.inputSources.length === 1) {
            advanceAlongViewDirection(-stickY * 3.8 * dt, stickX * 2.5 * dt);
          } else if (source.handedness === 'right') {
            advanceAlongViewDirection(-stickY * 3.8 * dt, 0);
            if (Math.abs(stickX) > 0.25) {
              hallAnchorGroup.rotation.y -= stickX * 1.4 * dt;
            }
          }
        }

        if (gp.buttons[4]?.pressed && buttonCooldown <= 0) {
          buttonCooldown = 0.45;
          targetWalkOffset.set(0, 0, 0);
        }

        if (gp.buttons[5]?.pressed && buttonCooldown <= 0) {
          buttonCooldown = 0.45;
          triggerMaterializationWave();
        }
      }
    }

    async function startXRSession(requestedMode = 'immersive-vr') {
      loadingModal.classList.add('hidden');
      hudOverlay.classList.add('active');

      if (!navigator.xr) {
        showToast('WebXR no detectado · Modo 3D activo');
        return;
      }

      try {
        let mode = requestedMode;
        let supported = await navigator.xr.isSessionSupported(mode);

        if (!supported) {
          const fallback = mode === 'immersive-vr' ? 'immersive-ar' : 'immersive-vr';
          if (await navigator.xr.isSessionSupported(fallback)) {
            mode = fallback;
            supported = true;
          }
        }

        if (!supported) {
          showToast('Visor XR no disponible · Explorando en pantalla');
          return;
        }

        const session = await navigator.xr.requestSession(mode, {
          optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay'],
          domOverlay: { root: hudOverlay }
        });

        try {
          renderer.xr.setReferenceSpaceType('local-floor');
        } catch (_) {
          renderer.xr.setReferenceSpaceType('local');
        }

        await renderer.xr.setSession(session);

        if (mode === 'immersive-ar' || session.environmentBlendMode === 'alpha-blend') {
          scene.background = null;
          scene.fog = null;
        } else {
          scene.background = new THREE.Color(0x040907);
          scene.fog = new THREE.FogExp2(0x040907, 0.016);
        }

        hallAnchorGroup.position.set(0, 0, 0);
        hallAnchorGroup.visible = true;
        targetWalkOffset.set(0, 0, 0);
        currentWalkOffset.set(0, 0, 0);

        triggerMaterializationWave();

        session.addEventListener('end', () => {
          scene.background = new THREE.Color(0x040907);
          scene.fog = new THREE.FogExp2(0x040907, 0.016);
        });
      } catch (err) {
        console.warn('Error al iniciar XR:', err);
        showToast('Modo 3D activo en navegador');
      }
    }

    function renderLoop(timestamp) {
      const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000 || 0.016);
      lastFrameTime = timestamp;
      const timeSec = timestamp * 0.001;

      processQuestThumbsticks(dt);

      if (moveButtonDir !== 0) {
        advanceAlongViewDirection(moveButtonDir * 4.4 * dt, 0);
      }
      if (keysPressed.forward) advanceAlongViewDirection(4.2 * dt, 0);
      if (keysPressed.back) advanceAlongViewDirection(-4.2 * dt, 0);
      if (keysPressed.left) advanceAlongViewDirection(0, -3.2 * dt);
      if (keysPressed.right) advanceAlongViewDirection(0, 3.2 * dt);

      currentWalkOffset.lerp(targetWalkOffset, Math.min(1, dt * 8.5));
      walkStageGroup.position.set(currentWalkOffset.x, 0, currentWalkOffset.z);

      distanceReadout.textContent = `${currentWalkOffset.z.toFixed(1)} m`;

      if (isMaterializing) {
        materializationT = Math.min(1, materializationT + dt * 0.28);
        const eased = 1 - Math.pow(1 - materializationT, 3);
        const revealH = eased * maxRevealHeight;

        clippingPlane.constant = hallAnchorGroup.position.y + revealH;

        leafMaterial.uniforms.uTime.value = timeSec;
        leafMaterial.uniforms.uProgress.value = eased;
        leafMaterial.uniforms.uOpacity.value = 1.0;

        magicWaveRing.position.y = Math.min(revealH, 6.0);
        magicWaveRing.rotation.z = timeSec * 1.8;
        magicWaveRing.scale.setScalar(1.0 + Math.sin(timeSec * 5.0) * 0.12);
        magicWaveRing.material.opacity = (1.0 - materializationT) * 0.85;

        magicWaveLight.position.set(0, Math.min(revealH + 0.5, 6.5), -(totalCorridorLength * 0.42));
        magicWaveLight.intensity = (1.0 - materializationT * 0.7) * 5.0;

        if (materializationT >= 1) {
          isMaterializing = false;
          renderer.localClippingEnabled = false;
          clippingPlane.constant = 1000;
          magicWaveRing.visible = false;
          magicWaveLight.intensity = 0;
        }
      } else if (leafParticles && leafParticles.visible) {
        leafMaterial.uniforms.uTime.value = timeSec * 0.65;
        leafMaterial.uniforms.uOpacity.value = Math.max(0.45, leafMaterial.uniforms.uOpacity.value - dt * 0.25);
      }

      renderer.render(scene, camera);
    }
  </script>
