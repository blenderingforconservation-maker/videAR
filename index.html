<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>La Barca de las Grullas — AR · VR · 3D</title>
  <link rel="icon" type="image/png" href="./image_c713d6.png" />

  <style>
    :root {
      --bg-deep: #02060e;
      --glass-bg: rgba(5, 13, 25, 0.56);
      --blue-core: #2eb4ff;
      --blue-bright: #8ee0ff;
      --gold: #f0d08a;
      --text-main: #eef6ff;
      --text-soft: rgba(196, 224, 248, 0.68);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =====================================================================
       PORTADA GRÁFICA: WIREFRAME AZUL 2D DESVANECIDO + 3 MEDALLONES FLOTANTES
       ===================================================================== */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(26px, 5vh, 52px) 20px clamp(30px, 6vh, 58px);
      /* Viñeta translúcida: deja ver el wireframe azul 2D en el centro y lo desvanece en los bordes */
      background:
        radial-gradient(ellipse 68% 54% at 50% 48%,
          rgba(6, 20, 42, 0.08) 0%,
          rgba(4, 12, 26, 0.44) 52%,
          rgba(2, 6, 14, 0.92) 100%);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.85s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Encabezado minimalista */
    .intro-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      pointer-events: none;
    }

    .museum-mark {
      font-size: 10px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--blue-bright);
      opacity: 0.78;
    }

    .hero-title {
      font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
      font-size: clamp(26px, 4.6vw, 48px);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #f4f8ff;
      text-shadow:
        0 0 28px rgba(46, 180, 255, 0.38),
        0 2px 14px rgba(0, 0, 0, 0.75);
    }

    .astral-divider {
      width: 140px;
      height: 1px;
      position: relative;
      background: linear-gradient(90deg, transparent, rgba(110, 212, 255, 0.7), transparent);
      margin-top: 2px;
    }

    .astral-divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    /* Hilo de carga ultralimpio mientras llega barcagrullas.glb */
    .load-track {
      width: 140px;
      height: 2px;
      border-radius: 99px;
      background: rgba(110, 212, 255, 0.14);
      overflow: hidden;
      margin-top: 6px;
      transition: opacity 0.5s ease;
    }

    .load-track.done {
      opacity: 0;
    }

    .load-fill {
      width: 18%;
      height: 100%;
      background: linear-gradient(90deg, var(--blue-core), var(--blue-bright));
      box-shadow: 0 0 10px var(--blue-core);
      transition: width 0.25s ease;
    }

    /* Contenedor de los 3 botones flotantes modernos y místicos */
    .orbs-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4.5vw, 44px);
      padding-bottom: 4px;
    }

    .mystic-orb {
      position: relative;
      width: clamp(92px, 13vw, 122px);
      height: clamp(92px, 13vw, 122px);
      border-radius: 50%;
      border: 1px solid rgba(114, 212, 255, 0.34);
      background:
        radial-gradient(circle at 32% 24%, rgba(56, 188, 255, 0.20) 0%, rgba(5, 14, 30, 0.72) 64%, rgba(3, 8, 18, 0.88) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      outline: none;
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.55),
        0 0 26px rgba(46, 180, 255, 0.14),
        inset 0 0 18px rgba(46, 180, 255, 0.12);
      animation: levitate 5.4s ease-in-out infinite;
      transition:
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        opacity 0.35s ease,
        filter 0.35s ease;
    }

    /* Flotación asíncrona sutil */
    .mystic-orb:nth-child(1) { animation-delay: 0s; }
    .mystic-orb:nth-child(2) { animation-delay: -1.8s; }
    .mystic-orb:nth-child(3) { animation-delay: -3.5s; }

    @keyframes levitate {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }

    /* Aro astral exterior giratorio */
    .mystic-orb::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed rgba(124, 216, 255, 0.32);
      pointer-events: none;
      animation: orbitRotate 22s linear infinite;
      transition: border-color 0.35s ease, transform 0.35s ease;
    }

    /* Halo interior dorado/azul sutil */
    .mystic-orb::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid rgba(240, 208, 138, 0.18);
      pointer-events: none;
      transition: border-color 0.35s ease;
    }

    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Destello en hover / foco */
    .mystic-orb:not(:disabled):hover,
    .mystic-orb:not(:disabled):focus-visible {
      border-color: rgba(142, 224, 255, 0.92);
      box-shadow:
        0 18px 42px rgba(4, 48, 102, 0.52),
        0 0 38px rgba(46, 180, 255, 0.45),
        inset 0 0 26px rgba(96, 208, 255, 0.28);
    }

    .mystic-orb:not(:disabled):hover::before {
      border-color: rgba(240, 208, 138, 0.62);
      animation-duration: 9s;
    }

    .mystic-orb:not(:disabled):hover::after {
      border-color: rgba(240, 208, 138, 0.55);
    }

    .mystic-orb:not(:disabled):active {
      filter: brightness(1.22);
    }

    .mystic-orb:disabled {
      opacity: 0.34;
      cursor: not-allowed;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .mystic-orb:disabled::before {
      animation-play-state: paused;
      border-color: rgba(160, 190, 220, 0.16);
    }

    .orb-icon {
      color: var(--blue-bright);
      filter: drop-shadow(0 0 8px rgba(46, 180, 255, 0.55));
      transition: color 0.3s ease, transform 0.3s ease, filter 0.3s ease;
    }

    .mystic-orb:not(:disabled):hover .orb-icon {
      color: #ffffff;
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px rgba(142, 224, 255, 0.9));
    }

    .orb-label {
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f4f7fb;
      padding-left: 0.22em; /* Compensa el letter-spacing para centrado óptico */
    }

    .orb-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      opacity: 0.9;
    }

    .mystic-orb:disabled .orb-dot {
      background: rgba(190, 210, 230, 0.35);
      box-shadow: none;
    }

    /* =====================================================================
       HUD MINIMALISTA DENTRO DE LA EXPERIENCIA (Compatible AR dom-overlay)
       ===================================================================== */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 15;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.65s ease, visibility 0.65s ease;
    }

    #hud.visible {
      opacity: 1;
      visibility: visible;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .status-pill {
      pointer-events: auto;
      background: var(--glass-bg);
      border: 1px solid rgba(114, 212, 255, 0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      flex-shrink: 0;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .status-dot.blue {
      background: var(--blue-core);
      box-shadow: 0 0 12px var(--blue-core);
      animation: bluePulse 1.1s ease-in-out infinite;
    }

    @keyframes bluePulse {
      0%, 100% { transform: scale(0.85); opacity: 0.55; }
      50%      { transform: scale(1.28); opacity: 1.0; }
    }

    .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #hint {
      background: var(--glass-bg);
      border: 1px solid rgba(114, 212, 255, 0.24);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: var(--text-soft);
      text-align: center;
      max-width: 90vw;
    }

    .xr-btn {
      background: var(--glass-bg);
      border: 1px solid rgba(114, 212, 255, 0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .xr-btn:hover {
      background: rgba(46, 180, 255, 0.18);
      border-color: var(--blue-bright);
    }

    .xr-btn:active { transform: scale(0.96); }
    .xr-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- =====================================================================
       PORTADA GRÁFICA MINIMALISTA (SIN TEXTOS ABRUMADORES)
       ===================================================================== -->
  <section id="intro-screen" aria-label="Inicio — La Barca de las Grullas">
    <header class="intro-header">
      <span class="museum-mark">Museo Leonora Carrington</span>
      <h1 class="hero-title">La Barca de las Grullas</h1>
      <div class="astral-divider" aria-hidden="true"></div>
      <div id="load-track" class="load-track" aria-hidden="true">
        <div id="load-fill" class="load-fill"></div>
      </div>
    </header>

    <nav class="orbs-dock" aria-label="Modos de experiencia">
      <!-- Botón flotante AR -->
      <button id="orb-ar" class="mystic-orb" disabled aria-label="Entrar en Realidad Aumentada" title="Realidad Aumentada">
        <svg class="orb-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/>
          <path d="M12 7.2 16.5 9.8v4.8L12 17.2 7.5 14.6V9.8L12 7.2Z"/>
          <path d="M12 12.2v5M12 12.2l4.5-2.4M12 12.2 7.5 9.8"/>
        </svg>
        <span class="orb-label">AR</span>
        <span class="orb-dot" aria-hidden="true"></span>
      </button>

      <!-- Botón flotante VR -->
      <button id="orb-vr" class="mystic-orb" disabled aria-label="Entrar en Realidad Virtual" title="Realidad Virtual">
        <svg class="orb-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="7" width="19" height="10" rx="3.4"/>
          <path d="M9.5 17 11 14.4a1.2 1.2 0 0 1 2 0L14.5 17"/>
          <circle cx="8" cy="12" r="1.4"/>
          <circle cx="16" cy="12" r="1.4"/>
        </svg>
        <span class="orb-label">VR</span>
        <span class="orb-dot" aria-hidden="true"></span>
      </button>

      <!-- Botón flotante 3D Web -->
      <button id="orb-web" class="mystic-orb" disabled aria-label="Entrar en 3D Web" title="3D Web">
        <svg class="orb-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.8"/>
          <ellipse cx="12" cy="12" rx="4" ry="8.8"/>
          <path d="M3.5 9.5h17M3.5 14.5h17"/>
        </svg>
        <span class="orb-label">3D Web</span>
        <span class="orb-dot" aria-hidden="true"></span>
      </button>
    </nav>
  </section>

  <!-- =====================================================================
       HUD EN EXPERIENCIA
       ===================================================================== -->
  <div id="hud">
    <div class="hud-top">
      <div class="status-pill">
        <span id="status-dot" class="status-dot"></span>
        <span id="state-label">Materializando...</span>
      </div>
      <div class="top-actions">
        <button id="btn-modes" class="xr-btn">Inicio</button>
        <button id="btn-audio" class="xr-btn active">Audio: ON</button>
        <button id="btn-fullscreen" class="xr-btn">Pantalla completa</button>
      </div>
    </div>

    <div class="hud-bottom">
      <div id="hint">Toca una barca para abordar</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // =========================================================================
    // BLOQUE 1: RUTAS EXACTAS DEL REPO videAR + CONFIGURACIÓN CALIBRADA
    // =========================================================================
    const REPO_RAW = 'https://raw.githubusercontent.com/blenderingforconservation-maker/videAR/main';

    const ASSETS = {
      boatPrimary:   './models/barcagrullas.glb',
      boatFallback:  `${REPO_RAW}/models/barcagrullas.glb`,
      audioPrimary:  './bosque_noche.mp3',
      audioFallback: `${REPO_RAW}/bosque_noche.mp3`
    };

    const CONFIG = {
      targetBoatLength: 3.8,
      waterlineSink: 0.14,
      defaultEyeHeight: 1.65,
      seatOffset: new THREE.Vector3(0, 0.34, -0.1),

      originPosition: new THREE.Vector3(0, 0, 0),

      // 7 barcas estáticas mirando de frente hacia el portal
      boatsLayout: [
        { pos: new THREE.Vector3(-8.6, 0, -8.0), yaw:  0.22 },
        { pos: new THREE.Vector3(-5.6, 0, -6.0), yaw:  0.14 },
        { pos: new THREE.Vector3(-2.7, 0, -4.8), yaw:  0.07 },
        { pos: new THREE.Vector3( 0.0, 0, -4.3), yaw:  0.00 },
        { pos: new THREE.Vector3( 2.8, 0, -4.9), yaw: -0.07 },
        { pos: new THREE.Vector3( 5.7, 0, -6.2), yaw: -0.15 },
        { pos: new THREE.Vector3( 8.7, 0, -8.2), yaw: -0.22 }
      ],

      // Gran portal redondo lejano (78 m) para una travesía real de 20 segundos
      portalPosition: new THREE.Vector3(0, 6.5, -78),
      portalRadius: 6.2,

      materializeDuration: 3.8,
      boardingDuration: 1.15,
      voyageDuration: 20.0,
      proximityBoardDist: 1.65,
      flashPeakDuration: 0.55
    };

    // =========================================================================
    // BLOQUE 2: RENDERIZADOR, ESCENA E ILUMINACIÓN
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const INTRO_BG = new THREE.Color(0x020712);
    const NIGHT_BG = new THREE.Color(0x040a13);
    const NIGHT_FOG = new THREE.FogExp2(0x050e1a, 0.0085);
    scene.background = INTRO_BG;
    scene.fog = null;

    const playerRig = new THREE.Group();
    playerRig.position.copy(CONFIG.originPosition);
    scene.add(playerRig);

    const camera = new THREE.PerspectiveCamera(
      62,
      window.innerWidth / window.innerHeight,
      0.1,
      260
    );
    camera.position.set(0, CONFIG.defaultEyeHeight, 0);
    playerRig.add(camera);

    // Malla de destello 3D pegada a la cámara (idéntica en 3D Web, AR y VR)
    const portalFlashMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0xfff4d8),
      transparent: true,
      opacity: 0.0,
      depthTest: false,
      depthWrite: false
    });
    const portalFlashMesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), portalFlashMat);
    portalFlashMesh.position.set(0, 0, -0.32);
    portalFlashMesh.renderOrder = 999;
    portalFlashMesh.visible = false;
    camera.add(portalFlashMesh);

    const hemiLight = new THREE.HemisphereLight(0x8bb6dd, 0x1c2e42, 1.38);
    scene.add(hemiLight);

    const moonLight = new THREE.DirectionalLight(0xd9ecff, 1.48);
    moonLight.position.set(16, 28, 14);
    scene.add(moonLight);

    const fillLight = new THREE.DirectionalLight(0x86aec8, 0.58);
    fillLight.position.set(-16, 12, 18);
    scene.add(fillLight);

    const materializeBlueLight = new THREE.PointLight(0x3cb8ff, 0.0, 42, 1.5);
    materializeBlueLight.position.set(0, 3.2, -6.0);
    scene.add(materializeBlueLight);

    const portalGlowLight = new THREE.PointLight(0xffd27d, 0.0, 115, 1.25);
    portalGlowLight.position.copy(CONFIG.portalPosition).add(new THREE.Vector3(0, 0.5, 5.0));
    scene.add(portalGlowLight);

    // =========================================================================
    // BLOQUE 2B: FONDO GRÁFICO WIREFRAME AZUL 2D DE barcagrullas.glb (SOLO EN INTRO)
    // =========================================================================
    const introStage = new THREE.Group();
    scene.add(introStage);

    let introWireframePivot = null;
    let introEdgeMat = null;
    let introMeshWireMat = null;
    let introFadeIn = 0.0;
    let introParallaxX = 0;
    let introParallaxY = 0;

    // Aura radial azul suave detrás del wireframe 2D
    const introAuraUniforms = { uTime: { value: 0 }, uFade: { value: 0 } };
    const introAuraPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(9.2, 6.2),
      new THREE.ShaderMaterial({
        uniforms: introAuraUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform float uFade;
          varying vec2 vUv;
          void main() {
            float d = length(vUv * vec2(0.88, 1.15));
            float pulse = 0.84 + 0.16 * sin(uTime * 1.9);
            float halo = exp(-d * d * 2.8) * 0.34 * pulse * uFade;
            // Sutil línea de horizonte azul tenue estilo plano gráfico
            float horizon = exp(-abs(vUv.y + 0.26) * 48.0) * smoothstep(1.0, 0.15, abs(vUv.x)) * 0.14 * uFade;
            vec3 col = vec3(0.14, 0.62, 1.0) * halo + vec3(0.35, 0.82, 1.0) * horizon;
            gl_FragColor = vec4(col, halo + horizon);
          }
        `
      })
    );
    introAuraPlane.position.z = -1.2;
    introStage.add(introAuraPlane);

    // Polvo azul brillante levitando suavemente en la portada
    const introDustUniforms = {
      uTime:  { value: 0 },
      uFade:  { value: 1 },
      uRatio: { value: Math.min(window.devicePixelRatio, 2) }
    };
    {
      const count = 95;
      const pos = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * 8.5;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 4.8;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 2.6;
        phases[i] = Math.random() * Math.PI * 2;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: introDustUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          attribute float aPhase;
          uniform float uTime;
          uniform float uRatio;
          varying float vPulse;
          void main() {
            vec3 p = position;
            p.y += sin(uTime * 0.65 + aPhase) * 0.24;
            p.x += cos(uTime * 0.40 + aPhase * 1.3) * 0.22;
            vPulse = 0.25 + 0.75 * (0.5 + 0.5 * sin(uTime * 2.4 + aPhase * 2.1));
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp((22.0 * uRatio / max(-mv.z, 1.0)) * (0.65 + 0.55 * vPulse), 1.5, 22.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uFade;
          varying float vPulse;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float glow = exp(-d * 6.5) * vPulse * 0.78 * uFade;
            gl_FragColor = vec4(0.28, 0.80, 1.0, glow);
          }
        `
      });
      introStage.add(new THREE.Points(geo, mat));
    }

    function buildIntroWireframe(normalizedWrapper) {
      if (introWireframePivot) {
        introStage.remove(introWireframePivot);
        introWireframePivot = null;
      }

      introWireframePivot = new THREE.Group();
      normalizedWrapper.updateMatrixWorld(true);

      // Material principal: aristas luminosas azul cian estilo plano gráfico 2D
      introEdgeMat = new THREE.LineBasicMaterial({
        color: 0x3ec6ff,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      // Material secundario: malla wireframe muy tenue para dar volumen holográfico sutil
      introMeshWireMat = new THREE.MeshBasicMaterial({
        color: 0x1578ff,
        wireframe: true,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const invRoot = new THREE.Matrix4().copy(normalizedWrapper.matrixWorld).invert();
      const relMatrix = new THREE.Matrix4();

      normalizedWrapper.traverse((obj) => {
        if (obj.isMesh && obj.geometry) {
          relMatrix.multiplyMatrices(invRoot, obj.matrixWorld);

          // 1. Aristas escultóricas limpias (threshold 16° elimina ruido de triángulos planos)
          const edgesGeo = new THREE.EdgesGeometry(obj.geometry, 16);
          const lineSegs = new THREE.LineSegments(edgesGeo, introEdgeMat);
          lineSegs.applyMatrix4(relMatrix);
          introWireframePivot.add(lineSegs);

          // 2. Malla wireframe etérea complementaria
          const wireMesh = new THREE.Mesh(obj.geometry, introMeshWireMat);
          wireMesh.applyMatrix4(relMatrix);
          introWireframePivot.add(wireMesh);
        }
      });

      // Centrar verticalmente la silueta dentro del encuadre gráfico 2D
      const wfBox = new THREE.Box3().setFromObject(introWireframePivot);
      const wfCenter = wfBox.getCenter(new THREE.Vector3());
      introWireframePivot.children.forEach((child) => {
        child.position.sub(wfCenter);
      });

      // Perfil lateral limpio en 2D (eslora horizontal de izquierda a derecha)
      introWireframePivot.rotation.set(0.04, Math.PI / 2 - 0.10, 0);
      introStage.add(introWireframePivot);
      introFadeIn = 0.0;
      positionIntroStage();
    }

    function positionIntroStage() {
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const aspect = window.innerWidth / window.innerHeight;
      const hFovRad = 2 * Math.atan(Math.tan(vFovRad / 2) * aspect);

      // En móvil portrait ocupa ~86% del ancho; en escritorio ~56% para lucir elegante y respirado
      const targetWidthFraction = aspect < 0.85 ? 0.88 : (aspect < 1.3 ? 0.72 : 0.56);
      const boatSpan = CONFIG.targetBoatLength * 1.08;
      const distForWidth = (boatSpan / targetWidthFraction) / (2 * Math.tan(hFovRad / 2));
      const dist = THREE.MathUtils.clamp(distForWidth, 4.4, 8.8);

      introStage.position.set(0, CONFIG.defaultEyeHeight + 0.06, -dist);
    }
    positionIntroStage();

    // Bóveda estrellada del escenario nocturno (oculta en INTRO y en WebAR)
    const skyGroup = new THREE.Group();
    skyGroup.visible = false;
    scene.add(skyGroup);
    let starMat = null;
    {
      const starCount = 420;
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(0.12 + Math.random() * 0.88);
        const r = 135 + Math.random() * 30;
        starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = r * Math.cos(phi);
        starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      }
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starMat = new THREE.PointsMaterial({
        color: 0xe4f0ff,
        size: 0.45,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
        fog: false
      });
      skyGroup.add(new THREE.Points(starGeo, starMat));
    }

    // =========================================================================
    // BLOQUE 3: SHADERS GLSL (AGUA DENSA DINÁMICA + PORTAL + PARTÍCULAS AZULES)
    // =========================================================================
    const WATER_SIZE = 180;
    const WATER_SEGMENTS = 108;
    const WATER_STEP = WATER_SIZE / WATER_SEGMENTS;

    const waterUniforms = {
      uTime:         { value: 0 },
      uWaterReveal:  { value: 0 },
      uBoatPos:      { value: new THREE.Vector3(0, 0, -999) },
      uBoatDir:      { value: new THREE.Vector2(0, -1) },
      uBoatSpeed:    { value: 0 },
      uMotionFactor: { value: 0 },
      uFlowOffset:   { value: new THREE.Vector2(0, 0) },
      uPortalPos:    { value: CONFIG.portalPosition.clone() },
      uIsAR:         { value: 0 }
    };

    const waterMaterial = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      transparent: true,
      depthWrite: true,
      vertexShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uBoatPos;
        uniform vec2 uBoatDir;
        uniform float uMotionFactor;
        uniform vec2 uFlowOffset;

        varying vec3 vWorldPos;
        varying float vElevation;

        float baseWave(vec2 p, float t, float motion) {
          vec2 pf = p - uFlowOffset * 0.55;
          float amp = 1.0 + motion * 0.85;
          float w1 = sin(pf.x * 0.34 + t * 0.90) * 0.055;
          float w2 = cos(pf.y * 0.42 - t * 0.85) * 0.050;
          float w3 = sin((pf.x * 0.25 + pf.y * 0.34) + t * 1.35) * 0.036;
          float surge = sin(pf.y * 0.72 + t * 2.4) * cos(pf.x * 0.48 - t * 1.4) * 0.055 * motion;
          return (w1 + w2 + w3) * amp + surge;
        }

        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vec2 p = worldPos.xz;

          float h = baseWave(p, uTime, uMotionFactor);
          float wakeLift = 0.0;

          if (uMotionFactor > 0.01) {
            vec2 toVert = p - uBoatPos.xz;
            vec2 fwd = normalize(uBoatDir + vec2(0.0001));
            vec2 right = vec2(-fwd.y, fwd.x);
            float along = dot(toVert, fwd);
            float across = abs(dot(toVert, right));

            float bowCrest = exp(-pow((along - 1.85) * 0.95, 2.0)) * exp(-pow(across * 0.78, 2.0));
            wakeLift += bowCrest * 0.14 * uMotionFactor;

            if (along < 1.2 && along > -24.0) {
              float spread = max(0.0, -along) * 0.56 + 0.65;
              float distToArm = abs(across - spread);
              float vCrest = exp(-distToArm * 1.35) * sin(along * 1.8 - uTime * 7.5);
              float fade = smoothstep(-24.0, -2.5, along) * smoothstep(1.2, -0.4, along);
              wakeLift += vCrest * fade * 0.13 * uMotionFactor;
            }
          }

          worldPos.y += h + wakeLift;
          vWorldPos = worldPos.xyz;
          vElevation = h + wakeLift;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform float uWaterReveal;
        uniform vec3 uBoatPos;
        uniform vec2 uBoatDir;
        uniform float uBoatSpeed;
        uniform float uMotionFactor;
        uniform vec2 uFlowOffset;
        uniform vec3 uPortalPos;
        uniform float uIsAR;

        varying vec3 vWorldPos;
        varying float vElevation;

        void main() {
          if (uWaterReveal <= 0.001) discard;

          vec2 p = vWorldPos.xz;

          // Expansión radial de materialización con onda de brillo azul pulsante
          float revealMask = 1.0;
          float blueEdgeGlow = 0.0;
          if (uWaterReveal < 0.999) {
            float distOrigin = length(p);
            float revealRadius = uWaterReveal * 135.0;
            float edgeDist = revealRadius - distOrigin;
            revealMask = smoothstep(-5.0, 5.5, edgeDist);
            if (revealMask <= 0.005) discard;
            float pulse = 0.62 + 0.38 * sin(uTime * 7.5 - distOrigin * 0.45);
            blueEdgeGlow = exp(-abs(edgeDist) * 0.32) * pulse * (1.0 - smoothstep(0.88, 1.0, uWaterReveal));
          }

          vec2 pf = p - uFlowOffset;

          float nx = cos(pf.x * 0.36 + uTime * 0.95) * 0.14
                   + cos((pf.x * 0.28 + pf.y * 0.35) + uTime * 1.35) * 0.09
                   + cos(pf.x * 1.45 - pf.y * 0.92 + uTime * 2.6) * (0.045 + 0.055 * uMotionFactor);
          float nz = -sin(pf.y * 0.44 - uTime * 0.88) * 0.14
                   + cos((pf.x * 0.28 + pf.y * 0.35) + uTime * 1.35) * 0.09
                   + sin(pf.y * 1.65 + pf.x * 0.78 - uTime * 2.9) * (0.045 + 0.055 * uMotionFactor);

          vec3 N = normalize(vec3(-nx, 1.0, -nz));
          vec3 V = normalize(cameraPosition - vWorldPos);

          // Agua densa y profunda
          vec3 deepColor  = vec3(0.018, 0.056, 0.098);
          vec3 midColor   = vec3(0.042, 0.125, 0.188);
          vec3 crestColor = vec3(0.088, 0.215, 0.285);

          float heightFactor = clamp(vElevation * 4.2 + 0.48, 0.0, 1.0);
          vec3 col = mix(deepColor, midColor, smoothstep(0.0, 0.65, heightFactor));
          col = mix(col, crestColor, smoothstep(0.55, 1.0, heightFactor));

          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.8);
          col += vec3(0.15, 0.27, 0.38) * fresnel * 0.82;

          vec3 moonDir = normalize(vec3(0.35, 0.72, 0.28));
          vec3 moonHalf = normalize(moonDir + V);
          float moonSpec = pow(max(dot(N, moonHalf), 0.0), 42.0);
          col += vec3(0.55, 0.72, 0.88) * moonSpec * 0.42;

          // Reflejo dorado del portal lejano
          vec3 toPortal = uPortalPos - vWorldPos;
          float portalDist = length(toPortal.xz);
          vec3 Lportal = normalize(vec3(toPortal.x, max(toPortal.y, 2.5), toPortal.z));
          vec3 Hportal = normalize(Lportal + V);
          float specPortal = pow(max(dot(N, Hportal), 0.0), 22.0);
          float portalAtten = smoothstep(120.0, 6.0, portalDist);
          col += vec3(1.0, 0.83, 0.48) * specPortal * portalAtten * (1.45 + 0.35 * uMotionFactor);
          col += vec3(0.95, 0.72, 0.36) * exp(-portalDist * 0.042) * 0.34;

          // Espuma dinámica de proa, estela en V (~30°) y estela central al navegar
          if (uMotionFactor > 0.01) {
            vec2 toFrag = p - uBoatPos.xz;
            vec2 fwd = normalize(uBoatDir + vec2(0.0001));
            vec2 right = vec2(-fwd.y, fwd.x);

            float along = dot(toFrag, fwd);
            float across = abs(dot(toFrag, right));

            float bowFoam = exp(-pow((along - 1.75) * 1.4, 2.0)) * exp(-pow(across * 1.25, 2.0));
            bowFoam *= 0.65 + 0.35 * sin(across * 8.0 - uTime * 9.0);

            float wakeArms = 0.0;
            float sternTrail = 0.0;
            if (along < 1.5 && along > -26.0) {
              float spread = max(0.0, -along) * 0.56 + 0.62;
              float distToArm = abs(across - spread);
              float chevron = 0.55 + 0.45 * sin(along * 3.4 - across * 2.2 - uTime * 8.5);
              float armFade = smoothstep(-26.0, -2.5, along) * smoothstep(1.5, -0.3, along);
              wakeArms = exp(-distToArm * 2.1) * chevron * armFade;

              float swirl = 0.5 + 0.5 * sin(along * 4.5 - uTime * 9.5 + sin(across * 6.0));
              float centerWidth = 0.55 + max(0.0, -along) * 0.045;
              float centerMask = exp(-pow(across / centerWidth, 2.0));
              float centerFade = smoothstep(-18.0, -1.5, along) * smoothstep(-0.8, -2.0, along);
              sternTrail = centerMask * swirl * centerFade * 0.68;
            }

            float totalFoam = clamp((bowFoam * 0.85 + wakeArms * 0.92 + sternTrail) * uMotionFactor, 0.0, 1.0);
            col = mix(col, vec3(0.80, 0.91, 0.96), totalFoam * 0.72);
          }

          col += vec3(0.24, 0.76, 1.0) * blueEdgeGlow * 1.35;

          float camDist = length(vWorldPos.xz - cameraPosition.xz);
          float alpha = 0.99;
          if (uIsAR > 0.5) {
            alpha = smoothstep(82.0, 26.0, camDist) * 0.94;
          } else {
            float fogFactor = 1.0 - exp(-pow(camDist * 0.0085, 2.0));
            col = mix(col, vec3(0.020, 0.055, 0.102), clamp(fogFactor, 0.0, 1.0));
          }

          gl_FragColor = vec4(col, alpha * revealMask);
        }
      `
    });

    const waterMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, WATER_SEGMENTS, WATER_SEGMENTS),
      waterMaterial
    );
    waterMesh.rotation.x = -Math.PI / 2;
    waterMesh.visible = false;
    scene.add(waterMesh);

    // --- Rocío de agua al navegar ---
    const SPRAY_COUNT = 54;
    const sprayPositions = new Float32Array(SPRAY_COUNT * 3);
    const sprayVelocities = [];
    const sprayLife = new Float32Array(SPRAY_COUNT);
    for (let i = 0; i < SPRAY_COUNT; i++) {
      sprayPositions[i * 3 + 1] = -20;
      sprayVelocities.push(new THREE.Vector3());
      sprayLife[i] = Math.random();
    }
    const sprayGeo = new THREE.BufferGeometry();
    sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPositions, 3));
    const sprayMat = new THREE.PointsMaterial({
      color: 0xd9f0fa,
      size: 0.16,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const sprayPoints = new THREE.Points(sprayGeo, sprayMat);
    sprayPoints.frustumCulled = false;
    scene.add(sprayPoints);

    function updateWaterSpray(dt, boatPos, dir2D, motionFactor) {
      sprayMat.opacity = THREE.MathUtils.lerp(sprayMat.opacity, motionFactor * 0.72, dt * 5);
      if (motionFactor < 0.05) return;

      const posAttr = sprayGeo.attributes.position;
      const rightX = -dir2D.y;
      const rightZ = dir2D.x;

      for (let i = 0; i < SPRAY_COUNT; i++) {
        sprayLife[i] += dt * (1.2 + Math.random() * 0.7);
        if (sprayLife[i] >= 1.0) {
          sprayLife[i] = 0;
          const side = Math.random() < 0.5 ? 1 : -1;
          const alongBoat = 1.65 - Math.random() * 2.4;
          const lateral = side * (0.65 + Math.random() * 0.25);

          sprayPositions[i * 3]     = boatPos.x + dir2D.x * alongBoat + rightX * lateral;
          sprayPositions[i * 3 + 1] = 0.08 + Math.random() * 0.12;
          sprayPositions[i * 3 + 2] = boatPos.z + dir2D.y * alongBoat + rightZ * lateral;

          sprayVelocities[i].set(
            rightX * side * (0.65 + Math.random() * 0.85) - dir2D.x * 0.8,
            0.55 + Math.random() * 0.75,
            rightZ * side * (0.65 + Math.random() * 0.85) - dir2D.y * 0.8
          );
        } else {
          sprayVelocities[i].y -= 2.4 * dt;
          sprayPositions[i * 3]     += sprayVelocities[i].x * dt;
          sprayPositions[i * 3 + 1] += sprayVelocities[i].y * dt;
          sprayPositions[i * 3 + 2] += sprayVelocities[i].z * dt;
        }
      }
      posAttr.needsUpdate = true;
    }

    // --- Gran Portal Redondo Luminoso ---
    const portalGroup = new THREE.Group();
    portalGroup.position.copy(CONFIG.portalPosition);
    portalGroup.visible = false;
    scene.add(portalGroup);

    const portalUniforms = {
      uTime:      { value: 0 },
      uProximity: { value: 0 },
      uReveal:    { value: 0 }
    };

    const portalRingMat = new THREE.MeshStandardMaterial({
      color: 0xd4a456,
      emissive: 0x3cb8ff,
      emissiveIntensity: 1.4,
      metalness: 0.76,
      roughness: 0.24,
      transparent: true,
      opacity: 0.0,
      fog: false
    });
    const portalRing = new THREE.Mesh(
      new THREE.TorusGeometry(CONFIG.portalRadius, 0.24, 20, 80),
      portalRingMat
    );
    portalGroup.add(portalRing);

    const vortexDisk = new THREE.Mesh(
      new THREE.CircleGeometry(CONFIG.portalRadius * 0.99, 72),
      new THREE.ShaderMaterial({
        uniforms: portalUniforms,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform float uProximity;
          uniform float uReveal;
          varying vec2 vUv;

          void main() {
            if (uReveal <= 0.005) discard;
            float r = length(vUv);
            if (r > 1.0) discard;

            float angle = atan(vUv.y, vUv.x);
            float speed = 0.65 + uProximity * 2.1 + (1.0 - uReveal) * 2.2;
            float swirl1 = sin(angle * 4.0 + r * 7.0 - uTime * speed * 1.45);
            float swirl2 = cos(angle * 7.0 - r * 11.0 + uTime * speed * 0.95);
            float waves = 0.5 + 0.5 * (swirl1 * 0.6 + swirl2 * 0.4);

            vec3 coreDark  = vec3(0.09, 0.18, 0.34);
            vec3 midGold   = vec3(0.96, 0.78, 0.42);
            vec3 rimLight  = vec3(1.00, 0.97, 0.86);
            vec3 blueBirth = vec3(0.26, 0.78, 1.00);

            vec3 col = mix(coreDark, midGold, smoothstep(0.12, 0.90, r) * (0.68 + 0.32 * waves));
            col = mix(col, rimLight, smoothstep(0.70, 0.99, r));
            col = mix(col, rimLight, uProximity * 0.72 * (1.0 - r * 0.28));
            col = mix(blueBirth, col, smoothstep(0.25, 0.95, uReveal));

            float alpha = smoothstep(1.0, 0.88, r) * (0.84 + 0.16 * waves) * uReveal;
            gl_FragColor = vec4(col, alpha);
          }
        `
      })
    );
    portalGroup.add(vortexDisk);

    const haloPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(CONFIG.portalRadius * 4.1, CONFIG.portalRadius * 4.1),
      new THREE.ShaderMaterial({
        uniforms: portalUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform float uProximity;
          uniform float uReveal;
          varying vec2 vUv;

          void main() {
            if (uReveal <= 0.005) discard;
            float r = length(vUv);
            float pulse = 0.92 + 0.08 * sin(uTime * 1.7);
            float ringGlow = exp(-pow((r - 0.50) * 5.0, 2.0));
            float softAura = exp(-r * 2.25) * 0.54;
            float intensity = (ringGlow * 0.92 + softAura) * pulse * (1.0 + uProximity * 1.0) * uReveal;
            intensity *= smoothstep(1.0, 0.58, r);

            vec3 goldGlow = mix(vec3(1.0, 0.78, 0.38), vec3(1.0, 0.96, 0.86), ringGlow);
            vec3 blueGlow = vec3(0.28, 0.80, 1.0);
            vec3 glowCol = mix(blueGlow, goldGlow, smoothstep(0.25, 0.95, uReveal));
            gl_FragColor = vec4(glowCol * intensity, intensity);
          }
        `
      })
    );
    haloPlane.position.z = -0.10;
    portalGroup.add(haloPlane);

    // --- Partículas de Materialización con Brillo Azul Pulsante (1 draw call GPU) ---
    let materializePoints = null;
    const matParticleUniforms = {
      uTime:    { value: 0 },
      uMatTime: { value: -1.0 },
      uRatio:   { value: Math.min(window.devicePixelRatio, 2) }
    };

    function buildMaterializeParticles(sampledBoatVerts) {
      if (materializePoints) {
        scene.remove(materializePoints);
        materializePoints.geometry.dispose();
        materializePoints.material.dispose();
        materializePoints = null;
      }

      const perBoatCount = sampledBoatVerts.length;
      const sceneExtraCount = 340;
      const total = boats.length * perBoatCount + sceneExtraCount;

      const positions = new Float32Array(total * 3);
      const delays    = new Float32Array(total);
      const seeds     = new Float32Array(total);
      const kinds     = new Float32Array(total);

      const tmpVec = new THREE.Vector3();
      let ptr = 0;

      boats.forEach((b) => {
        b.group.updateMatrixWorld(true);
        const boatDelay = b.matDelay;
        for (let i = 0; i < perBoatCount; i++) {
          tmpVec.copy(sampledBoatVerts[i]).applyMatrix4(b.group.matrixWorld);
          positions[ptr * 3]     = tmpVec.x;
          positions[ptr * 3 + 1] = tmpVec.y;
          positions[ptr * 3 + 2] = tmpVec.z;
          delays[ptr] = boatDelay + Math.random() * 0.28;
          seeds[ptr]  = Math.random();
          kinds[ptr]  = 0.0;
          ptr++;
        }
      });

      for (let i = 0; i < sceneExtraCount; i++) {
        const isPortalCloud = i > sceneExtraCount * 0.72;
        if (isPortalCloud) {
          const ang = Math.random() * Math.PI * 2;
          const rad = CONFIG.portalRadius * (0.45 + Math.random() * 0.85);
          positions[ptr * 3]     = CONFIG.portalPosition.x + Math.cos(ang) * rad;
          positions[ptr * 3 + 1] = CONFIG.portalPosition.y + Math.sin(ang) * rad;
          positions[ptr * 3 + 2] = CONFIG.portalPosition.z + (Math.random() - 0.5) * 4.5;
          delays[ptr] = 0.85 + Math.random() * 0.65;
        } else {
          positions[ptr * 3]     = (Math.random() - 0.5) * 34;
          positions[ptr * 3 + 1] = 0.08 + Math.random() * 0.6;
          positions[ptr * 3 + 2] = 2.0 - Math.random() * 68;
          delays[ptr] = Math.random() * 1.1;
        }
        seeds[ptr] = Math.random();
        kinds[ptr] = 1.0;
        ptr++;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aDelay',   new THREE.BufferAttribute(delays, 1));
      geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds, 1));
      geo.setAttribute('aKind',    new THREE.BufferAttribute(kinds, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: matParticleUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          attribute float aDelay;
          attribute float aSeed;
          attribute float aKind;

          uniform float uTime;
          uniform float uMatTime;
          uniform float uRatio;

          varying float vAlpha;
          varying float vPulse;

          void main() {
            if (uMatTime < 0.0) {
              vAlpha = 0.0;
              gl_PointSize = 0.0;
              gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
              return;
            }

            float localT = uMatTime - aDelay;
            if (localT < 0.0) {
              vAlpha = 0.0;
              gl_PointSize = 0.0;
              gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
              return;
            }

            float dur = aKind < 0.5 ? 3.2 : 3.6;
            float p = clamp(localT / dur, 0.0, 1.0);
            vec3 pos = position;

            float freq = 5.2 + fract(aSeed * 7.13) * 4.8;
            float pulse = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * freq + aSeed * 31.4));
            vPulse = pulse;

            if (aKind < 0.5) {
              float gather = smoothstep(0.0, 0.44, p);
              float driftUp = smoothstep(0.66, 1.0, p);
              float angle = (1.0 - gather) * 4.2 + aSeed * 6.28318;
              float swirlR = (1.0 - gather) * (0.38 + fract(aSeed * 13.7) * 0.95);

              pos.x += cos(angle) * swirlR;
              pos.z += sin(angle) * swirlR;
              pos.y += -(1.0 - gather) * (0.30 + fract(aSeed * 5.9) * 0.45)
                     + driftUp * (1.15 + fract(aSeed * 19.3) * 1.65);

              vAlpha = smoothstep(0.0, 0.14, p) * (1.0 - smoothstep(0.68, 1.0, p));
            } else {
              pos.y += p * (2.4 + fract(aSeed * 11.1) * 2.8);
              pos.x += sin(uTime * 1.4 + aSeed * 12.0) * 0.55;
              pos.z += cos(uTime * 1.1 + aSeed * 9.0) * 0.55;
              vAlpha = smoothstep(0.0, 0.18, p) * (1.0 - smoothstep(0.68, 1.0, p));
            }

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float baseSize = (aKind < 0.5 ? 36.0 : 52.0) * uRatio;
            gl_PointSize = clamp((baseSize / max(-mvPosition.z, 1.0)) * (0.65 + 0.65 * pulse), 2.0, 48.0);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          varying float vAlpha;
          varying float vPulse;

          void main() {
            if (vAlpha <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;

            float halo = exp(-d * 5.6);
            float core = exp(-d * 14.5);

            vec3 deepBlue = vec3(0.08, 0.46, 1.00);
            vec3 cyanBlue = vec3(0.36, 0.84, 1.00);
            vec3 coreWhite = vec3(0.88, 0.97, 1.00);

            vec3 col = mix(deepBlue, cyanBlue, vPulse);
            col = mix(col, coreWhite, core * 0.85);

            float finalAlpha = (halo * 0.78 + core * 0.65) * vAlpha * (0.55 + 0.45 * vPulse);
            gl_FragColor = vec4(col * (1.0 + 0.35 * vPulse), finalAlpha);
          }
        `
      });

      materializePoints = new THREE.Points(geo, mat);
      materializePoints.frustumCulled = false;
      scene.add(materializePoints);
    }

    // --- Partículas ambientales (luciérnagas doradas + motas azules pulsantes) ---
    const ambientParticleUniforms = {
      uTime:   { value: 0 },
      uReveal: { value: 0 },
      uRatio:  { value: Math.min(window.devicePixelRatio, 2) }
    };
    const ambientPoints = (() => {
      const count = 175;
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const isBlue = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const blueMote = i < 70;
        positions[i * 3]     = (Math.random() - 0.5) * 38;
        positions[i * 3 + 1] = blueMote ? (0.25 + Math.random() * 2.8) : (0.8 + Math.random() * 8.0);
        positions[i * 3 + 2] = 4 - Math.random() * 90;
        phases[i] = Math.random() * Math.PI * 2;
        isBlue[i] = blueMote ? 1.0 : 0.0;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aIsBlue',  new THREE.BufferAttribute(isBlue, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: ambientParticleUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          attribute float aPhase;
          attribute float aIsBlue;
          uniform float uTime;
          uniform float uReveal;
          uniform float uRatio;
          varying float vPulse;
          varying float vIsBlue;
          varying float vReveal;

          void main() {
            vec3 pos = position;
            pos.y += sin(uTime * 0.72 + aPhase) * 0.36;
            pos.x += cos(uTime * 0.44 + aPhase * 1.3) * 0.40;
            vPulse = 0.28 + 0.72 * (0.5 + 0.5 * sin(uTime * (aIsBlue > 0.5 ? 2.6 : 1.7) + aPhase * 2.1));
            vIsBlue = aIsBlue;
            vReveal = uReveal;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = clamp((26.0 * uRatio / max(-mvPosition.z, 1.0)) * (0.65 + 0.55 * vPulse), 1.5, 28.0);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          varying float vPulse;
          varying float vIsBlue;
          varying float vReveal;

          void main() {
            if (vReveal <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float glow = exp(-d * 6.2) * vPulse * vReveal;
            vec3 col = mix(vec3(1.0, 0.88, 0.54), vec3(0.32, 0.80, 1.0), vIsBlue);
            gl_FragColor = vec4(col, glow);
          }
        `
      });
      const pts = new THREE.Points(geo, mat);
      pts.visible = false;
      scene.add(pts);
      return pts;
    })();

    // =========================================================================
    // BLOQUE 4: CARGA, NORMALIZACIÓN Y WIREFRAME DE models/barcagrullas.glb
    // =========================================================================
    const boats = [];
    const boatHitboxes = [];
    let modelReady = false;
    let vrSupported = false;
    let arSupported = false;

    const introScreen = document.getElementById('intro-screen');
    const loadTrack   = document.getElementById('load-track');
    const loadFill    = document.getElementById('load-fill');
    const orbAR       = document.getElementById('orb-ar');
    const orbVR       = document.getElementById('orb-vr');
    const orbWeb      = document.getElementById('orb-web');

    function sampleVerticesFromTemplate(wrapper, maxSamples = 145) {
      wrapper.updateMatrixWorld(true);
      const rawVerts = [];
      const v = new THREE.Vector3();

      wrapper.traverse((obj) => {
        if (obj.isMesh && obj.geometry && obj.geometry.attributes.position) {
          const pos = obj.geometry.attributes.position;
          const stride = Math.max(1, Math.floor(pos.count / 90));
          for (let i = 0; i < pos.count; i += stride) {
            v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
            rawVerts.push(v.clone());
          }
        }
      });

      if (rawVerts.length === 0) {
        for (let i = 0; i < maxSamples; i++) {
          rawVerts.push(new THREE.Vector3(
            (Math.random() - 0.5) * 1.4,
            Math.random() * 1.4,
            (Math.random() - 0.5) * 3.6
          ));
        }
      }

      const sampled = [];
      for (let i = 0; i < maxSamples; i++) {
        const idx = Math.floor((i / maxSamples) * rawVerts.length);
        sampled.push(rawVerts[idx]);
      }
      return sampled;
    }

    function normalizeBoatTemplate(rawScene) {
      const wrapper = new THREE.Group();
      wrapper.add(rawScene);

      rawScene.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(rawScene);
      let size = box.getSize(new THREE.Vector3());

      if (size.x > size.z * 1.15) {
        rawScene.rotation.y = Math.PI / 2;
      }

      // Corrección 180° validada: todas las barcas ven y navegan de frente hacia el portal
      rawScene.rotation.y += Math.PI;

      rawScene.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(rawScene);
      size = box.getSize(new THREE.Vector3());

      const longestHoriz = Math.max(size.x, size.z, 0.001);
      const scale = CONFIG.targetBoatLength / longestHoriz;
      rawScene.scale.setScalar(scale);
      rawScene.updateMatrixWorld(true);

      box = new THREE.Box3().setFromObject(rawScene);
      const center = box.getCenter(new THREE.Vector3());
      rawScene.position.x -= center.x;
      rawScene.position.z -= center.z;
      rawScene.position.y -= (box.min.y + CONFIG.waterlineSink);

      rawScene.updateMatrixWorld(true);
      const finalBox = new THREE.Box3().setFromObject(wrapper);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      CONFIG.seatOffset.set(0, THREE.MathUtils.clamp(finalSize.y * 0.20, 0.26, 0.55), 0);

      rawScene.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          obj.frustumCulled = true;
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            if (m.isMeshStandardMaterial) {
              m.roughness = Math.min(m.roughness ?? 0.6, 0.78);
            }
          });
        }
      });

      const sampledVerts = sampleVerticesFromTemplate(wrapper, 145);
      return { wrapper, finalSize, sampledVerts };
    }

    function createEmergencyBoat() {
      const wrapper = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x5c4b36, metalness: 0.55, roughness: 0.42 });
      const hull = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 2.2, 6, 14), mat);
      hull.rotation.x = Math.PI / 2;
      hull.scale.set(1.0, 0.55, 1.1);
      hull.position.y = 0.2;
      wrapper.add(hull);
      return {
        wrapper,
        finalSize: new THREE.Vector3(1.4, 1.4, 3.6),
        sampledVerts: sampleVerticesFromTemplate(wrapper, 145)
      };
    }

    function populateBoats(normalizedData) {
      boats.forEach(b => scene.remove(b.group));
      boats.length = 0;
      boatHitboxes.length = 0;

      const { wrapper, finalSize, sampledVerts } = normalizedData;
      const ringRadius = Math.max(finalSize.x, finalSize.z) * 0.48;
      const centerIndex = Math.floor(CONFIG.boatsLayout.length / 2);

      // Genera inmediatamente el wireframe azul 2D de fondo con el modelo real
      buildIntroWireframe(wrapper);

      CONFIG.boatsLayout.forEach((cfg, index) => {
        const boatGroup = new THREE.Group();
        boatGroup.position.copy(cfg.pos);
        const initialYaw = Math.PI + cfg.yaw;
        boatGroup.rotation.y = initialYaw;
        boatGroup.visible = false;

        const visual = wrapper.clone(true);

        const matRecords = [];
        visual.traverse((obj) => {
          if (obj.isMesh && obj.material) {
            const isArray = Array.isArray(obj.material);
            const clonedList = (isArray ? obj.material : [obj.material]).map((orig) => {
              const m = orig.clone();
              matRecords.push({
                mat: m,
                origTransparent: !!m.transparent,
                origDepthWrite: m.depthWrite !== undefined ? m.depthWrite : true,
                origOpacity: m.opacity !== undefined ? m.opacity : 1.0,
                hasEmissive: !!m.emissive,
                origEmissive: m.emissive ? m.emissive.clone() : new THREE.Color(0x000000),
                origEmissiveIntensity: m.emissiveIntensity !== undefined ? m.emissiveIntensity : 0.0
              });
              return m;
            });
            obj.material = isArray ? clonedList : clonedList[0];
          }
        });

        boatGroup.add(visual);

        const beaconRing = new THREE.Mesh(
          new THREE.RingGeometry(ringRadius * 0.92, ringRadius * 1.03, 40),
          new THREE.MeshBasicMaterial({
            color: 0xf4d694,
            transparent: true,
            opacity: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        beaconRing.rotation.x = -Math.PI / 2;
        beaconRing.position.y = 0.06;
        boatGroup.add(beaconRing);

        const hitbox = new THREE.Mesh(
          new THREE.BoxGeometry(
            Math.max(finalSize.x * 1.15, 1.8),
            Math.max(finalSize.y * 1.15, 2.0),
            Math.max(finalSize.z * 1.08, 3.6)
          ),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hitbox.position.y = Math.max(finalSize.y * 0.45, 0.8);
        hitbox.userData.boatIndex = index;
        boatGroup.add(hitbox);
        boatHitboxes.push(hitbox);

        scene.add(boatGroup);

        const radialStep = Math.abs(index - centerIndex);
        boats.push({
          index,
          group: boatGroup,
          visual,
          beaconRing,
          matRecords,
          matDelay: 0.25 + radialStep * 0.24,
          materialized: false,
          homePos: cfg.pos.clone(),
          homeYaw: initialYaw,
          phaseOffset: index * 1.41 + Math.random() * 0.5
        });
      });

      buildMaterializeParticles(sampledVerts);
    }

    const BLUE_MAT_COLOR       = new THREE.Color(0x28a4ff);
    const GOLD_PORTAL_EMISSIVE = new THREE.Color(0xffc870);
    const BLUE_PORTAL_EMISSIVE = new THREE.Color(0x38b6ff);

    function smoothstepJS(edge0, edge1, x) {
      const t = THREE.MathUtils.clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function setBoatMaterialization(boat, progress, timeSec) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);
      if (p <= 0.001) {
        boat.group.visible = false;
        boat.materialized = false;
        return;
      }

      boat.group.visible = true;
      const easeOut = 1.0 - Math.pow(1.0 - p, 3.0);

      boat.group.position.set(
        boat.homePos.x,
        boat.homePos.y - (1.0 - easeOut) * 0.34,
        boat.homePos.z
      );
      boat.visual.scale.setScalar(THREE.MathUtils.lerp(0.93, 1.0, easeOut));

      if (p >= 0.999) {
        if (!boat.materialized) {
          boat.materialized = true;
          boat.visual.scale.setScalar(1.0);
          for (const rec of boat.matRecords) {
            rec.mat.transparent = rec.origTransparent;
            rec.mat.depthWrite  = rec.origDepthWrite;
            rec.mat.opacity     = rec.origOpacity;
            if (rec.hasEmissive) {
              rec.mat.emissive.copy(rec.origEmissive);
              rec.mat.emissiveIntensity = rec.origEmissiveIntensity;
            }
            rec.mat.needsUpdate = true;
          }
        }
        return;
      }

      boat.materialized = false;
      const glowBell = Math.sin(p * Math.PI);
      const bluePulse = 0.58 + 0.42 * Math.sin(timeSec * 8.5 + boat.phaseOffset);

      for (const rec of boat.matRecords) {
        if (!rec.mat.transparent) {
          rec.mat.transparent = true;
          rec.mat.needsUpdate = true;
        }
        rec.mat.depthWrite = p > 0.58 ? rec.origDepthWrite : false;
        rec.mat.opacity = rec.origOpacity * smoothstepJS(0.05, 0.86, p);

        if (rec.hasEmissive) {
          rec.mat.emissive.lerpColors(BLUE_MAT_COLOR, rec.origEmissive, smoothstepJS(0.45, 1.0, p));
          rec.mat.emissiveIntensity = THREE.MathUtils.lerp(
            rec.origEmissiveIntensity,
            1.75 * bluePulse,
            glowBell
          );
        }
      }
    }

    function refreshIntroOrbs() {
      if (!modelReady) return;
      loadFill.style.width = '100%';
      loadTrack.classList.add('done');

      orbWeb.disabled = false;
      orbAR.disabled  = !arSupported;
      orbVR.disabled  = !vrSupported;

      orbAR.title = arSupported ? 'Entrar en Realidad Aumentada' : 'AR no disponible en este navegador';
      orbVR.title = vrSupported ? 'Entrar en Realidad Virtual' : 'VR no disponible en este navegador';
    }

    function loadBoatAsset() {
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

      const gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      const attemptLoad = (url, isFallback) => {
        gltfLoader.load(
          url,
          (gltf) => {
            const normalized = normalizeBoatTemplate(gltf.scene);
            populateBoats(normalized);
            modelReady = true;
            refreshIntroOrbs();
          },
          (xhr) => {
            if (xhr.lengthComputable) {
              const pct = Math.min(Math.round((xhr.loaded / xhr.total) * 100), 98);
              loadFill.style.width = `${Math.max(18, pct)}%`;
            }
          },
          (err) => {
            if (!isFallback) {
              attemptLoad(ASSETS.boatFallback, true);
            } else {
              console.warn('No se pudo cargar barcagrullas.glb:', err);
              populateBoats(createEmergencyBoat());
              modelReady = true;
              refreshIntroOrbs();
            }
          }
        );
      };

      attemptLoad(ASSETS.boatPrimary, false);
    }
    loadBoatAsset();

    // =========================================================================
    // BLOQUE 5: AUDIO HÍBRIDO (bosque_noche.mp3 + MATERIALIZACIÓN + PORTAL)
    // =========================================================================
    const forestAudio = new Audio();
    forestAudio.src = ASSETS.audioPrimary;
    forestAudio.loop = true;
    forestAudio.preload = 'auto';
    forestAudio.volume = 0;
    forestAudio.addEventListener('error', () => {
      if (forestAudio.src !== ASSETS.audioFallback) {
        forestAudio.src = ASSETS.audioFallback;
      }
    });

    const audioEngine = {
      ctx: null,
      enabled: false,
      masterGain: null,
      wakeGain: null,
      wakeFilter: null,
      portalGain: null,
      currentForestVol: 0,

      initSynth() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0;
        this.masterGain.connect(this.ctx.destination);

        const bufSize = this.ctx.sampleRate * 3;
        const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          lastOut = (lastOut + 0.025 * white) / 1.025;
          data[i] = lastOut * 2.6;
        }

        const wakeSrc = this.ctx.createBufferSource();
        wakeSrc.buffer = noiseBuf;
        wakeSrc.loop = true;
        this.wakeFilter = this.ctx.createBiquadFilter();
        this.wakeFilter.type = 'bandpass';
        this.wakeFilter.frequency.value = 420;
        this.wakeFilter.Q.value = 0.75;
        this.wakeGain = this.ctx.createGain();
        this.wakeGain.gain.value = 0.0;
        wakeSrc.connect(this.wakeFilter).connect(this.wakeGain).connect(this.masterGain);
        wakeSrc.start();

        this.portalGain = this.ctx.createGain();
        this.portalGain.gain.value = 0.0;

        const oscA = this.ctx.createOscillator();
        oscA.type = 'sine';
        oscA.frequency.value = 146.83;

        const oscB = this.ctx.createOscillator();
        oscB.type = 'triangle';
        oscB.frequency.value = 220.0;

        const portalFilter = this.ctx.createBiquadFilter();
        portalFilter.type = 'lowpass';
        portalFilter.frequency.value = 640;

        oscA.connect(portalFilter);
        oscB.connect(portalFilter);
        portalFilter.connect(this.portalGain).connect(this.masterGain);
        oscA.start();
        oscB.start();
      },

      toggle(forceOn = false) {
        this.initSynth();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        this.enabled = forceOn ? true : !this.enabled;
        const now = this.ctx.currentTime;
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.65 : 0.0, now, 0.25);

        if (this.enabled) {
          forestAudio.play().catch(() => {});
        } else {
          forestAudio.pause();
        }

        btnAudio.textContent = this.enabled ? 'Audio: ON' : 'Audio: OFF';
        btnAudio.classList.toggle('active', this.enabled);
      },

      playMaterializeSwell() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [196.0, 293.66, 369.99, 587.33];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq * 0.985, now);
          osc.frequency.exponentialRampToValueAtTime(freq, now + 2.2);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(320, now);
          filter.frequency.exponentialRampToValueAtTime(1600, now + 1.8);
          filter.frequency.exponentialRampToValueAtTime(480, now + 3.8);

          const start = now + idx * 0.14;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(0.065, start + 1.2);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 3.6);

          osc.connect(filter).connect(gain).connect(this.masterGain);
          osc.start(start);
          osc.stop(start + 3.7);
        });
      },

      playBoardChime() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(293.66, now);
        osc.frequency.exponentialRampToValueAtTime(440.0, now + 0.65);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.13, now + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
        osc.connect(gain).connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 1.45);
      },

      update(dt, motionFactor, portalProximity) {
        const targetForest = this.enabled ? THREE.MathUtils.lerp(0.62, 0.22, portalProximity) : 0.0;
        this.currentForestVol = THREE.MathUtils.lerp(this.currentForestVol, targetForest, dt * 2.5);
        forestAudio.volume = THREE.MathUtils.clamp(this.currentForestVol, 0, 1);

        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.wakeGain.gain.setTargetAtTime(motionFactor * 0.44, now, 0.18);
        this.wakeFilter.frequency.setTargetAtTime(360 + motionFactor * 560, now, 0.18);
        this.portalGain.gain.setTargetAtTime(Math.pow(portalProximity, 1.55) * 0.30, now, 0.12);
      }
    };

    // =========================================================================
    // BLOQUE 6: MÁQUINA DE ESTADOS (INTRO -> MATERIALIZING -> IDLE -> VOYAGE)
    // =========================================================================
    const STATE = {
      INTRO: 'INTRO',
      MATERIALIZING: 'MATERIALIZING',
      IDLE: 'IDLE',
      BOARDING: 'BOARDING',
      NAVIGATING: 'NAVIGATING',
      PORTAL_CROSSING: 'PORTAL_CROSSING'
    };

    let currentState = STATE.INTRO;
    let activeMode = 'web';
    let activeBoat = null;
    let hoveredBoatIndex = -1;
    let isARMode = false;
    let voyagesCompleted = 0;

    let stateTimer = 0;
    let matElapsed = -1.0;
    const boardStartRigPos = new THREE.Vector3();
    let navCurve = null;
    let navProgress = 0;
    let currentBoatSpeed = 0;
    let smoothMotionFactor = 0;
    const prevBoatPos = new THREE.Vector3();
    const currentBoatDir = new THREE.Vector2(0, -1);
    let flashSwapped = false;

    const hudEl         = document.getElementById('hud');
    const statusDot     = document.getElementById('status-dot');
    const stateLabel    = document.getElementById('state-label');
    const hintEl        = document.getElementById('hint');
    const btnModes      = document.getElementById('btn-modes');
    const btnAudio      = document.getElementById('btn-audio');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    function setHUD(status, hint, blueDot = false) {
      stateLabel.textContent = status;
      if (hint !== undefined) hintEl.textContent = hint;
      statusDot.classList.toggle('blue', blueDot);
    }

    function lerpAngle(a, b, t) {
      const diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      return a + diff * t;
    }

    function resetSceneToHidden() {
      playerRig.position.copy(CONFIG.originPosition);
      activeBoat = null;
      navCurve = null;
      navProgress = 0;
      currentBoatSpeed = 0;
      smoothMotionFactor = 0;
      matElapsed = -1.0;
      matParticleUniforms.uMatTime.value = -1.0;

      waterMesh.visible = false;
      waterUniforms.uWaterReveal.value = 0.0;
      waterUniforms.uBoatSpeed.value = 0.0;
      waterUniforms.uMotionFactor.value = 0.0;

      portalGroup.visible = false;
      portalUniforms.uReveal.value = 0.0;
      portalUniforms.uProximity.value = 0.0;
      portalRingMat.transparent = true;
      portalRingMat.opacity = 0.0;
      portalRingMat.needsUpdate = true;
      portalGlowLight.intensity = 0.0;
      materializeBlueLight.intensity = 0.0;

      skyGroup.visible = false;
      starMat.opacity = 0.0;
      ambientPoints.visible = false;
      ambientParticleUniforms.uReveal.value = 0.0;
      sprayMat.opacity = 0.0;

      portalFlashMesh.visible = false;
      portalFlashMat.opacity = 0.0;

      for (const b of boats) {
        b.group.position.copy(b.homePos);
        b.group.rotation.set(0, b.homeYaw, 0);
        b.visual.rotation.set(0, 0, 0);
        b.beaconRing.material.opacity = 0.0;
        setBoatMaterialization(b, 0.0, 0.0);
      }
    }

    function startMaterialization(modeName) {
      activeMode = modeName;
      resetSceneToHidden();

      // Oculta el wireframe 2D de portada y enciende la escena espacial
      introStage.visible = false;
      introScreen.classList.add('hidden');
      hudEl.classList.add('visible');
      btnFullscreen.style.display = (modeName === 'web') ? '' : 'none';

      waterMesh.visible = true;
      portalGroup.visible = true;
      ambientPoints.visible = true;
      skyGroup.visible = !isARMode;

      currentState = STATE.MATERIALIZING;
      stateTimer = 0;
      matElapsed = 0;
      matParticleUniforms.uMatTime.value = 0;

      audioEngine.playMaterializeSwell();
      setHUD('Materializando...', 'Las esculturas están emergiendo', true);
    }

    function showIntroState() {
      currentState = STATE.INTRO;
      resetSceneToHidden();

      scene.background = INTRO_BG;
      scene.fog = null;
      renderer.setClearAlpha(1);
      camera.position.set(0, CONFIG.defaultEyeHeight, 0);
      camYaw = 0;
      camPitch = 0;
      updateDesktopCameraLook();

      introStage.visible = true;
      positionIntroStage();
      hudEl.classList.remove('visible');
      introScreen.classList.remove('hidden');
    }

    async function returnToIntroMenu() {
      const session = renderer.xr.getSession();
      if (session) {
        await session.end().catch(() => {});
      }
      showIntroState();
    }

    function buildVoyageCurve(startPos) {
      const endPos = new THREE.Vector3(
        CONFIG.portalPosition.x,
        0.55,
        CONFIG.portalPosition.z + 0.6
      );
      const sideSign = startPos.x === 0 ? (Math.random() < 0.5 ? 1 : -1) : Math.sign(startPos.x);
      const p1 = new THREE.Vector3(
        startPos.x * 0.82 + sideSign * 2.2,
        0.0,
        THREE.MathUtils.lerp(startPos.z, endPos.z, 0.30)
      );
      const p2 = new THREE.Vector3(
        startPos.x * 0.25 - sideSign * 2.0,
        0.12,
        THREE.MathUtils.lerp(startPos.z, endPos.z, 0.68)
      );
      return new THREE.CatmullRomCurve3([startPos.clone(), p1, p2, endPos]);
    }

    function voyageEaseC1(u) {
      const a = 0.20;
      const k = 1.0 / (2.0 * a - a * a);
      if (u < a) return k * u * u;
      return k * a * a + 2.0 * k * a * (u - a);
    }

    function startBoarding(boat) {
      if (currentState !== STATE.IDLE || !boat) return;
      if (!audioEngine.enabled) audioEngine.toggle(true);
      audioEngine.playBoardChime();

      activeBoat = boat;
      currentState = STATE.BOARDING;
      stateTimer = 0;
      boardStartRigPos.copy(playerRig.position);
      navCurve = buildVoyageCurve(boat.group.position);
      navProgress = 0;
      prevBoatPos.copy(boat.group.position);

      setHUD('Abordando barca...', 'La corriente está por iniciar', false);
    }

    /**
     * DESTINO DEL PORTAL (Aislado para evolucionarlo fácilmente después)
     */
    function onPortalCrossed(context) {
      playerRig.position.copy(CONFIG.originPosition);

      if (context.boat) {
        context.boat.group.position.copy(context.boat.homePos);
        context.boat.group.rotation.set(0, context.boat.homeYaw, 0);
        context.boat.visual.rotation.x = 0;
        context.boat.visual.rotation.z = 0;
      }

      activeBoat = null;
      navCurve = null;
      navProgress = 0;
      currentBoatSpeed = 0;
      smoothMotionFactor = 0;
      portalUniforms.uProximity.value = 0;
      waterUniforms.uBoatSpeed.value = 0;
      waterUniforms.uMotionFactor.value = 0;
      sprayMat.opacity = 0;

      setHUD(
        `Embarcadero · Travesía #${context.voyagesCompleted}`,
        'Toca una barca para volver a zarpar',
        false
      );
    }

    // =========================================================================
    // BLOQUE 7: INTERACCIÓN MULTIPLATAFORMA + LANZADORES AR / VR / 3D WEB
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    let isDragging = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let camYaw = 0;
    let camPitch = 0;

    function updateDesktopCameraLook() {
      if (renderer.xr.isPresenting) return;
      camera.rotation.order = 'YXZ';
      camera.rotation.y = camYaw;
      camera.rotation.x = camPitch;
    }
    updateDesktopCameraLook();

    // Micro-paralaje sutil del wireframe 2D en la portada al mover el cursor
    window.addEventListener('pointermove', (e) => {
      if (currentState !== STATE.INTRO) return;
      introParallaxX = (e.clientX / window.innerWidth - 0.5) * 2;
      introParallaxY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function pickBoatFromPointer(clientX, clientY) {
      pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(boatHitboxes, false);
      return hits.length > 0 ? boats[hits[0].object.userData.boatIndex] : null;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (currentState === STATE.INTRO) return;
      isDragging = true;
      pointerDownX = lastPointerX = e.clientX;
      pointerDownY = lastPointerY = e.clientY;
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (currentState === STATE.INTRO) return;
      if (isDragging && !renderer.xr.isPresenting) {
        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        camYaw += dx * 0.0042;
        camPitch = THREE.MathUtils.clamp(camPitch + dy * 0.0036, -1.05, 1.05);
        updateDesktopCameraLook();
      } else if (currentState === STATE.IDLE && !renderer.xr.isPresenting) {
        const b = pickBoatFromPointer(e.clientX, e.clientY);
        hoveredBoatIndex = b ? b.index : -1;
        renderer.domElement.style.cursor = b ? 'pointer' : 'grab';
      }
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (currentState === STATE.INTRO) return;
      const moved = Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY);
      isDragging = false;
      if (moved < 10 && currentState === STATE.IDLE && !renderer.xr.isPresenting) {
        const b = pickBoatFromPointer(e.clientX, e.clientY);
        if (b) startBoarding(b);
      }
    });

    const tempMatrix = new THREE.Matrix4();
    const controllers = [];
    const vrLasers = [];

    function raycastFromController(controller) {
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
      const hits = raycaster.intersectObjects(boatHitboxes, false);
      return hits.length > 0 ? boats[hits[0].object.userData.boatIndex] : null;
    }

    function setupXRController(idx) {
      const controller = renderer.xr.getController(idx);
      const laser = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -16)
        ]),
        new THREE.LineBasicMaterial({
          color: 0xf4d694,
          transparent: true,
          opacity: 0.45
        })
      );
      controller.add(laser);
      vrLasers.push(laser);

      controller.addEventListener('selectstart', () => {
        if (currentState !== STATE.IDLE) return;
        const boat = raycastFromController(controller);
        if (boat) startBoarding(boat);
      });

      playerRig.add(controller);
      controllers.push(controller);
    }
    setupXRController(0);
    setupXRController(1);

    btnAudio.addEventListener('click', () => audioEngine.toggle());
    btnModes.addEventListener('click', () => returnToIntroMenu());

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    });
    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.textContent = document.fullscreenElement ? 'Salir pantalla' : 'Pantalla completa';
    });

    async function detectXRCapabilities() {
      if ('xr' in navigator) {
        vrSupported = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
