    );
    introAuraPlane.position.z = -1.2;
    introStage.add(introAuraPlane);

    const introDustUniforms = {
      uTime:  { value: 0 },
      uFade:  { value: 1 },
      uRatio: { value: Math.min(window.devicePixelRatio, 2) }
    };
    {
      const count = 95;
      const pos = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * 8.5;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 4.8;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 2.6;
        phases[i] = Math.random() * Math.PI * 2;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: introDustUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          attribute float aPhase;
          uniform float uTime;
          uniform float uRatio;
          varying float vPulse;
          void main() {
            vec3 p = position;
            p.y += sin(uTime * 0.65 + aPhase) * 0.24;
            p.x += cos(uTime * 0.40 + aPhase * 1.3) * 0.22;
            vPulse = 0.25 + 0.75 * (0.5 + 0.5 * sin(uTime * 2.4 + aPhase * 2.1));
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp((22.0 * uRatio / max(-mv.z, 1.0)) * (0.65 + 0.55 * vPulse), 1.5, 22.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;
          uniform float uFade;
          varying float vPulse;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float glow = exp(-d * 6.5) * vPulse * 0.78 * uFade;
            gl_FragColor = vec4(0.28, 0.80, 1.0, glow);
          }
        `
      });
      introStage.add(new THREE.Points(geo, mat));
    }

    function buildIntroWireframe(normalizedWrapper) {
      if (introWireframePivot) {
        introStage.remove(introWireframePivot);
        introWireframePivot.traverse((obj) => {
          if (obj.isLineSegments && obj.geometry) obj.geometry.dispose();
        });
        if (introEdgeMat) introEdgeMat.dispose();
        if (introMeshWireMat) introMeshWireMat.dispose();
        introWireframePivot = null;
      }

      introWireframePivot = new THREE.Group();
      normalizedWrapper.updateMatrixWorld(true);

      introEdgeMat = new THREE.LineBasicMaterial({
        color: 0x3ec6ff,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      introMeshWireMat = new THREE.MeshBasicMaterial({
        color: 0x1578ff,
        wireframe: true,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const invRoot = new THREE.Matrix4().copy(normalizedWrapper.matrixWorld).invert();
      const relMatrix = new THREE.Matrix4();

      normalizedWrapper.traverse((obj) => {
        if (obj.isMesh && obj.geometry) {
          relMatrix.multiplyMatrices(invRoot, obj.matrixWorld);
          const edgesGeo = new THREE.EdgesGeometry(obj.geometry, 16);
          const lineSegs = new THREE.LineSegments(edgesGeo, introEdgeMat);
          lineSegs.applyMatrix4(relMatrix);
          introWireframePivot.add(lineSegs);

          const wireMesh = new THREE.Mesh(obj.geometry, introMeshWireMat);
          wireMesh.applyMatrix4(relMatrix);
          introWireframePivot.add(wireMesh);
        }
      });

      const wfBox = new THREE.Box3().setFromObject(introWireframePivot);
      const wfCenter = wfBox.getCenter(new THREE.Vector3());
      introWireframePivot.children.forEach((child) => child.position.sub(wfCenter));

      introWireframePivot.rotation.set(0.04, Math.PI / 2 - 0.10, 0);
      introStage.add(introWireframePivot);
      introFadeIn = 0.0;
      positionIntroStage();
    }

    function positionIntroStage() {
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const aspect = window.innerWidth / window.innerHeight;
      const hFovRad = 2 * Math.atan(Math.tan(vFovRad / 2) * aspect);

      const targetWidthFraction = aspect < 0.85 ? 0.88 : (aspect < 1.3 ? 0.72 : 0.56);
      const boatSpan = CONFIG.targetBoatLength * 1.08;
      const distForWidth = (boatSpan / targetWidthFraction) / (2 * Math.tan(hFovRad / 2));
      const dist = THREE.MathUtils.clamp(distForWidth, 4.4, 8.8);

      introStage.position.set(0, CONFIG.defaultEyeHeight + 0.06, -dist);
    }
    positionIntroStage();

    // =========================================================================
    // BLOQUE 3: AGUA (GLB REALISTA ANIMADO + RESPALDO PROCEDURAL)
    // =========================================================================
    const WATER_SIZE = 260;
    const WATER_SEGMENTS = 100;
    const WATER_STEP = WATER_SIZE / WATER_SEGMENTS;

    const waterUniforms = {
      uTime:            { value: 0 },
      uWaterReveal:     { value: 0 },
      uGalaxyWorld:     { value: 0 },
      uBoatPos:         { value: new THREE.Vector3(0, 0, -999) },
      uBoatDir:         { value: new THREE.Vector2(0, -1) },
      uBoatSpeed:       { value: 0 },
      uMotionFactor:    { value: 0 },
      uFlowOffset:      { value: new THREE.Vector2(0, 0) },
      uPortalPos:       { value: new THREE.Vector3(0, 18.0, CONFIG.portalBasePosition.z) },
      uGalaxyIntensity: { value: SKY_SETTINGS.galaxyIntensity },
      uFogDensity:      { value: FOG_DENSITY_A },
      uIsAR:            { value: 0 }
    };

    const waterRoot = new THREE.Group();
    waterRoot.visible = false;
    scene.add(waterRoot);

    let usingGLBWater = false;
    let glbWaterGroup = null;
    const glbWaterAnimatedTextures = [];

    const waterMaterial = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      transparent: true,
      depthWrite: true,
      vertexShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uBoatPos;
        uniform vec2 uBoatDir;
        uniform float uMotionFactor;
        uniform vec2 uFlowOffset;

        varying vec3 vWorldPos;
        varying float vElevation;

        float baseWave(vec2 p, float t, float motion) {
          vec2 pf = p - uFlowOffset * 0.55;
          float amp = 1.0 + motion * 0.85;
          float w1 = sin(pf.x * 0.34 + t * 0.90) * 0.055;
          float w2 = cos(pf.y * 0.42 - t * 0.85) * 0.050;
          float w3 = sin((pf.x * 0.25 + pf.y * 0.34) + t * 1.35) * 0.036;
          float surge = sin(pf.y * 0.72 + t * 2.4) * cos(pf.x * 0.48 - t * 1.4) * 0.055 * motion;
          return (w1 + w2 + w3) * amp + surge;
        }

        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vec2 p = worldPos.xz;

          float h = baseWave(p, uTime, uMotionFactor);
          float wakeLift = 0.0;

          if (uMotionFactor > 0.01) {
            vec2 toVert = p - uBoatPos.xz;
            vec2 fwd = normalize(uBoatDir + vec2(0.0001));
            vec2 right = vec2(-fwd.y, fwd.x);
            float along = dot(toVert, fwd);
            float across = abs(dot(toVert, right));

            float bowCrest = exp(-pow((along - 1.85) * 0.95, 2.0)) * exp(-pow(across * 0.78, 2.0));
            wakeLift += bowCrest * 0.14 * uMotionFactor;

            if (along < 1.2 && along > -24.0) {
              float spread = max(0.0, -along) * 0.56 + 0.65;
              float distToArm = abs(across - spread);
              float vCrest = exp(-distToArm * 1.35) * sin(along * 1.8 - uTime * 7.5);
              float fade = smoothstep(-24.0, -2.5, along) * smoothstep(1.2, -0.4, along);
              wakeLift += vCrest * fade * 0.13 * uMotionFactor;
            }
          }

          worldPos.y += h + wakeLift;
          vWorldPos = worldPos.xyz;
          vElevation = h + wakeLift;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: /* glsl */ `
        precision highp float;

        uniform float uTime;
        uniform float uWaterReveal;
        uniform float uGalaxyWorld;
        uniform vec3 uBoatPos;
        uniform vec2 uBoatDir;
        uniform float uBoatSpeed;
        uniform float uMotionFactor;
        uniform vec2 uFlowOffset;
        uniform vec3 uPortalPos;
        uniform float uGalaxyIntensity;
        uniform float uFogDensity;
        uniform float uIsAR;

        varying vec3 vWorldPos;
        varying float vElevation;

        void main() {
          if (uWaterReveal <= 0.001) discard;

          vec2 p = vWorldPos.xz;

          float revealMask = 1.0;
          float blueEdgeGlow = 0.0;
          if (uWaterReveal < 0.999) {
            float distOrigin = length(p);
            float revealRadius = uWaterReveal * 185.0;
            float edgeDist = revealRadius - distOrigin;
            revealMask = smoothstep(-5.5, 6.0, edgeDist);
            if (revealMask <= 0.005) discard;
            float pulse = 0.62 + 0.38 * sin(uTime * 7.5 - distOrigin * 0.45);
            blueEdgeGlow = exp(-abs(edgeDist) * 0.30) * pulse * (1.0 - smoothstep(0.88, 1.0, uWaterReveal));
          }

          vec2 pf = p - uFlowOffset;

          float nx = cos(pf.x * 0.36 + uTime * 0.95) * 0.14
                   + cos((pf.x * 0.28 + pf.y * 0.35) + uTime * 1.35) * 0.09
                   + cos(pf.x * 1.45 - pf.y * 0.92 + uTime * 2.6) * (0.045 + 0.055 * uMotionFactor);
          float nz = -sin(pf.y * 0.44 - uTime * 0.88) * 0.14
                   + cos((pf.x * 0.28 + pf.y * 0.35) + uTime * 1.35) * 0.09
                   + sin(pf.y * 1.65 + pf.x * 0.78 - uTime * 2.9) * (0.045 + 0.055 * uMotionFactor);

          vec3 N = normalize(vec3(-nx, 1.0, -nz));
          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 R = reflect(-V, N);

          vec3 deepColor  = mix(vec3(0.004, 0.009, 0.018), vec3(0.012, 0.038, 0.074), uGalaxyWorld);
          vec3 midColor   = mix(vec3(0.010, 0.022, 0.038), vec3(0.032, 0.096, 0.158), uGalaxyWorld);
          vec3 crestColor = mix(vec3(0.022, 0.044, 0.068), vec3(0.072, 0.178, 0.252), uGalaxyWorld);

          float heightFactor = clamp(vElevation * 4.2 + 0.48, 0.0, 1.0);
          vec3 col = mix(deepColor, midColor, smoothstep(0.0, 0.65, heightFactor));
          col = mix(col, crestColor, smoothstep(0.55, 1.0, heightFactor));

          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.7);
          float galRefBand = exp(-abs(dot(R, normalize(vec3(0.58, 0.70, -0.42)))) * 4.0);
          vec3 galaxyRefCol = mix(vec3(0.08, 0.18, 0.36), vec3(0.26, 0.22, 0.48), galRefBand);
          col += galaxyRefCol * fresnel * (0.55 + 0.45 * uGalaxyIntensity) * uGalaxyWorld;

          vec3 moonDir = normalize(vec3(0.32, 0.72, 0.26));
          vec3 moonHalf = normalize(moonDir + V);
          float moonSpec = pow(max(dot(N, moonHalf), 0.0), 46.0);
          col += vec3(0.56, 0.74, 0.92) * moonSpec * (0.14 + 0.24 * uGalaxyWorld);

          vec3 toPortal = uPortalPos - vWorldPos;
          float portalDist = length(toPortal.xz);
          vec3 Lportal = normalize(vec3(toPortal.x, max(toPortal.y * 0.55, 4.5), toPortal.z));
          vec3 Hportal = normalize(Lportal + V);
          float specPortal = pow(max(dot(N, Hportal), 0.0), 22.0);
          float portalAtten = smoothstep(160.0, 10.0, portalDist);
          col += vec3(0.95, 0.80, 0.48) * specPortal * portalAtten * (1.15 + 0.35 * uMotionFactor);
          col += vec3(0.90, 0.70, 0.36) * exp(-portalDist * 0.028) * 0.26;

          if (uMotionFactor > 0.01) {
            vec2 toFrag = p - uBoatPos.xz;
            vec2 fwd = normalize(uBoatDir + vec2(0.0001));
            vec2 right = vec2(-fwd.y, fwd.x);

            float along = dot(toFrag, fwd);
            float across = abs(dot(toFrag, right));

            float bowFoam = exp(-pow((along - 1.75) * 1.4, 2.0)) * exp(-pow(across * 1.25, 2.0));
            bowFoam *= 0.65 + 0.35 * sin(across * 8.0 - uTime * 9.0);

            float wakeArms = 0.0;
            float sternTrail = 0.0;
            if (along < 1.5 && along > -26.0) {
              float spread = max(0.0, -along) * 0.56 + 0.62;
              float distToArm = abs(across - spread);
              float chevron = 0.55 + 0.45 * sin(along * 3.4 - across * 2.2 - uTime * 8.5);
              float armFade = smoothstep(-26.0, -2.5, along) * smoothstep(1.5, -0.3, along);
              wakeArms = exp(-distToArm * 2.1) * chevron * armFade;

              float swirl = 0.5 + 0.5 * sin(along * 4.5 - uTime * 9.5 + sin(across * 6.0));
              float centerWidth = 0.55 + max(0.0, -along) * 0.045;
              float centerMask = exp(-pow(across / centerWidth, 2.0));
              float centerFade = smoothstep(-18.0, -1.5, along) * smoothstep(-0.8, -2.0, along);
              sternTrail = centerMask * swirl * centerFade * 0.68;
            }

            float totalFoam = clamp((bowFoam * 0.85 + wakeArms * 0.92 + sternTrail) * uMotionFactor, 0.0, 1.0);
            col = mix(col, vec3(0.80, 0.91, 0.96), totalFoam * 0.72);
          }

          col += vec3(0.24, 0.76, 1.0) * blueEdgeGlow * 1.35;

          float camDist = length(vWorldPos.xz - cameraPosition.xz);
          float alpha = 0.99;
          if (uIsAR > 0.5) {
            alpha = smoothstep(95.0, 28.0, camDist) * 0.94;
          } else {
            float fogFactor = 1.0 - exp(-pow(camDist * uFogDensity, 2.0));
            vec3 fogCol = mix(vec3(0.005, 0.010, 0.022), vec3(0.016, 0.046, 0.092), uGalaxyWorld);
            col = mix(col, fogCol, clamp(fogFactor, 0.0, 1.0));
          }

          gl_FragColor = vec4(col, alpha * revealMask);
        }
      `
    });

    const waterMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, WATER_SEGMENTS, WATER_SEGMENTS),
      waterMaterial
    );
    waterMesh.rotation.x = -Math.PI / 2;
    waterRoot.add(waterMesh);

    function setupGLBWaterPlane(rawScene) {
      if (glbWaterGroup) {
        waterRoot.remove(glbWaterGroup);
        disposeHierarchy(glbWaterGroup);
        glbWaterGroup = null;
      }
      glbWaterAnimatedTextures.length = 0;

      const wrapper = new THREE.Group();
      wrapper.add(rawScene);

      rawScene.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(rawScene);
      let size = box.getSize(new THREE.Vector3());

      const horizSpan = Math.max(size.x, size.z, 0.001);
      const scaleXZ = WATER_SIZE / horizSpan;
      rawScene.scale.set(scaleXZ, Math.max(1.0, scaleXZ * 0.05), scaleXZ);
      rawScene.updateMatrixWorld(true);

      box = new THREE.Box3().setFromObject(rawScene);
      const center = box.getCenter(new THREE.Vector3());
      rawScene.position.x -= center.x;
      rawScene.position.z -= center.z;
      rawScene.position.y -= center.y;

      const seenTextures = new Set();

      rawScene.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        obj.frustumCulled = false;

        const isArray = Array.isArray(obj.material);
        const mats = (isArray ? obj.material : [obj.material]).map((orig) => {
          const m = orig.clone();
          m.transparent = true;
          m.depthWrite = true;

          if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
            m.envMapIntensity = Math.max(m.envMapIntensity ?? 1.0, 1.35);
          }

          const texSlots = [
            { tex: m.normalMap,    speedX:  0.018, speedY:  0.024 },
            { tex: m.bumpMap,      speedX: -0.015, speedY:  0.020 },
            { tex: m.roughnessMap, speedX:  0.012, speedY: -0.016 },
            { tex: m.map,          speedX:  0.010, speedY:  0.014 }
          ];
          for (const slot of texSlots) {
            if (slot.tex && !seenTextures.has(slot.tex)) {
              seenTextures.add(slot.tex);
              slot.tex.wrapS = THREE.RepeatWrapping;
              slot.tex.wrapT = THREE.RepeatWrapping;
              slot.tex.needsUpdate = true;
              glbWaterAnimatedTextures.push({
                tex: slot.tex,
                baseOffsetX: slot.tex.offset.x,
                baseOffsetY: slot.tex.offset.y,
                speedX: slot.speedX,
                speedY: slot.speedY
              });
            }
          }

          m.onBeforeCompile = (shader) => {
            shader.uniforms.uTime         = waterUniforms.uTime;
            shader.uniforms.uWaterReveal  = waterUniforms.uWaterReveal;
            shader.uniforms.uBoatPos      = waterUniforms.uBoatPos;
            shader.uniforms.uBoatDir      = waterUniforms.uBoatDir;
            shader.uniforms.uMotionFactor = waterUniforms.uMotionFactor;
            shader.uniforms.uFlowOffset   = waterUniforms.uFlowOffset;
            shader.uniforms.uIsAR         = waterUniforms.uIsAR;

            shader.vertexShader = shader.vertexShader
              .replace(
                '#include <common>',
                /* glsl */ `
                #include <common>
                uniform float uTime;
                uniform vec3 uBoatPos;
                uniform vec2 uBoatDir;
                uniform float uMotionFactor;
                uniform vec2 uFlowOffset;
                varying vec3 vWaterWorldPos;
                `
              )
              .replace(
                '#include <begin_vertex>',
                /* glsl */ `
                #include <begin_vertex>
                vec4 wpTmp = modelMatrix * vec4(transformed, 1.0);
                vec2 pW = wpTmp.xz - uFlowOffset * 0.45;
                float waveH = (sin(pW.x * 0.30 + uTime * 0.85) * 0.045
                             + cos(pW.y * 0.38 - uTime * 0.78) * 0.040
                             + sin((pW.x * 0.22 + pW.y * 0.30) + uTime * 1.15) * 0.028)
                             * (1.0 + uMotionFactor * 0.65);

                if (uMotionFactor > 0.01) {
                  vec2 toV = wpTmp.xz - uBoatPos.xz;
                  vec2 fwdW = normalize(uBoatDir + vec2(0.0001));
                  vec2 rightW = vec2(-fwdW.y, fwdW.x);
                  float alongW = dot(toV, fwdW);
                  float acrossW = abs(dot(toV, rightW));
                  if (alongW < 1.4 && alongW > -22.0) {
                    float spreadW = max(0.0, -alongW) * 0.54 + 0.62;
                    float armW = exp(-abs(acrossW - spreadW) * 1.4) * sin(alongW * 1.7 - uTime * 7.0);
                    float fadeW = smoothstep(-22.0, -2.5, alongW) * smoothstep(1.4, -0.3, alongW);
                    waveH += armW * fadeW * 0.10 * uMotionFactor;
                  }
                }
                transformed.y += waveH;
                vWaterWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
                `
              );

            shader.fragmentShader = shader.fragmentShader
              .replace(
                '#include <common>',
                /* glsl */ `
                #include <common>
                uniform float uTime;
                uniform float uWaterReveal;
                uniform vec3 uBoatPos;
                uniform vec2 uBoatDir;
                uniform float uMotionFactor;
                uniform float uIsAR;
                varying vec3 vWaterWorldPos;
                `
              )
              .replace(
                '#include <dithering_fragment>',
                /* glsl */ `
                if (uWaterReveal <= 0.001) discard;
                float distOrigW = length(vWaterWorldPos.xz);
                float revMaskW = 1.0;
                if (uWaterReveal < 0.999) {
                  float edgeW = uWaterReveal * 185.0 - distOrigW;
                  revMaskW = smoothstep(-5.5, 6.0, edgeW);
                  if (revMaskW <= 0.005) discard;
                  float pulseW = 0.62 + 0.38 * sin(uTime * 7.5 - distOrigW * 0.45);
                  float glowW = exp(-abs(edgeW) * 0.30) * pulseW * (1.0 - smoothstep(0.88, 1.0, uWaterReveal));
                  gl_FragColor.rgb += vec3(0.24, 0.76, 1.0) * glowW * 1.25;
                }

                if (uMotionFactor > 0.01) {
                  vec2 toF = vWaterWorldPos.xz - uBoatPos.xz;
                  vec2 fwdF = normalize(uBoatDir + vec2(0.0001));
                  vec2 rightF = vec2(-fwdF.y, fwdF.x);
                  float alongF = dot(toF, fwdF);
                  float acrossF = abs(dot(toF, rightF));

                  float bowF = exp(-pow((alongF - 1.75) * 1.4, 2.0)) * exp(-pow(acrossF * 1.25, 2.0));
                  float wakeF = 0.0;
                  if (alongF < 1.5 && alongF > -24.0) {
                    float spF = max(0.0, -alongF) * 0.56 + 0.62;
                    float chevF = 0.55 + 0.45 * sin(alongF * 3.4 - acrossF * 2.2 - uTime * 8.5);
                    float fdF = smoothstep(-24.0, -2.5, alongF) * smoothstep(1.5, -0.3, alongF);
                    wakeF = exp(-abs(acrossF - spF) * 2.1) * chevF * fdF;
                  }
                  float foamF = clamp((bowF * 0.8 + wakeF * 0.85) * uMotionFactor, 0.0, 1.0);
                  gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.82, 0.92, 0.97), foamF * 0.68);
                }

                if (uIsAR > 0.5) {
                  float camDW = length(vWaterWorldPos.xz - cameraPosition.xz);
                  gl_FragColor.a *= smoothstep(95.0, 28.0, camDW) * 0.94;
                }
                gl_FragColor.a *= revMaskW;
                #include <dithering_fragment>
                `
              );
          };

          return m;
        });

        obj.material = isArray ? mats : mats[0];
      });

      glbWaterGroup = wrapper;
      usingGLBWater = true;
      waterMesh.visible = false;
      waterRoot.add(glbWaterGroup);
    }

    function updateGLBWaterAnimation(t) {
      if (!usingGLBWater) return;
      const flowX = waterUniforms.uFlowOffset.value.x * 0.015;
      const flowY = waterUniforms.uFlowOffset.value.y * 0.015;
      for (const item of glbWaterAnimatedTextures) {
        item.tex.offset.x = item.baseOffsetX + t * item.speedX + flowX;
        item.tex.offset.y = item.baseOffsetY + t * item.speedY + flowY;
      }
    }

    // --- Aro luminoso sutil sobre el agua indicando la circunferencia límite ---
    const boundaryUniforms = {
      uTime:      { value: 0 },
      uOpacity:   { value: 0 },
      uPlayerXZ:  { value: new THREE.Vector2(0, 0) },
      uCenterXZ:  { value: new THREE.Vector2(0, -4.8) },
      uRadius:    { value: CONFIG.walkBoundary.radius },
      uColorMode: { value: 0.0 }
    };

    const boundaryRingMesh = new THREE.Mesh(
      new THREE.RingGeometry(0.965, 1.0, 128),
      new THREE.ShaderMaterial({
        uniforms: boundaryUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false,
        vertexShader: /* glsl */ `
          varying vec3 vWorldPos;
          varying vec2 vLocalPos;
          void main() {
            vLocalPos = position.xy;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;
          uniform float uTime;
          uniform float uOpacity;
          uniform vec2 uPlayerXZ;
          uniform vec2 uCenterXZ;
          uniform float uRadius;
          uniform float uColorMode;

          varying vec3 vWorldPos;
          varying vec2 vLocalPos;

          void main() {
            if (uOpacity <= 0.005) discard;

            float rNorm = length(vLocalPos);
            float radialBand = exp(-pow((rNorm - 0.985) * 85.0, 2.0));
            float ang = atan(vLocalPos.y, vLocalPos.x);
            float dash = 0.55 + 0.45 * sin(ang * 36.0 - uTime * 1.4);

            float distToPlayer = length(vWorldPos.xz - uPlayerXZ);
            float nearGlow = exp(-distToPlayer * 0.22);
            float playerEdgeProx = smoothstep(uRadius * 0.62, uRadius * 0.98, length(uPlayerXZ - uCenterXZ));

            vec3 colWalk = vec3(0.28, 0.78, 1.00);
            vec3 colNav  = vec3(0.96, 0.78, 0.42);
            vec3 col = mix(colWalk, colNav, uColorMode);

            float alpha = radialBand * dash * (0.14 + 0.36 * playerEdgeProx + 0.52 * nearGlow) * uOpacity;
            gl_FragColor = vec4(col, alpha);
          }
        `
      })
    );
    boundaryRingMesh.rotation.x = -Math.PI / 2;
    boundaryRingMesh.position.set(CONFIG.walkBoundary.centerX, 0.09, CONFIG.walkBoundary.centerZ);
    boundaryRingMesh.scale.setScalar(CONFIG.walkBoundary.radius);
    boundaryRingMesh.visible = false;
    scene.add(boundaryRingMesh);

    const SPRAY_COUNT = 54;
    const sprayPositions = new Float32Array(SPRAY_COUNT * 3);
    const sprayVelocities = [];
    const sprayLife = new Float32Array(SPRAY_COUNT);
    for (let i = 0; i < SPRAY_COUNT; i++) {
      sprayPositions[i * 3 + 1] = -20;
      sprayVelocities.push(new THREE.Vector3());
      sprayLife[i] = Math.random();
    }
    const sprayGeo = new THREE.BufferGeometry();
    sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPositions, 3));
    const sprayMat = new THREE.PointsMaterial({
      color: 0xd9f0fa,
      size: 0.16,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const sprayPoints = new THREE.Points(sprayGeo, sprayMat);
    sprayPoints.frustumCulled = false;
    sprayPoints.visible = false;
    scene.add(sprayPoints);

    function updateWaterSpray(dt, boatPos, dir2D, motionFactor) {
      sprayMat.opacity = THREE.MathUtils.lerp(sprayMat.opacity, motionFactor * 0.72, dt * 5);
      if (sprayMat.opacity <= 0.005 && motionFactor < 0.05) {
        sprayPoints.visible = false;
        return;
      }
      sprayPoints.visible = true;
      if (motionFactor < 0.05) return;

      const posAttr = sprayGeo.attributes.position;
      const rightX = -dir2D.y;
      const rightZ = dir2D.x;

      for (let i = 0; i < SPRAY_COUNT; i++) {
        sprayLife[i] += dt * (1.2 + Math.random() * 0.7);
        if (sprayLife[i] >= 1.0) {
          sprayLife[i] = 0;
          const side = Math.random() < 0.5 ? 1 : -1;
          const alongBoat = 1.65 - Math.random() * 2.4;
          const lateral = side * (0.65 + Math.random() * 0.25);

          sprayPositions[i * 3]     = boatPos.x + dir2D.x * alongBoat + rightX * lateral;
          sprayPositions[i * 3 + 1] = 0.06 + Math.random() * 0.10;
          sprayPositions[i * 3 + 2] = boatPos.z + dir2D.y * alongBoat + rightZ * lateral;

          sprayVelocities[i].set(
            rightX * side * (0.65 + Math.random() * 0.85) - dir2D.x * 0.8,
            0.50 + Math.random() * 0.70,
            rightZ * side * (0.65 + Math.random() * 0.85) - dir2D.y * 0.8
          );
        } else {
          sprayVelocities[i].y -= 2.4 * dt;
          sprayPositions[i * 3]     += sprayVelocities[i].x * dt;
          sprayPositions[i * 3 + 1] += sprayVelocities[i].y * dt;
          sprayPositions[i * 3 + 2] += sprayVelocities[i].z * dt;
        }
      }
      posAttr.needsUpdate = true;
    }

    // =========================================================================
    // BLOQUE 3B: PORTAL MONUMENTAL 3D + ESPIRAL SELLADO AL MARCO POR RAYCASTER
    // =========================================================================
    const portalGroup = new THREE.Group();
    portalGroup.position.copy(CONFIG.portalBasePosition);
    portalGroup.visible = false;
    scene.add(portalGroup);

    const portalUniforms = {
      uTime:      { value: 0 },
      uProximity: { value: 0 },
      uReveal:    { value: 0 },
      uAspect:    { value: 0.56 },
      uRatio:     { value: Math.min(window.devicePixelRatio, 2) }
    };

    let portalModelPivot = null;
    let portalMatRecords = [];
    let portalMaterialized = false;
    let portalVortexMesh = null;
    let portalCloudPoints = null;
    let portalSampledVerts = [];
    let portalApertureData = {
      centerX: 0,
      centerY: 17.5,
      width: 20.0,
      height: 36.0,
      clearWidth: 19.2,
      outerHalfW: 24.0,
      zOffset: -1.2
    };

    // Espiral opaco y continuo de marco a marco (el propio marco 3D recorta los bordes por Z-buffer)
    const portalVortexMaterial = new THREE.ShaderMaterial({
      uniforms: portalUniforms,
      transparent: true,
      side: THREE.DoubleSide,
      depthTest: true,
      depthWrite: false,
      fog: false,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv * 2.0 - 1.0;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        precision highp float;

        uniform float uTime;
        uniform float uProximity;
        uniform float uReveal;
        uniform float uAspect;

        varying vec2 vUv;

        void main() {
          if (uReveal <= 0.005) discard;

          // Coordenadas circulares proporcionadas a la altura real del vano
          vec2 p = vec2(vUv.x * uAspect, vUv.y + 0.04);
          float r = length(p);
          float angle = atan(p.y, p.x);

          float speed = 1.12 + uProximity * 2.5 + (1.0 - uReveal) * 1.9;
          float logR = log(r + 0.055);

          float spiral1 = 0.5 + 0.5 * sin(angle * 3.0 - logR * 8.4 + uTime * speed * 1.35);
          float spiral2 = 0.5 + 0.5 * sin(angle * 5.0 - logR * 13.0 + uTime * speed * 0.92 + 1.15);
          float spiralArms = pow(spiral1, 1.75) * 0.74 + pow(spiral2, 2.4) * 0.34;

          // Mantiene brazos luminosos hasta las esquinas superiores del marco sin zonas muertas
          float depthPull = exp(-r * 1.45);
          float coreBright = exp(-r * 5.6);

          vec3 colVoid  = vec3(0.025, 0.055, 0.145);
          vec3 colCyan  = vec3(0.18, 0.58, 0.92);
          vec3 colGold  = vec3(0.96, 0.80, 0.46);
          vec3 colCore  = vec3(1.00, 0.97, 0.88);
          vec3 colBirth = vec3(0.24, 0.78, 1.00);

          vec3 col = mix(colVoid, colCyan, spiralArms * (0.72 + 0.24 * depthPull));
          col = mix(col, colGold, spiralArms * (0.40 + 0.58 * depthPull));
          col += colCore * coreBright * 0.95;

          // Sombra de contacto muy sutil pegada al borde del marco para profundidad volumétrica
          float edgeX = 1.0 - abs(vUv.x);
          float edgeY = 1.0 - abs(vUv.y);
          float minEdge = min(edgeX, edgeY);
          float frameAO = mix(0.68, 1.0, smoothstep(0.0, 0.09, minEdge));
          col *= frameAO;

          col = mix(col, colCore, uProximity * 0.74 * (0.35 + 0.65 * depthPull));
          col = mix(colBirth, col, smoothstep(0.22, 0.92, uReveal));

          float alpha = clamp(0.95 + 0.05 * spiralArms, 0.0, 1.0) * uReveal;
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    function buildPortalParticleCloud(aperture) {
      if (portalCloudPoints) {
        portalGroup.remove(portalCloudPoints);
        portalCloudPoints.geometry.dispose();
        portalCloudPoints.material.dispose();
        portalCloudPoints = null;
      }

      const TOTAL = 240;
      const positions = new Float32Array(TOTAL * 3);
      const sizes     = new Float32Array(TOTAL);
      const phases    = new Float32Array(TOTAL);
      const speeds    = new Float32Array(TOTAL);
      const colorMix  = new Float32Array(TOTAL);
      const drifts    = new Float32Array(TOTAL * 3);

      const halfW = aperture.clearWidth * 0.46;
      const halfH = aperture.height * 0.45;

      for (let i = 0; i < TOTAL; i++) {
        const px = aperture.centerX + (Math.random() * 2 - 1) * halfW;
        const py = Math.max(0.55, aperture.centerY + (Math.random() * 2 - 1) * halfH);
        const pz = aperture.zOffset + (Math.random() - 0.35) * 1.8;

        positions[i * 3]     = px;
        positions[i * 3 + 1] = py;
        positions[i * 3 + 2] = pz;

        sizes[i]    = 115.0 + Math.random() * 125.0;
        phases[i]   = Math.random() * Math.PI * 2;
        speeds[i]   = 1.35 + Math.random() * 2.0;
        colorMix[i] = Math.random();

        drifts[i * 3]     = (Math.random() - 0.5) * 0.38;
        drifts[i * 3 + 1] = 0.22 + Math.random() * 0.45;
        drifts[i * 3 + 2] = (Math.random() - 0.5) * 0.38;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position',  new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aSize',     new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aPhase',    new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aSpeed',    new THREE.BufferAttribute(speeds, 1));
      geo.setAttribute('aColorMix', new THREE.BufferAttribute(colorMix, 1));
      geo.setAttribute('aDrift',    new THREE.BufferAttribute(drifts, 3));

      const mat = new THREE.ShaderMaterial({
        uniforms: portalUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
        vertexShader: /* glsl */ `
          attribute float aSize;
          attribute float aPhase;
          attribute float aSpeed;
          attribute float aColorMix;
          attribute vec3 aDrift;

          uniform float uTime;
          uniform float uProximity;
          uniform float uReveal;
          uniform float uRatio;

          varying float vPulse;
          varying float vColorMix;
          varying float vReveal;

          void main() {
            vec3 p = position;
            float t = uTime;

            p.x += sin(t * 0.45 + aPhase) * aDrift.x;
            p.y += cos(t * 0.40 + aPhase * 1.25) * aDrift.y;
            p.z += sin(t * 0.36 + aPhase * 0.85) * aDrift.z;

            float pulseWave = 0.5 + 0.5 * sin(t * aSpeed * (1.0 + uProximity * 0.5) + aPhase * 2.4);
            vPulse = 0.24 + 0.76 * pow(pulseWave, 1.5);
            vColorMix = aColorMix;
            vReveal = uReveal;

            vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
            float dist = max(-mvPosition.z, 2.5);
            float ptSize = (aSize * uRatio / dist) * (0.72 + 0.40 * vPulse);
            gl_PointSize = clamp(ptSize, 1.5 * uRatio, 12.0 * uRatio);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;

          uniform float uProximity;
          varying float vPulse;
          varying float vColorMix;
          varying float vReveal;

          void main() {
            if (vReveal <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;

            float halo = exp(-d * 6.8);
            float core = exp(-d * 16.5);

            vec3 softCyan = vec3(0.32, 0.74, 0.96);
            vec3 warmGold = vec3(0.96, 0.79, 0.46);
            vec3 pearlCol = vec3(0.92, 0.94, 0.96);

            vec3 orbCol = vColorMix < 0.38
              ? mix(softCyan, pearlCol, vColorMix / 0.38)
              : mix(pearlCol, warmGold, (vColorMix - 0.38) / 0.62);

            orbCol = mix(softCyan, orbCol, smoothstep(0.22, 0.95, vReveal));
            vec3 col = mix(orbCol, vec3(0.98, 0.96, 0.92), core * 0.55);

            float alpha = (halo * 0.38 + core * 0.42) * (0.26 + 0.44 * vPulse) * 0.52 * vReveal;
            gl_FragColor = vec4(col * (0.74 + 0.24 * vPulse + 0.12 * uProximity), alpha);
          }
        `
      });

      portalCloudPoints = new THREE.Points(geo, mat);
      portalCloudPoints.frustumCulled = false;
      portalGroup.add(portalCloudPoints);
    }

    // Mide exactamente el marco interior (jambas, dintel y profundidad Z) usando Raycaster sobre el GLB
    function computePortalInnerAperture(wrapper, finalBox, finalSize) {
      wrapper.updateMatrixWorld(true);

      // Activar temporalmente DoubleSide para detectar cualquier cara interior sin depender de normales
      const savedSides = [];
      wrapper.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        for (const m of mats) {
          savedSides.push({ mat: m, side: m.side });
          m.side = THREE.DoubleSide;
        }
      });

      const rc = new THREE.Raycaster();
      const origin = new THREE.Vector3();
      const dirLeft  = new THREE.Vector3(-1, 0, 0);
      const dirRight = new THREE.Vector3( 1, 0, 0);
      const dirUp    = new THREE.Vector3( 0, 1, 0);

      const leftHits = [];
      const rightHits = [];
      const frameZHits = [];

      const zSlices = [-0.20, -0.10, 0.0, 0.10, 0.20].map((f) => finalSize.z * f);
      const yProbeFracs = [0.16, 0.24, 0.34, 0.44, 0.52];

      for (const yf of yProbeFracs) {
        const y = finalBox.min.y + finalSize.y * yf;
        for (const z of zSlices) {
          origin.set(0, y, z);

          rc.set(origin, dirLeft);
          const hitsL = rc.intersectObject(wrapper, true);
          for (const h of hitsL) {
            if (h.distance > finalSize.x * 0.06 && h.distance < finalSize.x * 0.48) {
              leftHits.push(h.point.x);
              frameZHits.push(h.point.z);
              break;
            }
          }

          rc.set(origin, dirRight);
          const hitsR = rc.intersectObject(wrapper, true);
          for (const h of hitsR) {
            if (h.distance > finalSize.x * 0.06 && h.distance < finalSize.x * 0.48) {
              rightHits.push(h.point.x);
              frameZHits.push(h.point.z);
              break;
            }
          }
        }
      }

      const leftInner  = leftHits.length  ? medianValue(leftHits)  : -finalSize.x * 0.22;
      const rightInner = rightHits.length ? medianValue(rightHits) :  finalSize.x * 0.22;
      const clearWidth = Math.max(rightInner - leftInner, finalSize.x * 0.24);
      const centerX    = (leftInner + rightInner) * 0.5;

      // Medir la cara inferior exacta del dintel horizontal disparando rayos hacia +Y desde el vano
      const topHits = [];
      const lintelZHits = [];
      const yStart = Math.max(0.5, finalBox.min.y + finalSize.y * 0.15);
      const xProbeFracs = [-0.28, -0.14, 0.0, 0.14, 0.28];

      for (const xf of xProbeFracs) {
        const x = centerX + clearWidth * xf;
        for (const z of zSlices) {
          origin.set(x, yStart, z);
          rc.set(origin, dirUp);
          const hitsU = rc.intersectObject(wrapper, true);
          for (const h of hitsU) {
            if (h.point.y > finalBox.min.y + finalSize.y * 0.35 && h.point.y < finalBox.min.y + finalSize.y * 0.86) {
              topHits.push(h.point.y);
              lintelZHits.push(h.point.z);
              break;
            }
          }
        }
      }

      // Restaurar el side original de cada material
      for (const item of savedSides) {
        item.mat.side = item.side;
      }

      const topInner = topHits.length
        ? medianValue(topHits)
        : (finalBox.min.y + finalSize.y * 0.66);

      // Extender ligeramente dentro del marco sólido para garantizar 0 mm de hueco sin sobresalir jamás
      const bottomY   = -0.65; // Entra bajo la superficie del agua
      const sideEmbed = Math.min(0.42, clearWidth * 0.024);
      const topEmbed  = Math.min(0.68, (topInner - bottomY) * 0.022);

      const width   = clearWidth + sideEmbed * 2.0;
      const topY    = Math.min(topInner + topEmbed, finalBox.max.y - finalSize.y * 0.16);
      const height  = Math.max(topY - bottomY, finalSize.y * 0.40);
      const centerY = bottomY + height * 0.5;

      // Posición Z dentro del espesor interior del marco (ligeramente hacia la cara posterior del vano)
      const zSamples = lintelZHits.length ? lintelZHits : frameZHits;
      let zOffset = -Math.max(0.85, finalSize.z * 0.15);
      if (zSamples.length >= 2) {
        const zMin = Math.min(...zSamples);
        const zMax = Math.max(...zSamples);
        const zSpan = zMax - zMin;
        zOffset = zSpan > 0.25
          ? THREE.MathUtils.lerp(zMin, zMax, 0.32)
          : (medianValue(zSamples) - 0.18);
      }
      zOffset = THREE.MathUtils.clamp(zOffset, finalBox.min.z + 0.30, finalBox.max.z - 0.30);

      return {
        centerX,
        centerY,
        width,
        height,
        clearWidth,
        outerHalfW: finalSize.x * 0.5,
        zOffset
      };
    }

    function normalizePortalTemplate(rawScene) {
      const wrapper = new THREE.Group();
      wrapper.add(rawScene);

      rawScene.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(rawScene);
      let size = box.getSize(new THREE.Vector3());

      if (size.z > size.x * 1.15) {
        rawScene.rotation.y = Math.PI / 2;
      }

      rawScene.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(rawScene);
      size = box.getSize(new THREE.Vector3());

      let scale = CONFIG.portalTargetHeight / Math.max(size.y, 0.001);
      if (size.x * scale > CONFIG.portalMaxWidth) {
        scale = CONFIG.portalMaxWidth / Math.max(size.x, 0.001);
      }
      rawScene.scale.setScalar(scale);
      rawScene.updateMatrixWorld(true);

      box = new THREE.Box3().setFromObject(rawScene);
      const center = box.getCenter(new THREE.Vector3());
      rawScene.position.x -= center.x;
      rawScene.position.z -= center.z;
      rawScene.position.y -= (box.min.y + CONFIG.portalWaterSink);

      rawScene.updateMatrixWorld(true);
      const finalBox = new THREE.Box3().setFromObject(wrapper);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const aperture = computePortalInnerAperture(wrapper, finalBox, finalSize);

      const matRecords = [];
      rawScene.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          obj.frustumCulled = false;
          const isArray = Array.isArray(obj.material);
          const mats = (isArray ? obj.material : [obj.material]).map((orig) => {
            const m = orig.clone();
            if (m.isMeshStandardMaterial) {
              m.roughness = Math.min(m.roughness ?? 0.55, 0.78);
              m.envMapIntensity = 1.35;
            }
            matRecords.push({
              mat: m,
              origTransparent: !!m.transparent,
              origDepthWrite: m.depthWrite !== undefined ? m.depthWrite : true,
              origOpacity: m.opacity !== undefined ? m.opacity : 1.0,
              hasEmissive: !!m.emissive,
              origEmissive: m.emissive ? m.emissive.clone() : new THREE.Color(0x000000),
              origEmissiveIntensity: m.emissiveIntensity !== undefined ? m.emissiveIntensity : 0.0
            });
            return m;
          });
          obj.material = isArray ? mats : mats[0];
        }
      });

      const sampledVerts = sampleVerticesFromTemplate(wrapper, 280);
      return { wrapper, finalSize, aperture, matRecords, sampledVerts };
    }

    function createFallbackMonumentalPortal() {
      const wrapper = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: 0x6e5a44,
        metalness: 0.76,
        roughness: 0.34,
        envMapIntensity: 1.35
      });
      const h = CONFIG.portalTargetHeight;
      const w = h * 0.76;
      const thick = 5.2;
      const depth = 6.2;

      const leftPillar = new THREE.Mesh(new THREE.BoxGeometry(thick, h * 0.72, depth), mat);
      leftPillar.position.set(-w * 0.5 + thick * 0.5, h * 0.36, 0);
      const rightPillar = leftPillar.clone();
      rightPillar.position.x = w * 0.5 - thick * 0.5;
      const topBeam = new THREE.Mesh(new THREE.BoxGeometry(w, thick * 1.4, depth * 1.05), mat);
      topBeam.position.set(0, h * 0.72, 0);

      wrapper.add(leftPillar, rightPillar, topBeam);
      return normalizePortalTemplate(wrapper);
    }

    function setupMonumentalPortal(normalizedPortal) {
      if (portalModelPivot) {
        portalGroup.remove(portalModelPivot);
        disposeHierarchy(portalModelPivot);
      }
      if (portalVortexMesh) {
        portalGroup.remove(portalVortexMesh);
        portalVortexMesh.geometry.dispose();
      }

      const { wrapper, finalSize, aperture, matRecords, sampledVerts } = normalizedPortal;
      portalModelPivot   = wrapper;
      portalMatRecords   = matRecords;
      portalSampledVerts = sampledVerts;
      portalApertureData = aperture;
      portalMaterialized = false;

      portalGroup.add(portalModelPivot);

      portalUniforms.uAspect.value = aperture.width / Math.max(aperture.height, 0.01);
      portalVortexMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(aperture.width, aperture.height),
        portalVortexMaterial
      );
      portalVortexMesh.position.set(aperture.centerX, aperture.centerY, aperture.zOffset);
      portalVortexMesh.frustumCulled = false;
      portalGroup.add(portalVortexMesh);

      buildPortalParticleCloud(aperture);

      const frontOffset = Math.max(finalSize.z * 0.55, 6.0) + 4.5;
      portalGlowLight.position.set(aperture.centerX, aperture.centerY * 0.78, CONFIG.portalBasePosition.z + frontOffset);
      portalCrownLight.position.set(aperture.centerX, aperture.centerY * 1.45, CONFIG.portalBasePosition.z + frontOffset + 3.0);
      waterUniforms.uPortalPos.value.set(aperture.centerX, aperture.centerY, CONFIG.portalBasePosition.z);
    }

    const BLUE_MAT_COLOR       = new THREE.Color(0x28a4ff);
    const GOLD_PORTAL_EMISSIVE = new THREE.Color(0xd8a856);
    const BLUE_PORTAL_EMISSIVE = new THREE.Color(0x38b6ff);

    function setPortalMaterialization(progress, timeSec) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);
      portalUniforms.uReveal.value = p;

      if (!portalModelPivot) return;

      if (p <= 0.001) {
        portalModelPivot.visible = false;
        portalMaterialized = false;
        return;
      }

      portalModelPivot.visible = true;
      const easeOut = 1.0 - Math.pow(1.0 - p, 3.0);
      portalGroup.scale.setScalar(THREE.MathUtils.lerp(0.86, 1.0, easeOut));

      if (p >= 0.999) {
        if (!portalMaterialized) {
          portalMaterialized = true;
          portalGroup.scale.setScalar(1.0);
          for (const rec of portalMatRecords) {
            rec.mat.transparent = rec.origTransparent;
            rec.mat.depthWrite  = rec.origDepthWrite;
            rec.mat.opacity     = rec.origOpacity;
            if (rec.hasEmissive) {
              rec.mat.emissive.copy(rec.origEmissive);
              rec.mat.emissiveIntensity = rec.origEmissiveIntensity;
            }
            rec.mat.needsUpdate = true;
          }
        }
        return;
      }

      portalMaterialized = false;
      const glowBell = Math.sin(p * Math.PI);
      const bluePulse = 0.60 + 0.40 * Math.sin(timeSec * 8.2);

      for (const rec of portalMatRecords) {
        if (!rec.mat.transparent) {
          rec.mat.transparent = true;
          rec.mat.needsUpdate = true;
        }
        rec.mat.depthWrite = p > 0.58 ? rec.origDepthWrite : false;
        rec.mat.opacity = rec.origOpacity * smoothstepJS(0.04, 0.84, p);

        if (rec.hasEmissive) {
          rec.mat.emissive.lerpColors(BLUE_PORTAL_EMISSIVE, GOLD_PORTAL_EMISSIVE, smoothstepJS(0.45, 1.0, p));
          rec.mat.emissiveIntensity = THREE.MathUtils.lerp(
            rec.origEmissiveIntensity,
            1.35 * bluePulse,
            glowBell
          );
        }
      }
    }

    let materializePoints = null;
    const matParticleUniforms = {
      uTime:    { value: 0 },
      uMatTime: { value: -1.0 },
      uRatio:   { value: Math.min(window.devicePixelRatio, 2) }
    };

    function buildMaterializeParticles(sampledBoatVerts) {
      if (materializePoints) {
        scene.remove(materializePoints);
        materializePoints.geometry.dispose();
        materializePoints.material.dispose();
        materializePoints = null;
      }

      const perBoatCount = sampledBoatVerts.length;
      const sceneExtraCount = 340;
      const total = boats.length * perBoatCount + sceneExtraCount;

      const positions = new Float32Array(total * 3);
      const delays    = new Float32Array(total);
      const seeds     = new Float32Array(total);
      const kinds     = new Float32Array(total);

      const tmpVec = new THREE.Vector3();
      let ptr = 0;

      boats.forEach((b) => {
        b.group.updateMatrixWorld(true);
        const boatDelay = b.matDelay;
        for (let i = 0; i < perBoatCount; i++) {
          tmpVec.copy(sampledBoatVerts[i]).applyMatrix4(b.group.matrixWorld);
          positions[ptr * 3]     = tmpVec.x;
          positions[ptr * 3 + 1] = tmpVec.y;
          positions[ptr * 3 + 2] = tmpVec.z;
          delays[ptr] = boatDelay + Math.random() * 0.28;
          seeds[ptr]  = Math.random();
          kinds[ptr]  = 0.0;
          ptr++;
        }
      });

      for (let i = 0; i < sceneExtraCount; i++) {
        const isPortalCloud = i > sceneExtraCount * 0.60;
        if (isPortalCloud && portalSampledVerts.length > 0) {
          const pv = portalSampledVerts[i % portalSampledVerts.length];
          positions[ptr * 3]     = CONFIG.portalBasePosition.x + pv.x + (Math.random() - 0.5) * 3.0;
          positions[ptr * 3 + 1] = Math.max(0.6, pv.y + (Math.random() - 0.5) * 3.0);
          positions[ptr * 3 + 2] = CONFIG.portalBasePosition.z + pv.z + (Math.random() - 0.5) * 3.5;
          delays[ptr] = 0.70 + Math.random() * 0.75;
          kinds[ptr]  = 2.0;
        } else {
          positions[ptr * 3]     = (Math.random() - 0.5) * 34;
          positions[ptr * 3 + 1] = 0.08 + Math.random() * 0.6;
          positions[ptr * 3 + 2] = 2.0 - Math.random() * 72;
          delays[ptr] = Math.random() * 1.1;
          kinds[ptr]  = 1.0;
        }
        seeds[ptr] = Math.random();
        ptr++;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aDelay',   new THREE.BufferAttribute(delays, 1));
      geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds, 1));
      geo.setAttribute('aKind',    new THREE.BufferAttribute(kinds, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: matParticleUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
        vertexShader: /* glsl */ `
          attribute float aDelay;
          attribute float aSeed;
          attribute float aKind;

          uniform float uTime;
          uniform float uMatTime;
          uniform float uRatio;

          varying float vAlpha;
          varying float vPulse;
          varying float vKind;

          void main() {
            vKind = aKind;
            if (uMatTime < 0.0) {
              vAlpha = 0.0;
              gl_PointSize = 0.0;
              gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
              return;
            }

            float localT = uMatTime - aDelay;
            if (localT < 0.0) {
              vAlpha = 0.0;
              gl_PointSize = 0.0;
              gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
              return;
            }

            float dur = aKind < 0.5 ? 3.2 : 3.6;
            float p = clamp(localT / dur, 0.0, 1.0);
            vec3 pos = position;

            float freq = 5.2 + fract(aSeed * 7.13) * 4.8;
            float pulse = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * freq + aSeed * 31.4));
            vPulse = pulse;

            if (aKind < 0.5) {
              float gather = smoothstep(0.0, 0.44, p);
              float driftUp = smoothstep(0.66, 1.0, p);
              float angle = (1.0 - gather) * 4.2 + aSeed * 6.28318;
              float swirlR = (1.0 - gather) * (0.38 + fract(aSeed * 13.7) * 0.95);

              pos.x += cos(angle) * swirlR;
              pos.z += sin(angle) * swirlR;
              pos.y += -(1.0 - gather) * (0.30 + fract(aSeed * 5.9) * 0.45)
                     + driftUp * (1.15 + fract(aSeed * 19.3) * 1.65);

              vAlpha = smoothstep(0.0, 0.14, p) * (1.0 - smoothstep(0.68, 1.0, p));
            } else {
              pos.y += p * (2.4 + fract(aSeed * 11.1) * 3.0);
              pos.x += sin(uTime * 1.4 + aSeed * 12.0) * (aKind > 1.5 ? 1.0 : 0.55);
              pos.z += cos(uTime * 1.1 + aSeed * 9.0) * (aKind > 1.5 ? 1.0 : 0.55);
              vAlpha = smoothstep(0.0, 0.18, p) * (1.0 - smoothstep(0.68, 1.0, p));
            }

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float baseSize = (aKind > 1.5 ? 210.0 : (aKind < 0.5 ? 36.0 : 52.0)) * uRatio;
            float maxPt = (aKind > 1.5 ? 18.0 : 44.0) * uRatio;
            gl_PointSize = clamp((baseSize / max(-mvPosition.z, 1.0)) * (0.65 + 0.60 * pulse), 2.0, maxPt);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;

          varying float vAlpha;
          varying float vPulse;
          varying float vKind;

          void main() {
            if (vAlpha <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;

            float halo = exp(-d * 5.8);
            float core = exp(-d * 14.8);

            vec3 deepBlue  = vec3(0.08, 0.46, 1.00);
            vec3 cyanBlue  = vec3(0.36, 0.84, 1.00);
            vec3 coreWhite = vec3(0.88, 0.97, 1.00);

            vec3 col = mix(deepBlue, cyanBlue, vPulse);
            col = mix(col, coreWhite, core * 0.78);

            float dimPortal = vKind > 1.5 ? 0.60 : 1.0;
            float finalAlpha = (halo * 0.72 + core * 0.60) * vAlpha * (0.50 + 0.45 * vPulse) * dimPortal;
            gl_FragColor = vec4(col * (0.95 + 0.30 * vPulse), finalAlpha);
          }
        `
      });

      materializePoints = new THREE.Points(geo, mat);
      materializePoints.frustumCulled = false;
      materializePoints.visible = false;
      scene.add(materializePoints);
    }

    const ambientParticleUniforms = {
      uTime:        { value: 0 },

    };
    const ambientPoints = (() => {
      const count = 240;
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const isBlue = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const nearBoats = i < 140;
        positions[i * 3]     = nearBoats ? (Math.random() - 0.5) * 24 : (Math.random() - 0.5) * 44;
        positions[i * 3 + 1] = nearBoats ? (0.35 + Math.random() * 3.8) : (0.6 + Math.random() * 8.5);
        positions[i * 3 + 2] = nearBoats ? (2.5 - Math.random() * 18) : (4.0 - Math.random() * 86);
        phases[i] = Math.random() * Math.PI * 2;
        isBlue[i] = i < 185 ? 0.0 : 1.0;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aIsBlue',  new THREE.BufferAttribute(isBlue, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: ambientParticleUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          attribute float aPhase;
          attribute float aIsBlue;
          uniform float uTime;
          uniform float uReveal;
          uniform float uGalaxyWorld;
          uniform float uRatio;
          varying float vPulse;
          varying float vIsBlue;
          varying float vReveal;

          void main() {
            vec3 pos = position;
            pos.y += sin(uTime * 0.72 + aPhase) * 0.42;
            pos.x += cos(uTime * 0.46 + aPhase * 1.3) * 0.52;
            pos.z += sin(uTime * 0.38 + aPhase * 0.9) * 0.35;
            vPulse = 0.22 + 0.78 * pow(0.5 + 0.5 * sin(uTime * (aIsBlue > 0.5 ? 2.4 : 1.65) + aPhase * 2.1), 1.6);
            vIsBlue = aIsBlue;
            vReveal = uReveal;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float sizeBoost = mix(30.0, 22.0, uGalaxyWorld);
            gl_PointSize = clamp((sizeBoost * uRatio / max(-mvPosition.z, 1.0)) * (0.65 + 0.60 * vPulse), 1.8, 28.0);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;

          uniform float uGalaxyWorld;
          varying float vPulse;
          varying float vIsBlue;
          varying float vReveal;

          void main() {
            if (vReveal <= 0.005) discard;
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float glow = exp(-d * 6.0) * vPulse * vReveal * mix(1.05, 0.65, uGalaxyWorld);
            vec3 fireflyGold = vec3(1.00, 0.88, 0.44);
            vec3 cosmicBlue  = vec3(0.36, 0.82, 1.00);
            vec3 col = mix(fireflyGold, cosmicBlue, vIsBlue * (0.25 + 0.75 * uGalaxyWorld));
            gl_FragColor = vec4(col, glow);
          }
        `
      });
      const pts = new THREE.Points(geo, mat);
      pts.visible = false;
      scene.add(pts);
      return pts;
    })();

    function sampleVerticesFromTemplate(wrapper, maxSamples = 145) {
      wrapper.updateMatrixWorld(true);
      const rawVerts = [];
      const v = new THREE.Vector3();

      wrapper.traverse((obj) => {
        if (obj.isMesh && obj.geometry && obj.geometry.attributes.position) {
          const pos = obj.geometry.attributes.position;
          const stride = Math.max(1, Math.floor(pos.count / 110));
          for (let i = 0; i < pos.count; i += stride) {
            v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
            rawVerts.push(v.clone());
          }
        }
      });

      if (rawVerts.length === 0) {
        for (let i = 0; i < maxSamples; i++) {
          rawVerts.push(new THREE.Vector3(
            (Math.random() - 0.5) * 1.4,
            Math.random() * 1.4,
            (Math.random() - 0.5) * 3.6
          ));
        }
      }

      const sampled = [];
      for (let i = 0; i < maxSamples; i++) {
        const idx = Math.floor((i / maxSamples) * rawVerts.length);
        sampled.push(rawVerts[idx]);
      }
      return sampled;
    }

            if (m.isMeshStandardMaterial) {
