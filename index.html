<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07191d">
  <title>Atmósferas escultóricas | AR</title>
  <style>
    :root { color-scheme: dark; --mint:#8ce7d5; --glass:rgba(5,22,27,.78); }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; min-height:100%; background:#07191d; color:#effbf9;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    body { min-height:100svh; overflow:hidden; }
    #app { position:fixed; inset:0; overflow:hidden; }
    #hud { position:absolute; z-index:5; inset:0; display:flex; flex-direction:column;
      justify-content:space-between; padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      pointer-events:none; }
    .top,.bottom { width:min(100%,560px); margin-inline:auto; }
    .eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mint); font-weight:750; }
    h1 { font-size:clamp(28px,7.5vw,42px); line-height:1.02; margin:10px 0 0; letter-spacing:-.04em; }
    .panel { background:var(--glass); border:1px solid rgba(164,231,221,.2); border-radius:18px;
      padding:14px 15px; backdrop-filter:blur(16px); box-shadow:0 12px 40px #0003; }
    #status { font-size:13px; line-height:1.45; color:#e1f2ef; margin:0 0 12px; }
    .actions { display:flex; gap:9px; flex-wrap:wrap; pointer-events:auto; }
    button { appearance:none; border:0; border-radius:999px; padding:13px 17px; min-height:46px;
      font-weight:750; font-size:13px; cursor:pointer; }
    #start { color:#06201e; background:var(--mint); flex:1; }
    #reset { color:#e9f6f3; background:#ffffff17; border:1px solid #ffffff25; }
    #close { color:#ffdede; background:#ff4d4d22; border:1px solid #ff4d4d55; display:none; flex:1; }
    #fallback { position:absolute; z-index:4; inset:0; display:none; align-items:center; justify-content:center;
      padding:24px; background:linear-gradient(160deg,#0b282d,#07191d); }
    #fallback .panel { max-width:460px; }
    #fallback h2 { margin:0 0 10px; font-size:24px; }
    #fallback p { color:#c3d9d7; font-size:14px; line-height:1.55; }
    .pill { display:inline-block; padding:5px 9px; border-radius:99px; background:#8ce7d51c; color:var(--mint);
      font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; margin-bottom:10px; }
    canvas { display:block; touch-action:none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="top">
      <div class="eyebrow">Experiencia de patrimonio · WebAR</div>
      <h1>Atmósferas<br>escultóricas.</h1>
    </div>
    <div class="bottom panel">
      <p id="status">Preparando la experiencia…</p>
      <div class="actions">
        <button id="start">Iniciar realidad aumentada</button>
        <button id="reset" type="button">Reiniciar</button>
        <button id="close" type="button">Cerrar AR</button>
      </div>
    </div>
  </div>
  <div id="fallback">
    <div class="panel">
      <span class="pill">Compatibilidad del dispositivo</span>
      <h2>AR espacial no disponible aquí</h2>
      <p id="fallbackText">Este navegador no expone WebXR immersive-ar.</p>
    </div>
  </div>
</div>

<!-- ===================================================== -->
<!-- ELEMENTO DE AUDIO: ATMÓSFERA INMERSIVA DE BOSQUE      -->
<!-- ===================================================== -->
<audio id="audioBosque" src="bosque_noche.mp3" preload="auto" loop></audio>

<script type="module">
  import * as THREE from 'three';

  const app          = document.querySelector('#app');
  const statusEl     = document.querySelector('#status');
  const startButton  = document.querySelector('#start');
  const resetButton  = document.querySelector('#reset');
  const closeButton  = document.querySelector('#close');
  const fallback     = document.querySelector('#fallback');
  const fallbackText = document.querySelector('#fallbackText');
  const audioBosque  = document.querySelector('#audioBosque');

  /* ---------------- Sistema de Control de Audio Suave ---------------- */
  let fadeAudioInterval = null;

  function iniciarAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    audioBosque.volume = 0.0;
    
    const playPromise = audioBosque.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        fadeAudioInterval = setInterval(() => {
          if (audioBosque.volume < 0.85) {
            audioBosque.volume = Math.min(0.85, audioBosque.volume + 0.05);
          } else {
            clearInterval(fadeAudioInterval);
          }
        }, 150);
      }).catch(err => {
        console.warn("Audio esperando interacción del usuario:", err);
      });
    }
  }

  function detenerAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    
    fadeAudioInterval = setInterval(() => {
      if (audioBosque.volume > 0.05) {
        audioBosque.volume = Math.max(0, audioBosque.volume - 0.08);
      } else {
        audioBosque.volume = 0;
        audioBosque.pause();
        audioBosque.currentTime = 0;
        clearInterval(fadeAudioInterval);
      }
    }, 100);
  }

  /* ---------------- Renderer / escena ---------------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  app.prepend(renderer.domElement);

  const scene  = new THREE.Scene();

  // Neblina moderada en la escena
  scene.fog = new THREE.FogExp2(0x0b2238, 0.14);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 30);
  scene.add(new THREE.HemisphereLight(0xd8fff7, 0x193c42, 1.6));

  /* ---------------- Textura de partícula ---------------- */
  function makeParticleTexture() {
    const size = 128; const c = document.createElement('canvas');
    c.width = c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0.0, 'rgba(255,255,255,1)');
    g.addColorStop(0.3, 'rgba(200,255,255,0.8)');
    g.addColorStop(1.0, 'rgba(100,200,220,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return tex;
  }
  const particleTexture = makeParticleTexture();

  /* ---------------- Reticle ---------------- */
  const reticleGeo = new THREE.RingGeometry(0.12, 0.17, 48); reticleGeo.rotateX(-Math.PI / 2);
  const reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({ color: 0x9cf7e7, side: THREE.DoubleSide, transparent: true, opacity: 0.95 }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  /* ---------------- Efecto agua + neblina moderada + partículas ---------------- */
  function createAtmosphere() {
    const group = new THREE.Group();

    // --- 1. AGUA (Domain Warping + Normal Map + Fresnel + Neblina) ---
    const textureLoader = new THREE.TextureLoader();
    const waterNormal = textureLoader.load('image_c713d6.png');
    waterNormal.wrapS = THREE.RepeatWrapping;
    waterNormal.wrapT = THREE.RepeatWrapping;

    const waterGeo = new THREE.PlaneGeometry(14.4, 14.4);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uColorDeep: { value: new THREE.Color(0x05142b) },    // Oscuro profundo más azul
        uColorShallow: { value: new THREE.Color(0x2b88c8) }, // Azul vivo, menos verde
        uLightColor: { value: new THREE.Color(0xc9f1ff) },   // Reflejo especular más frío/azulado
        uFogColor: { value: new THREE.Color(0x133352) },     // Color de neblina nocturna azulada
        uFogDensity: { value: 0.14 },                        // Densidad de neblina moderada
        uNormalMap: { value: waterNormal }
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        void main() {
          vUv = uv;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColorDeep;
        uniform vec3 uColorShallow;
        uniform vec3 uLightColor;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        uniform sampler2D uNormalMap;
        varying vec2 vUv;
        varying vec3 vWorldPosition;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p); vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash(i); float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }
        float fbm(vec2 p) {
          float value = 0.0; float amplitude = 0.5; float frequency = 1.0;
          for (int i = 0; i < 4; i++) {
            value += amplitude * noise(p * frequency);
            frequency *= 2.0; amplitude *= 0.5;
          }
          return value;
        }

        void main() {
          vec2 p = (vUv - 0.5) * 2.0 * 4.0; 
          float t = uTime * 0.075; // Velocidad del pantano

          // Domain Warping
          vec2 q = vec2(fbm(p + vec2(0.0, 0.0) + t), fbm(p + vec2(5.2, 1.3) - t));
          vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.5), fbm(p + 4.0 * q + vec2(8.3, 2.8) - t * 0.3));
          
          float height = fbm(p + 4.0 * r);

          // Normales usando la textura animada (Normal Map)
          vec2 uvNormal = vUv * 6.0 + vec2(t * 0.15, -t * 0.1);
          vec3 texNormal = texture2D(uNormalMap, uvNormal).xyz * 2.0 - 1.0;
          vec3 normal = normalize(vec3(texNormal.x * 1.5, texNormal.y * 1.5, 1.0));
          
          vec3 viewDir = normalize(cameraPosition - vWorldPosition);
          vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));

          // Reflejo Especular y Fresnel
          float spec = pow(max(dot(normal, lightDir), 0.0), 24.0);
          float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

          // Color base del agua
          vec3 color = mix(uColorDeep, uColorShallow, smoothstep(0.2, 0.8, height));
          color += uLightColor * spec * 1.5;
          color = mix(color, uLightColor, fresnel * 0.4);

          // Neblina moderada sobre la superficie y la distancia
          float dist = length(cameraPosition - vWorldPosition);
          float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
          float mistNoise = fbm(p * 1.2 - vec2(t * 0.35, t * 0.2));
          float mistLayer = smoothstep(0.35, 0.85, mistNoise) * 0.32;
          color = mix(color, uFogColor, clamp(fogFactor * 0.65 + mistLayer, 0.0, 0.75));

          // Opacidad: Transparente en valles, opaco en crestas y bordes
          float alpha = mix(0.85, 0.99, smoothstep(0.2, 0.8, height));
          alpha = max(alpha, fresnel * 0.8);
          
          // Desvanecimiento del borde del plano
          float edgeFade = 1.0 - smoothstep(0.7, 1.0, length(vUv - 0.5) * 2.0);
          alpha = clamp(alpha, 0.0, 0.95) * edgeFade;

          gl_FragColor = vec4(color, alpha);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 0.02;
    water.frustumCulled = false;
    group.add(water);

    // --- 2. PARTÍCULAS (Shader con aSeed y desvanecimiento por neblina) ---
    const particleCount = 1200;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.sqrt(Math.random()) * 12.3;
      particlePositions[i * 3]     = Math.cos(angle) * radius;
      particlePositions[i * 3 + 1] = 0.15 + Math.random() * 2.4;
      particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
      particleSeeds[i] = Math.random() * Math.PI * 2;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('aSeed', new THREE.BufferAttribute(particleSeeds, 1));

    const particleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uTexture: { value: particleTexture },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        uFogDensity: { value: 0.12 }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        uniform float uFogDensity;
        attribute float aSeed;
        varying float vAlpha;

        void main() {
          vec3 pos = position;
          // Movimiento orgánico individual
          pos.x += sin(uTime * 0.5 + aSeed) * 0.4;
          pos.y += cos(uTime * 0.4 + aSeed * 2.0) * 0.25;
          pos.z += sin(uTime * 0.3 + aSeed * 3.0) * 0.4;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          float dist = length(mvPosition.xyz);
          float fogAtten = exp(-pow(dist * uFogDensity, 2.0));
          
          gl_PointSize = 70.0 * uPixelRatio * (1.0 / -mvPosition.z);
          gl_PointSize = clamp(gl_PointSize, 2.0, 35.0);

          vAlpha = (0.5 + 0.5 * sin(uTime * 1.5 + aSeed * 5.0)) * fogAtten;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        varying float vAlpha;
        void main() {
          vec4 texColor = texture2D(uTexture, gl_PointCoord);
          gl_FragColor = vec4(texColor.rgb, texColor.a * vAlpha);
        }
      `
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    particles.frustumCulled = false;
    group.add(particles);

    group.userData.waterMaterial = waterMat;
    group.userData.particleMaterial = particleMat;
    group.visible = false;
    scene.add(group);
    return group;
  }

  const placedEffect = createAtmosphere();

  /* ---------------- Estado ---------------- */
  let hitTestSource = null;
  let activeSession = null;
  let elapsed = 0;
  let xrSessionStarting = false;
  let arSupported = null;

  /* ---------------- Acciones ---------------- */
  function showFallback(text) {
    fallbackText.textContent = text;
    fallback.style.display = 'flex';
  }

  function placeEffect() {
    if (!reticle.visible) {
      statusEl.textContent = 'Aún no detecto una superficie. Mueve lentamente el teléfono y apunta hacia el suelo.';
      return;
    }
    placedEffect.position.setFromMatrixPosition(reticle.matrix);
    placedEffect.position.y -= 0.01;
    placedEffect.visible = true;
    statusEl.textContent = 'Atmósfera colocada. Muévete alrededor para explorarla.';

    iniciarAudioAmbiente();
  }

  function clearEffect() {
    placedEffect.visible = false;
    reticle.visible = false;
    statusEl.textContent = 'Efecto reiniciado. Apunta al suelo y toca para colocar.';

    detenerAudioAmbiente();
  }

  async function endAR() {
    detenerAudioAmbiente();
    if (activeSession) {
      try { await activeSession.end(); } catch (_) {}
    }
  }

  /* ---------------- Controladores / sesión ---------------- */
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', placeEffect);
  scene.add(controller);

  renderer.xr.addEventListener('sessionstart', async () => {
    activeSession = renderer.xr.getSession();
    fallback.style.display = 'none';

    startButton.style.display = 'none';
    closeButton.style.display = 'block';
    statusEl.textContent = 'AR activa. Apunta al suelo para detectar una superficie.';

    const session = activeSession;
    if (!session) return;

    session.addEventListener('select', placeEffect);

    try {
      const viewerSpace = await session.requestReferenceSpace('viewer');
      if (session !== activeSession) return;
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    } catch (err) {
      statusEl.textContent = 'AR activa, sin seguimiento de superficies: ' + (err?.message || err);
    }

    session.addEventListener('end', () => {
      detenerAudioAmbiente();
      hitTestSource = null;
      activeSession = null;
      xrSessionStarting = false;
      startButton.disabled = false;
      startButton.textContent = 'Iniciar realidad aumentada';
      statusEl.textContent = 'Sesión finalizada.';
    }, { once: true });
  });

  renderer.xr.addEventListener('sessionend', () => {
    detenerAudioAmbiente();
    hitTestSource = null;
    activeSession = null;
    xrSessionStarting = false;
    startButton.disabled = false;
    startButton.style.display = '';
    startButton.textContent = 'Iniciar realidad aumentada';
    closeButton.style.display = 'none';
  });

  /* ---------------- Bucle de render ---------------- */
  renderer.setAnimationLoop((time, frame) => {
    elapsed = time * 0.001;

    // Actualizar shaders
    placedEffect.userData.waterMaterial.uniforms.uTime.value = elapsed;
    placedEffect.userData.particleMaterial.uniforms.uTime.value = elapsed;

    if (frame) {
      const refSpace = renderer.xr.getReferenceSpace();
      if (hitTestSource && refSpace) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(refSpace);
          if (pose) {
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            reticle.matrixWorldNeedsUpdate = true;
          } else { reticle.visible = false; }
        } else { reticle.visible = false; }
      }
    }
    renderer.render(scene, camera);
  });

  /* ---------------- Inicio de AR ---------------- */
  async function beginAR() {
    if (xrSessionStarting || renderer.xr.isPresenting || activeSession) {
      statusEl.textContent = 'La RA ya está iniciada o se está abriendo.';
      return;
    }
    if (!navigator.xr) {
      showFallback('Este navegador no ofrece navigator.xr. Prueba Chrome actualizado en Android compatible.');
      return;
    }
    if (arSupported === false) {
      showFallback('El dispositivo no admite sesiones immersive-ar.');
      return;
    }

    xrSessionStarting = true;
    startButton.disabled = true;
    startButton.textContent = 'Iniciando…';
    statusEl.textContent = 'Iniciando la cámara AR…';

    let session = null;
    try {
      session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });
      await renderer.xr.setSession(session);
    } catch (err) {
      if (session && !renderer.xr.isPresenting) {
        try { await session.end(); } catch (_) {}
      }
      const message = err?.message || String(err);
      showFallback(message.includes('already an active')
        ? 'Ya hay una sesión AR activa. Recarga la página y pulsa Iniciar una sola vez.'
        : 'No se pudo iniciar la sesión AR: ' + message + '. Comprueba HTTPS y compatibilidad del dispositivo.');
      statusEl.textContent = 'No se pudo iniciar AR.';
      startButton.disabled = false;
      startButton.textContent = 'Intentar de nuevo';
    } finally {
      if (!renderer.xr.isPresenting && !activeSession) {
        xrSessionStarting = false;
        startButton.disabled = false;
        if (startButton.textContent === 'Iniciando…') {
          startButton.textContent = 'Iniciar realidad aumentada';
        }
      }
    }
  }

  startButton.addEventListener('click', beginAR);
  resetButton.addEventListener('click', clearEffect);
  closeButton.addEventListener('click', endAR);

  document.body.addEventListener('beforexrselect', (e) => {
    const t = e.target;
    if (t && t.closest && t.closest('button, .actions')) e.preventDefault();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((ok) => {
      arSupported = ok;
      statusEl.textContent = ok ? 'Listo. Pulsa “Iniciar realidad aumentada”.' : 'Este dispositivo no admite WebXR immersive-ar.';
      if (!ok) startButton.textContent = 'Ver compatibilidad';
    }).catch(() => {
      statusEl.textContent = 'No se pudo comprobar la compatibilidad. Pulsa “Iniciar”.';
    });
  } else {
    statusEl.textContent = 'Este navegador no ofrece WebXR. Prueba Chrome en Android.';
    startButton.textContent = 'Ver compatibilidad';
  }
</script>
</body>
</html>
