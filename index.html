        arSupported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      }
      if (modelReady) refreshIntroOrbs();
    }
    detectXRCapabilities();

    // Lanzador 3D Web
    orbWeb.addEventListener('click', () => {
      if (!modelReady) return;
      isARMode = false;
      scene.background = NIGHT_BG;
      scene.fog = NIGHT_FOG;
      waterUniforms.uIsAR.value = 0.0;
      renderer.setClearAlpha(1);
      vrLasers.forEach(l => l.visible = false);
      camera.position.set(0, CONFIG.defaultEyeHeight, 0);
      camYaw = 0;
      camPitch = -0.02;
      updateDesktopCameraLook();

      audioEngine.toggle(true);
      startMaterialization('web');
    });

    // Lanzadores AR y VR
    orbAR.addEventListener('click', () => startXRMode('immersive-ar'));
    orbVR.addEventListener('click', () => startXRMode('immersive-vr'));

    async function startXRMode(xrMode) {
      if (!modelReady || !('xr' in navigator)) return;
      try {
        audioEngine.toggle(true);

        const isAR = (xrMode === 'immersive-ar');
        const sessionInit = isAR
          ? {
              optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'dom-overlay'],
              domOverlay: { root: document.getElementById('hud') }
            }
          : {
              optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
            };

        const session = await navigator.xr.requestSession(xrMode, sessionInit);
        isARMode = isAR;

        if (isARMode) {
          scene.background = null;
          scene.fog = null;
          waterUniforms.uIsAR.value = 1.0;
          renderer.setClearAlpha(0);
          vrLasers.forEach(l => l.visible = false);
        } else {
          scene.background = NIGHT_BG;
          scene.fog = NIGHT_FOG;
          waterUniforms.uIsAR.value = 0.0;
          renderer.setClearAlpha(1);
          vrLasers.forEach(l => l.visible = true);
        }

        if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
        await renderer.xr.setSession(session);
        camera.position.set(0, 0, 0);

        startMaterialization(isARMode ? 'ar' : 'vr');

        session.addEventListener('end', () => {
          isARMode = false;
          waterUniforms.uIsAR.value = 0.0;
          vrLasers.forEach(l => l.visible = false);
          showIntroState();
        });
      } catch (err) {
        console.warn('No se pudo iniciar la sesión WebXR:', err);
      }
    }

    // =========================================================================
    // BUCLE PRINCIPAL DE ANIMACIÓN (60–72+ FPS)
    // =========================================================================
    const clock = new THREE.Clock();
    const worldCamPos = new THREE.Vector3();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();

      waterUniforms.uTime.value = t;
      portalUniforms.uTime.value = t;
      matParticleUniforms.uTime.value = t;
      ambientParticleUniforms.uTime.value = t;

      // =====================================================================
      // ESTADO: INTRO (Render del Wireframe Azul 2D de barcagrullas.glb)
      // =====================================================================
      if (currentState === STATE.INTRO) {
        introAuraUniforms.uTime.value = t;
        introDustUniforms.uTime.value = t;

        if (introWireframePivot) {
          introFadeIn = Math.min(introFadeIn + dt * 0.9, 1.0);
          const pulse = 0.78 + 0.22 * Math.sin(t * 2.1);

          introAuraUniforms.uFade.value = introFadeIn;
          if (introEdgeMat)     introEdgeMat.opacity     = 0.34 * introFadeIn * pulse;
          if (introMeshWireMat) introMeshWireMat.opacity = 0.055 * introFadeIn * pulse;

          // Flotación gráfica sutil + micro-paralaje 2D
          introWireframePivot.position.y = Math.sin(t * 0.95) * 0.07;
          const targetRotY = (Math.PI / 2 - 0.10) + introParallaxX * 0.10;
          const targetRotX = 0.04 + introParallaxY * 0.05;
          introWireframePivot.rotation.y = THREE.MathUtils.lerp(introWireframePivot.rotation.y, targetRotY, dt * 3.0);
          introWireframePivot.rotation.x = THREE.MathUtils.lerp(introWireframePivot.rotation.x, targetRotX, dt * 3.0);
        }

        renderer.render(scene, camera);
        return;
      }

      // Grid snapping del agua para cero parpadeo de vértices
      waterMesh.position.x = Math.round(playerRig.position.x / WATER_STEP) * WATER_STEP;
      waterMesh.position.z = Math.round(playerRig.position.z / WATER_STEP) * WATER_STEP;

      portalRing.rotation.z = t * 0.14;

      if (matElapsed >= 0 && matElapsed < 6.5) {
        matElapsed += dt;
        matParticleUniforms.uMatTime.value = matElapsed;
      }

      // =====================================================================
      // ESTADO: MATERIALIZING (Partículas azules pulsantes + escenario + barcas)
      // =====================================================================
      if (currentState === STATE.MATERIALIZING) {
        stateTimer += dt;
        const u = Math.min(stateTimer / CONFIG.materializeDuration, 1.0);

        const waterP = smoothstepJS(0.0, 0.72, u);
        waterUniforms.uWaterReveal.value = waterP;

        if (!isARMode) {
          starMat.opacity = smoothstepJS(0.10, 0.85, u) * 0.80;
        }
        ambientParticleUniforms.uReveal.value = smoothstepJS(0.45, 1.0, u);

        const blueBell = Math.sin(u * Math.PI);
        const blueBeat = 0.65 + 0.35 * Math.sin(t * 7.8);
        materializeBlueLight.intensity = blueBell * blueBeat * 11.5;

        for (const b of boats) {
          const boatLocal = (stateTimer - b.matDelay) / 2.05;
          setBoatMaterialization(b, boatLocal, t);
        }

        const portalP = smoothstepJS(0.26, 0.96, u);
        portalUniforms.uReveal.value = portalP;
        portalGroup.scale.setScalar(THREE.MathUtils.lerp(0.35, 1.0, portalP));
        portalRingMat.opacity = portalP;
        portalRingMat.emissive.lerpColors(BLUE_PORTAL_EMISSIVE, GOLD_PORTAL_EMISSIVE, smoothstepJS(0.35, 0.95, portalP));
        portalRingMat.emissiveIntensity = THREE.MathUtils.lerp(1.9, 1.15, portalP);
        portalGlowLight.intensity = portalP * 8.5;

        if (u >= 1.0) {
          waterUniforms.uWaterReveal.value = 1.0;
          portalUniforms.uReveal.value = 1.0;
          portalGroup.scale.setScalar(1.0);
          portalRingMat.opacity = 1.0;
          portalRingMat.transparent = false;
          portalRingMat.needsUpdate = true;
          portalRingMat.emissive.copy(GOLD_PORTAL_EMISSIVE);
          portalRingMat.emissiveIntensity = 1.15;
          portalGlowLight.intensity = 8.5;
          materializeBlueLight.intensity = 0.0;
          ambientParticleUniforms.uReveal.value = 1.0;
          for (const b of boats) setBoatMaterialization(b, 1.0, t);

          currentState = STATE.IDLE;
          if (activeMode === 'ar') {
            setHUD('AR · Barcas en calma', 'Camina hacia una barca o tócala para abordar', false);
          } else if (activeMode === 'vr') {
            setHUD('VR · Barcas en calma', 'Apunta o camina hacia una barca para abordar', false);
          } else {
            setHUD('Embarcadero · En calma', 'Arrastra para mirar · Toca una barca para abordar', false);
          }
        }

        audioEngine.update(dt, 0, 0);
        renderer.render(scene, camera);
        return;
      }

      // =====================================================================
      // INTERACCIÓN XR EN REPOSO + FLOTACIÓN ORGÁNICA
      // =====================================================================
      if (currentState === STATE.IDLE && renderer.xr.isPresenting) {
        hoveredBoatIndex = -1;
        if (!isARMode) {
          for (const ctrl of controllers) {
            const hit = raycastFromController(ctrl);
            if (hit) { hoveredBoatIndex = hit.index; break; }
          }
        }

        camera.getWorldPosition(worldCamPos);
        for (const b of boats) {
          const distXZ = Math.hypot(
            worldCamPos.x - b.group.position.x,
            worldCamPos.z - b.group.position.z
          );
          if (distXZ < CONFIG.proximityBoardDist) {
            startBoarding(b);
            break;
          }
        }
      }

      for (const b of boats) {
        const isHovered = (b.index === hoveredBoatIndex && currentState === STATE.IDLE);
        const targetRingOpacity = (currentState === STATE.IDLE) ? (isHovered ? 0.85 : 0.18) : 0.0;
        b.beaconRing.material.opacity = THREE.MathUtils.lerp(
          b.beaconRing.material.opacity,
          targetRingOpacity,
          dt * 6
        );
        const targetScale = isHovered ? 1.12 : 1.0;
        b.beaconRing.scale.setScalar(
          THREE.MathUtils.lerp(b.beaconRing.scale.x, targetScale, dt * 6)
        );

        if (b !== activeBoat) {
          const ph = b.phaseOffset;
          b.group.position.y = Math.sin(t * 1.15 + ph) * 0.05;
          b.visual.rotation.x = Math.sin(t * 0.90 + ph) * 0.028;
          b.visual.rotation.z = Math.cos(t * 1.05 + ph) * 0.034;
        }
      }

      // =====================================================================
      // ABORDAJE, NAVEGACIÓN (20s) Y CRUCE DEL PORTAL
      // =====================================================================
      let targetMotionFactor = 0.0;

      if (currentState === STATE.BOARDING && activeBoat) {
        stateTimer += dt;
        const u = Math.min(stateTimer / CONFIG.boardingDuration, 1.0);
        const smooth = u * u * (3 - 2 * u);

        const targetRigPos = activeBoat.group.position.clone().add(CONFIG.seatOffset);
        playerRig.position.lerpVectors(boardStartRigPos, targetRigPos, smooth);
        activeBoat.group.position.y = -Math.sin(u * Math.PI) * 0.075;

        if (u >= 1.0) {
          currentState = STATE.NAVIGATING;
          stateTimer = 0;
          setHUD('Navegando hacia el portal', 'Observa libremente a tu alrededor', false);
        }
      }

      else if (currentState === STATE.NAVIGATING && activeBoat && navCurve) {
        stateTimer += dt;
        const rawT = Math.min(stateTimer / CONFIG.voyageDuration, 1.0);
        navProgress = voyageEaseC1(rawT);

        const posOnCurve = navCurve.getPoint(navProgress);
        const tangent = navCurve.getTangent(navProgress);

        const stepDist = posOnCurve.distanceTo(prevBoatPos);
        currentBoatSpeed = dt > 0 ? stepDist / dt : 0;
        prevBoatPos.copy(posOnCurve);

        targetMotionFactor = THREE.MathUtils.clamp(currentBoatSpeed / 3.8, 0.0, 1.0);

        activeBoat.group.position.copy(posOnCurve);
        activeBoat.group.position.y += Math.sin(t * 2.15) * (0.04 + 0.045 * smoothMotionFactor);

        const targetYaw = Math.atan2(tangent.x, tangent.z);
        activeBoat.group.rotation.y = lerpAngle(activeBoat.group.rotation.y, targetYaw, dt * 3.2);

        activeBoat.visual.rotation.x = Math.sin(t * 1.95) * (0.025 + 0.025 * smoothMotionFactor);
        activeBoat.visual.rotation.z = Math.cos(t * 1.55) * (0.030 + 0.032 * smoothMotionFactor);

        playerRig.position.set(
          posOnCurve.x + CONFIG.seatOffset.x,
          posOnCurve.y + CONFIG.seatOffset.y,
          posOnCurve.z + CONFIG.seatOffset.z
        );

        waterUniforms.uBoatPos.value.copy(posOnCurve);
        currentBoatDir.set(tangent.x, tangent.z).normalize();
        waterUniforms.uBoatDir.value.copy(currentBoatDir);
        waterUniforms.uBoatSpeed.value = currentBoatSpeed;

        waterUniforms.uFlowOffset.value.x -= currentBoatDir.x * currentBoatSpeed * dt * 0.55;
        waterUniforms.uFlowOffset.value.y -= currentBoatDir.y * currentBoatSpeed * dt * 0.55;

        updateWaterSpray(dt, posOnCurve, currentBoatDir, smoothMotionFactor);

        const proximity = smoothstepJS(0.45, 1.0, navProgress);
        portalUniforms.uProximity.value = proximity;
        portalGlowLight.intensity = 8.5 + proximity * 14.0;

        if (navProgress > 0.92) {
          const preFlash = (navProgress - 0.92) / 0.08;
          portalFlashMesh.visible = true;
          portalFlashMat.opacity = Math.min(preFlash * 0.68, 0.68);
        }

        if (rawT >= 1.0) {
          currentState = STATE.PORTAL_CROSSING;
          stateTimer = 0;
          flashSwapped = false;
          portalFlashMesh.visible = true;
          setHUD('Cruzando el umbral...', '', false);
        }
      }

      else if (currentState === STATE.PORTAL_CROSSING) {
        stateTimer += dt;
        const riseTime = 0.45;
        const holdTime = CONFIG.flashPeakDuration;
        const fadeTime = 1.25;

        if (stateTimer < riseTime) {
          const k = stateTimer / riseTime;
          portalFlashMat.opacity = THREE.MathUtils.lerp(0.68, 1.0, k);
        } else if (stateTimer < riseTime + holdTime) {
          portalFlashMat.opacity = 1.0;
          if (!flashSwapped) {
            flashSwapped = true;
            voyagesCompleted += 1;
            onPortalCrossed({
              voyagesCompleted,
              boat: activeBoat,
              isARMode
            });
          }
        } else if (stateTimer < riseTime + holdTime + fadeTime) {
          const k = (stateTimer - riseTime - holdTime) / fadeTime;
          portalFlashMat.opacity = 1.0 - (k * k * (3 - 2 * k));
        } else {
          portalFlashMat.opacity = 0.0;
          portalFlashMesh.visible = false;
          portalGlowLight.intensity = 8.5;
          currentState = STATE.IDLE;
        }
      }

      smoothMotionFactor = THREE.MathUtils.lerp(smoothMotionFactor, targetMotionFactor, dt * 2.8);
      waterUniforms.uMotionFactor.value = smoothMotionFactor;
      if (currentState !== STATE.NAVIGATING) {
        updateWaterSpray(dt, waterUniforms.uBoatPos.value, currentBoatDir, 0);
      }

      audioEngine.update(dt, smoothMotionFactor, portalUniforms.uProximity.value);
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      const pr = Math.min(window.devicePixelRatio, 2);
      matParticleUniforms.uRatio.value = pr;
      ambientParticleUniforms.uRatio.value = pr;
      introDustUniforms.uRatio.value = pr;
      positionIntroStage();
    });
  </script>
</body>
</html>
