
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07191d">
  <title>Atmósferas escultóricas | AR</title>
  <style>
    :root {
      color-scheme: dark;
      --mint: #8ce7d5;
      --accent: #6ee0ff;
      --glass: rgba(5, 22, 27, .72);
      --glass-border: rgba(164, 231, 221, .22);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; width: 100%; min-height: 100%;
      background: #07191d; color: #effbf9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100svh; overflow: hidden; }
    #app { position: fixed; inset: 0; overflow: hidden; }
    canvas { display: block; touch-action: none; }

    /* ================= HUD ================= */
    #hud {
      position: absolute; z-index: 5; inset: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .top { width: min(100%, 560px); margin-inline: auto; }
    .eyebrow {
      font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--mint); font-weight: 750;
    }
    h1 {
      font-size: clamp(28px, 7.5vw, 42px); line-height: 1.02;
      margin: 10px 0 0; letter-spacing: -.04em;
      background: linear-gradient(120deg, #ffffff 30%, #9feadd 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    /* ================= Espacio reservado para fotografía de portada ================= */
    /* Para añadir la foto después, coloca una imagen dentro de #fotoPortada o usa
       background-image: url('portada.jpg'); background-size: cover; background-position: center. */
    .foto-portada {
      position: absolute; top: 51%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(74vw, 340px); aspect-ratio: 4 / 5; max-height: 43svh;
      border-radius: 24px;
      border: 1px solid rgba(164, 231, 221, .2);
      background:
        radial-gradient(ellipse at 50% 35%, rgba(110, 224, 255, .055), transparent 62%),
        linear-gradient(155deg, rgba(255,255,255,.025), rgba(140,231,213,.012));
      box-shadow: 0 18px 55px rgba(0,0,0,.15), inset 0 0 0 1px rgba(255,255,255,.018);
      overflow: hidden; pointer-events: none;
      transition: opacity .45s ease, transform .45s ease, visibility .45s ease;
    }
    .foto-portada.oculto {
      opacity: 0; visibility: hidden;
      transform: translate(-50%, -48%) scale(.98);
    }
    .foto-portada img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Estado accesible para lectores de pantalla, sin cuadro de instrucciones en portada */
    .status-sr {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
    }

    /* Instrucción breve dentro de la experiencia AR */
    #arHint {
      position: absolute; z-index: 18;
      left: 50%; bottom: calc(124px + env(safe-area-inset-bottom));
      transform: translateX(-50%); width: min(88%, 420px);
      display: none; padding: 11px 16px; border-radius: 15px;
      background: rgba(5, 22, 27, .68);
      border: 1px solid rgba(164, 231, 221, .22);
      color: #effbf9; text-align: center;
      font-size: 13px; line-height: 1.4; font-weight: 600; letter-spacing: .01em;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 28px #0004; pointer-events: none;
    }
    #arHint.activo { display: block; }

    /* ================= Panel inferior (solo inicio) ================= */
    .bottom { width: min(100%, 560px); margin-inline: auto; }
    .panel {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 14px 15px;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 44px #0005;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; pointer-events: auto; }
    button {
      appearance: none; border: 0; border-radius: 999px;
      padding: 14px 20px; min-height: 48px;
      font-weight: 750; font-size: 14px; cursor: pointer;
      font-family: inherit;
      transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    }
    button:active { transform: scale(.96); }
    #start {
      color: #06201e;
      background: linear-gradient(120deg, var(--mint), var(--accent));
      flex: 1;
      box-shadow: 0 8px 24px rgba(140, 231, 213, .25);
    }
    #start:disabled { opacity: .6; cursor: not-allowed; }

    /* ================= Controles flotantes AR ================= */
    #controlesAR {
      position: absolute; top: calc(16px + env(safe-area-inset-top));
      right: 16px; z-index: 20;
      display: none; gap: 10px; pointer-events: auto;
    }
    #controlesAR.activo { display: flex; }
    .btn-flotante {
      width: 44px; height: 44px; min-height: 44px; padding: 0;
      border-radius: 50%;
      background: rgba(10, 30, 36, .78);
      border: 1px solid rgba(164, 231, 221, .28);
      color: #effbf9;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; line-height: 1;
      box-shadow: 0 8px 24px #0005;
    }
    #close.btn-flotante { color: #ffc7c7; border-color: rgba(255, 100, 100, .4); }

    /* ================= Controles de foto y vídeo ================= */
    #contenedorControles {
      position: absolute; bottom: calc(22px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%) translateY(20px);
      z-index: 20; display: flex; flex-direction: column; align-items: center;
      gap: 12px; pointer-events: none; opacity: 0;
      transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
    }
    #contenedorControles.activo {
      opacity: 1; transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .dock-captura {
      display: flex; align-items: center; justify-content: center; gap: 13px;
      background: rgba(7, 24, 28, .78);
      border: 1px solid rgba(164, 231, 221, .24);
      padding: 9px 12px; border-radius: 50px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 14px 40px #0006;
      pointer-events: auto;
    }
    .btn-captura {
      position: relative; width: 61px; height: 61px; min-height: 61px; padding: 0;
      border-radius: 50%; border: 1px solid rgba(255,255,255,.74);
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.17), rgba(255,255,255,.035) 70%);
      color: #f3fffb; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 4px rgba(140, 231, 213, .07), inset 0 0 0 1px rgba(255,255,255,.035);
      transition: transform .15s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .btn-captura svg { width: 25px; height: 25px; display: block; }
    .btn-captura:active { transform: scale(.92); }
    #btnFoto { box-shadow: 0 0 0 4px rgba(140,231,213,.12), 0 0 24px rgba(140,231,213,.08); }
    #btnVideo { color: #b7ff77; border-color: rgba(183,255,119,.72); }
    #btnVideo.grabando {
      color: #ff6575; border-color: rgba(255,101,117,.92);
      box-shadow: 0 0 0 5px rgba(255,101,117,.12), 0 0 28px rgba(255,55,85,.22);
      animation: pulsoGrabacion 1.2s ease-in-out infinite;
    }
    @keyframes pulsoGrabacion {
      0%,100% { box-shadow: 0 0 0 4px rgba(255,101,117,.09), 0 0 18px rgba(255,55,85,.14); }
      50% { box-shadow: 0 0 0 7px rgba(255,101,117,.17), 0 0 30px rgba(255,55,85,.28); }
    }
    .sr-only {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
    }

    #flashPantalla {
      position: fixed; inset: 0; background: #fff; opacity: 0;
      pointer-events: none; z-index: 100; transition: opacity .2s;
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(.9);
      background: rgba(10, 30, 36, .92);
      border: 1px solid rgba(164, 231, 221, .3);
      color: #e9f8f5;
      padding: 12px 22px; border-radius: 99px;
      font-size: 13px; font-weight: 600;
      z-index: 150; opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .toast.visible {
      opacity: 1; transform: translate(-50%, -50%) scale(1);
    }

    /* ================= Fallback ================= */
    #fallback {
      position: absolute; z-index: 10; inset: 0;
      display: none; align-items: center; justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #0b282d, #07191d);
    }
    #fallback .panel { max-width: 460px; pointer-events: auto; }
    #fallback h2 { margin: 0 0 10px; font-size: 24px; }
    #fallback p { color: #c3d9d7; font-size: 14px; line-height: 1.55; }
    .pill {
      display: inline-block; padding: 5px 10px; border-radius: 99px;
      background: #8ce7d51c; color: var(--mint);
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      font-weight: 800; margin-bottom: 10px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
<div id="app">
  <div id="hud">
    <div class="top">
      <div class="eyebrow">Experiencia de patrimonio · WebAR</div>
      <h1>Atmósferas<br>escultóricas.</h1>
    </div>

    <!-- Área vacía reservada para añadir una fotografía de portada más adelante. -->
    <div id="fotoPortada" class="foto-portada" aria-label="Espacio reservado para una fotografía"></div>
    <p id="status" class="status-sr" aria-live="polite">Preparando la experiencia…</p>

    <div class="bottom" id="panelInicio">
      <div class="panel">
        <div class="actions">
          <button id="start">Iniciar realidad aumentada</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Botones flotantes (reset / close) durante AR -->
  <div id="controlesAR">
    <button id="reset" class="btn-flotante" aria-label="Reposicionar">⟳</button>
    <button id="close" class="btn-flotante" aria-label="Salir">✕</button>
  </div>

  <!-- Captura de la experiencia AR -->
  <div id="arHint" aria-live="polite">Apunta al suelo y gira suavemente la cámara alrededor.</div>

  <div id="contenedorControles">
    <div class="dock-captura" aria-label="Captura de la experiencia">
      <button id="btnFoto" class="btn-captura" aria-label="Tomar y descargar foto" title="Tomar foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.2 8.1h3.2l1.5-2.2h6.2l1.5 2.2h3.2a1.6 1.6 0 0 1 1.6 1.6v8.1a1.6 1.6 0 0 1-1.6 1.6H4.2a1.6 1.6 0 0 1-1.6-1.6V9.7a1.6 1.6 0 0 1 1.6-1.6Z" />
          <circle cx="12" cy="13.7" r="3.4" />
          <path d="M17.7 10.6h.01" stroke-width="2.8" />
        </svg>
        <span class="sr-only">Foto</span>
      </button>

      <button id="btnVideo" class="btn-captura" aria-label="Iniciar grabación de vídeo" title="Grabar vídeo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="6.2" width="12.2" height="11.6" rx="3" />
          <path d="m15.2 10 5.2-3v10l-5.2-3" />
          <circle cx="9.1" cy="12" r="1.4" fill="currentColor" stroke="none" />
        </svg>
        <span class="sr-only">Vídeo</span>
      </button>
    </div>
  </div>

  <div id="fallback">
    <div class="panel">
      <span class="pill">Compatibilidad del dispositivo</span>
      <h2>AR espacial no disponible aquí</h2>
      <p id="fallbackText">Este navegador no expone WebXR immersive-ar.</p>
    </div>
  </div>
</div>

<div id="flashPantalla"></div>

<audio id="audioBosque" src="bosque_noche.mp3" preload="auto" loop></audio>

<script type="module">
  import * as THREE from 'three';

  const app          = document.querySelector('#app');
  const statusEl     = document.querySelector('#status');
  const fotoPortada  = document.querySelector('#fotoPortada');
  const arHint       = document.querySelector('#arHint');
  const panelInicio  = document.querySelector('#panelInicio');
  const controlesAR  = document.querySelector('#controlesAR');
  const controlesCam = document.querySelector('#contenedorControles');
  const startButton  = document.querySelector('#start');
  const resetButton  = document.querySelector('#reset');
  const closeButton  = document.querySelector('#close');
  const fallback     = document.querySelector('#fallback');
  const fallbackText = document.querySelector('#fallbackText');
  const audioBosque  = document.querySelector('#audioBosque');

  /* ---------------- Toast helper ---------------- */
  function mostrarToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add('visible'));
    setTimeout(() => {
      t.classList.remove('visible');
      setTimeout(() => t.remove(), 300);
    }, 2000);
  }

  /* ---------------- Audio ---------------- */
  let fadeAudioInterval = null;

  function iniciarAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    audioBosque.volume = 0.0;
    const p = audioBosque.play();

    if (p !== undefined) {
      p.then(() => {
        fadeAudioInterval = setInterval(() => {
          if (audioBosque.volume < 0.85) {
            audioBosque.volume = Math.min(0.85, audioBosque.volume + 0.05);
          } else {
            clearInterval(fadeAudioInterval);
          }
        }, 150);
      }).catch(err => console.warn("Audio:", err));
    }
  }

  function detenerAudioAmbiente() {
    if (!audioBosque) return;
    clearInterval(fadeAudioInterval);
    fadeAudioInterval = setInterval(() => {
      if (audioBosque.volume > 0.05) {
        audioBosque.volume = Math.max(0, audioBosque.volume - 0.08);
      } else {
        audioBosque.volume = 0;
        audioBosque.pause();
        audioBosque.currentTime = 0;
        clearInterval(fadeAudioInterval);
      }
    }, 100);
  }

  /* ---------------- Renderer ---------------- */
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  app.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x06181f, 0.12);

  const camera = new THREE.PerspectiveCamera(
    70, window.innerWidth / window.innerHeight, 0.01, 30
  );
  scene.add(new THREE.HemisphereLight(0xd8fff7, 0x193c42, 1.6));

  /* ---------------- Textura de partículas verde fluorescente ---------------- */
  function makeParticleTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    const g = ctx.createRadialGradient(
      size / 2, size / 2, 0,
      size / 2, size / 2, size / 2
    );

    g.addColorStop(0.00, 'rgba(248, 255, 218, 1)');
    g.addColorStop(0.10, 'rgba(210, 255, 105, 1)');
    g.addColorStop(0.27, 'rgba(100, 255, 48, .95)');
    g.addColorStop(0.56, 'rgba(31, 255, 105, .40)');
    g.addColorStop(1.00, 'rgba(0, 255, 112, 0)');

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);

    // Destello sutil de cuatro puntas para dar un aspecto más etéreo.
    const glow = ctx.createRadialGradient(
      size / 2, size / 2, 0,
      size / 2, size / 2, size * .24
    );
    glow.addColorStop(0, 'rgba(255,255,226,.95)');
    glow.addColorStop(1, 'rgba(220,255,160,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(size * .26, size * .26, size * .48, size * .48);

    ctx.fillStyle = 'rgba(221,255,153,.58)';
    ctx.beginPath();
    ctx.moveTo(size / 2, size * .25);
    ctx.lineTo(size * .535, size * .465);
    ctx.lineTo(size * .75, size / 2);
    ctx.lineTo(size * .535, size * .535);
    ctx.lineTo(size / 2, size * .75);
    ctx.lineTo(size * .465, size * .535);
    ctx.lineTo(size * .25, size / 2);
    ctx.lineTo(size * .465, size * .465);
    ctx.closePath();
    ctx.fill();

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  const particleTexture = makeParticleTexture();

  /* ---------------- Reticle ---------------- */
  const reticleGeo = new THREE.RingGeometry(0.12, 0.17, 48);
  reticleGeo.rotateX(-Math.PI / 2);

  const reticle = new THREE.Mesh(
    reticleGeo,
    new THREE.MeshBasicMaterial({
      color: 0x9cf7e7,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.95
    })
  );

  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  /* ---------------- Atmósfera: agua y partículas pulsantes ---------------- */
  function createAtmosphere() {
    const group = new THREE.Group();

    const textureLoader = new THREE.TextureLoader();
    const waterNormal = textureLoader.load('image_c713d6.png');
    waterNormal.wrapS = THREE.RepeatWrapping;
    waterNormal.wrapT = THREE.RepeatWrapping;

    const waterGeo = new THREE.PlaneGeometry(14.4, 14.4);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime:         { value: 0 },
        uColorDeep:    { value: new THREE.Color(0x041c30) },
        uColorShallow: { value: new THREE.Color(0x1690c2) },
        uLightColor:   { value: new THREE.Color(0xbce9ff) },
        uFogColor:     { value: new THREE.Color(0x081c33) },
        uFogDensity:   { value: 0.14 },
        uNormalMap:    { value: waterNormal }
      },

      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPosition;

        void main() {
          vUv = uv;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,

      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColorDeep;
        uniform vec3 uColorShallow;
        uniform vec3 uLightColor;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        uniform sampler2D uNormalMap;

        varying vec2 vUv;
        varying vec3 vWorldPosition;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);

          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }

        float fbm(vec2 p) {
          float value = 0.0;
          float amplitude = 0.5;
          float frequency = 1.0;

          for (int i = 0; i < 4; i++) {
            value += amplitude * noise(p * frequency);
            frequency *= 2.0;
            amplitude *= 0.5;
          }

          return value;
        }

        void main() {
          vec2 p = (vUv - 0.5) * 2.0 * 4.0;
          float t = uTime * 0.075;

          vec2 q = vec2(
            fbm(p + vec2(0.0, 0.0) + t),
            fbm(p + vec2(5.2, 1.3) - t)
          );

          vec2 r = vec2(
            fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.5),
            fbm(p + 4.0 * q + vec2(8.3, 2.8) - t * 0.3)
          );

          float height = fbm(p + 4.0 * r);

          vec2 uvNormal = vUv * 6.0 + vec2(t * 0.15, -t * 0.1);
          vec3 texNormal = texture2D(uNormalMap, uvNormal).xyz * 2.0 - 1.0;
          vec3 normal = normalize(vec3(texNormal.x * 1.5, texNormal.y * 1.5, 1.0));

          vec3 viewDir = normalize(cameraPosition - vWorldPosition);
          vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));

          float spec = pow(max(dot(normal, lightDir), 0.0), 24.0);
          float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

          vec3 color = mix(
            uColorDeep, uColorShallow,
            smoothstep(0.2, 0.8, height)
          );

          color += uLightColor * spec * 1.5;
          color = mix(color, uLightColor, fresnel * 0.4);

          float dist = length(cameraPosition - vWorldPosition);
          float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
          float mistNoise = fbm(p * 1.2 - vec2(t * 0.35, t * 0.2));
          float mistLayer = smoothstep(0.35, 0.85, mistNoise) * 0.32;

          color = mix(
            color, uFogColor,
            clamp(fogFactor * 0.65 + mistLayer, 0.0, 0.75)
          );

          float alpha = mix(0.85, 0.99, smoothstep(0.2, 0.8, height));
          alpha = max(alpha, fresnel * 0.8);

          float edgeFade = 1.0 - smoothstep(
            0.7, 1.0, length(vUv - 0.5) * 2.0
          );

          alpha = clamp(alpha, 0.0, 0.95) * edgeFade;

          gl_FragColor = vec4(color, alpha);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });

    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 0.02;
    water.frustumCulled = false;
    group.add(water);

    // ===== Partículas etéreas: verde lima / esmeralda fluorescente =====
    const particleCount = 1450;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSeeds = new Float32Array(particleCount);
    const particleSizes = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.sqrt(Math.random()) * 12.3;

      particlePositions[i * 3] = Math.cos(angle) * radius;
      particlePositions[i * 3 + 1] = 0.12 + Math.random() * 3.0;
      particlePositions[i * 3 + 2] = Math.sin(angle) * radius;

      particleSeeds[i] = Math.random() * Math.PI * 2;
      particleSizes[i] = 0.45 + Math.random() * 1.25;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute(
      'position', new THREE.BufferAttribute(particlePositions, 3)
    );
    particleGeo.setAttribute(
      'aSeed', new THREE.BufferAttribute(particleSeeds, 1)
    );
    particleGeo.setAttribute(
      'aSize', new THREE.BufferAttribute(particleSizes, 1)
    );

    const particleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime:       { value: 0 },
        uTexture:    { value: particleTexture },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 1.8) },
        uFogDensity: { value: 0.105 }
      },

      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        uniform float uFogDensity;

        attribute float aSeed;
        attribute float aSize;

        varying float vAlpha;
        varying float vSeed;

        void main() {
          vec3 pos = position;

          pos.x += sin(uTime * 0.34 + aSeed) * 0.48
                 + cos(uTime * 0.17 + aSeed * 2.0) * 0.12;

          pos.y += cos(uTime * 0.57 + aSeed * 2.0) * 0.34
                 + sin(uTime * 0.22 + aSeed) * 0.10;

          pos.z += sin(uTime * 0.29 + aSeed * 3.0) * 0.48;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          float dist = length(mvPosition.xyz);
          float fogAtten = exp(-pow(dist * uFogDensity, 2.0));

          float pulse = 0.70 + 0.48 * sin(uTime * 2.0 + aSeed * 3.7);

          gl_PointSize = 58.0 * uPixelRatio * aSize
                       * (1.0 / max(0.45, -mvPosition.z)) * pulse;

          gl_PointSize = clamp(gl_PointSize, 2.0, 42.0);

          float alphaPulse = 0.52 + 0.48 * sin(uTime * 1.65 + aSeed * 4.8);

          vAlpha = alphaPulse * fogAtten;
          vSeed = aSeed;

          gl_Position = projectionMatrix * mvPosition;
        }
      `,

      fragmentShader: `
        uniform sampler2D uTexture;

        varying float vAlpha;
        varying float vSeed;

        void main() {
          vec4 texColor = texture2D(uTexture, gl_PointCoord);

          vec3 lime = vec3(0.42, 1.0, 0.12);
          vec3 emerald = vec3(0.04, 1.0, 0.42);
          vec3 hue = mix(emerald, lime, 0.5 + 0.5 * sin(vSeed * 5.3));

          gl_FragColor = vec4(texColor.rgb * hue * 1.8, texColor.a * vAlpha);
        }
      `
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    particles.frustumCulled = false;
    group.add(particles);

    group.userData.waterMaterial = waterMat;
    group.userData.particleMaterial = particleMat;
    group.visible = false;

    scene.add(group);
    return group;
  }

  const placedEffect = createAtmosphere();

  /* ---------------- Captura directa: foto JPG y vídeo ---------------- */
  let fotoPendiente = false;
  let grabadorVideo = null;
  let streamGrabacion = null;
  let fragmentosVideo = [];

  const canvasVideo = document.createElement('canvas');
  const contextoVideo = canvasVideo.getContext('2d', { alpha: false });

  const btnFoto = document.getElementById('btnFoto');
  const btnVideo = document.getElementById('btnVideo');
  const flash = document.getElementById('flashPantalla');

  function selloTemporal() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');

    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
  }

  function descargarBlob(blob, nombreArchivo) {
    if (!blob || !blob.size) {
      mostrarToast('No se pudo generar el archivo. Inténtalo de nuevo.');
      return;
    }

    const url = URL.createObjectURL(blob);
    const enlace = document.createElement('a');

    enlace.href = url;
    enlace.download = nombreArchivo;
    enlace.style.display = 'none';
    enlace.rel = 'noopener';

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    // Se conserva la URL un momento para dar tiempo al navegador a iniciar la descarga.
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  function dispararFlash() {
    flash.style.opacity = '0.72';
    setTimeout(() => { flash.style.opacity = '0'; }, 130);
  }

  btnFoto.addEventListener('click', () => {
    if (!activeSession) {
      mostrarToast('Primero inicia la experiencia AR.');
      return;
    }

    dispararFlash();
    fotoPendiente = true;
  });

  function elegirFormatoVideo() {
    if (!window.MediaRecorder) return '';

    const formatos = [
      'video/mp4;codecs=avc1.42E01E',
      'video/mp4',
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm'
    ];

    return formatos.find(tipo =>
      MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(tipo)
    ) || '';
  }

  function iniciarGrabacionVideo() {
    if (!activeSession) {
      mostrarToast('Primero inicia la experiencia AR.');
      return;
    }

    if (!window.MediaRecorder || !renderer.domElement.captureStream) {
      mostrarToast('Este navegador no permite grabar vídeo desde la experiencia.');
      return;
    }

    try {
      // Grabamos un canvas compuesto para que el archivo no dependa de un fondo transparente.
      canvasVideo.width = renderer.domElement.width || window.innerWidth;
      canvasVideo.height = renderer.domElement.height || window.innerHeight;

      streamGrabacion = canvasVideo.captureStream(30);

      const formato = elegirFormatoVideo();

      grabadorVideo = formato
        ? new MediaRecorder(streamGrabacion, { mimeType: formato })
        : new MediaRecorder(streamGrabacion);

      fragmentosVideo = [];
      const grabadorActual = grabadorVideo;

      grabadorActual.addEventListener('dataavailable', event => {
        if (event.data && event.data.size > 0) {
          fragmentosVideo.push(event.data);
        }
      });

      grabadorActual.addEventListener('error', () => {
        mostrarToast('No se pudo completar la grabación.');
        limpiarGrabacion();
      });

      grabadorActual.addEventListener('stop', () => {
        const mime = grabadorActual.mimeType || formato || 'video/webm';
        const extension = mime.includes('mp4') ? 'mp4' : 'webm';
        const videoBlob = new Blob(fragmentosVideo, { type: mime });

        if (videoBlob.size) {
          descargarBlob(
            videoBlob,
            `atmosferas-ar-${selloTemporal()}.${extension}`
          );
          mostrarToast('Vídeo preparado. Revisa las descargas del navegador.');
        } else {
          mostrarToast('La grabación quedó vacía. Inténtalo de nuevo.');
        }

        limpiarGrabacion();
      }, { once: true });

      grabadorActual.start(250);

      btnVideo.classList.add('grabando');
      btnVideo.setAttribute('aria-label', 'Detener grabación de vídeo');
      btnVideo.title = 'Detener grabación';

      mostrarToast('Grabando vídeo. Toca de nuevo para detener.');
    } catch (error) {
      console.error('Error al iniciar vídeo:', error);
      limpiarGrabacion();
      mostrarToast('No se pudo iniciar la grabación en este navegador.');
    }
  }

  function limpiarGrabacion() {
    if (streamGrabacion) {
      streamGrabacion.getTracks().forEach(track => track.stop());
    }

    streamGrabacion = null;
    grabadorVideo = null;
    fragmentosVideo = [];

    btnVideo.classList.remove('grabando');
    btnVideo.setAttribute('aria-label', 'Iniciar grabación de vídeo');
    btnVideo.title = 'Grabar vídeo';
  }

  btnVideo.addEventListener('click', () => {
    if (grabadorVideo && grabadorVideo.state !== 'inactive') {
      grabadorVideo.stop();
    } else {
      iniciarGrabacionVideo();
    }
  });

  /* ---------------- Estado AR ---------------- */
  let hitTestSource = null;
  let activeSession = null;
  let elapsed = 0;
  let xrSessionStarting = false;
  let arSupported = null;

  function showFallback(text) {
    fallbackText.textContent = text;
    fallback.style.display = 'flex';
  }

  function placeEffect() {
    if (!reticle.visible) {
      mostrarToast('Apunta al suelo y gira suavemente la cámara alrededor.');
      return;
    }

    placedEffect.position.setFromMatrixPosition(reticle.matrix);
    placedEffect.position.y -= 0.01;
    placedEffect.visible = true;

    mostrarToast('Atmósfera colocada');
  }

  function clearEffect() {
    placedEffect.visible = false;
    reticle.visible = false;
    mostrarToast('Reposicionando…');
  }

  async function endAR() {
    detenerAudioAmbiente();
    if (activeSession) {
      try { await activeSession.end(); } catch (_) {}
    }
  }

  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', placeEffect);
  scene.add(controller);

  renderer.xr.addEventListener('sessionstart', async () => {
    activeSession = renderer.xr.getSession();

    fallback.style.display = 'none';
    panelInicio.style.display = 'none';
    fotoPortada.classList.add('oculto');
    arHint.classList.add('activo');
    controlesAR.classList.add('activo');
    controlesCam.classList.add('activo');

    const session = activeSession;
    if (!session) return;

    try {
      const viewerSpace = await session.requestReferenceSpace('viewer');

      if (session === activeSession) {
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
      }
    } catch (_) {}

    session.addEventListener('end', () => {
      detenerAudioAmbiente();

      hitTestSource = null;
      activeSession = null;
      xrSessionStarting = false;

      panelInicio.style.display = '';
      startButton.disabled = false;
      startButton.textContent = 'Iniciar realidad aumentada';

      fotoPortada.classList.remove('oculto');
      arHint.classList.remove('activo');
      controlesAR.classList.remove('activo');
      controlesCam.classList.remove('activo');

      fotoPendiente = false;

      if (grabadorVideo && grabadorVideo.state !== 'inactive') {
        grabadorVideo.stop();
      }

      statusEl.textContent = 'Listo. Pulsa "Iniciar realidad aumentada".';

      placedEffect.visible = false;
      reticle.visible = false;
    }, { once: true });
  });

  /* ---------------- Bucle de render + captura ---------------- */
  renderer.setAnimationLoop((time, frame) => {
    elapsed = time * 0.001;

    placedEffect.userData.waterMaterial.uniforms.uTime.value = elapsed;
    placedEffect.userData.particleMaterial.uniforms.uTime.value = elapsed;

    if (frame) {
      const refSpace = renderer.xr.getReferenceSpace();

      if (hitTestSource && refSpace) {
        const results = frame.getHitTestResults(hitTestSource);

        if (results.length > 0) {
          const pose = results[0].getPose(refSpace);

          if (pose) {
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            reticle.matrixWorldNeedsUpdate = true;
          } else {
            reticle.visible = false;
          }
        } else {
          reticle.visible = false;
        }
      }
    }

    renderer.render(scene, camera);

    // Mantiene un compuesto de vídeo por fotograma mientras se graba.
    if (grabadorVideo && grabadorVideo.state === 'recording' && contextoVideo) {
      const glVideo = renderer.domElement;

      if (canvasVideo.width !== glVideo.width || canvasVideo.height !== glVideo.height) {
        canvasVideo.width = glVideo.width || window.innerWidth;
        canvasVideo.height = glVideo.height || window.innerHeight;
      }

      const gradVideo = contextoVideo.createLinearGradient(
        0, 0, 0, canvasVideo.height
      );

      gradVideo.addColorStop(0, '#040d12');
      gradVideo.addColorStop(1, '#0a2530');

      contextoVideo.fillStyle = gradVideo;
      contextoVideo.fillRect(0, 0, canvasVideo.width, canvasVideo.height);

      try {
        contextoVideo.drawImage(
          glVideo, 0, 0, canvasVideo.width, canvasVideo.height
        );
      } catch (error) {
        // El navegador puede bloquear el acceso al canvas durante una sesión XR.
      }
    }

    // Descarga automática del archivo tras capturar el fotograma del canvas.
    if (fotoPendiente) {
      fotoPendiente = false;

      const glC = renderer.domElement;
      const captura = document.createElement('canvas');
      const maxDim = 1600;
      const escala = Math.min(1, maxDim / Math.max(glC.width, glC.height));

      captura.width = Math.max(1, Math.floor(glC.width * escala));
      captura.height = Math.max(1, Math.floor(glC.height * escala));

      const ctx = captura.getContext('2d', { alpha: false });

      // Fondo neutro para el canvas WebGL. El navegador WebXR no expone la cámara real
      // en todos los dispositivos; en esos casos la captura contiene la capa renderizada.
      const grad = ctx.createLinearGradient(0, 0, 0, captura.height);

      grad.addColorStop(0, '#040d12');
      grad.addColorStop(1, '#0a2530');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, captura.width, captura.height);

      try {
        try {
          ctx.drawImage(glC, 0, 0, captura.width, captura.height);
        } catch (errorCanvas) {
          // Conserva el fondo de respaldo si WebXR bloquea la lectura del canvas de render.
          console.warn(
            'El canvas WebXR no se pudo copiar; se usará el fondo de respaldo.',
            errorCanvas
          );
        }

        captura.toBlob(blob => {
          if (!blob) {
            mostrarToast('El navegador no pudo crear la foto.');
            return;
          }

          descargarBlob(blob, `atmosferas-ar-${selloTemporal()}.jpg`);
          mostrarToast('Foto preparada. Revisa las descargas del navegador.');
        }, 'image/jpeg', 0.9);
      } catch (error) {
        console.error('Error al capturar foto:', error);
        mostrarToast('No se pudo crear el archivo de foto.');
      }
    }
  });

  /* ---------------- Inicialización AR ---------------- */
  async function beginAR() {
    if (xrSessionStarting || renderer.xr.isPresenting || activeSession) return;

    if (!navigator.xr || arSupported === false) {
      showFallback('No compatible con WebXR immersive-ar.');
      return;
    }

    xrSessionStarting = true;
    startButton.disabled = true;
    startButton.textContent = 'Iniciando…';
    statusEl.textContent = 'Cargando cámara…';

    // Audio dentro del gesto del usuario (garantiza reproducción)
    iniciarAudioAmbiente();

    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });

      await renderer.xr.setSession(session);
    } catch (err) {
      detenerAudioAmbiente();

      showFallback(
        'No se pudo iniciar la sesión AR. Asegúrate de tener permisos de cámara.'
      );

      startButton.disabled = false;
      startButton.textContent = 'Intentar de nuevo';
    } finally {
      xrSessionStarting = false;
    }
  }

  startButton.addEventListener('click', beginAR);
  resetButton.addEventListener('click', clearEffect);
  closeButton.addEventListener('click', endAR);

  document.body.addEventListener('beforexrselect', e => {
    const t = e.target;

    if (t && t.closest &&
        t.closest('button, .actions, .dock-captura, #controlesAR, #contenedorControles')) {
      e.preventDefault();
    }
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then(ok => {
      arSupported = ok;

      statusEl.textContent = ok
        ? 'Pulsa "Iniciar realidad aumentada". Apunta al suelo y gira suavemente la cámara alrededor.'
        : 'Dispositivo no compatible con WebXR.';

      if (!ok) startButton.textContent = 'Ver compatibilidad';
    }).catch(() => {
      statusEl.textContent = 'Pulsa "Iniciar".';
    });
  } else {
    statusEl.textContent = 'WebXR no disponible en este navegador.';
  }
</script>
</body>
</html>
