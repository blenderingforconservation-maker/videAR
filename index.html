<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>La Barca de las Grullas — AR · VR · 3D</title>
  <link rel="icon" type="image/png" href="./image_c713d6.png" />

  <style>
    :root {
      --bg-deep: #02060e;
      --glass-bg: rgba(5, 13, 25, 0.62);
      --glass-border: rgba(114, 212, 255, 0.28);
      --blue-core: #2eb4ff;
      --blue-bright: #8ee0ff;
      --gold: #f0d08a;
      --text-main: #eef6ff;
      --text-soft: rgba(196, 224, 248, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(24px, 5vh, 52px) 20px clamp(28px, 6vh, 56px);
      background:
        radial-gradient(ellipse 68% 54% at 50% 48%,
          rgba(6, 20, 42, 0.08) 0%,
          rgba(4, 12, 26, 0.44) 52%,
          rgba(2, 6, 14, 0.92) 100%);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.85s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      pointer-events: none;
    }

    .museum-mark {
      font-size: 10px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--blue-bright);
      opacity: 0.8;
    }

    .hero-title {
      font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
      font-size: clamp(26px, 4.6vw, 48px);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #f4f8ff;
      text-shadow:
        0 0 28px rgba(46, 180, 255, 0.38),
        0 2px 14px rgba(0, 0, 0, 0.75);
    }

    .astral-divider {
      width: 140px;
      height: 1px;
      position: relative;
      background: linear-gradient(90deg, transparent, rgba(110, 212, 255, 0.72), transparent);
      margin-top: 2px;
    }

    .astral-divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    .load-track {
      width: 140px;
      height: 2px;
      border-radius: 99px;
      background: rgba(110, 212, 255, 0.14);
      overflow: hidden;
      margin-top: 6px;
      transition: opacity 0.5s ease;
    }

    .load-track.done { opacity: 0; }

    .load-fill {
      width: 12%;
      height: 100%;
      background: linear-gradient(90deg, var(--blue-core), var(--blue-bright));
      box-shadow: 0 0 10px var(--blue-core);
      transition: width 0.25s ease;
    }

    .orbs-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4.5vw, 44px);
      padding-bottom: 4px;
    }

    .mystic-orb {
      position: relative;
      width: clamp(92px, 13vw, 122px);
      height: clamp(92px, 13vw, 122px);
      border-radius: 50%;
      border: 1px solid rgba(114, 212, 255, 0.34);
      background:
        radial-gradient(circle at 32% 24%, rgba(56, 188, 255, 0.22) 0%, rgba(5, 14, 30, 0.74) 64%, rgba(3, 8, 18, 0.90) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      outline: none;
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.55),
        0 0 26px rgba(46, 180, 255, 0.14),
        inset 0 0 18px rgba(46, 180, 255, 0.12);
      animation: levitate 5.4s ease-in-out infinite;
      transition: border-color 0.35s ease, box-shadow 0.35s ease, opacity 0.35s ease, filter 0.35s ease;
    }

    .mystic-orb:nth-child(1) { animation-delay: 0s; }
    .mystic-orb:nth-child(2) { animation-delay: -1.8s; }
    .mystic-orb:nth-child(3) { animation-delay: -3.5s; }

    @keyframes levitate {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }

    .mystic-orb::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed rgba(124, 216, 255, 0.32);
      pointer-events: none;
      animation: orbitRotate 22s linear infinite;
      transition: border-color 0.35s ease;
    }

    .mystic-orb::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid rgba(240, 208, 138, 0.18);
      pointer-events: none;
      transition: border-color 0.35s ease;
    }

    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .mystic-orb:not(:disabled):hover,
    .mystic-orb:not(:disabled):focus-visible {
      border-color: rgba(142, 224, 255, 0.92);
      box-shadow:
        0 18px 42px rgba(4, 48, 102, 0.52),
        0 0 38px rgba(46, 180, 255, 0.45),
        inset 0 0 26px rgba(96, 208, 255, 0.28);
    }

    .mystic-orb:not(:disabled):hover::before {
      border-color: rgba(240, 208, 138, 0.64);
      animation-duration: 9s;
    }

    .mystic-orb:not(:disabled):hover::after {
      border-color: rgba(240, 208, 138, 0.55);
    }

    .mystic-orb:not(:disabled):active { filter: brightness(1.22); }

    .mystic-orb:disabled {
      opacity: 0.34;
      cursor: not-allowed;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .mystic-orb:disabled::before {
      animation-play-state: paused;
      border-color: rgba(160, 190, 220, 0.16);
    }

    .orb-icon {
      color: var(--blue-bright);
      filter: drop-shadow(0 0 8px rgba(46, 180, 255, 0.55));
      transition: color 0.3s ease, transform 0.3s ease, filter 0.3s ease;
    }

    .mystic-orb:not(:disabled):hover .orb-icon {
      color: #ffffff;
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px rgba(142, 224, 255, 0.9));
    }

    .orb-label {
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f4f7fb;
      padding-left: 0.22em;
    }

    .orb-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }

    .mystic-orb:disabled .orb-dot {
      background: rgba(190, 210, 230, 0.35);
      box-shadow: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 15;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.65s ease, visibility 0.65s ease;
    }

    #hud.visible {
      opacity: 1;
      visibility: visible;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      pointer-events: auto;
    }

    .status-pill {
      pointer-events: auto;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      flex-shrink: 0;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .status-dot.blue {
      background: var(--blue-core);
      box-shadow: 0 0 12px var(--blue-core);
      animation: bluePulse 1.1s ease-in-out infinite;
    }

    @keyframes bluePulse {
      0%, 100% { transform: scale(0.85); opacity: 0.55; }
      50%      { transform: scale(1.28); opacity: 1.0; }
    }

    .xr-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, color 0.2s ease;
    }

    .xr-btn:hover {
      background: rgba(46, 180, 255, 0.18);
      border-color: var(--blue-bright);
    }

    .xr-btn:active { transform: scale(0.96); }
    .xr-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #hint {
      background: var(--glass-bg);
      border: 1px solid rgba(114, 212, 255, 0.24);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: var(--text-soft);
      text-align: center;
      max-width: 92vw;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <section id="intro-screen" aria-label="Inicio — La Barca de las Grullas">
    <header class="intro-header">
      <span class="museum-mark">Museo Leonora Carrington</span>
      <h1 class="hero-title">La Barca de las Grullas</h1>
      <div class="astral-divider" aria-hidden="true"></div>
      <div id="load-track" class="load-track" aria-hidden="true">
        <div id="load-fill" class="load-fill"></div>
      </div>
    </header>

    <nav class="orbs-dock" aria-label="Modos de experiencia">
      <button id="orb-ar" class="mystic-orb" disabled aria-label="Entrar en Realidad Aumentada" title="Realidad Aumentada">
        <svg class="orb-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2"/>
          <path d="M12 7.2 16.5 9.8v4.8L12 17.2 7.5 14.6V9.8L12 7.2Z"/>
          <path d="M12 12.2v5M12 12.2l4.5-2.4M12 12.2 7.5 9.8"/>
        </svg>
        <span class="orb-label">AR</span>
        <span class="orb-dot" aria-hidden="true"></span>
      </button>

      <button id="orb-vr" class="mystic-orb" disabled aria-label="Entrar en Realidad Virtual" title="Realidad Virtual">
        <svg class="orb-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="7" width="19" height="10" rx="3.4"/>
          <path d="M9.5 17 11 14.4a1.2 1.2 0 0 1 2 0L14.5 17"/>
          <circle cx="8" cy="12" r="1.4"/>
          <circle cx="16" cy="12" r="1.4"/>
        </svg>
        <span class="orb-label">VR</span>
        <span class="orb-dot" aria-hidden="true"></span>
      </button>

      <button id="orb-web" class="mystic-orb" disabled aria-label="Entrar en 3D Web" title="3D Web">
        <svg class="orb-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.8"/>
          <ellipse cx="12" cy="12" rx="4" ry="8.8"/>
          <path d="M3.5 9.5h17M3.5 14.5h17"/>
        </svg>
        <span class="orb-label">3D Web</span>
        <span class="orb-dot" aria-hidden="true"></span>
      </button>
    </nav>
  </section>

  <div id="hud">
    <div class="hud-top">
      <div class="status-pill">
        <span id="status-dot" class="status-dot"></span>
        <span id="state-label">Materializando...</span>
      </div>

      <div class="top-actions">
        <button id="btn-modes" class="xr-btn">Inicio</button>
        <button id="btn-audio" class="xr-btn active">Audio: ON</button>
        <button id="btn-fullscreen" class="xr-btn">Pantalla completa</button>
      </div>
    </div>

    <div class="hud-bottom">
      <div id="hint">Arrastra 360° para explorar · Toca una barca para abordar</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // =========================================================================
    // BLOQUE 1: RUTAS DEL REPO videAR + PARÁMETROS CALIBRADOS
    // =========================================================================
    const REPO_RAW = 'https://raw.githubusercontent.com/blenderingforconservation-maker/videAR/main';

    const ASSETS = {
      boatPrimary:    './models/barcagrullas.glb',
      boatFallback:   `${REPO_RAW}/models/barcagrullas.glb`,
      portalPrimary:  './models/portal%20barcas_optimizado.glb',
      portalFallback: `${REPO_RAW}/models/portal%20barcas_optimizado.glb`,
      waterPrimary:   './models/agua.glb',
      waterFallback:  `${REPO_RAW}/models/agua.glb`,
      audioPrimary:   './bosque_noche.mp3',
      audioFallback:  `${REPO_RAW}/bosque_noche.mp3`
    };

    const CONFIG = {
      targetBoatLength: 3.8,
      waterlineSink: 0.32, // Barcas más hundidas y aplomadas
      defaultEyeHeight: 1.65,
      seatOffset: new THREE.Vector3(0, 0.30, -0.1),

      originPosition: new THREE.Vector3(0, 0, 0),

      boatsLayout: [
        { pos: new THREE.Vector3(-8.6, 0, -8.0), yaw:  0.22 },
        { pos: new THREE.Vector3(-5.6, 0, -6.0), yaw:  0.14 },
        { pos: new THREE.Vector3(-2.7, 0, -4.8), yaw:  0.07 },
        { pos: new THREE.Vector3( 0.0, 0, -4.3), yaw:  0.00 },
        { pos: new THREE.Vector3( 2.8, 0, -4.9), yaw: -0.07 },
        { pos: new THREE.Vector3( 5.7, 0, -6.2), yaw: -0.15 },
        { pos: new THREE.Vector3( 8.7, 0, -8.2), yaw: -0.22 }
      ],

      portalBasePosition: new THREE.Vector3(0, 0, -78),
      portalTargetHeight: 56.0,
      portalMaxWidth:     88.0,
      portalWaterSink:    1.25,

      materializeDuration: 3.8,
      boardingDuration: 1.15,
      voyageDuration: 20.0,
      proximityBoardDist: 1.65,
      flashPeakDuration: 0.55
    };

    const SKY_SETTINGS = {
      galaxyIntensity: 0.88,
      nebulaRichness:  0.82,
      rotationSpeed:   0.20
    };

    const FOG_DENSITY_A = 0.0095; // Escenario A: oscuridad envolvente
    const FOG_DENSITY_B = 0.0038; // Escenario B: horizonte abierto hacia las galaxias

    function disposeHierarchy(root, disposeGeometries = true, disposeMaterials = true) {
      if (!root) return;
      root.traverse((obj) => {
        if (disposeGeometries && obj.geometry) obj.geometry.dispose();
        if (disposeMaterials && obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const m of mats) m.dispose();
        }
      });
    }

    function smoothstepJS(edge0, edge1, x) {
      const t = THREE.MathUtils.clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    // =========================================================================
    // BLOQUE 2: RENDERIZADOR, ESCENA E ILUMINACIÓN
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const INTRO_BG = new THREE.Color(0x02060e);
    const DARK_A_BG = new THREE.Color(0x010308);
    const GALAXY_B_BG = new THREE.Color(0x020610);
    const FOG_A = new THREE.FogExp2(0x02050c, FOG_DENSITY_A);
    const FOG_B = new THREE.FogExp2(0x050e1c, FOG_DENSITY_B);
    scene.background = INTRO_BG;
    scene.fog = null;

    const playerRig = new THREE.Group();
    playerRig.position.copy(CONFIG.originPosition);
    scene.add(playerRig);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, CONFIG.defaultEyeHeight, 0);
    playerRig.add(camera);

    const portalFlashMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0xfff4d8),
      transparent: true,
      opacity: 0.0,
      depthTest: false,
      depthWrite: false
    });
    const portalFlashMesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), portalFlashMat);
    portalFlashMesh.position.set(0, 0, -0.32);
    portalFlashMesh.renderOrder = 999;
    portalFlashMesh.visible = false;
    camera.add(portalFlashMesh);

    const hemiLight = new THREE.HemisphereLight(0x7ca8d8, 0x142236, 0.55);
    scene.add(hemiLight);

    const moonLight = new THREE.DirectionalLight(0xd2e8ff, 0.72);
    moonLight.position.set(16, 36, 18);
    scene.add(moonLight);

    const fillLight = new THREE.DirectionalLight(0x709cc8, 0.35);
    fillLight.position.set(-18, 18, 22);
    scene.add(fillLight);

    const materializeBlueLight = new THREE.PointLight(0x3cb8ff, 0.0, 48, 1.5);
    materializeBlueLight.position.set(0, 3.2, -6.0);
    scene.add(materializeBlueLight);

    const portalGlowLight = new THREE.PointLight(0xffd27d, 0.0, 210, 1.05);
    portalGlowLight.position.set(0, 14.0, CONFIG.portalBasePosition.z + 12.0);
    scene.add(portalGlowLight);

    const portalCrownLight = new THREE.PointLight(0x88c8ff, 0.0, 150, 1.15);
    portalCrownLight.position.set(0, 34.0, CONFIG.portalBasePosition.z + 14.0);
    scene.add(portalCrownLight);

    // =========================================================================
    // BLOQUE 2B: CIELO GALÁCTICO 360° (9 GALAXIAS DISTRIBUIDAS, SOLO ESCENARIO B)
    // =========================================================================
    const galaxySkyUniforms = {
      uTime:            { value: 0.0 },
      uReveal:          { value: 0.0 },
      uGalaxyWorld:     { value: 0.0 }, // 0 = Escenario A (oscuro), 1 = Escenario B (galaxias)
      uGalaxyIntensity: { value: SKY_SETTINGS.galaxyIntensity },
      uNebulaRichness:  { value: SKY_SETTINGS.nebulaRichness },
      uSkyRotation:     { value: 0.0 },
      uBakeBoost:       { value: 1.0 }
    };

    const galaxySkyVertexShader = /* glsl */ `
      varying vec3 vLocalDir;
      void main() {
        vLocalDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const galaxySkyFragmentShader = /* glsl */ `
      precision highp float;

      uniform float uTime;
      uniform float uReveal;
      uniform float uGalaxyWorld;
      uniform float uGalaxyIntensity;
      uniform float uNebulaRichness;
      uniform float uSkyRotation;
      uniform float uBakeBoost;

      varying vec3 vLocalDir;

      float hash31(vec3 p) {
        p = fract(p * vec3(0.1031, 0.1030, 0.0973));
        p += dot(p, p.yxz + 33.33);
        return fract((p.x + p.y) * p.z);
      }

      vec3 hash33(vec3 p) {
        p = fract(p * vec3(0.1031, 0.1030, 0.0973));
        p += dot(p, p.yxz + 33.33);
        return fract((p.xxy + p.yxx) * p.zyx);
      }

      float noise3D(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        vec3 u = f * f * (3.0 - 2.0 * f);

        float n000 = hash31(i + vec3(0.0, 0.0, 0.0));
        float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
        float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
        float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
        float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
        float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
        float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
        float n111 = hash31(i + vec3(1.0, 1.0, 1.0));

        float nx00 = mix(n000, n100, u.x);
        float nx10 = mix(n010, n110, u.x);
        float nx01 = mix(n001, n101, u.x);
        float nx11 = mix(n011, n111, u.x);

        return mix(mix(nx00, nx10, u.y), mix(nx01, nx11, u.y), u.z);
      }

      float fbm4(vec3 p) {
        float val = 0.0;
        float amp = 0.5;
        for (int i = 0; i < 4; i++) {
          val += amp * noise3D(p);
          p = p * 2.04 + vec3(13.1, 7.7, 5.3);
          amp *= 0.5;
        }
        return val;
      }

      float fbm3(vec3 p) {
        float val = 0.0;
        float amp = 0.52;
        for (int i = 0; i < 3; i++) {
          val += amp * noise3D(p);
          p = p * 2.06 + vec3(11.3, 6.9, 4.7);
          amp *= 0.5;
        }
        return val;
      }

      vec3 rotY(vec3 v, float a) {
        float c = cos(a);
        float s = sin(a);
        return vec3(c * v.x + s * v.z, v.y, -s * v.x + c * v.z);
      }

      vec3 starLayer(vec3 dir, float scale, float threshold, float sizeScale, float twinkleRate) {
        vec3 p = dir * scale;
        vec3 id = floor(p);
        vec3 f = fract(p);

        vec3 rnd = hash33(id);
        if (rnd.x < threshold) return vec3(0.0);

        vec3 starPos = vec3(0.18) + rnd * 0.64;
        float d = length(f - starPos);

        float brightness = smoothstep(threshold, 1.0, rnd.x);
        float radius = (0.042 + 0.076 * brightness) * sizeScale;

        float core = pow(smoothstep(radius, 0.0, d), 2.3);
        float halo = exp(-d * (11.5 / max(sizeScale, 0.4))) * brightness * 0.16;

        float twinkle = 0.74 + 0.26 * sin(uTime * twinkleRate * (0.7 + rnd.y * 1.4) + rnd.z * 62.83);

        vec3 specCol;
        if (rnd.y < 0.30)      specCol = vec3(0.66, 0.82, 1.00);
        else if (rnd.y < 0.55) specCol = vec3(0.94, 0.96, 1.00);
        else if (rnd.y < 0.78) specCol = vec3(0.98, 0.87, 0.68);
        else if (rnd.y < 0.90) specCol = vec3(0.54, 0.88, 1.00);
        else                   specCol = vec3(0.96, 0.68, 0.46);

        return specCol * (core * 1.12 + halo) * (0.38 + 0.82 * brightness) * twinkle;
      }

      vec3 renderSpiralGalaxy(
        vec3 dir, vec3 centerDir, float angRadius,
        float tiltRatio, float tiltAngle, float spinSpeed,
        vec3 coreColor, vec3 armColor
      ) {
        if (dot(dir, centerDir) < 0.70) return vec3(0.0);

        vec3 upRef = abs(centerDir.y) > 0.92 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
        vec3 uAxis = normalize(cross(upRef, centerDir));
        vec3 vAxis = normalize(cross(centerDir, uAxis));

        vec2 uv = vec2(dot(dir, uAxis), dot(dir, vAxis)) / angRadius;

        float ct = cos(tiltAngle);
        float st = sin(tiltAngle);
        uv = mat2(ct, -st, st, ct) * uv;
        uv.y /= tiltRatio;

        float r = length(uv);
        if (r > 1.45) return vec3(0.0);

        float angle = atan(uv.y, uv.x) + uTime * spinSpeed;
        float logSpiral = angle * 2.0 - log(r + 0.065) * 5.4;
        float mainArms = 0.5 + 0.5 * sin(logSpiral);
        float subArms  = 0.5 + 0.5 * sin(logSpiral * 2.0 + 1.4);

        float clumps = noise3D(vec3(uv * 5.2, 2.4)) * 0.65 + noise3D(vec3(uv * 11.5, 6.1)) * 0.35;
        float armMask = pow(mainArms, 2.1) * (0.60 + 0.78 * clumps) + pow(subArms, 3.0) * 0.28;
        armMask *= smoothstep(0.04, 0.20, r) * exp(-r * 2.15);

        float core = exp(-r * 6.8) * 1.40;
        float innerGlow = exp(-r * 2.8) * 0.40;
        float outerFade = smoothstep(1.40, 0.52, r);

        return (coreColor * (core + innerGlow * 0.60) + armColor * (armMask * 0.92 + innerGlow * 0.40)) * outerFade;
      }

      void main() {
        vec3 rawDir = normalize(vLocalDir);
        vec3 dir = rotY(rawDir, uSkyRotation);

        float elev = clamp(rawDir.y, 0.0, 1.0);
        vec3 darkNightA = mix(vec3(0.005, 0.009, 0.018), vec3(0.002, 0.003, 0.008), pow(elev, 0.7));

        // Escenario A: cielo oscuro sereno, sin galaxias
        if (uGalaxyWorld <= 0.001) {
          float subtleStars = length(starLayer(dir, 95.0, 0.985, 0.65, 1.1)) * 0.14;
          vec3 colA = darkNightA + vec3(0.75, 0.85, 1.0) * subtleStars * smoothstep(0.0, 0.25, rawDir.y);
          gl_FragColor = vec4(colA * uReveal * uBakeBoost, 1.0);
          return;
        }

        vec3 voidCol = mix(vec3(0.009, 0.020, 0.044), vec3(0.003, 0.006, 0.016), pow(elev, 0.62));

        vec3 galUp    = normalize(vec3(0.58, 0.70, -0.42));
        vec3 galFwd   = normalize(vec3(-0.18, 0.34, -0.92));
        vec3 galRight = normalize(cross(galUp, galFwd));
        galFwd        = normalize(cross(galRight, galUp));

        vec3 g = vec3(dot(dir, galRight), dot(dir, galUp), dot(dir, galFwd));

        float warp = (fbm3(g * 2.6 + vec3(1.2, -0.8, 3.1)) - 0.5) * 0.24;
        float lat = g.y + warp;

        float bandTight = exp(-abs(lat) * 5.2);
        float bandWide  = exp(-abs(lat) * 1.95);

        float nebA = fbm4(g * 3.4 + vec3(0.0, 1.5, -2.2));
        float nebB = fbm3(g * 7.0 + vec3(4.1, -2.3, 1.7));
        float dustNoise = fbm3(g * 5.6 + vec3(-3.2, 0.6, 5.4));

        float riftBand = exp(-abs(lat + (dustNoise - 0.5) * 0.14) * 14.5);
        float dustAbsorption = 1.0 - riftBand * smoothstep(0.36, 0.72, dustNoise) * 0.76;

        vec3 coreDir = normalize(vec3(-0.14, 0.26, -0.95));
        float coreAlign = pow(max(dot(dir, coreDir), 0.0), 4.0);
        float coreTight = pow(max(dot(dir, coreDir), 0.0), 12.0);

        vec3 colIndigo = vec3(0.042, 0.105, 0.265);
        vec3 colSapph  = vec3(0.088, 0.255, 0.500);
        vec3 colViolet = vec3(0.245, 0.120, 0.385);
        vec3 colAmber  = vec3(0.900, 0.640, 0.340);

        vec3 milkyWay = vec3(0.0);
        milkyWay += colIndigo * bandWide * (0.46 + 0.80 * nebA);
        milkyWay += colSapph  * bandTight * smoothstep(0.28, 0.82, nebA * 0.65 + nebB * 0.45) * 1.05;
        milkyWay += colViolet * bandWide  * smoothstep(0.40, 0.84, nebB) * 0.66;
        milkyWay += colAmber  * (coreAlign * 0.56 + coreTight * 0.70) * (0.50 + 0.60 * nebA);

        float cosmicMist = smoothstep(0.42, 0.85, fbm3(dir * 2.2 + vec3(2.3, -1.1, 4.7)));
        vec3 outerNebula = mix(colIndigo, colViolet, nebB) * cosmicMist * 0.24;

        vec3 skyCol = voidCol + (milkyWay * dustAbsorption + outerNebula) * uNebulaRichness * uGalaxyIntensity;

        // 9 galaxias espirales distribuidas de forma orgánica por toda la bóveda celeste (sin vacíos)
        vec3 galaxies = vec3(0.0);
        // Frente-derecha media
        galaxies += renderSpiralGalaxy(dir, normalize(vec3( 0.42, 0.28, -0.86)), 0.20, 0.46,  0.52,  0.022, vec3(1.00, 0.86, 0.62), vec3(0.36, 0.68, 1.00));
        // Frente-izquierda media
        galaxies += renderSpiralGalaxy(dir, normalize(vec3(-0.46, 0.34, -0.82)), 0.16, 0.74, -0.38, -0.026, vec3(0.88, 0.94, 1.00), vec3(0.28, 0.76, 0.98));
        // Frente-alta central
        galaxies += renderSpiralGalaxy(dir, normalize(vec3( 0.06, 0.54, -0.84)), 0.14, 0.55,  1.05,  0.018, vec3(0.98, 0.78, 0.56), vec3(0.58, 0.40, 0.92));
        // Lateral derecha
        galaxies += renderSpiralGalaxy(dir, normalize(vec3( 0.86, 0.36, -0.35)), 0.18, 0.42, -0.72,  0.020, vec3(1.00, 0.82, 0.58), vec3(0.46, 0.58, 0.98));
        // Lateral izquierda
        galaxies += renderSpiralGalaxy(dir, normalize(vec3(-0.88, 0.32, -0.34)), 0.17, 0.62,  0.84, -0.022, vec3(0.92, 0.88, 1.00), vec3(0.62, 0.38, 0.88));
        // Cenit inclinado
        galaxies += renderSpiralGalaxy(dir, normalize(vec3(-0.18, 0.88, -0.44)), 0.15, 0.78,  0.25,  0.016, vec3(0.96, 0.84, 0.64), vec3(0.32, 0.74, 0.96));
        // Espalda-derecha
        galaxies += renderSpiralGalaxy(dir, normalize(vec3( 0.62, 0.40,  0.67)), 0.19, 0.50,  1.22, -0.024, vec3(0.98, 0.76, 0.54), vec3(0.52, 0.38, 0.86));
        // Espalda-izquierda
        galaxies += renderSpiralGalaxy(dir, normalize(vec3(-0.58, 0.36,  0.73)), 0.16, 0.66, -0.95,  0.020, vec3(0.86, 0.92, 1.00), vec3(0.28, 0.68, 0.94));
        // Espalda-alta
        galaxies += renderSpiralGalaxy(dir, normalize(vec3( 0.05, 0.62,  0.78)), 0.13, 0.48,  0.40, -0.019, vec3(1.00, 0.84, 0.66), vec3(0.66, 0.44, 0.90));

        skyCol += galaxies * 0.86 * uGalaxyIntensity;

        vec3 stars = vec3(0.0);
        float bandBoost = 1.0 + bandTight * 0.92 * dustAbsorption;
        stars += starLayer(dir, 118.0, 0.925, 0.84, 1.6) * 0.56 * bandBoost;
        stars += starLayer(dir,  64.0, 0.952, 0.94, 2.1) * 0.82;
        stars += starLayer(dir,  29.0, 0.975, 1.10, 2.6) * 1.08;
        skyCol += stars * (0.48 + 0.38 * uGalaxyIntensity);

        float horizonBand = exp(-abs(rawDir.y) * 10.0);
        vec3 horizonGlow = vec3(0.018, 0.050, 0.096) * horizonBand * 0.82;
        float portalAzimuth = pow(max(dot(normalize(vec3(rawDir.x, 0.0, rawDir.z)), vec3(0.0, 0.0, -1.0)), 0.0), 8.0);
        horizonGlow += vec3(0.20, 0.14, 0.06) * horizonBand * portalAzimuth * 0.36;

        float aboveWater = smoothstep(-0.08, 0.08, rawDir.y);
        skyCol = mix(vec3(0.012, 0.036, 0.070), skyCol, aboveWater) + horizonGlow;

        vec3 blendedWorld = mix(darkNightA, skyCol, clamp(uGalaxyWorld, 0.0, 1.0));

        float rev = clamp(uReveal, 0.0, 1.0);
        vec3 birthTint = vec3(0.03, 0.14, 0.28) * sin(rev * 3.14159) * 0.34;
        vec3 finalCol = mix(vec3(0.004, 0.008, 0.018), blendedWorld, rev) + birthTint;

        gl_FragColor = vec4(finalCol * uBakeBoost, 1.0);
      }
    `;

    const galaxySkyMaterial = new THREE.ShaderMaterial({
      uniforms: galaxySkyUniforms,
      vertexShader: galaxySkyVertexShader,
      fragmentShader: galaxySkyFragmentShader,
      side: THREE.BackSide,
      depthWrite: false,
      fog: false
    });

    const galaxySkyDome = new THREE.Mesh(
      new THREE.SphereGeometry(245, 56, 36),
      galaxySkyMaterial
    );
    galaxySkyDome.visible = false;
    galaxySkyDome.renderOrder = -10;
    scene.add(galaxySkyDome);

    function bakeProceduralHDRIEnvironment() {
      try {
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        const bakeScene = new THREE.Scene();
        const bakeMat = galaxySkyMaterial.clone();
        bakeMat.uniforms = THREE.UniformsUtils.clone(galaxySkyUniforms);
        bakeMat.uniforms.uReveal.value = 1.0;
        bakeMat.uniforms.uGalaxyWorld.value = 1.0;
        bakeMat.uniforms.uGalaxyIntensity.value = 0.92;
        bakeMat.uniforms.uNebulaRichness.value = 0.88;
        bakeMat.uniforms.uBakeBoost.value = 1.35;

        const bakeGeo = new THREE.SphereGeometry(48, 40, 28);
        bakeScene.add(new THREE.Mesh(bakeGeo, bakeMat));

        const bakePortalSpot = new THREE.Mesh(
          new THREE.SphereGeometry(9.0, 14, 14),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 1.75, 1.0) })
        );
        bakePortalSpot.position.set(0, 12, -40);
        bakeScene.add(bakePortalSpot);

        const rt = pmremGenerator.fromScene(bakeScene, 0.025, 0.1, 120);
        scene.environment = rt.texture;

        bakeGeo.dispose();
        bakeMat.dispose();
        bakePortalSpot.geometry.dispose();
        bakePortalSpot.material.dispose();
        pmremGenerator.dispose();
      } catch (err) {
        console.warn('PMREM procedural omitido; se usa iluminación directa:', err);
      }
    }
    bakeProceduralHDRIEnvironment();

    // =========================================================================
    // BLOQUE 2C: FONDO GRÁFICO WIREFRAME AZUL 2D DE barcagrullas.glb (PORTADA)
    // =========================================================================
    const introStage = new THREE.Group();
    scene.add(introStage);

    let introWireframePivot = null;
    let introEdgeMat = null;
    let introMeshWireMat = null;
    let introFadeIn = 0.0;
    let introParallaxX = 0;
    let introParallaxY = 0;

    const introAuraUniforms = { uTime: { value: 0 }, uFade: { value: 0 } };
    const introAuraPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(9.2, 6.2),
      new THREE.ShaderMaterial({
        uniforms: introAuraUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv * 2.0 - 1.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;
          uniform float uTime;
          uniform float uFade;
          varying vec2 vUv;
          void main() {
            float d = length(vUv * vec2(0.88, 1.15));
            float pulse = 0.84 + 0.16 * sin(uTime * 1.9);
            float halo = exp(-d * d * 2.8) * 0.34 * pulse * uFade;
            float horizon = exp(-abs(vUv.y + 0.26) * 48.0) * smoothstep(1.0, 0.15, abs(vUv.x)) * 0.14 * uFade;
            vec3 col = vec3(0.14, 0.62, 1.0) * halo + vec3(0.35, 0.82, 1.0) * horizon;
            gl_FragColor = vec4(col, halo + horizon);
          }
        `
      })
    );
    introAuraPlane.position.z = -1.2;
    introStage.add(introAuraPlane);

    const introDustUniforms = {
      uTime:  { value: 0 },
      uFade:  { value: 1 },
      uRatio: { value: Math.min(window.devicePixelRatio, 2) }
    };
    {
      const count = 95;
      const pos = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * 8.5;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 4.8;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 2.6;
        phases[i] = Math.random() * Math.PI * 2;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aPhase',   new THREE.BufferAttribute(phases, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: introDustUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: /* glsl */ `
          attribute float aPhase;
          uniform float uTime;
          uniform float uRatio;
          varying float vPulse;
          void main() {
            vec3 p = position;
            p.y += sin(uTime * 0.65 + aPhase) * 0.24;
            p.x += cos(uTime * 0.40 + aPhase * 1.3) * 0.22;
            vPulse = 0.25 + 0.75 * (0.5 + 0.5 * sin(uTime * 2.4 + aPhase * 2.1));
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp((22.0 * uRatio / max(-mv.z, 1.0)) * (0.65 + 0.55 * vPulse), 1.5, 22.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */ `
          precision highp float;
          uniform float uFade;
          varying float vPulse;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            float glow = exp(-d * 6.5) * vPulse * 0.78 * uFade;
            gl_FragColor = vec4(0.28, 0.80, 1.0, glow);
          }
        `
      });
      introStage.add(new THREE.Points(geo, mat));
    }

    function buildIntroWireframe(normalizedWrapper) {
      if (introWireframePivot) {
        introStage.remove(introWireframePivot);
        introWireframePivot.traverse((obj) => {
          if (obj.isLineSegments && obj.geometry) obj.geometry.dispose();
        });
        if (introEdgeMat) introEdgeMat.dispose();
        if (introMeshWireMat) introMeshWireMat.dispose();
        introWireframePivot = null;
      }

      introWireframePivot = new THREE.Group();
      normalizedWrapper.updateMatrixWorld(true);

      introEdgeMat = new THREE.LineBasicMaterial({
        color: 0x3ec6ff,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      introMeshWireMat = new THREE.MeshBasicMaterial({
        color: 0x1578ff,
        wireframe: true,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const invRoot = new THREE.Matrix4().copy(normalizedWrapper.matrixWorld).invert();
      const relMatrix = new THREE.Matrix4();

      normalizedWrapper.traverse((obj) => {
        if (obj.isMesh && obj.geometry) {
          relMatrix.multiplyMatrices(invRoot, obj.matrixWorld);
          const edgesGeo = new THREE.EdgesGeometry(obj.geometry, 16);
          const lineSegs = new THREE.LineSegments(edgesGeo, introEdgeMat);
          lineSegs.applyMatrix4(relMatrix);
          introWireframePivot.add(lineSegs);

          const wireMesh = new THREE.Mesh(obj.geometry, introMeshWireMat);
          wireMesh.applyMatrix4(relMatrix);
          introWireframePivot.add(wireMesh);
        }
      });

      const wfBox = new THREE.Box3().setFromObject(introWireframePivot);
      const wfCenter = wfBox.getCenter(new THREE.Vector3());
      introWireframePivot.children.forEach((child) => child.position.sub(wfCenter));

      introWireframePivot.rotation.set(0.04, Math.PI / 2 - 0.10, 0);
      introStage.add(introWireframePivot);
      introFadeIn = 0.0;
      positionIntroStage();
    }

    function positionIntroStage() {
      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const aspect = window.innerWidth / window.innerHeight;
      const hFovRad = 2 * Math.atan(Math.tan(vFovRad / 2) * aspect);

      const targetWidthFraction = aspect < 0.85 ? 0.88 : (aspect < 1.3 ? 0.72 : 0.56);
      const boatSpan = CONFIG.targetBoatLength * 1.08;
      const distForWidth = (boatSpan / targetWidthFraction) / (2 * Math.tan(hFovRad / 2));
      const dist = THREE.MathUtils.clamp(distForWidth, 4.4, 8.8);

      introStage.position.set(0, CONFIG.defaultEyeHeight + 0.06, -dist);
    }
    positionIntroStage();

    // =========================================================================
    // BLOQUE 3: AGUA (GLB REALISTA ANIMADO + RESPALDO PROCEDURAL)
    // =========================================================================
    const WATER_SIZE = 260;
    const WATER_SEGMENTS = 100;
    const WATER_STEP = WATER_SIZE / WATER_SEGMENTS;

    const waterUniforms = {
      uTime:            { value: 0 },
      uWaterReveal:     { value: 0 },
      uGalaxyWorld:     { value: 0 }, // 0 = Escenario A (agua oscura), 1 = Escenario B (reflejo galáctico)
      uBoatPos:         { value: new THREE.Vector3(0, 0, -999) },
      uBoatDir:         { value: new THREE.Vector2(0, -1) },
      uBoatSpeed:       { value: 0 },
      uMotionFactor:    { value: 0 },
      uFlowOffset:      { value: new THREE.Vector2(0, 0) },
      uPortalPos:       { value: new THREE.Vector3(0, 26.0, CONFIG.portalBasePosition.z) },
      uGalaxyIntensity: { value: SKY_SETTINGS.galaxyIntensity },
      uFogDensity:      { value: FOG_DENSITY_A },
      uIsAR:            { value: 0 }
    };

    const waterRoot = new THREE.Group();
    waterRoot.visible = false;
    scene.add(waterRoot);

    let usingGLBWater = false;
    let glbWaterGroup = null;
    const glbWaterAnimatedTextures = [];

    const waterMaterial = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      transparent: true,
      depthWrite: true,
      vertexShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uBoatPos;
        uniform vec2 uBoatDir;
        uniform float uMotionFactor;
        uniform vec2 uFlowOffset;

        varying vec3 vWorldPos;
        varying float vElevation;

        float baseWave(vec2 p, float t, float motion) {
          vec2 pf = p - uFlowOffset * 0.55;
          float amp = 1.0 + motion * 0.85;
          float w1 = sin(pf.x * 0.34 + t * 0.90) * 0.055;
          float w2 = cos(pf.y * 0.42 - t * 0.85) * 0.050;
          float w3 = sin((pf.x * 0.25 + pf.y * 0.34) + t * 1.35) * 0.036;
          float surge = sin(pf.y * 0.72 + t * 2.4) * cos(pf.x * 0.48 - t * 1.4) * 0.055 * motion;
          return (w1 + w2 + w3) * amp + surge;
        }

        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vec2 p = worldPos.xz;

          float h = baseWave(p, uTime, uMotionFactor);
          float wakeLift = 0.0;

          if (uMotionFactor > 0.01) {
            vec2 toVert = p - uBoatPos.xz;
            vec2 fwd = normalize(uBoatDir + vec2(0.0001));
            vec2 right = vec2(-fwd.y, fwd.x);
            float along = dot(toVert, fwd);
            float across = abs(dot(toVert, right));

            float bowCrest = exp(-pow((along - 1.85) * 0.95, 2.0)) * exp(-pow(across * 0.78, 2.0));
            wakeLift += bowCrest * 0.14 * uMotionFactor;

            if (along < 1.2 && along > -24.0) {
              float spread = max(0.0, -along) * 0.56 + 0.65;
              float distToArm = abs(across - spread);
              float vCrest = exp(-distToArm * 1.35) * sin(along * 1.8 - uTime * 7.5);
              float fade = smoothstep(-24.0, -2.5, along) * smoothstep(1.2, -0.4, along);
              wakeLift += vCrest * fade * 0.13 * uMotionFactor;
            }
          }

          worldPos.y += h + wakeLift;
          vWorldPos = worldPos.xyz;
          vElevation = h + wakeLift;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: /* glsl */ `
        precision highp float;

        uniform float uTime;
        uniform float uWaterReveal;
        uniform float uGalaxyWorld;
        uniform vec3 uBoatPos;
        uniform vec2 uBoatDir;
        uniform float uBoatSpeed;
        uniform float uMotionFactor;
        uniform vec2 uFlowOffset;
        uniform vec3 uPortalPos;
        uniform float uGalaxyIntensity;
        uniform float uFogDensity;
        uniform float uIsAR;

        varying vec3 vWorldPos;
        varying float vElevation;

        void main() {
          if (uWaterReveal <= 0.001) discard;

          vec2 p = vWorldPos.xz;

          float revealMask = 1.0;
          float blueEdgeGlow = 0.0;
          if (uWaterReveal < 0.999) {
            float distOrigin = length(p);
            float revealRadius = uWaterReveal * 185.0;
            float edgeDist = revealRadius - distOrigin;
            revealMask = smoothstep(-5.5, 6.0, edgeDist);
            if (revealMask <= 0.005) discard;
            float pulse = 0.62 + 0.38 * sin(uTime * 7.5 - distOrigin * 0.45);
            blueEdgeGlow = exp(-abs(edgeDist) * 0.30) * pulse * (1.0 - smoothstep(0.88, 1.0, uWaterReveal));
          }

          vec2 pf = p - uFlowOffset;

          float nx = cos(pf.x * 0.36 + uTime * 0.95) * 0.14
                   + cos((pf.x * 0.28 + pf.y * 0.35) + uTime * 1.35) * 0.09
                   + cos(pf.x * 1.45 - pf.y * 0.92 + uTime * 2.6) * (0.045 + 0.055 * uMotionFactor);
          float nz = -sin(pf.y * 0.44 - uTime * 0.88) * 0.14
                   + cos((pf.x * 0.28 + pf.y * 0.35) + uTime * 1.35) * 0.09
                   + sin(pf.y * 1.65 + pf.x * 0.78 - uTime * 2.9) * (0.045 + 0.055 * uMotionFactor);

          vec3 N = normalize(vec3(-nx, 1.0, -nz));
          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 R = reflect(-V, N);

          // Escenario A: agua nocturna muy oscura / Escenario B: agua azul cósmica reflejando galaxias
          vec3 deepColor  = mix(vec3(0.004, 0.009, 0.018), vec3(0.012, 0.038, 0.074), uGalaxyWorld);
          vec3 midColor   = mix(vec3(0.010, 0.022, 0.038), vec3(0.032, 0.096, 0.158), uGalaxyWorld);
          vec3 crestColor = mix(vec3(0.022, 0.044, 0.068), vec3(0.072, 0.178, 0.252), uGalaxyWorld);

          float heightFactor = clamp(vElevation * 4.2 + 0.48, 0.0, 1.0);
          vec3 col = mix(deepColor, midColor, smoothstep(0.0, 0.65, heightFactor));
          col = mix(col, crestColor, smoothstep(0.55, 1.0, heightFactor));

          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.7);
          float galRefBand = exp(-abs(dot(R, normalize(vec3(0.58, 0.70, -0.42)))) * 4.0);
          vec3 galaxyRefCol = mix(vec3(0.08, 0.18, 0.36), vec3(0.26, 0.22, 0.48), galRefBand);
          col += galaxyRefCol * fresnel * (0.55 + 0.45 * uGalaxyIntensity) * uGalaxyWorld;

          vec3 moonDir = normalize(vec3(0.32, 0.72, 0.26));
          vec3 moonHalf = normalize(moonDir + V);
          float moonSpec = pow(max(dot(N, moonHalf), 0.0), 46.0);
          col += vec3(0.56, 0.74, 0.92) * moonSpec * (0.14 + 0.24 * uGalaxyWorld);

          vec3 toPortal = uPortalPos - vWorldPos;
          float portalDist = length(toPortal.xz);
          vec3 Lportal = normalize(vec3(toPortal.x, max(toPortal.y * 0.55, 4.5), toPortal.z));
          vec3 Hportal = normalize(Lportal + V);
          float specPortal = pow(max(dot(N, Hportal), 0.0), 22.0);
          float portalAtten = smoothstep(160.0, 10.0, portalDist);
          col += vec3(0.95, 0.80, 0.48) * specPortal * portalAtten * (1.15 + 0.35 * uMotionFactor);
          col += vec3(0.90, 0.70, 0.36) * exp(-portalDist * 0.028) * 0.26;

          if (uMotionFactor > 0.01) {
            vec2 toFrag = p - uBoatPos.xz;
            vec2 fwd = normalize(uBoatDir + vec2(0.0001));
            vec2 right = vec2(-fwd.y, fwd.x);

            float along = dot(toFrag, fwd);
            float across = abs(dot(toFrag, right));

            float bowFoam = exp(-pow((along - 1.75) * 1.4, 2.0)) * exp(-pow(across * 1.25, 2.0));
            bowFoam *= 0.65 + 0.35 * sin(across * 8.0 - uTime * 9.0);

            float wakeArms = 0.0;
            float sternTrail = 0.0;
            if (along < 1.5 && along > -26.0) {
              float spread = max(0.0, -along) * 0.56 + 0.62;
              float distToArm = abs(across - spread);
              float chevron = 0.55 + 0.45 * sin(along * 3.4 - across * 2.2 - uTime * 8.5);
              float armFade = smoothstep(-26.0, -2.5, along) * smoothstep(1.5, -0.3, along);
              wakeArms = exp(-distToArm * 2.1) * chevron * armFade;

              float swirl = 0.5 + 0.5 * sin(along * 4.5 - uTime * 9.5 + sin(across * 6.0));
              float centerWidth = 0.55 + max(0.0, -along) * 0.045;
              float centerMask = exp(-pow(across / centerWidth, 2.0));
              float centerFade = smoothstep(-18.0, -1.5, along) * smoothstep(-0.8, -2.0, along);
              sternTrail = centerMask * swirl * centerFade * 0.68;
            }

            float totalFoam = clamp((bowFoam * 0.85 + wakeArms * 0.92 + sternTrail) * uMotionFactor, 0.0, 1.0);
            col = mix(col, vec3(0.80, 0.91, 0.96), totalFoam * 0.72);
          }

          col += vec3(0.24, 0.76, 1.0) * blueEdgeGlow * 1.35;

          float camDist = length(vWorldPos.xz - cameraPosition.xz);
          float alpha = 0.99;
          if (uIsAR > 0.5) {
            alpha = smoothstep(95.0, 28.0, camDist) * 0.94;
          } else {
            float fogFactor = 1.0 - exp(-pow(camDist * uFogDensity, 2.0));
            vec3 fogCol = mix(vec3(0.005, 0.010, 0.022), vec3(0.016, 0.046, 0.092), uGalaxyWorld);
            col = mix(col, fogCol, clamp(fogFactor, 0.0, 1.0));
          }

          gl_FragColor = vec4(col, alpha * revealMask);
        }
      `
    });

    const waterMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, WATER_SEGMENTS, WATER_SEGMENTS),
      waterMaterial
