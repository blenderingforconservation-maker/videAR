<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>La Barca de las Grullas · Travesía AR & VR · Museo Leonora Carrington</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
      background-color: #09292e; font-family: 'Inter', sans-serif; touch-action: none;
    }
    .font-museum { font-family: 'Cormorant Garamond', Georgia, serif; }

    #ar-camera-feed {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; display: none; background: #000;
    }
    #ar-camera-feed.active { display: block; }
    #ar-camera-feed.mirrored { transform: scaleX(-1); }

    #webgl-viewport { position: fixed; inset: 0; z-index: 2; cursor: grab; }
    #webgl-viewport:active { cursor: grabbing; }

    #shutter-flash {
      position: fixed; inset: 0; z-index: 45; pointer-events: none;
      background: #f0fdfa; opacity: 0; transition: opacity 0.22s ease-out;
    }

    /* Interfaz orgánica y translúcida */
    #experience-hud {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
      display: none; flex-direction: column; justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    #experience-hud.active { display: flex; }
    .interactive { pointer-events: auto; }

    .organic-glass {
      background: rgba(7, 29, 33, 0.56);
      backdrop-filter: blur(14px) saturate(135%);
      -webkit-backdrop-filter: blur(14px) saturate(135%);
      border: 1px solid rgba(153, 246, 228, 0.24);
      box-shadow: 0 8px 28px rgba(2, 16, 19, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .organic-btn {
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .organic-btn:active, .organic-btn.pressing {
      transform: scale(0.92);
      border-color: rgba(253, 224, 71, 0.72);
    }

    .cta-luminous {
      background: linear-gradient(135deg, #14b8a6 0%, #2dd4bf 55%, #f5e67a 100%);
      box-shadow: 0 8px 26px rgba(45, 212, 191, 0.36);
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
    }
    .cta-luminous:active { transform: scale(0.95); }

    /* Botón obturador táctil foto / video */
    #shutter-btn {
      width: 72px; height: 72px; border-radius: 999px;
      padding: 5px;
      background: rgba(7, 29, 33, 0.42);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2.5px solid rgba(236, 254, 255, 0.92);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35), 0 0 22px rgba(45, 212, 191, 0.28);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #shutter-btn:active { transform: scale(0.92); }
    #shutter-core {
      width: 100%; height: 100%; border-radius: 999px;
      background: linear-gradient(145deg, #ffffff 0%, #ccfbf1 100%);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #shutter-btn.video-mode #shutter-core {
      background: linear-gradient(145deg, #fb7185 0%, #e11d48 100%);
      transform: scale(0.86);
    }
    #shutter-btn.recording {
      border-color: rgba(251, 113, 133, 0.95);
      box-shadow: 0 0 0 6px rgba(225, 29, 72, 0.22), 0 6px 24px rgba(0, 0, 0, 0.4);
    }
    #shutter-btn.recording #shutter-core {
      width: 26px; height: 26px; border-radius: 8px;
      background: #f43f5e; transform: scale(1);
    }

    .mode-pill-active {
      background: rgba(45, 212, 191, 0.24);
      color: #f0fdfa;
      border-color: rgba(94, 234, 212, 0.55);
    }

    #toast-banner {
      position: fixed; top: max(68px, calc(env(safe-area-inset-top) + 54px)); left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      background: rgba(7, 29, 33, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(153, 246, 228, 0.35);
      border-radius: 999px; color: #e6fffb; font-size: 12px; font-weight: 500;
      letter-spacing: 0.02em; opacity: 0; transition: opacity 0.24s ease;
      pointer-events: none; text-align: center; max-width: 88vw; z-index: 42;
    }

    /* Panel flotante desplegable de ajustes rápidos */
    #quick-tools-drawer {
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #quick-tools-drawer.drawer-closed {
      opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.96);
    }

    /* Modal de previsualización y guardado de foto/video */
    #capture-modal {
      background: rgba(4, 18, 21, 0.84);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
  </style>
</head>
<body>

  <video id="ar-camera-feed" autoplay playsinline muted></video>
  <div id="webgl-viewport"></div>
  <div id="shutter-flash"></div>
  <div id="toast-banner">Cargando travesía...</div>

  <!-- PANTALLA DE BIENVENIDA MINIMALISTA -->
  <div id="loading-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#061c20] px-6 text-center transition-opacity duration-500">
    <div class="w-14 h-14 mb-5 rounded-full bg-teal-400/10 border border-teal-300/35 flex items-center justify-center shadow-[0_0_36px_rgba(45,212,191,0.28)]">
      <div class="w-3 h-3 rounded-full bg-lime-200 animate-ping"></div>
    </div>
    <span class="text-[10px] uppercase tracking-[0.32em] text-teal-200/80 font-medium mb-1.5">
      Museo Leonora Carrington SLP
    </span>
    <h1 class="font-museum text-4xl sm:text-5xl text-stone-50 tracking-wide mb-2">
      La Barca de las Grullas
    </h1>
    <p id="loading-message" class="text-xs text-teal-100/75 max-w-xs mb-6 leading-relaxed">
      Preparando la travesía de las 9 barcas y el río nocturno...
    </p>

    <div id="progress-container" class="w-60 flex flex-col items-center mb-4">
      <div class="w-full h-1 bg-teal-950 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-teal-400 via-emerald-300 to-yellow-200 w-0 transition-all duration-200"></div>
      </div>
      <span id="progress-text" class="text-[10px] font-mono text-teal-300/75 mt-2">0%</span>
    </div>

    <div id="launch-controls" class="hidden flex-col gap-3 w-full max-w-xs">
      <button id="btn-launch-ar-direct" class="cta-luminous w-full py-3.5 px-6 rounded-full text-slate-950 font-bold text-xs uppercase tracking-[0.14em] flex items-center justify-center gap-2">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Desplegar AR · Cámara</span>
      </button>
      <button id="btn-launch-vr-direct" class="organic-glass organic-btn w-full py-3.5 px-6 rounded-full text-teal-50 font-semibold text-xs uppercase tracking-[0.14em] flex items-center justify-center gap-2">
        <span>Entrar en VR · Quest 3</span>
      </button>
      <button id="btn-start-preview" class="w-full py-2.5 px-6 rounded-full text-teal-200/80 hover:text-teal-50 font-medium text-[11px] uppercase tracking-[0.16em] transition-colors">
        Explorar en Vista 3D
      </button>
    </div>

    <p class="mt-6 max-w-xs text-[11px] text-teal-200/55 leading-relaxed">
      Las 9 barcas cruzarán frente a ti sobre el río. Captura fotos o graba video directo en tu galería.
    </p>
  </div>

  <!-- INTERFAZ UNIFICADA ORGÁNICA (3D / AR CÁMARA / WEBXR AR) -->
  <div id="experience-hud">
    <!-- BARRA SUPERIOR -->
    <header class="w-full flex items-center justify-between gap-2">
      <!-- Indicador dinámico de estado / REC -->
      <div id="status-pill" class="organic-glass flex items-center gap-2 rounded-full px-3.5 py-2">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-teal-300 animate-pulse"></span>
        <span id="status-label" class="text-[11px] font-medium text-teal-50 tracking-wide">
          Travesía · 9 Barcas
        </span>
      </div>

      <!-- Iconos circulares minimalistas -->
      <div class="interactive flex items-center gap-2">
        <button id="btn-switch-cam" class="hidden organic-glass organic-btn w-10 h-10 rounded-full flex items-center justify-center text-teal-50" title="Cambiar cámara">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </button>
        <button id="btn-audio" class="organic-glass organic-btn w-10 h-10 rounded-full flex items-center justify-center text-teal-50" title="Sonido ambiental">
          <svg id="icon-audio-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <svg id="icon-audio-off" class="w-4 h-4 hidden text-rose-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <button id="btn-fullscreen" class="organic-glass organic-btn w-10 h-10 rounded-full flex items-center justify-center text-teal-50" title="Pantalla completa">
          <svg id="icon-fs-enter" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          <svg id="icon-fs-exit" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <button id="btn-exit-ar" class="hidden px-3.5 h-10 rounded-full bg-rose-950/75 border border-rose-400/45 text-rose-100 text-[11px] font-semibold uppercase tracking-wider organic-btn backdrop-blur-md">
          Salir AR
        </button>
      </div>
    </header>

    <!-- DOCK INFERIOR ORGÁNICO -->
    <footer class="w-full flex flex-col items-center gap-3">

      <!-- Acción de despliegue en plano (solo visible al escanear suelo/pared en AR) -->
      <div id="ar-placement-bar" class="hidden interactive flex items-center justify-center gap-2.5 w-full max-w-xs">
        <button id="btn-ar-place" class="cta-luminous flex-1 py-3 px-5 rounded-full text-slate-950 font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2">
          <span>Desplegar en Plano</span>
        </button>
        <button id="btn-ar-cancel-place" class="hidden organic-glass organic-btn px-4 py-3 rounded-full text-teal-100 text-[11px] font-medium">
          Listo
        </button>
      </div>

      <!-- Panel flotante compacto de ajustes (Distancia / Escala / Modo) -->
      <div id="quick-tools-drawer" class="drawer-closed interactive organic-glass rounded-3xl px-3.5 py-2.5 flex flex-wrap items-center justify-center gap-2 max-w-sm">
        <button id="btn-move-back" class="organic-btn px-3 py-1.5 rounded-full bg-teal-950/60 border border-teal-400/30 text-teal-100 text-[11px] font-medium">↓ Alejar</button>
        <button id="btn-move-forward" class="organic-btn px-3 py-1.5 rounded-full bg-teal-950/60 border border-teal-400/30 text-teal-100 text-[11px] font-medium">Acercar ↑</button>
        <div class="w-px h-4 bg-teal-300/20"></div>
        <button id="btn-scale-down" class="organic-btn w-8 h-8 rounded-full bg-teal-950/60 border border-teal-400/30 text-teal-100 text-sm font-semibold">−</button>
        <span id="scale-readout" class="text-[11px] font-mono text-teal-200/90 min-w-[38px] text-center">100%</span>
        <button id="btn-scale-up" class="organic-btn w-8 h-8 rounded-full bg-teal-950/60 border border-teal-400/30 text-teal-100 text-sm font-semibold">+</button>
        <div class="w-px h-4 bg-teal-300/20"></div>
        <button id="btn-recenter" class="organic-btn px-3 py-1.5 rounded-full bg-yellow-300/15 border border-yellow-300/40 text-yellow-200 text-[11px] font-medium">Centrar</button>
        <button id="btn-switch-vr" class="organic-btn px-3 py-1.5 rounded-full bg-teal-400/20 border border-teal-300/40 text-teal-50 text-[11px] font-semibold">VR</button>
      </div>

      <!-- Barra de captura principal (ergonomía a una mano) -->
      <div id="capture-dock" class="interactive flex flex-col items-center gap-2.5 w-full max-w-sm">
        <!-- Selector orgánico Foto / Video -->
        <div class="organic-glass rounded-full p-1 flex items-center gap-1">
          <button id="mode-photo" class="mode-pill-active px-4 py-1 rounded-full text-[11px] font-semibold tracking-wider uppercase border border-transparent transition-all">
            Foto
          </button>
          <button id="mode-video" class="px-4 py-1 rounded-full text-[11px] font-semibold tracking-wider uppercase text-teal-200/70 border border-transparent transition-all">
            Video
          </button>
        </div>

        <!-- Fila de obturador + accesos directos -->
        <div class="w-full grid grid-cols-3 items-center px-2">
          <!-- Izquierda: AR / Reubicar plano -->
          <div class="flex justify-start">
            <button id="btn-left-context" class="organic-glass organic-btn h-11 px-4 rounded-full text-teal-50 text-[11px] font-semibold tracking-wide flex items-center gap-1.5">
              <svg class="w-4 h-4 text-teal-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
              <span id="btn-left-label">AR</span>
            </button>
          </div>

          <!-- Centro: Obturador táctil -->
          <div class="flex justify-center">
            <button id="shutter-btn" aria-label="Capturar foto o video">
              <span id="shutter-core"></span>
            </button>
          </div>

          <!-- Derecha: Ajustes rápidos / última captura -->
          <div class="flex justify-end items-center gap-2">
            <button id="btn-last-capture" class="hidden organic-glass organic-btn w-11 h-11 rounded-full overflow-hidden p-0.5" title="Ver última captura">
              <img id="last-capture-thumb" class="w-full h-full object-cover rounded-full" alt="Última captura" />
            </button>
            <button id="btn-toggle-tools" class="organic-glass organic-btn w-11 h-11 rounded-full flex items-center justify-center text-teal-50" title="Ajustes de vista y escala">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- MODAL DE PREVISUALIZACIÓN Y GUARDADO EN TELÉFONO -->
  <div id="capture-modal" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center p-5">
    <div class="organic-glass w-full max-w-md rounded-3xl p-4 flex flex-col gap-3.5 shadow-2xl">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-teal-300"></span>
          <span id="capture-modal-title" class="text-xs font-semibold uppercase tracking-widest text-teal-100">
            Captura Lista
          </span>
        </div>
        <button id="btn-close-capture" class="organic-btn w-8 h-8 rounded-full bg-teal-950/80 border border-teal-400/30 text-teal-100 flex items-center justify-center text-sm">
          ✕
        </button>
      </div>

      <div class="relative w-full max-h-[58dvh] rounded-2xl overflow-hidden bg-slate-950/90 border border-teal-300/20 flex items-center justify-center">
        <img id="preview-photo" class="hidden max-w-full max-h-[58dvh] object-contain" alt="Foto capturada" />
        <video id="preview-video" class="hidden max-w-full max-h-[58dvh] object-contain" controls playsinline loop></video>
      </div>

      <div class="flex items-center gap-2.5">
        <button id="btn-save-device" class="cta-luminous flex-1 py-3.5 px-5 rounded-full text-slate-950 font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Guardar en Teléfono</span>
        </button>
        <button id="btn-share-device" class="hidden organic-glass organic-btn py-3.5 px-4 rounded-full text-teal-50 font-semibold text-xs uppercase tracking-wider flex items-center justify-center gap-1.5" title="Compartir o guardar en Fotos">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span>Fotos</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    // =========================================================================
    // ⚡ PERFIL ADAPTATIVO DE RENDIMIENTO (QUEST 3 / ANDROID / iOS / DESKTOP)
    // =========================================================================
    const UA = navigator.userAgent || '';
    const IS_QUEST = /OculusBrowser|Quest/i.test(UA);
    const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(UA) && !IS_QUEST;

    const PERF = {
      maxDpr: IS_MOBILE ? 1.25 : 1.5,
      waterSubdivisions: IS_MOBILE ? 80 : (IS_QUEST ? 108 : 124),
      fireflyCount: IS_MOBILE ? 105 : 160,
      particlesPerBoat: IS_MOBILE ? 220 : 380,
      maxAniso: IS_MOBILE ? 2 : 4
    };

    // =========================================================================
    // 📍 ZONA EDITABLE: TRAVESÍA DE LAS 9 BARCAS, AGUA Y AUDIO
    // =========================================================================
    const SCULPTURE_CONFIG = {
      baseScale: 3.4,          // Escala base de cada barca
      submersionRatio: 0.14,   // Inmersión del casco en el agua
      headingOffsetDeg: 0      // 0 = proa alineada al sentido de avance (cambia a 180 si deseas invertirla)
    };

    const CONVOY_CONFIG = {
      spanHalfX: 23.0,         // Recorrido horizontal de -23m a +23m (46m totales)
      approachDepthZ: 4.4,     // Cuánto se acercan hacia el espectador al cruzar el centro
      direction: 1             // 1 = izquierda a derecha (-X -> +X), -1 = derecha a izquierda
    };

    // 9 barcas en 3 carriles orgánicos que se acercan navegando y atraviesan el escenario
    const CONVOY_BOATS_LAYOUT = [

    function initAudioSystem() {
      if (ambientAudioEl) return;
      ambientAudioEl = new Audio(ASSETS.ambientAudio);
      ambientAudioEl.crossOrigin = 'anonymous';
      ambientAudioEl.loop = true;
      ambientAudioEl.preload = 'auto';
      ambientAudioEl.playsInline = true;
      ambientAudioEl.volume = 1.0;

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioCtx = new AudioCtx();
          const sourceNode = audioCtx.createMediaElementSource(ambientAudioEl);
          audioGainNode = audioCtx.createGain();
          audioGainNode.gain.value = 0.0;
          sourceNode.connect(audioGainNode);
          audioGainNode.connect(audioCtx.destination);
          if (typeof audioCtx.createMediaStreamDestination === 'function') {
            audioRecordDest = audioCtx.createMediaStreamDestination();
            audioGainNode.connect(audioRecordDest);
          }
        } else {
          ambientAudioEl.volume = 0.0;
        }
      } catch (err) {
        audioGainNode = null;
        audioRecordDest = null;
        ambientAudioEl.volume = 0.0;
      }
    }

    function unlockAndPlayAudio() {
      initAudioSystem();

    // 📸 COMPOSITOR DE FOTO Y VIDEO (AR CÁMARA + 3D + AUDIO) + GUARDADO MÓVIL
    // =========================================================================
    function syncCaptureCanvasSize() {
      const maxEdge = IS_MOBILE ? 1080 : 1440;
      const vw = Math.max(2, window.innerWidth);
      const vh = Math.max(2, window.innerHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      let cw = Math.round(vw * dpr);
      let ch = Math.round(vh * dpr);
      const longest = Math.max(cw, ch);
      if (longest > maxEdge) {
        const ratio = maxEdge / longest;
        cw = Math.round(cw * ratio);
        ch = Math.round(ch * ratio);
      }
      // Dimensiones pares obligatorias para codificadores H.264/MP4
      cw = cw - (cw % 2);
      ch = ch - (ch % 2);
      if (captureCanvas.width !== cw || captureCanvas.height !== ch) {
        captureCanvas.width = Math.max(2, cw);
        captureCanvas.height = Math.max(2, ch);
      }
    }

    function compositeCurrentFrameToCaptureCanvas() {
      syncCaptureCanvasSize();
      const cw = captureCanvas.width;
      const ch = captureCanvas.height;

      captureCtx.clearRect(0, 0, cw, ch);

      // 1) Capa de cámara en vivo en modo AR celular (con recorte object-fit: cover exacto)
      if (isCameraARActive && arCameraFeed.readyState >= 2 && arCameraFeed.videoWidth > 0) {
        const vw = arCameraFeed.videoWidth;
        const vh = arCameraFeed.videoHeight;
        const videoAspect = vw / vh;
        const canvasAspect = cw / ch;

        let sx = 0, sy = 0, sw = vw, sh = vh;
        if (videoAspect > canvasAspect) {
          sw = vh * canvasAspect;
          sx = (vw - sw) * 0.5;
        } else {
          sh = vw / canvasAspect;
          sy = (vh - sh) * 0.5;
        }

        captureCtx.save();
        if (currentFacingMode === 'user') {
          captureCtx.translate(cw, 0);
          captureCtx.scale(-1, 1);
        }
        captureCtx.drawImage(arCameraFeed, sx, sy, sw, sh, 0, 0, cw, ch);
        captureCtx.restore();
      } else if (!isARModeActive) {
        captureCtx.fillStyle = '#0d363c';
        captureCtx.fillRect(0, 0, cw, ch);
      } else {
        captureCtx.fillStyle = '#071d21';
        captureCtx.fillRect(0, 0, cw, ch);
      }

      // 2) Capa WebGL (las 9 barcas, río verde-aqua y luciérnagas)
      captureCtx.drawImage(renderer.domElement, 0, 0, cw, ch);
    }

    function pickBestVideoMimeType() {
      if (typeof MediaRecorder === 'undefined') return '';
      const candidates = [
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      for (const mime of candidates) {
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mime)) return mime;
      }
      return '';
    }

    function startVideoRecording() {
      if (typeof MediaRecorder === 'undefined' || typeof captureCanvas.captureStream !== 'function') {
        showToast('Este navegador no soporta grabación de video · Usa modo Foto');
        return;
      }

      unlockAndPlayAudio();
      compositeCurrentFrameToCaptureCanvas();

      const stream = captureCanvas.captureStream(30);
      if (audioRecordDest && !isAudioMuted) {
        const audioTracks = audioRecordDest.stream.getAudioTracks();
        if (audioTracks.length > 0) stream.addTrack(audioTracks[0]);
      }

      const mimeType = pickBestVideoMimeType();
      const options = mimeType ? { mimeType, videoBitsPerSecond: IS_MOBILE ? 4500000 : 6500000 } : {};

      try {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (err) {
        try {
          mediaRecorder = new MediaRecorder(stream);
        } catch (err2) {
          showToast('No se pudo iniciar la grabación de video');
          return;
        }
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const finalMime = (mediaRecorder && mediaRecorder.mimeType) || mimeType || 'video/webm';
        const isMp4 = finalMime.includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: finalMime });
        const filename = `BarcaGrullas_${getTimestampStamp()}.${ext}`;
        stream.getTracks().forEach((t) => {
          if (t.kind === 'video') t.stop();
        });
        openCapturePreview(blob, filename, 'video', finalMime);

      mediaRecorder.start(250);
      isRecordingVideo = true;
      recordStartTime = performance.now();
      shutterBtn.classList.add('recording');

    // =========================================================================
    // 🌊 ONDULACIÓN ANALÍTICA + RUTA ORGÁNICA DE LAS 9 BARCAS NAVEGANDO
    // =========================================================================
    function sampleRiverHeightAndSlopeJS(px, pz, t, out) {
      const flowT = t * (0.64 + WATER_CONFIG.flowSpeed * 1.25);
      const amp = WATER_CONFIG.waveAmplitude;
      const turb = WATER_CONFIG.turbulence;

      const ph0 = px * 0.40 - flowT * 0.80 + pz * 0.16;
      const ph1 = px * 0.74 - flowT * 1.08 + pz * 0.28;
      const ph2 = pz * 0.64 + px * 0.90 - flowT * 1.30;
      const ph3 = -pz * 0.78 + px * 1.10 - flowT * 1.44;
      const ph4 = pz * 1.36 - px * 0.66 - flowT * 1.72;
      const ph5 = pz * 1.10 + px * 1.74 - flowT * 1.98;

      const c0 = Math.cos(ph0), c1 = Math.cos(ph1), c2 = Math.cos(ph2);
      const c3 = Math.cos(ph3), c4 = Math.cos(ph4), s5 = Math.sin(ph5);

      out.h = (
        Math.sin(ph0) * 0.068 +
        Math.sin(ph1) * 0.048 +
        Math.sin(ph2) * 0.038 +
        Math.sin(ph3) * 0.032 +
        Math.sin(ph4) * 0.018 * turb +
        Math.cos(ph5) * 0.015 * turb
      ) * amp;

      out.sx = (
        c0 * 0.068 * 0.40 +
        c1 * 0.048 * 0.74 +
        c2 * 0.038 * 0.90 +
        c3 * 0.032 * 1.10 +
        c4 * 0.018 * turb * -0.66 -
        s5 * 0.015 * turb * 1.74
      ) * amp;

      out.sz = (
        c0 * 0.068 * 0.16 +
        c1 * 0.048 * 0.28 +
        c2 * 0.038 * 0.64 +
        c3 * 0.032 * -0.78 +
        c4 * 0.018 * turb * 1.36 -
        s5 * 0.015 * turb * 1.10
      ) * amp;
    }

    // Evalúa la curva de navegación: entra desde un lado, se acerca al centro del escenario y cruza hacia el otro lado
    function evaluateConvoyPosition(u, cfg, out) {
      const dir = CONVOY_CONFIG.direction;
      const halfX = CONVOY_CONFIG.spanHalfX;
      const x = THREE.MathUtils.lerp(-halfX, halfX, u) * dir;

      // Arco de aproximación: en los extremos las barcas están más lejos y al acercarse al centro se aproximan al usuario
      const centered = (u - 0.5) * 2.35;
      const approachBell = Math.exp(-centered * centered);
      const meander = Math.sin(u * Math.PI * 3.0 + cfg.swayPhase) * cfg.swayAmp;

      const z = cfg.laneZ - CONVOY_CONFIG.approachDepthZ * (1.0 - approachBell) + meander;
      out.x = x;
      out.z = z;
    }

    function smoothstepJS(edge0, edge1, x) {
      const t = THREE.MathUtils.clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function setupAtmosphereDome() {
      const domeGeo = new THREE.SphereGeometry(68, 22, 14);
      const domeMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        uniforms: {
          uTopColor:      { value: new THREE.Color(0x0b2634) },
          uMidSkyColor:   { value: new THREE.Color(0x144952) },
          uHorizonColor:  { value: new THREE.Color(0x287878) },
          uMistGlowColor: { value: new THREE.Color(0x4fb3a8) },
          uBottomColor:   { value: new THREE.Color(0x0a3034) },
          uMoonDir:       { value: new THREE.Vector3(-0.32, 0.24, -0.92).normalize() }
        },
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 uTopColor, uMidSkyColor, uHorizonColor, uMistGlowColor, uBottomColor, uMoonDir;
          varying vec3 vWorldPos;
          void main() {
            vec3 dir = normalize(vWorldPos);
            float h = dir.y;
            vec3 col = h >= 0.0
              ? mix(mix(uHorizonColor, uMidSkyColor, smoothstep(0.0, 0.30, h)), uTopColor, smoothstep(0.22, 0.85, h))
              : mix(uHorizonColor, uBottomColor, pow(max(-h, 0.0001), 0.55));
            col += uMistGlowColor * exp(-abs(h) * 7.5) * 0.22;
            float moonAlign = max(dot(dir, uMoonDir), 0.0);
            col += vec3(0.76, 0.96, 0.90) * (pow(max(moonAlign, 0.0001), 7.0) * 0.26 + pow(max(moonAlign, 0.0001), 36.0) * 0.24);
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      skyDome = new THREE.Mesh(domeGeo, domeMat);
      scene.add(skyDome);
    }

    function clearDetectedPlaneMeshes() {
      detectedPlaneMeshes.forEach((mesh) => {
        if (mesh.geometry) mesh.geometry.dispose();
        if (mesh.material) mesh.material.dispose();
        detectedPlanesGroup.remove(mesh);
      });
      detectedPlaneMeshes.clear();
    }

    function updateWebXRDetectedPlanes(frame) {
      if (!isARPlacementMode || !frame.detectedPlanes || !xrRefSpace) {
        detectedPlanesGroup.visible = false;
        return;
      }
      detectedPlanesGroup.visible = true;
      const activePlanes = frame.detectedPlanes;

      for (const [xrPlane, mesh] of detectedPlaneMeshes.entries()) {
        if (!activePlanes.has(xrPlane)) {
          if (mesh.geometry) mesh.geometry.dispose();
          if (mesh.material) mesh.material.dispose();
          detectedPlanesGroup.remove(mesh);
          detectedPlaneMeshes.delete(xrPlane);
        }
      }

      activePlanes.forEach((xrPlane) => {
        const pose = frame.getPose(xrPlane.planeSpace, xrRefSpace);
        if (!pose) return;
        let mesh = detectedPlaneMeshes.get(xrPlane);
        const lastChanged = xrPlane.lastChangedTime || 0;

        if (!mesh || mesh.userData.lastChanged !== lastChanged) {
          if (mesh) {
            if (mesh.geometry) mesh.geometry.dispose();
            if (mesh.material) mesh.material.dispose();
            detectedPlanesGroup.remove(mesh);
          }
          const poly = xrPlane.polygon;
          if (!poly || poly.length < 3) return;
          const shape = new THREE.Shape();
          shape.moveTo(poly[0].x, -poly[0].z);
          for (let i = 1; i < poly.length; i++) shape.lineTo(poly[i].x, -poly[i].z);
          shape.closePath();

          const geo = new THREE.ShapeGeometry(shape);
          geo.rotateX(-Math.PI / 2);
          const isVert = xrPlane.orientation === 'vertical';
          const mat = new THREE.MeshBasicMaterial({
            color: isVert ? 0xfde047 : 0x2dd4bf,
            transparent: true, opacity: isVert ? 0.14 : 0.11,
            side: THREE.DoubleSide, depthWrite: false
          });
          mesh = new THREE.Mesh(geo, mat);
          mesh.matrixAutoUpdate = false;
          mesh.userData.lastChanged = lastChanged;
          detectedPlanesGroup.add(mesh);
          detectedPlaneMeshes.set(xrPlane, mesh);
        }
        mesh.matrix.fromArray(pose.transform.matrix);
      });
    }

    function updateFallbackSurfaceEstimate(isWebXR) {
      const activeCam = isWebXR ? renderer.xr.getCamera() : camera;
      activeCam.getWorldPosition(_camWorldPos);
      activeCam.getWorldDirection(_camWorldDir);

      const lookingDown = _camWorldDir.y < -0.25;
      if (lookingDown) {
        const t = (_camWorldPos.y) / Math.max(0.25, -_camWorldDir.y);
        const dist = THREE.MathUtils.clamp(t, 2.5, 6.8);
        currentSurfaceHit.position.copy(_camWorldPos).addScaledVector(_camWorldDir, dist);
        currentSurfaceHit.position.y = 0.0;
        currentSurfaceHit.normal.set(0, 1, 0);
        currentSurfaceHit.quaternion.identity();
        currentSurfaceHit.isVertical = false;
        currentSurfaceHit.valid = true;
        surfaceReticle.visible = true;
        surfaceReticle.matrix.compose(currentSurfaceHit.position, currentSurfaceHit.quaternion, _hitScale.set(1, 1, 1));
        updateReticleVisualState(false, 'Plano Horizontal (Suelo)');
      } else {
        const dist = 4.2;
        currentSurfaceHit.position.copy(_camWorldPos).addScaledVector(_camWorldDir, dist);
        _wallFwd.set(-_camWorldDir.x, 0, -_camWorldDir.z);
        if (_wallFwd.lengthSq() < 0.0001) _wallFwd.set(0, 0, 1);
        _wallFwd.normalize();
        currentSurfaceHit.normal.copy(_wallFwd);
        currentSurfaceHit.quaternion.setFromUnitVectors(_upAxis, _wallFwd);
        currentSurfaceHit.isVertical = true;
        currentSurfaceHit.valid = true;
        surfaceReticle.visible = true;
        surfaceReticle.matrix.compose(currentSurfaceHit.position, currentSurfaceHit.quaternion, _hitScale.set(1, 1, 1));
        updateReticleVisualState(true, 'Plano Vertical (Pared)');
      }
    }

    function updateWebXRHitTest(frame, dt) {
      if (!isARPlacementMode) {
        surfaceReticle.visible = false;
        detectedPlanesGroup.visible = false;
        return;
      }

      updateWebXRDetectedPlanes(frame);

      let foundRealHit = false;
      if (xrHitTestSource && xrRefSpace) {
        const results = frame.getHitTestResults(xrHitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(xrRefSpace);
          if (pose) {
            _hitMat.fromArray(pose.transform.matrix);
            _hitMat.decompose(_hitPos, _hitQuat, _hitScale);
            _hitNormal.set(0, 1, 0).applyQuaternion(_hitQuat).normalize();

            const isVert = Math.abs(_hitNormal.y) < 0.65;
            currentSurfaceHit.valid = true;
            currentSurfaceHit.isVertical = isVert;
            currentSurfaceHit.position.copy(_hitPos);
            currentSurfaceHit.normal.copy(_hitNormal);
            currentSurfaceHit.quaternion.copy(_hitQuat);

            surfaceReticle.visible = true;
            surfaceReticle.matrix.copy(_hitMat);
            updateReticleVisualState(isVert, isVert ? 'Pared Vertical Detectada' : 'Suelo Horizontal Detectado');

            xrNoHitElapsed = 0;
            foundRealHit = true;
          }
        }
      }

      if (!foundRealHit) {
        xrNoHitElapsed += dt;
        if (xrNoHitElapsed > 0.45) updateFallbackSurfaceEstimate(true);
      }
    }

    function placeSceneAtDetectedSurface() {
      if (!currentSurfaceHit.valid) {
        showToast('Apunta al suelo o a una pared para desplegar');
        return;
      }

      const activeCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      activeCam.getWorldPosition(_camWorldPos);

      if (currentSurfaceHit.isVertical) {
        _wallFwd.set(currentSurfaceHit.normal.x, 0, currentSurfaceHit.normal.z);
        if (_wallFwd.lengthSq() < 0.001) {
          _wallFwd.subVectors(_camWorldPos, currentSurfaceHit.position);
          _wallFwd.y = 0;
        }
        _wallFwd.normalize();
        const toCamX = _camWorldPos.x - currentSurfaceHit.position.x;
        const toCamZ = _camWorldPos.z - currentSurfaceHit.position.z;
        if (_wallFwd.x * toCamX + _wallFwd.z * toCamZ < 0) _wallFwd.negate();

        const clearance = 1.6 * arAnchorScale;
        barcaAnchorGroup.position.set(
          currentSurfaceHit.position.x + _wallFwd.x * clearance,
          currentSurfaceHit.position.y - 0.55 * arAnchorScale,
          currentSurfaceHit.position.z + _wallFwd.z * clearance
        );
        barcaAnchorGroup.rotation.set(0, Math.atan2(_wallFwd.x, _wallFwd.z), 0);
        showToast('Travesía desplegada frente a la pared');
      } else {
        const dx = _camWorldPos.x - currentSurfaceHit.position.x;
        const dz = _camWorldPos.z - currentSurfaceHit.position.z;
        barcaAnchorGroup.position.copy(currentSurfaceHit.position);
        barcaAnchorGroup.rotation.set(0, Math.atan2(dx, dz), 0);
        showToast('Travesía desplegada sobre el plano');
      }

      barcaAnchorGroup.visible = true;
      hasPlacedInAR = true;
      setARPlacementMode(false);
      triggerMaterializationOnce();
    }

    }

    // =========================================================================
    // 💧 AGUA FLUVIAL OPTIMIZADA CON ESTELAS DINÁMICAS DE LAS 9 BARCAS
    // =========================================================================
    function createSeamlessUtilityTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;

      const perm = new Uint8Array(512);
      let seed = 1337;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
      }
      for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

      const tileNoise = (x, y, period) => {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const x0 = ((xi % period) + period) % period, y0 = ((yi % period) + period) % period;
        const x1 = (x0 + 1) % period, y1 = (y0 + 1) % period;
        const aa = perm[(perm[x0 & 255] + y0) & 255] / 255;
        const ba = perm[(perm[x1 & 255] + y0) & 255] / 255;
        const ab = perm[(perm[x0 & 255] + y1) & 255] / 255;
        const bb = perm[(perm[x1 & 255] + y1) & 255] / 255;
        return (aa * (1 - u) + ba * u) * (1 - v) + (ab * (1 - u) + bb * u) * v;
      };

      const fbmTile = (u, v, baseFreq, ox, oy) => {
        let sum = 0, amp = 0.52, freq = baseFreq;
        for (let o = 0; o < 3; o++) {
          sum += tileNoise(u * freq + ox, v * freq + oy, freq) * amp;
          freq *= 2; amp *= 0.5;
        }
        return Math.min(1, Math.max(0, sum));
      };

      for (let y = 0; y < size; y++) {
        const v = y / size;
        for (let x = 0; x < size; x++) {
          const u = x / size;
          const idx = (y * size + x) * 4;
          data[idx]     = Math.floor(fbmTile(u, v, 4, 0, 0) * 255);
          data[idx + 1] = Math.floor(fbmTile(u, v, 4, 17, 29) * 255);
          data[idx + 2] = Math.floor(Math.pow(fbmTile(u, v, 8, 43, 11), 1.35) * 255);
          data[idx + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.needsUpdate = true;
      return tex;
    }

    function createFallbackWaterNormalTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = (x / size) * Math.PI * 2, v = (y / size) * Math.PI * 2;
          const dx = Math.cos(u * 3 + v * 2) * 0.34 + Math.cos(u * 5 - v * 4) * 0.26 + Math.sin(u * 2 + v * 6) * 0.22 + Math.cos(u * 9 + v * 7) * 0.14;
          const dy = Math.sin(u * 2 + v * 4) * 0.34 + Math.cos(u * 4 + v * 5) * 0.26 + Math.sin(u * 6 - v * 3) * 0.22 + Math.sin(u * 8 - v * 9) * 0.14;
          const idx = (y * size + x) * 4;
          data[idx] = Math.floor((dx * 0.44 + 0.5) * 255);
          data[idx + 1] = Math.floor((dy * 0.44 + 0.5) * 255);
          data[idx + 2] = 238; data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function buildSobelNormalTextureFromImage(img, strength = 2.9) {
      const size = IS_MOBILE ? 256 : 512;
      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = size; srcCanvas.height = size;
      const srcCtx = srcCanvas.getContext('2d');
      srcCtx.drawImage(img, 0, 0, size, size);
      const srcData = srcCtx.getImageData(0, 0, size, size).data;

      const lum = new Float32Array(size * size);
      let sumR = 0, sumG = 0, sumB = 0, samples = 0;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const r = srcData[i] / 255, g = srcData[i + 1] / 255, b = srcData[i + 2] / 255;
          lum[y * size + x] = r * 0.299 + g * 0.587 + b * 0.114;
          if ((x & 7) === 0 && (y & 7) === 0) { sumR += r; sumG += g; sumB += b; samples++; }
        }
      }
      if ((sumB / samples > 0.72) && (Math.abs(sumR / samples - 0.5) < 0.16) && (Math.abs(sumG / samples - 0.5) < 0.16)) {
        return { isNormalMap: true, normalTex: null };
      }

      const outCanvas = document.createElement('canvas');
      outCanvas.width = size; outCanvas.height = size;
      const outCtx = outCanvas.getContext('2d');
      const outImg = outCtx.createImageData(size, size);
      const out = outImg.data;
      const sampleLum = (x, y) => lum[(((y + size) % size) * size) + ((x + size) % size)];

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const tl = sampleLum(x - 1, y - 1), t = sampleLum(x, y - 1), tr = sampleLum(x + 1, y - 1);
          const l = sampleLum(x - 1, y), r = sampleLum(x + 1, y);
          const bl = sampleLum(x - 1, y + 1), b = sampleLum(x, y + 1), br = sampleLum(x + 1, y + 1);
          const dx = (tr + 2 * r + br - tl - 2 * l - bl) * strength;
          const dy = (bl + 2 * b + br - tl - 2 * t - tr) * strength;
          const invLen = 1.0 / Math.hypot(dx, dy, 1.0);
          const idx = (y * size + x) * 4;
          out[idx]     = Math.floor((-dx * invLen * 0.5 + 0.5) * 255);
          out[idx + 1] = Math.floor((-dy * invLen * 0.5 + 0.5) * 255);
          out[idx + 2] = Math.floor((invLen * 0.5 + 0.5) * 255);
          out[idx + 3] = 255;
        }
      }
      outCtx.putImageData(outImg, 0, 0);
      const normalTex = new THREE.CanvasTexture(outCanvas);
      normalTex.wrapS = THREE.RepeatWrapping; normalTex.wrapT = THREE.RepeatWrapping;
      normalTex.needsUpdate = true;
      return { isNormalMap: false, normalTex };
    }

    function loadRepoWaterTexture() {
      const texLoader = new THREE.TextureLoader();
      texLoader.setCrossOrigin('anonymous');
      texLoader.load(ASSETS.waterTexture, (loadedTex) => {
        const aniso = Math.min(PERF.maxAniso, renderer.capabilities.getMaxAnisotropy());
        loadedTex.wrapS = THREE.RepeatWrapping; loadedTex.wrapT = THREE.RepeatWrapping;
        loadedTex.anisotropy = aniso; loadedTex.needsUpdate = true;
        try {
          const analysis = buildSobelNormalTextureFromImage(loadedTex.image, 2.9);
          if (analysis.isNormalMap) waterUniforms.uNormalMap.value = loadedTex;
          else { analysis.normalTex.anisotropy = aniso; waterUniforms.uNormalMap.value = analysis.normalTex; }
        } catch (err) {}
      }, undefined, () => {});
    }

    function setupWaterSurface() {
      const normalTex = createFallbackWaterNormalTexture();
      const utilityTex = createSeamlessUtilityTexture();

      const segs = WATER_CONFIG.subdivisions;
      const waterGeo = new THREE.PlaneGeometry(58, 46, segs, segs);
      waterGeo.rotateX(-Math.PI / 2);

      waterUniforms = {
        uTime:              { value: 0 },
        uNormalMap:         { value: normalTex },
        uUtilityMap:        { value: utilityTex },
        uSunDirection:      { value: new THREE.Vector3(6, 13, 8).normalize() },
        uSkyZenithColor:    { value: new THREE.Color(0x11404a) },
        uSkyHorizonColor:   { value: new THREE.Color(0x32968e) },
        uWaterDeepColor:    { value: new THREE.Color(0x0b4547) },
        uWaterShallowColor: { value: new THREE.Color(0x188f84) },
        uCrestGlowColor:    { value: new THREE.Color(0x33bfa9) },
        uAtmoAmbientColor:  { value: new THREE.Color(0x1d706b) },
        uFoamColor:         { value: new THREE.Color(0xc4e3de) },
        uFogColor:          { value: new THREE.Color(SCENE_FOG_HEX) },
        uFogDensity:        { value: SCENE_FOG_DENSITY },
        uWaterFlow:         { value: new THREE.Vector2(CONVOY_CONFIG.direction, 0.14).normalize() },
        uFlowSpeed:         { value: WATER_CONFIG.flowSpeed },
        uWaveAmp:           { value: WATER_CONFIG.waveAmplitude },
        uTurbulence:        { value: WATER_CONFIG.turbulence },
        uBoatWakes:         { value: _boatWakeArray },
        uOpacity:           { value: 1.0 }
      };

      const waterMat = new THREE.ShaderMaterial({
        uniforms: waterUniforms,
        transparent: true,
        depthWrite: false,
        side: THREE.FrontSide,

        vertexShader: /* glsl */`
          uniform float uTime, uWaveAmp, uFlowSpeed, uTurbulence;
          varying vec3 vWorldPos, vWaveNormal;
          varying vec2 vLocalXZ;
          varying float vHeight, vSteepness, vFogDepth;

          void main() {
            vec3 pos = position;
            vec2 p = pos.xz;
            float flowT = uTime * (0.64 + uFlowSpeed * 1.25);

            float ph0 = p.x * 0.40 - flowT * 0.80 + p.y * 0.16;
            float ph1 = p.x * 0.74 - flowT * 1.08 + p.y * 0.28;
            float ph2 = p.y * 0.64 + p.x * 0.90 - flowT * 1.30;
            float ph3 = -p.y * 0.78 + p.x * 1.10 - flowT * 1.44;
            float ph4 = p.y * 1.36 - p.x * 0.66 - flowT * 1.72;
            float ph5 = p.y * 1.10 + p.x * 1.74 - flowT * 1.98;
            float ph6 = p.y * 2.10 - p.x * 1.85 - flowT * 2.30;

            float c0 = cos(ph0), c1 = cos(ph1), c2 = cos(ph2), c3 = cos(ph3), c4 = cos(ph4), s5 = sin(ph5), c6 = cos(ph6);

            float h = (
              sin(ph0) * 0.068 + sin(ph1) * 0.048 + sin(ph2) * 0.038 + sin(ph3) * 0.032 +
              sin(ph4) * 0.018 * uTurbulence + cos(ph5) * 0.015 * uTurbulence + sin(ph6) * 0.011 * uTurbulence
            ) * uWaveAmp;

            float dhdx = (
              c0 * 0.02720 + c1 * 0.03552 + c2 * 0.03420 + c3 * 0.03520 -
              c4 * 0.01188 * uTurbulence - s5 * 0.02610 * uTurbulence - c6 * 0.02035 * uTurbulence
            ) * uWaveAmp;

            float dhdz = (
              c0 * 0.01088 + c1 * 0.01344 + c2 * 0.02432 - c3 * 0.02496 +
              c4 * 0.02448 * uTurbulence - s5 * 0.01650 * uTurbulence + c6 * 0.02310 * uTurbulence
            ) * uWaveAmp;

            pos.x += (c0 * 0.024 + c1 * 0.016) * uWaveAmp;
            pos.z += (c2 * 0.012 - c3 * 0.011) * uWaveAmp;
            pos.y += h;

            vHeight = h;
            vLocalXZ = pos.xz;
            vec3 n = normalize(vec3(-dhdx, 1.0, -dhdz));
            vWaveNormal = normalize(mat3(modelMatrix) * n);
            vSteepness = clamp(1.0 - n.y, 0.0, 1.0);

            vec4 wp = modelMatrix * vec4(pos, 1.0);
            vWorldPos = wp.xyz;
            vec4 mvPosition = viewMatrix * wp;
            vFogDepth = -mvPosition.z;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,

        fragmentShader: /* glsl */`
          uniform sampler2D uNormalMap, uUtilityMap;
          uniform float uTime, uFogDensity, uFlowSpeed, uTurbulence, uOpacity;
          uniform vec3 uSunDirection, uSkyZenithColor, uSkyHorizonColor, uWaterDeepColor, uWaterShallowColor;
          uniform vec3 uCrestGlowColor, uAtmoAmbientColor, uFoamColor, uFogColor;
          uniform vec2 uWaterFlow;
          uniform vec3 uBoatWakes[9];

          varying vec3 vWorldPos, vWaveNormal;
          varying vec2 vLocalXZ;
          varying float vHeight, vSteepness, vFogDepth;

          void main() {
            vec2 flow = uWaterFlow * uFlowSpeed;
            float tFlow = uTime * uFlowSpeed;

            vec3 utilA = texture2D(uUtilityMap, vLocalXZ * 0.075 - flow * uTime * 0.16).rgb;
            vec3 utilB = texture2D(uUtilityMap, vLocalXZ * 0.165 - flow * uTime * 0.28 + vec2(0.31, 0.19)).rgb;

            vec2 warp = (utilA.rg - 0.5) * 0.78 * uTurbulence;
            vec2 turbPos = vLocalXZ + warp;

            mat2 rotA = mat2(0.92, -0.39, 0.39, 0.92);
            vec3 n1 = texture2D(uNormalMap, turbPos * 0.25 - flow * uTime * 0.80).xyz * 2.0 - 1.0;
            vec3 n2 = texture2D(uNormalMap, (rotA * turbPos) * 0.54 - (rotA * flow) * uTime * 1.18 + vec2(0.37, 0.61)).xyz * 2.0 - 1.0;
            vec3 detailN = normalize(n1 * 0.85 + n2 * 0.70);

            vec3 N = normalize(vWaveNormal + vec3(detailN.x * 0.54, 0.0, detailN.z * 0.54));
            vec3 V = normalize(cameraPosition - vWorldPos);
            float NdotV = max(dot(N, V), 0.001);

            float fresnel = 0.02 + 0.98 * pow(max(1.0 - NdotV, 0.0001), 4.8);
            vec3 R = reflect(-V, N);
            vec3 skyRefl = mix(uSkyHorizonColor, uSkyZenithColor, pow(clamp(R.y, 0.0001, 1.0), 0.62));

            vec3 L = normalize(uSunDirection);
            float wrapDiffuse = clamp(dot(N, L) * 0.5 + 0.5, 0.0, 1.0);
            vec3 H = normalize(L + V);
            float NdotH = max(dot(N, H), 0.0);

            float softSparkle = pow(max(NdotH, 0.0001), 86.0) * 0.20;
            float softSheen   = pow(max(NdotH, 0.0001), 18.0) * 0.07;

            float eddyTone = utilA.r * 0.55 + utilB.g * 0.45;
            float depthT = clamp(smoothstep(-0.20, 0.22, vHeight) * 0.58 + eddyTone * 0.42, 0.0, 1.0);
            vec3 waterColor = mix(uWaterDeepColor, uWaterShallowColor, depthT);
            waterColor = waterColor * (0.88 + 0.20 * wrapDiffuse) + uAtmoAmbientColor * 0.16;

            float sssMask = smoothstep(0.04, 0.24, vHeight) * (0.4 + 0.6 * pow(max(dot(V, -L), 0.0001), 2.0));
            waterColor = mix(waterColor, uCrestGlowColor, clamp(sssMask * 0.30, 0.0, 0.32));

            // Estela y sombra suave dinámica siguiendo a cada una de las 9 barcas en movimiento
            float wakeFoamAcc = 0.0;
            float hullShadowAcc = 0.0;
            for (int i = 0; i < 9; i++) {
              vec3 bw = uBoatWakes[i];
              if (bw.z > 0.05) {
                vec2 d = vLocalXZ - bw.xy;
                float d2 = dot(d, d);
                if (d2 < 14.0) {
                  // Sombra muy sutil bajo el casco
                  hullShadowAcc += exp(-d2 * 0.55) * 0.18 * bw.z;
                  // Estela suave detrás de la barca (estirada sobre el eje de avance)
                  vec2 trailD = vec2(d.x * 0.46 + 0.9 * uWaterFlow.x, d.y * 1.05);
                  wakeFoamAcc += exp(-dot(trailD, trailD) * 0.58) * 0.34 * bw.z;
                }
              }
            }

            waterColor *= (1.0 - clamp(hullShadowAcc, 0.0, 0.26));

            vec3 col = mix(waterColor, skyRefl, clamp(fresnel * 0.34, 0.04, 0.36));
            col += softSparkle * vec3(0.86, 0.95, 0.92);
            col += softSheen * vec3(0.56, 0.84, 0.80);

            float chopFoam = smoothstep(0.14, 0.28, vHeight) * smoothstep(0.04, 0.14, vSteepness) * 0.22;
            float organicBreakup = utilA.b * 0.50 + utilB.b * 0.50;
            float rawFoam = clamp(wakeFoamAcc + chopFoam, 0.0, 0.82);
            float finalFoam = smoothstep(0.22, 0.78, rawFoam * (0.40 + 1.05 * organicBreakup)) * 0.42;

            col = mix(col, uFoamColor * (0.82 + 0.14 * wrapDiffuse), finalFoam);

            if (uFogDensity > 0.0) {
              float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
              col = mix(col, uFogColor, clamp(fogFactor, 0.0, 0.90));
            }

            // Desvanecimiento ovalado suave hacia los bordes
            float ovalDist = length(vec2(vLocalXZ.x / 27.0, vLocalXZ.y / 21.0));
            float edgeFade = smoothstep(1.0, 0.66, ovalDist);

            float alpha = mix(0.88, 0.96, fresnel * 0.5);
            alpha = mix(alpha, 0.98, finalFoam);
            alpha *= edgeFade * uOpacity;

            gl_FragColor = vec4(col, alpha);
          }
        `
      });

      waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.set(0, WATER_CONFIG.levelY, 0);
      waterMesh.renderOrder = 1;
      barcaAnchorGroup.add(waterMesh);
    }

    function setupOrganicFireflies() {
      const count = FIREFLY_CONFIG.count;
      const geo = new THREE.BufferGeometry();
      const origins = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const flightA = new Float32Array(count * 4);
      const flightB = new Float32Array(count * 4);

      const palette = [
        new THREE.Color(0xd9f99d), new THREE.Color(0xcff868),
        new THREE.Color(0xbef264), new THREE.Color(0xfef08a), new THREE.Color(0xfde047)
      ];

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 1.0 + Math.pow(Math.random(), 0.78) * FIREFLY_CONFIG.spreadRadius;
        origins[i * 3]     = Math.cos(angle) * radius;
        origins[i * 3 + 1] = WATER_CONFIG.levelY + FIREFLY_CONFIG.minHeight
                           + Math.pow(Math.random(), 1.25) * (FIREFLY_CONFIG.maxHeight - FIREFLY_CONFIG.minHeight);
        origins[i * 3 + 2] = Math.sin(angle) * radius * 0.75 - 2.0;

        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;

        flightA[i * 4]     = Math.random() * Math.PI * 2;
        flightA[i * 4 + 1] = Math.random() * Math.PI * 2;
        flightA[i * 4 + 2] = Math.random() * Math.PI * 2;
        flightA[i * 4 + 3] = 0.75 + Math.random() * 1.85;

        flightB[i * 4]     = 0.24 + Math.random() * 0.34;
        flightB[i * 4 + 1] = 0.75 + Math.random() * 0.95;
        flightB[i * 4 + 2] = Math.random() * Math.PI * 2;
        flightB[i * 4 + 3] = 1.05 + Math.random() * 0.95;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(origins, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aFlightA', new THREE.BufferAttribute(flightA, 4));
      geo.setAttribute('aFlightB', new THREE.BufferAttribute(flightB, 4));

      firefliesMaterial = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uMinY: { value: WATER_CONFIG.levelY + 0.32 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: /* glsl */`
          attribute vec3 aColor;
          attribute vec4 aFlightA, aFlightB;
          uniform float uTime, uMinY, uPixelRatio;
          varying vec3 vColor; varying float vGlow;

          void main() {
            vColor = aColor;
            float pX = aFlightA.x, pY = aFlightA.y, pZ = aFlightA.z, wanderR = aFlightA.w;
            float spd = aFlightB.x, pulseSpeed = aFlightB.y, pulsePhase = aFlightB.z, sizeScale = aFlightB.w;
            float t = uTime * spd;

            vec3 offset;
            offset.x = (sin(t + pX) * 0.62 + sin(t * 2.13 + pZ * 1.4) * 0.28 + cos(t * 0.47 + pY) * 0.35) * wanderR;
            offset.z = (cos(t * 0.89 + pZ) * 0.62 + sin(t * 1.91 + pX * 1.3) * 0.28 + sin(t * 0.53 + pY) * 0.35) * wanderR;
            offset.y = (sin(t * 1.27 + pY) * 0.45 + cos(t * 2.61 + pX) * 0.18 + sin(t * 0.61 + pZ) * 0.22) * (wanderR * 0.42);
            offset.y += sin(uTime * 5.2 + pX * 3.0) * 0.025;

            vec3 pos = position + offset;
            pos.y = max(pos.y, uMinY);

            float waveA = 0.5 + 0.5 * sin(uTime * pulseSpeed + pulsePhase);
            float waveB = 0.5 + 0.5 * sin(uTime * (pulseSpeed * 0.47) + pulsePhase * 1.7);
            vGlow = 0.14 + 0.86 * pow(max(waveA, 0.0001), 1.65) * (0.55 + 0.45 * waveB);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = clamp(((24.0 + 30.0 * vGlow) * sizeScale * uPixelRatio) / max(-mvPosition.z, 0.5), 5.0, 52.0);
          }
        `,
        fragmentShader: /* glsl */`
          varying vec3 vColor; varying float vGlow;
          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            float core = smoothstep(0.17, 0.0, d);
            float innerHalo = exp(-d * 5.6);
            float outerMist = smoothstep(0.5, 0.0, d) * 0.36;
            float alpha = clamp((core * 0.95 + innerHalo * 0.78 + outerMist) * vGlow, 0.0, 1.0);
            vec3 finalCol = mix(vColor, vec3(1.0, 1.0, 0.92), core * 0.75) * (0.95 + vGlow * 0.60);
            gl_FragColor = vec4(finalCol, alpha);
          }
        `
      });

      firefliesMesh = new THREE.Points(geo, firefliesMaterial);
      firefliesMesh.frustumCulled = false;
      firefliesMesh.renderOrder = 4;
      barcaAnchorGroup.add(firefliesMesh);
    }

    // =========================================================================
    // ✨ MATERIALIZACIÓN ÚNICA + BATCHING EN 1 INSTANCEDMESH PARA LAS 9 BARCAS
    // =========================================================================
    function buildSurfaceParticleGeometry(sourceRoot, referenceParent, particleCount) {
      referenceParent.updateMatrixWorld(true);
      const invParent = new THREE.Matrix4().copy(referenceParent.matrixWorld).invert();
      const relMat = new THREE.Matrix4();

      const triangles = [];
      let totalArea = 0;
      const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
      const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), cross = new THREE.Vector3();
      let minY = Infinity, maxY = -Infinity;

      sourceRoot.traverse((node) => {
        if (!node.isMesh || !node.geometry) return;
        const posAttr = node.geometry.attributes.position;
        if (!posAttr) return;
        relMat.multiplyMatrices(invParent, node.matrixWorld);
        const indexAttr = node.geometry.index;
        const triCount = indexAttr ? Math.floor(indexAttr.count / 3) : Math.floor(posAttr.count / 3);

        for (let i = 0; i < triCount; i++) {
          const i0 = indexAttr ? indexAttr.getX(i * 3)     : i * 3;
          const i1 = indexAttr ? indexAttr.getX(i * 3 + 1) : i * 3 + 1;
          const i2 = indexAttr ? indexAttr.getX(i * 3 + 2) : i * 3 + 2;
          vA.fromBufferAttribute(posAttr, i0).applyMatrix4(relMat);
          vB.fromBufferAttribute(posAttr, i1).applyMatrix4(relMat);
          vC.fromBufferAttribute(posAttr, i2).applyMatrix4(relMat);
          if (vA.y < minY) minY = vA.y; if (vB.y < minY) minY = vB.y; if (vC.y < minY) minY = vC.y;
          if (vA.y > maxY) maxY = vA.y; if (vB.y > maxY) maxY = vB.y; if (vC.y > maxY) maxY = vC.y;
          e1.subVectors(vB, vA); e2.subVectors(vC, vA);
          cross.crossVectors(e1, e2);
          const area = cross.length() * 0.5;
          if (area > 1e-7) {
            totalArea += area;
            triangles.push({ ax: vA.x, ay: vA.y, az: vA.z, bx: vB.x, by: vB.y, bz: vB.z, cx: vC.x, cy: vC.y, cz: vC.z, cumArea: totalArea });
          }
        }
      });

      if (!isFinite(minY) || !isFinite(maxY) || maxY <= minY) { minY = -0.3; maxY = 4.0; }
      localBoundsMinY = minY;
      localBoundsMaxY = maxY;
      const heightSpan = Math.max(0.01, maxY - minY);

      const positions = new Float32Array(particleCount * 3);
      const scatterDirs = new Float32Array(particleCount * 3);
      const meta = new Float32Array(particleCount * 4);

      const pickTriangle = (targetArea) => {
        let lo = 0, hi = triangles.length - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (triangles[mid].cumArea < targetArea) lo = mid + 1;
          else hi = mid;
        }
        return triangles[lo];
      };

      for (let i = 0; i < particleCount; i++) {
        let px = 0, py = minY, pz = 0;
        if (triangles.length > 0) {
          const tri = pickTriangle(Math.random() * totalArea);
          let r1 = Math.random(), r2 = Math.random();
          if (r1 + r2 > 1.0) { r1 = 1.0 - r1; r2 = 1.0 - r2; }
          const r0 = 1.0 - r1 - r2;
          px = tri.ax * r0 + tri.bx * r1 + tri.cx * r2;
          py = tri.ay * r0 + tri.by * r1 + tri.cy * r2;
          pz = tri.az * r0 + tri.bz * r1 + tri.cz * r2;
        }
        positions[i * 3] = px; positions[i * 3 + 1] = py; positions[i * 3 + 2] = pz;
        const theta = Math.random() * Math.PI * 2;
        const horiz = 0.55 + Math.random() * 1.10;
        scatterDirs[i * 3] = Math.cos(theta) * horiz;
        scatterDirs[i * 3 + 1] = (Math.random() - 0.30) * 0.90;
        scatterDirs[i * 3 + 2] = Math.sin(theta) * horiz;

        meta[i * 4] = THREE.MathUtils.clamp((py - minY) / heightSpan, 0, 1);
        meta[i * 4 + 1] = Math.random() * Math.PI * 2;
        meta[i * 4 + 2] = 0.8 + Math.random() * 0.95;
        meta[i * 4 + 3] = Math.random();
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aScatter', new THREE.BufferAttribute(scatterDirs, 3));
      geo.setAttribute('aMeta', new THREE.BufferAttribute(meta, 4));
      return geo;
    }

    function createMaterializationParticleMaterial() {
      return new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 }, uProgress: { value: 0 },
          uPixelRatio: { value: renderer.getPixelRatio() },
          uColorA: { value: new THREE.Color(0x7af5df) },
          uColorB: { value: new THREE.Color(0xf4f99b) }
        },
        vertexShader: /* glsl */`
          attribute vec3 aScatter; attribute vec4 aMeta;
          uniform float uTime, uProgress, uPixelRatio;
          varying float vAlpha, vHeat, vColorMix;
          void main() {
            float normY = aMeta.x, phase = aMeta.y, sizeScale = aMeta.z;
            vColorMix = aMeta.w;
            float wavePos = uProgress * 1.24 - 0.10;
            float dist = normY - wavePos;
            float approach = smoothstep(0.42, 0.0, dist);
            float afterFade = smoothstep(-0.14, 0.02, dist);
            float scatterAmt = clamp(max(dist, 0.0) * 2.1, 0.0, 1.0);
            float swirlAngle = uTime * 3.2 + phase + scatterAmt * 2.8;
            vec3 swirlOffset = vec3(cos(swirlAngle) * 0.25, sin(uTime * 2.6 + phase) * 0.14, sin(swirlAngle) * 0.25) * scatterAmt;
            vec3 pos = position + aScatter * (scatterAmt * scatterAmt * 1.12) + swirlOffset;
            float edgeBand = exp(-dist * dist * 125.0);
            vHeat = clamp(edgeBand * 1.35, 0.0, 1.0);
            float twinkle = 0.68 + 0.32 * sin(uTime * 11.5 + phase * 3.0);
            float envelope = smoothstep(0.0, 0.05, uProgress) * (1.0 - smoothstep(0.92, 1.0, uProgress));
            vAlpha = clamp((approach * afterFade * 0.78 + edgeBand * 0.98) * twinkle * envelope, 0.0, 1.0);
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = clamp(((13.0 + 16.0 * vHeat) * sizeScale * uPixelRatio) / max(-mvPosition.z, 0.5), 2.5, 30.0);
          }
        `,
        fragmentShader: /* glsl */`
          uniform vec3 uColorA, uColorB;
          varying float vAlpha, vHeat, vColorMix;
          void main() {
            if (vAlpha < 0.015) discard;
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            float core = smoothstep(0.19, 0.0, d);
            float halo = exp(-d * 5.8);
            vec3 baseCol = mix(uColorA, uColorB, clamp(vColorMix * 0.55 + vHeat * 0.65, 0.0, 1.0));
            vec3 finalCol = mix(baseCol, vec3(1.0, 0.99, 0.92), core * (0.48 + vHeat * 0.45));
            gl_FragColor = vec4(finalCol, clamp((core * 0.92 + halo * 0.68) * vAlpha, 0.0, 1.0));
          }
        `
      });
    }

    function assignBoatClippingPlane(rootObject, plane, maxAniso) {
      const clonedMats = [];
      rootObject.traverse((node) => {
        if (!node.isMesh || !node.material) return;
        const originalMats = Array.isArray(node.material) ? node.material : [node.material];
        const nextMats = originalMats.map((mat) => {
          const targetMat = mat.clone();
          clonedMats.push(targetMat);
          targetMat.clippingPlanes = [plane];
          if (targetMat.map) targetMat.map.anisotropy = maxAniso;
          targetMat.needsUpdate = true;
          return targetMat;
        });
        node.material = Array.isArray(node.material) ? nextMats : nextMats[0];
      });
      return clonedMats;
    }

    function finalizeAndOptimizeConvoy() {
      renderer.localClippingEnabled = false;

      // Liberar geometría y materiales de partículas de materialización
      for (let i = 0; i < convoyBoats.length; i++) {
        const b = convoyBoats[i];
        if (b.particles) {
          if (b.particles.parent) b.particles.parent.remove(b.particles);
          b.particles = null;
        }
        if (b.particleMat) { b.particleMat.dispose(); b.particleMat = null; }
      }
      if (boatParticleGeoRef) { boatParticleGeoRef.dispose(); boatParticleGeoRef = null; }

      // Consolidar las 9 barcas en 1 solo InstancedMesh por primitiva (de 9xN draw calls a 1xN)
      if (canUseInstancing && baseMeshTemplates.length > 0) {
        for (let p = 0; p < baseMeshTemplates.length; p++) {
          const tpl = baseMeshTemplates[p];
          const instMesh = new THREE.InstancedMesh(tpl.geometry, tpl.material, convoyBoats.length);
          instMesh.frustumCulled = false;
          instMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          fleetInstancedGroup.add(instMesh);
          fleetInstancedPrimitives.push({ instancedMesh: instMesh, localMatrix: tpl.localMatrix });
        }

        for (let i = 0; i < convoyBoats.length; i++) {
          const b = convoyBoats[i];
          if (b.clonedMats) { b.clonedMats.forEach((m) => m.dispose()); b.clonedMats = null; }
        }
        while (convoyGroup.children.length > 0) convoyGroup.remove(convoyGroup.children[0]);
        usingInstancedFleet = true;
      } else {
        for (let i = 0; i < convoyBoats.length; i++) {
          const b = convoyBoats[i];
          if (b.clonedMats) b.clonedMats.forEach((m) => { m.clippingPlanes = null; m.needsUpdate = true; });
        }
      }
    }

    function buildNineBoatConvoy(baseTemplate, referencePivot, maxAniso) {
      convoyBoats.length = 0;
      baseMeshTemplates.length = 0;

      // Extraer primitivas limpias para el InstancedMesh posterior
      canUseInstancing = true;
      referencePivot.updateMatrixWorld(true);
      const invPivot = new THREE.Matrix4().copy(referencePivot.matrixWorld).invert();
      baseTemplate.traverse((node) => {
        if (node.isSkinnedMesh || (node.morphTargetInfluences && node.morphTargetInfluences.length > 0)) {
          canUseInstancing = false;
        }
        if (node.isMesh && node.geometry && node.material && !Array.isArray(node.material)) {
          if (node.material.map) node.material.map.anisotropy = maxAniso;
          baseMeshTemplates.push({
            geometry: node.geometry,
            material: node.material,
            localMatrix: new THREE.Matrix4().multiplyMatrices(invPivot, node.matrixWorld)
          });
        } else if (node.isMesh && Array.isArray(node.material)) {
          canUseInstancing = false;
        }
      });

      boatParticleGeoRef = buildSurfaceParticleGeometry(baseTemplate, referencePivot, PERF.particlesPerBoat);

      CONVOY_BOATS_LAYOUT.forEach((cfg, idx) => {
        const bobGroup = new THREE.Group();
        const pivot = new THREE.Group();
        bobGroup.add(pivot);

        const clone = baseTemplate.clone(true);
        const boatPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), -100);
        const clonedMats = assignBoatClippingPlane(clone, boatPlane, maxAniso);
        clone.traverse((node) => { node.frustumCulled = true; });

        const pMat = createMaterializationParticleMaterial();
        const pPoints = new THREE.Points(boatParticleGeoRef, pMat);
        pPoints.frustumCulled = false;
        pPoints.renderOrder = 3;
        pPoints.visible = false;

        pivot.add(clone);
        pivot.add(pPoints);
        convoyGroup.add(bobGroup);

        convoyBoats.push({
          cfg,
          group: bobGroup,
          pivot,
          clippingPlane: boatPlane,
          clonedMats,
          particles: pPoints,
          particleMat: pMat,
          delay: (idx / Math.max(1, CONVOY_BOATS_LAYOUT.length - 1)) * MATERIALIZATION_CONFIG.maxStaggerDelay,
          duration: MATERIALIZATION_CONFIG.boatDuration,
          progress: 0.0,
          done: false,
          phase: idx * 0.87,
          curX: 0, curY: 0, curZ: 0, curYaw: 0, curPitch: 0, curRoll: 0, curScale: cfg.scaleMul
        });
      });
    }

    async function loadBarcaModel() {
      await MeshoptDecoder.ready;
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);
      gltfLoader.setMeshoptDecoder(MeshoptDecoder);

      try {
        const gltf = await new Promise((resolve, reject) => {
          gltfLoader.load(ASSETS.sculpture, resolve, (xhr) => {
            if (xhr.total > 0) {
              const pct = Math.round((xhr.loaded / xhr.total) * 100);
              document.getElementById('progress-bar').style.width = pct + '%';
              document.getElementById('progress-text').textContent = pct + '%';
            }
          }, reject);
        });

        const templateRoot = gltf.scene;
        templateRoot.scale.setScalar(SCULPTURE_CONFIG.baseScale);
        templateRoot.updateMatrixWorld(true);

        const rawBox = new THREE.Box3().setFromObject(templateRoot);
        const rawCenter = rawBox.getCenter(new THREE.Vector3());
        const rawSize = rawBox.getSize(new THREE.Vector3());

        const submersion = Math.min(0.80, Math.max(0.16, rawSize.y * SCULPTURE_CONFIG.submersionRatio));
        templateRoot.position.set(-rawCenter.x, -rawBox.min.y - submersion, -rawCenter.z);

        const refPivot = new THREE.Group();
        refPivot.add(templateRoot);
        refPivot.updateMatrixWorld(true);

        const aniso = Math.min(PERF.maxAniso, renderer.capabilities.getMaxAnisotropy());
        buildNineBoatConvoy(templateRoot, refPivot, aniso);

        dracoLoader.dispose();

        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('progress-text').textContent = '100%';
        document.getElementById('progress-container').classList.add('hidden');
        document.getElementById('loading-message').textContent = 'Las 9 barcas están listas para cruzar el río.';
        launchControls.classList.remove('hidden');
        launchControls.classList.add('flex');
      } catch (e) {
        console.error('Error cargando el modelo:', e);
        document.getElementById('loading-message').textContent = 'No se pudo cargar barcagrullas.glb. Verifica tu conexión.';
      }
    }

        b.clippingPlane.constant = -100;
        b.particleMat.uniforms.uProgress.value = 0.0;
        b.particles.visible = true;
      }
    }

    function handleDeviceOrientation(e) {
      if (e.alpha === null || e.beta === null || e.gamma === null) return;
      latestDeviceOrientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
    }

    async function enableGyroscopeIfAvailable() {
      if (typeof DeviceOrientationEvent === 'undefined') return;
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm !== 'granted') return;
        }
        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        gyroEnabled = true;
        gyroBaseYaw = null;
      } catch (err) {}
    }

    function disableGyroscope() {
      window.removeEventListener('deviceorientation', handleDeviceOrientation, true);
      gyroEnabled = false;
      gyroBaseYaw = null;
      latestDeviceOrientation = null;
    }

    function updateCameraFromGyro() {
      if (!gyroEnabled || !latestDeviceOrientation || renderer.xr.isPresenting) return;
      const alpha = THREE.MathUtils.degToRad(latestDeviceOrientation.alpha || 0);
      const beta  = THREE.MathUtils.degToRad(latestDeviceOrientation.beta  || 0);
      const gamma = THREE.MathUtils.degToRad(latestDeviceOrientation.gamma || 0);
      const orientAngle = (screen.orientation && typeof screen.orientation.angle === 'number')
        ? THREE.MathUtils.degToRad(screen.orientation.angle)
        : THREE.MathUtils.degToRad(window.orientation || 0);

      _gyroEuler.set(beta, alpha, -gamma, 'YXZ');
      _gyroQuat.setFromEuler(_gyroEuler);
      _gyroQuat.multiply(_gyroQ1);
      _gyroQuat.multiply(_gyroQ0.setFromAxisAngle(_gyroZee, -orientAngle));

      if (gyroBaseYaw === null) {
        _tempEuler.setFromQuaternion(_gyroQuat, 'YXZ');
        gyroBaseYaw = _tempEuler.y;
      }

      _yawOffsetQuat.setFromAxisAngle(_upAxis, -gyroBaseYaw + yaw);
      _touchQuat.setFromEuler(_tempEuler.set(pitch, 0, 0, 'YXZ'));
      camera.quaternion.copy(_yawOffsetQuat).multiply(_gyroQuat).multiply(_touchQuat);
    }

    function applyTransparentARVisuals(enable) {
      if (enable) {
        scene.background = null;
        scene.fog = null;

        waterUniforms.uFogDensity.value = 0.0;

        scene.background = new THREE.Color(SCENE_BG_HEX);
        scene.fog = new THREE.FogExp2(SCENE_FOG_HEX, SCENE_FOG_DENSITY);

        waterUniforms.uOpacity.value = 1.0;
        waterUniforms.uFogDensity.value = SCENE_FOG_DENSITY;

    async function startCameraStream(facingMode = 'environment') {
      stopCameraStream();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('getUserMedia no disponible');
      }
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: IS_MOBILE ? 1280 : 1280 },
          height: { ideal: IS_MOBILE ? 720 : 720 }
        },
        audio: false
      });
      arCameraFeed.srcObject = cameraStream;
      arCameraFeed.classList.add('active');
      arCameraFeed.classList.toggle('mirrored', facingMode === 'user');
      await arCameraFeed.play();
    }

    function stopCameraStream() {
      if (cameraStream) {
        cameraStream.getTracks().forEach((t) => t.stop());
        cameraStream = null;
      }
      arCameraFeed.srcObject = null;
      arCameraFeed.classList.remove('active', 'mirrored');
    }

    async function startMobileCameraARMode() {
      loadingModal.classList.add('hidden');
      experienceHud.classList.add('active');
      try {
        await startCameraStream(currentFacingMode);
        isCameraARActive = true;
        isARModeActive = true;
        applyTransparentARVisuals(true);

        arAnchorScale = 0.72;

        barcaAnchorGroup.visible = hasMaterializedOnce || hasPlacedInAR;

        showToast('Apunta al suelo o a una pared para desplegar');

        console.warn('No se pudo abrir la cámara AR:', err);

        isARModeActive = false;
        applyTransparentARVisuals(false);
        setARPlacementMode(false);

    async function exitActiveARMode() {
      if (isRecordingVideo) stopVideoRecording();
      const xrSession = renderer.xr.getSession();
      if (xrSession) {
        await xrSession.end().catch(() => {});
        return;
      }
      if (isCameraARActive) {
        isCameraARActive = false;
        isARModeActive = false;
        setARPlacementMode(false);
        stopCameraStream();
        disableGyroscope();
        applyTransparentARVisuals(false);
        resetViewerPosition(false);
